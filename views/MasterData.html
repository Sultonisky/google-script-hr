      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    function mdShowToast(msg, type) {
      var toast = document.getElementById('mdToast');
      document.getElementById('mdToastBody').textContent = msg;
      toast.className = 'toast align-items-center border-0 shadow text-bg-' + (type || 'primary');
      new bootstrap.Toast(toast, { delay: 3500 }).show();
    }
  </script>
