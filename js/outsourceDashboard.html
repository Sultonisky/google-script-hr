<script>
  // ============================================================
  // js/outsourceDashboard.html — OUTSOURCE DATA IN DASHBOARD
  // Fetches from Employee sheet (Employee Type = "Outsource")
  // Depends on: helpers.html (escapeHtml, initials, animateCounter, showToast)
  // ============================================================

  var OS = {
    allItems: [],
    filtered: [],
    masterData: {},
    currentPage: 1,
    detailId: null,
    editId: null,
    formModal: null,
  };

  var OS_PAGE_SIZE = 20;

  // ---- Load master data for form selects ----
  function loadOsMasterData() {
    if (OS.masterData && Object.keys(OS.masterData).length > 0) return; // sudah ter-load
    google.script.run
      .withSuccessHandler(function (result) {
        if (result && result.success) {
          OS.masterData = result.data || {};
        }
      })
      .withFailureHandler(function () {})
      .getMasterDataGrouped();
  }

  // ---- Load data from backend ----
  function loadOutsourceData(silent) {
    var btnR    = document.getElementById('osBtnRefresh');
    var loading = document.getElementById('osTableLoading');
    var empty   = document.getElementById('osTableEmpty');
    var subtitle = document.getElementById('osPanelSubtitle');

    if (btnR) btnR.classList.add('spinning');
    if (!silent) {
      if (loading) loading.classList.remove('d-none');
      if (empty)   empty.classList.add('d-none');
      var tbody = document.getElementById('osTableBody');
      if (tbody) tbody.innerHTML = '';
    }
    if (btnR) btnR.disabled = true;

    google.script.run
      .withSuccessHandler(function(data) {
        if (btnR) { btnR.classList.remove('spinning'); btnR.disabled = false; }
        OS.allItems = data || [];

        var statsEl = document.getElementById('outsourceStats');
        var panelEl = document.getElementById('outsourcePanel');
        if (statsEl) statsEl.style.removeProperty('display');
        if (panelEl) panelEl.style.removeProperty('display');

        if (subtitle) subtitle.innerText = 'Terakhir dimuat: ' + new Date().toLocaleString('id-ID');
        applyOsFilters();
        if (!silent) showToast('Data outsource dimuat (' + OS.allItems.length + ' data).', 'success');
      })
      .withFailureHandler(function(err) {
        if (btnR) { btnR.classList.remove('spinning'); btnR.disabled = false; }
        if (!silent) showToast('Gagal memuat data outsource: ' + err.message, 'error');
      })
      .getOutsourceList();
  }

  // ---- Filter + sort ----
  function applyOsFilters() {
    var siEl  = document.getElementById('osSearchInput');
    var sfEl  = document.getElementById('osStatusFilter');
    var ssEl  = document.getElementById('osSortSelect');
    if (!siEl) return;

    var kw     = siEl.value.trim().toLowerCase();
    var status = sfEl ? sfEl.value : '';
    var sort   = ssEl ? ssEl.value : 'newest';

    OS.filtered = OS.allItems.filter(function(r) {
      var mk = !kw ||
        (r.employeeId||'').toLowerCase().indexOf(kw) !== -1 ||
        (r.fullName||'').toLowerCase().indexOf(kw) !== -1 ||
        (r.nik||'').toLowerCase().indexOf(kw) !== -1 ||
        (r.position||'').toLowerCase().indexOf(kw) !== -1;
      var ms = !status || (r.status || '').toLowerCase() === status.toLowerCase();
      return mk && ms;
    });

    OS.filtered.sort(function(a, b) {
      switch (sort) {
        case 'oldest':    return (parseDdMmYyyy(a.createdDate)||0) - (parseDdMmYyyy(b.createdDate)||0);
        case 'name_asc':  return (a.fullName||'').localeCompare(b.fullName||'');
        case 'name_desc': return (b.fullName||'').localeCompare(a.fullName||'');
        default:          return (parseDdMmYyyy(b.createdDate)||0) - (parseDdMmYyyy(a.createdDate)||0);
      }
    });

    OS.currentPage = 1;
    renderOsTable();
    updateOsStats();
  }

  // ---- Stat cards ----
  function updateOsStats() {
    var ct = function(fn) { return OS.filtered.filter(fn).length; };
    var permanent  = ct(function(r){ return (r.employmentStatus||r.status||'').toLowerCase() === 'permanent'; });
    var contract   = ct(function(r){ return (r.employmentStatus||r.status||'').toLowerCase() === 'contract'; });
    var probation  = ct(function(r){ return (r.employmentStatus||r.status||'').toLowerCase() === 'probation'; });
    var m = {
      osStatTotal:      OS.filtered.length,
      osStatPermanent:  permanent,
      osStatContract:   contract,
      osStatProbation:  probation
    };
    Object.keys(m).forEach(function(id) {
      var el = document.getElementById(id);
      if (el) animateCounter(el, m[id]);
    });
  }

  // ---- Render table ----
  function renderOsTable() {
    var tbody   = document.getElementById('osTableBody');
    var loading = document.getElementById('osTableLoading');
    var empty   = document.getElementById('osTableEmpty');
    var ps      = OS_PAGE_SIZE;

    if (loading) loading.classList.add('d-none');

    if (!OS.filtered || OS.filtered.length === 0) {
      if (tbody) tbody.innerHTML = '';
      if (empty) empty.classList.remove('d-none');
      var fc = document.getElementById('osFooterCount');
      if (fc) fc.innerText = 'Menampilkan 0 dari ' + OS.allItems.length + ' data';
      renderOsPagination(ps);
      return;
    }
    if (empty) empty.classList.add('d-none');

    var total = Math.max(1, Math.ceil(OS.filtered.length / ps));
    if (OS.currentPage > total) OS.currentPage = total;
    var start    = (OS.currentPage - 1) * ps;
    var pageData = OS.filtered.slice(start, start + ps);

    if (tbody) tbody.innerHTML = pageData.map(function(r) {
      var empStatus   = r.employmentStatus || r.status || 'Active';
      var statusClass = entityStatusBadgeClass(empStatus);
      return '<tr class="os-row-link" data-id="' + escapeHtml(r.employeeId) + '" style="cursor:pointer;">' +
        '<td><div class="avatar-sm" style="background:rgba(8,145,178,0.1);color:#0e7490;">' + escapeHtml(initials(r.fullName)) + '</div></td>' +
        '<td><span class="id-mono">' + escapeHtml(r.employeeId || '-') + '</span></td>' +
        '<td>' +
          '<div class="cand-name" style="font-weight:600;cursor:pointer;color:var(--color-primary);" data-id="' + escapeHtml(r.employeeId) + '">' +
          escapeHtml(r.fullName || '-') + '</div>' +
          '<div class="cand-sub">' + escapeHtml(r.email || '-') + '</div>' +
        '</td>' +
        '<td>' +
          '<div style="font-weight:600;font-size:13px;">' + escapeHtml(r.position || '-') + '</div>' +
          '<div class="cand-sub">' + escapeHtml(r.department || '-') + '</div>' +
        '</td>' +
        '<td>' + escapeHtml(r.joinDate || '-') + '</td>' +
        '<td><span class="badge-status ' + statusClass + '">' + escapeHtml(empStatus) + '</span></td>' +
        '<td>' +
          '<button class="btn-action btn-view-btn" title="Lihat detail" data-id="' + escapeHtml(r.employeeId) + '">' +
            '<i class="bi bi-eye-fill"></i>' +
          '</button>' +
        '</td>' +
        '</tr>';
    }).join('');

    var sStart = start + 1, sEnd = Math.min(start + ps, OS.filtered.length);
    var fc2 = document.getElementById('osFooterCount');
    if (fc2) fc2.innerText = 'Menampilkan ' + sStart + '–' + sEnd + ' dari ' + OS.filtered.length + ' data (total ' + OS.allItems.length + ')';

    renderOsPagination(ps);
    attachOsRowHandlers();
  }

  // ---- Pagination ----
  function renderOsPagination(ps) {
    var nav   = document.getElementById('osPaginationUi');
    if (!nav) return;
    var total = Math.max(1, Math.ceil(OS.filtered.length / ps));
    var html  = '<button class="page-btn" type="button" id="osPrev" ' + (OS.currentPage===1?'disabled':'') + '><i class="bi bi-chevron-left"></i></button>';
    var mb=5, sp=Math.max(1, OS.currentPage-Math.floor(mb/2)), ep=Math.min(total, sp+mb-1);
    sp=Math.max(1, ep-mb+1);
    if(sp>1){ html+='<button class="page-btn" type="button" data-opg="1">1</button>'; if(sp>2) html+='<span class="page-btn" style="border:none;background:transparent;cursor:default">&hellip;</span>'; }
    for(var p=sp;p<=ep;p++) html+='<button class="page-btn'+(p===OS.currentPage?' active':'')+'" type="button" data-opg="'+p+'">'+p+'</button>';
    if(ep<total){ if(ep<total-1) html+='<span class="page-btn" style="border:none;background:transparent;cursor:default">&hellips;</span>'; html+='<button class="page-btn" type="button" data-opg="'+total+'">'+total+'</button>'; }
    html+='<button class="page-btn" type="button" id="osNext" '+(OS.currentPage===total?'disabled':'')+'>'+
            '<i class="bi bi-chevron-right"></i></button>';
    nav.innerHTML = html;
    nav.querySelectorAll('button[data-opg]').forEach(function(b) {
      b.addEventListener('click', function(){ OS.currentPage=parseInt(b.getAttribute('data-opg'),10); renderOsTable(); });
    });
    var prev=document.getElementById('osPrev'), next=document.getElementById('osNext');
    if(prev) prev.addEventListener('click', function(){ if(OS.currentPage>1){ OS.currentPage--; renderOsTable(); } });
    if(next) next.addEventListener('click', function(){ if(OS.currentPage<total){ OS.currentPage++; renderOsTable(); } });
  }

  function attachOsRowHandlers() {
    document.querySelectorAll('#osTableBody .os-row-link[data-id]').forEach(function(el) {
      el.addEventListener('click', function(event) {
        if (event.target.closest('button, a, input, select, textarea, label')) return;
        openOutsourceDrawer(el.getAttribute('data-id'));
      });
    });
    document.querySelectorAll('#osTableBody .cand-name[data-id]').forEach(function(el) {
      el.addEventListener('click', function() {
        openOutsourceDrawer(el.getAttribute('data-id'));
      });
    });
    document.querySelectorAll('#osTableBody .btn-view-btn').forEach(function(el) {
      el.addEventListener('click', function() {
        openOutsourceDrawer(el.getAttribute('data-id'));
      });
    });
  }

  // ---- Init ----
  var osInitialized = false;
  function initOutsourceUI() {
    if (osInitialized) return;
    osInitialized = true;

    OS.formModal = new bootstrap.Modal(document.getElementById('osFormModal'));

    var si      = document.getElementById('osSearchInput');
    var btnRef  = document.getElementById('osBtnRefresh');
    var btnAdd  = document.getElementById('btnOutAdd');
    var btnSav  = document.getElementById('btnOsSave');
    var btnReset = document.getElementById('osBtnResetFilter');

    if (si)      si.addEventListener('input', applyOsFilters);
    if (btnRef)  btnRef.addEventListener('click', function(){ loadOutsourceData(false); });
    // TOMBOL TAMBAH OUTSOURCE DINONAKTIFKAN SEMENTARA — listener di-comment agar create tidak bisa dipanggil dari UI
    // if (btnAdd)  btnAdd.addEventListener('click', function(){ openOsForm(null); });
    if (btnSav)  btnSav.addEventListener('click', saveOsData);
    if (btnReset) btnReset.addEventListener('click', function() {
      if (si) si.value = '';
      ['osStatusFilter'].forEach(function(id){
        var e = document.getElementById(id); if (e) e.value = '';
      });
      document.getElementById('osSortSelect').value = 'newest';
      applyOsFilters();
    });

    ['osStatusFilter','osSortSelect'].forEach(function(id) {
      var el = document.getElementById(id);
      if (el) el.addEventListener('change', applyOsFilters);
    });
  }
  function openOsForm(id) {
    OS.editId = id || null;
    document.getElementById('osFormTitle').textContent = id ? 'Edit Outsource' : 'Tambah Outsource';
    document.getElementById('osfId').value = id || '';

    // Populate master data selects
    var osMasterSelects = {
      'department':        'osfDept',
      'employment_status': 'osfEmpStatus',
    };
    var masterData = OS.masterData || {};
    Object.keys(osMasterSelects).forEach(function (cat) {
      var sel = document.getElementById(osMasterSelects[cat]);
      if (!sel) return;
      var items = masterData[cat] || [];
      sel.innerHTML = '<option value="">— Pilih —</option>';
      items.forEach(function (name) {
        var val = typeof name === 'object' ? name.name : name;
        sel.innerHTML += '<option value="' + escapeHtml(val) + '">' + escapeHtml(val) + '</option>';
      });
    });

    if (id) {
      var os = OS.allItems.find(function(x) { return x.employeeId === id; });
      if (os) {
        document.getElementById('osfNama').value          = os.fullName        || '';
        document.getElementById('osfNik').value           = os.nik             || '';
        document.getElementById('osfBirthDate').value     = toDateInputValue(os.birthDate);
        document.getElementById('osfGender').value        = os.gender          || '';
        document.getElementById('osfMarital').value       = os.maritalStatus   || '';
        document.getElementById('osfEmail').value         = os.email           || '';
        document.getElementById('osfPhone').value         = os.phone           || '';
        document.getElementById('osfAddress').value       = os.address         || '';
        document.getElementById('osfCity').value          = os.city            || '';
        document.getElementById('osfPosisi').value        = os.position        || '';
        document.getElementById('osfDept').value          = os.department      || '';
        document.getElementById('osfDivision').value      = os.division        || '';
        document.getElementById('osfBranch').value        = os.branch          || '';
        document.getElementById('osfTglMasuk').value      = toDateInputValue(os.joinDate);
        document.getElementById('osfEmpStatus').value     = os.employmentStatus || '';
        document.getElementById('osfContractEnd').value   = toDateInputValue(os.contractEnd);
        document.getElementById('osfStatus').value        = os.status          || 'Active';
      }
    } else {
      ['osfNama','osfNik','osfEmail','osfPhone','osfAddress','osfCity',
       'osfPosisi','osfDivision','osfBranch'].forEach(function(id) {
        var el = document.getElementById(id); if (el) el.value = '';
      });
      ['osfBirthDate','osfTglMasuk','osfContractEnd'].forEach(function(id) {
        var el = document.getElementById(id); if (el) el.value = '';
      });
      ['osfGender','osfMarital','osfDept','osfEmpStatus'].forEach(function(id) {
        var el = document.getElementById(id); if (el) el.value = '';
      });
      document.getElementById('osfStatus').value = 'Active';
    }
    OS.formModal.show();
  }

  function saveOsData() {
    var name = document.getElementById('osfNama').value.trim();
    if (!name) { showToast('Nama lengkap harus diisi.', 'warning'); return; }

    var data = {
      fullName:          name,
      nik:               document.getElementById('osfNik').value.trim(),
      birthDate:         document.getElementById('osfBirthDate').value,
      gender:            document.getElementById('osfGender').value,
      maritalStatus:     document.getElementById('osfMarital').value,
      email:             document.getElementById('osfEmail').value.trim(),
      phone:             document.getElementById('osfPhone').value.trim(),
      address:           document.getElementById('osfAddress').value.trim(),
      city:              document.getElementById('osfCity').value.trim(),
      position:          document.getElementById('osfPosisi').value.trim(),
      department:        document.getElementById('osfDept').value,
      division:          document.getElementById('osfDivision').value.trim(),
      branch:            document.getElementById('osfBranch').value.trim(),
      joinDate:          document.getElementById('osfTglMasuk').value,
      employmentStatus:  document.getElementById('osfEmpStatus').value,
      contractEnd:       document.getElementById('osfContractEnd').value,
    };

    var btn = document.getElementById('btnOsSave');
    btn.disabled = true;
    btn.innerHTML = '<i class="bi bi-hourglass-split"></i> Menyimpan...';

    if (OS.editId) {
      google.script.run
        .withSuccessHandler(function(r) {
          btn.disabled = false;
          btn.innerHTML = '<i class="bi bi-check2-circle me-1"></i> Simpan';
          if (r && r.success) {
            showToast(r.message, 'success');
            OS.formModal.hide();
            if (typeof closeDrawer === 'function') closeDrawer();
            loadOutsourceData(false);
          } else {
            showToast(r ? r.message : 'Gagal menyimpan.', 'danger');
          }
        })
        .withFailureHandler(function(err) {
          btn.disabled = false;
          btn.innerHTML = '<i class="bi bi-check2-circle me-1"></i> Simpan';
          showToast('Error: ' + err.message, 'danger');
        })
        .updateEmployee(OS.editId, data);
    } else {
      // ============ ADD (CREATE) DINONAKTIFKAN SEMENTARA ============
      // Path penyimpanan outsource baru tidak aktif (backup: kembalikan dengan
      // menghapus komentar pada blok di bawah ini).
      // google.script.run
      //   .withSuccessHandler(function(r) {
      //     btn.disabled = false;
      //     btn.innerHTML = '<i class="bi bi-check2-circle me-1"></i> Simpan';
      //     if (typeof r === 'string' && r.indexOf('Sukses') !== -1) {
      //       showToast('Karyawan outsource berhasil ditambahkan.', 'success');
      //       OS.formModal.hide();
      //       if (typeof closeDrawer === 'function') closeDrawer();
      //       loadOutsourceData(false);
      //     } else if (r && r.success) {
      //       showToast(r.message, 'success');
      //       OS.formModal.hide();
      //       if (typeof closeDrawer === 'function') closeDrawer();
      //       loadOutsourceData(false);
      //     } else {
      //       showToast(r ? (typeof r === 'string' ? r : r.message) : 'Gagal menyimpan.', 'danger');
      //     }
      //   })
      //   .withFailureHandler(function(err) {
      //     btn.disabled = false;
      //     btn.innerHTML = '<i class="bi bi-check2-circle me-1"></i> Simpan';
      //     showToast('Error: ' + err.message, 'danger');
      //   })
      //   .simpanDataOutsource(data);
      showToast('Fungsi tambah karyawan outsource sedang dinonaktifkan.', 'warning');
    }
  }

  // ---- Delete ----
  function deleteOsData() {
    if (!OS.detailId) return;
    var os = OS.allItems.find(function(x) { return x.employeeId === OS.detailId; });
    if (!os) return;
    if (!confirm('Hapus karyawan outsource "' + os.fullName + '"?')) return;

    google.script.run
      .withSuccessHandler(function(r) {
        if (r && r.success) {
          showToast(r.message, 'success');
          closeDrawer();
          loadOutsourceData(false);
        } else {
          showToast(r ? r.message : 'Gagal menghapus.', 'danger');
        }
      })
      .withFailureHandler(function(err) {
        showToast('Error: ' + err.message, 'danger');
      })
      .deleteOutsourceById(OS.detailId);
  }

  // SPA navigation hook — called by router when entering pageOutsource
  function outOnNavigate() {
    initOutsourceUI();
    loadOsMasterData();
    loadOutsourceData(false);
  }
</script>
