<script>
  // ============================================================
  // js/pdfExport.html — PDF EXPORT FOR CANDIDATE PROFILE
  // Depends on: helpers.html, jsPDF library
  // ============================================================

  // ============================================================
  // GLOBAL DATE FORMATTER — dipakai oleh semua fungsi PDF
  // Menerima semua format: Date object, YYYY-MM-DD, DD/MM/YYYY,
  // D/M/YYYY, DD-MM-YYYY, ISO timestamp, Date.toString() dengan
  // timezone (mis. "Wed Jul 15 2026 00:00:00 GMT+0700 ...")
  // Output: "15 Juli 2026"
  // ============================================================
  function fmtDateLongIndonesia(isoStr) {
    if (!isoStr) return '-';
    var bulan = ['Januari','Februari','Maret','April','Mei','Juni',
                 'Juli','Agustus','September','Oktober','November','Desember'];
    // Date object langsung
    if (isoStr instanceof Date) {
      if (isNaN(isoStr.getTime())) return '-';
      return isoStr.getDate() + ' ' + bulan[isoStr.getMonth()] + ' ' + isoStr.getFullYear();
    }
    var str = String(isoStr).trim();
    if (!str || str === '-') return '-';
    // DD/MM/YYYY atau D/M/YYYY
    var mDMY = str.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
    if (mDMY) return parseInt(mDMY[1],10)+' '+(bulan[parseInt(mDMY[2],10)-1]||'-')+' '+parseInt(mDMY[3],10);
    // YYYY-MM-DD atau YYYY-MM-DD HH:mm:ss (ISO)
    var mYMD = str.match(/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/);
    if (mYMD) return parseInt(mYMD[3],10)+' '+(bulan[parseInt(mYMD[2],10)-1]||'-')+' '+parseInt(mYMD[1],10);
    // DD-MM-YYYY
    var mDMYD = str.match(/^(\d{1,2})-(\d{1,2})-(\d{4})$/);
    if (mDMYD) return parseInt(mDMYD[1],10)+' '+(bulan[parseInt(mDMYD[2],10)-1]||'-')+' '+parseInt(mDMYD[3],10);
    // Fallback: Date constructor (handles Date.toString() dengan timezone, ISO extended)
    var parsed = new Date(str);
    if (!isNaN(parsed.getTime())) {
      return parsed.getDate()+' '+bulan[parsed.getMonth()]+' '+parsed.getFullYear();
    }
    return str;
  }

  function exportCandidatePDF(candidateId) {
    var c = allCandidates.find(function (x) {
      return x.recruitmentId === candidateId;
    });
    if (!c) {
      // Kandidat mungkin sudah dipindah ke sheet status (hold/accepted/blacklist)
      // sehingga tidak ada di allCandidates. Fetch dari backend.
      google.script.run
        .withSuccessHandler(function (fetched) {
          if (fetched && fetched.recruitmentId) {
            allCandidates.push(fetched);
            exportCandidatePDF(candidateId);
          } else {
            showToast("Data kandidat tidak ditemukan.", "error");
          }
        })
        .withFailureHandler(function () {
          showToast("Data kandidat tidak ditemukan.", "error");
        })
        .getCandidateById(candidateId);
      return;
    }

    try {
      if (typeof window.jspdf === "undefined") {
        var script = document.createElement("script");
        script.src =
          "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";
        document.head.appendChild(script);
        script.onload = function () {
          exportCandidatePDF(candidateId);
        };
        return;
      }

      var { jsPDF } = window.jspdf;
      var doc = new jsPDF();

      var pageWidth = doc.internal.pageSize.getWidth();
      var pageHeight = doc.internal.pageSize.getHeight();
      var margin = 20;
      var yPos = margin;
      var lineHeight = 7;

      // Colors
      var primaryColor = [235, 28, 36]; // #eb1c24
      var textColor = [31, 41, 55]; // #1F2937
      var softTextColor = [107, 114, 128]; // #6B7280
      var accentColor = [253, 185, 19]; // #FDB913

      // Helper: setTextColor accepts r,g,b separately, not an array
      function applyTextColor(color) {
        doc.setTextColor(color[0], color[1], color[2]);
      }

      // Helper functions
      function addText(text, x, y, options) {
        options = options || {};
        doc.setFontSize(options.fontSize || 10);
        applyTextColor(options.color || textColor);
        if (options.bold) doc.setFont("helvetica", "bold");
        else doc.setFont("helvetica", "normal");
        doc.text(String(text || "-"), x, y);
      }

      function addSection(title, icon) {
        yPos += 5;
        // Section background
        doc.setFillColor(245, 247, 250);
        doc.rect(margin, yPos - 5, pageWidth - 2 * margin, 10, "F");

        // Section title
        addText(title, margin + 2, yPos, {
          fontSize: 12,
          bold: true,
          color: primaryColor,
        });
        yPos += 10;
      }

      function addField(label, value, x, width) {
        doc.setFontSize(8);
        applyTextColor(softTextColor);
        doc.setFont("helvetica", "bold");
        doc.text(String(label || ""), x, yPos);

        yPos += 5;
        doc.setFontSize(10);
        applyTextColor(textColor);
        doc.setFont("helvetica", "normal");

        var lines = doc.splitTextToSize(String(value || "-"), width - 5);
        doc.text(lines, x, yPos);

        yPos += lines.length * lineHeight;
      }

      function checkPageBreak(requiredSpace) {
        if (yPos + requiredSpace > pageHeight - margin) {
          doc.addPage();
          yPos = margin;
          return true;
        }
        return false;
      }

      // ============================
      // HEADER
      // ============================
      doc.setFillColor(primaryColor[0], primaryColor[1], primaryColor[2]);
      doc.rect(0, 0, pageWidth, 35, "F");

      doc.setFontSize(18);
      doc.setTextColor(255, 255, 255);
      doc.setFont("helvetica", "bold");
      doc.text("PROFIL KANDIDAT", margin, 15);

      doc.setFontSize(10);
      doc.setFont("helvetica", "normal");
      doc.text("MITO HRIS — Applicant Tracking System", margin, 23);

      yPos = 45;

      // ============================
      // CANDIDATE INFO HEADER
      // ============================
      doc.setFontSize(16);
      applyTextColor(textColor);
      doc.setFont("helvetica", "bold");
      doc.text(c.fullName || "-", margin, yPos);
      yPos += 8;

      doc.setFontSize(11);
      applyTextColor(primaryColor);
      doc.setFont("helvetica", "normal");
      doc.text(c.positionApplied || "-", margin, yPos);
      yPos += 7;

      // Status badge
      var statusText = c.status || "Pending";
      var statusColor = [138, 97, 0]; // pending yellow
      if (statusText.toLowerCase() === "accepted")
        statusColor = [22, 101, 52]; // green
      else if (statusText.toLowerCase() === "hold")
        statusColor = [11, 74, 134]; // blue
      else if (statusText.toLowerCase() === "blacklist")
        statusColor = [153, 27, 27]; // red

      doc.setFillColor(statusColor[0], statusColor[1], statusColor[2]);
      doc.roundedRect(margin, yPos - 4, 30, 7, 2, 2, "F");
      doc.setFontSize(9);
      doc.setTextColor(255, 255, 255);
      doc.setFont("helvetica", "bold");
      doc.text(statusText, margin + 15, yPos, { align: "center" });

      yPos += 10;

      // Meta info
      doc.setFontSize(9);
      applyTextColor(softTextColor);
      doc.setFont("helvetica", "normal");
      doc.text("Recruitment ID: " + (c.recruitmentId || "-"), margin, yPos);
      doc.text(
        "Tanggal Daftar: " + (c.createdDate || "-"),
        pageWidth - margin - 60,
        yPos,
      );
      yPos += 5;

      doc.setDrawColor(229, 231, 235);
      doc.line(margin, yPos, pageWidth - margin, yPos);
      yPos += 5;

      // ============================
      // INFORMASI PRIBADI
      // ============================
      addSection("Informasi Pribadi", "person");

      var col1X = margin + 5;
      var col2X = pageWidth / 2 + 5;
      var colWidth = pageWidth / 2 - margin - 10;
      var startY = yPos;

      addField("Nama Lengkap", c.fullName, col1X, colWidth);
      var tempY = yPos;
      yPos = startY;
      addField("NIK", c.nik, col2X, colWidth);
      yPos = Math.max(yPos, tempY);

      startY = yPos;
      addField("Tanggal Lahir", c.birthDate, col1X, colWidth);
      tempY = yPos;
      yPos = startY;
      addField("Usia", c.age ? c.age + " Tahun" : "-", col2X, colWidth);
      yPos = Math.max(yPos, tempY);

      startY = yPos;
      var genderText = c.gender || "-";
      addField("Jenis Kelamin", genderText, col1X, colWidth);
      tempY = yPos;
      yPos = startY;
      addField("Status Pernikahan", c.maritalStatus, col2X, colWidth);
      yPos = Math.max(yPos, tempY);

      startY = yPos;
      addField("Email", c.email, col1X, colWidth);
      tempY = yPos;
      yPos = startY;
      addField("No. HP", c.phone, col2X, colWidth);
      yPos = Math.max(yPos, tempY);

      startY = yPos;
      addField("Kota", c.city, col1X, colWidth);
      tempY = yPos;
      yPos = startY;
      addField("Alamat", c.address, col2X, colWidth);
      yPos = Math.max(yPos, tempY);

      checkPageBreak(50);

      // ============================
      // INFORMASI PEKERJAAN
      // ============================
      addSection("Informasi Pekerjaan", "briefcase");

      startY = yPos;
      addField("Posisi Dilamar", c.positionApplied, col1X, colWidth);
      tempY = yPos;
      yPos = startY;
      addField("Pendidikan", c.education, col2X, colWidth);
      yPos = Math.max(yPos, tempY);

      startY = yPos;
      addField("Pengalaman Kerja", c.workExperience, col1X, colWidth);
      tempY = yPos;
      yPos = startY;
      addField("Perusahaan Terakhir", c.lastCompany, col2X, colWidth);
      yPos = Math.max(yPos, tempY);

      startY = yPos;
      addField(
        "Status Bekerja Saat Ini",
        c.currentEmploymentStatus,
        col1X,
        colWidth,
      );
      tempY = yPos;
      yPos = startY;
      addField("Kesediaan Bergabung", c.availableToJoin, col2X, colWidth);
      yPos = Math.max(yPos, tempY);

      startY = yPos;
      addField(
        "Ekspektasi Gaji",
        formatRupiah(c.expectedSalary),
        col1X,
        colWidth,
      );
      tempY = yPos;
      yPos = startY;
      addField("Sumber Rekrutmen", c.recruitmentSource, col2X, colWidth);
      yPos = Math.max(yPos, tempY);

      checkPageBreak(50);

      // ============================
      // CATATAN HR
      // ============================
      if (c.hrNotes && c.hrNotes.trim()) {
        addSection("Catatan HR", "chat");

        doc.setFontSize(10);
        applyTextColor(textColor);
        doc.setFont("helvetica", "normal");
        var notesLines = doc.splitTextToSize(
          c.hrNotes,
          pageWidth - 2 * margin - 10,
        );

        notesLines.forEach(function (line) {
          checkPageBreak(10);
          doc.text(line, margin + 5, yPos);
          yPos += lineHeight;
        });

        yPos += 5;
        doc.setFontSize(8);
        applyTextColor(softTextColor);
        doc.text(
          "Terakhir diperbarui: " + (c.updatedAt || "-"),
          margin + 5,
          yPos,
        );
        yPos += 10;
      }

      // ============================
      // FOOTER
      // ============================
      var totalPages = doc.internal.getNumberOfPages();
      for (var i = 1; i <= totalPages; i++) {
        doc.setPage(i);
        doc.setFontSize(8);
        applyTextColor(softTextColor);
        doc.setFont("helvetica", "normal");

        var footerText =
          "Generated on " +
          new Date().toLocaleString("id-ID") +
          " — Page " +
          i +
          " of " +
          totalPages;
        doc.text(footerText, pageWidth / 2, pageHeight - 10, {
          align: "center",
        });

        doc.setDrawColor(229, 231, 235);
        doc.line(margin, pageHeight - 15, pageWidth - margin, pageHeight - 15);
      }

      // ============================
      // SAVE PDF
      // ============================
      var fileName =
        "Kandidat_" +
        (c.recruitmentId || "Unknown").replace(/[^a-zA-Z0-9-]/g, "_") +
        ".pdf";
      doc.save(fileName);

      showToast("PDF berhasil diunduh: " + fileName, "success");
    } catch (error) {
      console.error("PDF Export Error:", error);
      showToast("Gagal membuat PDF: " + error.message, "error");
    }
  }
  // ============================================================
  // OFFERING LETTER PDF EXPORT
  // Params:
  //   candidate  — object kandidat dari getAcceptedList()
  //   offerData  — { companyEntity, position, department, salary,
  //                  joinDate, benefit, notes }
  //   callback   — function(success: boolean)
  // ============================================================
  // ============================================================
  // ROTATION LETTER PDF EXPORT
  // ============================================================
  function exportRotationLetterPDF(rotationData, callback) {
    if (typeof window.jspdf === "undefined") {
      var script = document.createElement("script");
      script.src =
        "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";
      document.head.appendChild(script);
      script.onload = function () {
        exportRotationLetterPDF(rotationData, callback);
      };
      script.onerror = function () {
        showToast(
          "Gagal memuat library PDF. Periksa koneksi internet.",
          "error",
        );
        if (callback) callback(false);
      };
      return;
    }

    try {
      var jsPDF = window.jspdf.jsPDF;
      var doc = new jsPDF({
        orientation: "portrait",
        unit: "mm",
        format: "a4",
      });
      var pageWidth = doc.internal.pageSize.getWidth();
      var pageHeight = doc.internal.pageSize.getHeight();
      var margin = 20;
      var contentW = pageWidth - margin * 2;
      var yPos = margin;

      var colorPrimary = [0, 0, 0];
      var colorNavy = [0, 0, 0];
      var colorText = [0, 0, 0];
      var colorSoft = [0, 0, 0];
      var colorBorder = [0, 0, 0];

      function setFill(c) {
        doc.setFillColor(c[0], c[1], c[2]);
      }
      function setDraw(c) {
        doc.setDrawColor(c[0], c[1], c[2]);
      }
      function setTxt(c) {
        doc.setTextColor(c[0], c[1], c[2]);
      }
      function bold() {
        doc.setFont("helvetica", "bold");
      }
      function normal() {
        doc.setFont("helvetica", "normal");
      }

      function fmtDateId(isoStr) { return fmtDateLongIndonesia(isoStr); }

      var data = rotationData || {};
      var branchName =
        data.branchName || data.branch || "PT Mahakarya Sukses Indonesia";
      var comp =
        typeof getCompanyProfile === "function"
          ? getCompanyProfile(branchName)
          : {
              name: branchName,
              tagline: "Electronics & Home Appliances Manufacturer",
              address: "Jakarta, Indonesia",
              phone: "(021) 6583-1234",
              email: "hrd@mito.co.id",
              accent: colorPrimary,
            };

      var typeMap = {
        Promosi: "PROMOSI",
        Demosi: "DEMOSI",
        Mutasi: "MUTASI",
        Rotasi: "ROTASI",
      };
      var typeLabel =
        typeMap[data.rotationType] || data.rotationType || "ROTASI";

      // ── KOP SURAT DINAMIS ──────────────────────────────────────
      yPos = renderKopSuratPDF(doc, comp, pageWidth, margin);

      // ── JUDUL SURAT KEPUTUSAN ──────────────────────────────────
      yPos += 9;
      doc.setFontSize(13);
      bold();
      setTxt(colorNavy);
      doc.text("SURAT KEPUTUSAN " + typeLabel, pageWidth / 2, yPos, {
        align: "center",
      });
      yPos += 5;

      doc.setFontSize(8.5);
      normal();
      setTxt(colorSoft);
      doc.text(
        "Nomor: " +
          (data.skNumber ||
            "001/HRD-SK/" +
              (comp.name.replace(/PT\s+/i, "").replace(/[^a-zA-Z0-9]/g, "").substring(0, 6).toUpperCase()) +
              "/" +
              ["I","II","III","IV","V","VI","VII","VIII","IX","X","XI","XII"][new Date().getMonth()] +
              "/" +
              new Date().getFullYear()),
        pageWidth / 2,
        yPos,
        { align: "center" },
      );

      // ── PEMBUKA ────────────────────────────────────────────────
      yPos += 8;
      doc.setFontSize(8.5);
      normal();
      setTxt(colorText);
      doc.text(
        "Yang bertanda tangan di bawah ini, Manajemen / HRD " +
          comp.name +
          ", dengan ini menetapkan:",
        margin,
        yPos,
      );
      yPos += 6;

      var rows = [
        ["Nama Karyawan", data.fullName || "-"],
        ["Employee ID", data.employeeId || "-"],
        ["NIK / No. KTP", data.nik || "-"],
        ["Entitas Perusahaan", comp.name],
        ["Jabatan Sebelumnya", data.formerPosition || "-"],
        ["Jabatan Baru", data.newPosition || "-"],
        ["Departemen Sebelumnya", data.formerDepartment || "-"],
        ["Departemen Baru", data.newDepartment || data.formerDepartment || "-"],
        ["Jenis Penetapan", data.rotationType || "-"],
        ["Tanggal Efektif", fmtDateId(data.effectiveDate)],
        ["Alasan / Pertimbangan", data.reason || "-"],
      ];

      rows.forEach(function (f, idx) {
        setFill(idx % 2 === 0 ? [248, 250, 252] : [255, 255, 255]);
        doc.rect(margin, yPos - 3.5, contentW, 6.5, "F");
        doc.setFontSize(8);
        bold();
        setTxt(colorText);
        doc.text(f[0], margin + 3, yPos);
        normal();
        setTxt(colorSoft);
        doc.text(":", margin + 46, yPos);
        setTxt(colorText);
        var vLines = doc.splitTextToSize(String(f[1]), contentW - 52);
        doc.text(vLines, margin + 50, yPos);
        yPos += vLines.length > 1 ? vLines.length * 4.5 : 6.5;
      });

      yPos += 5;
      doc.setFontSize(8);
      normal();
      setTxt(colorText);
      var closingTxt =
        "Demikian Surat Keputusan ini diterbitkan untuk dilaksanakan dengan penuh rasa tanggung jawab. Segala hak, kewajiban, dan wewenang yang melekat pada jabatan baru berlaku efektif sejak tanggal yang telah ditetapkan.";
      var closeLines = doc.splitTextToSize(closingTxt, contentW);
      doc.text(closeLines, margin, yPos);
      yPos += closeLines.length * 4.2 + 5;

      // ── BLOK TANDA TANGAN ──────────────────────────────────────
      yPos += 6;
      var sigX = pageWidth - margin - 70;
      var sigLineW = 60;

      doc.setFontSize(8.5);
      normal();
      setTxt(colorText);
      doc.text("Jakarta, " + fmtDateId(new Date().toISOString().split("T")[0]), sigX, yPos);
      yPos += 6;

      doc.setFontSize(9);
      normal();
      setTxt(colorText);
      doc.text("Hormat Kami,", sigX, yPos);
      yPos += 5;

      doc.setFontSize(9.5);
      bold();
      setTxt(colorNavy);
      doc.text(comp.name, sigX, yPos);
      yPos += 12;

      setDraw(colorBorder);
      doc.setLineWidth(0.4);
      doc.line(sigX, yPos, sigX + sigLineW, yPos);
      doc.setLineWidth(0.2);
      yPos += 6;

      doc.setFontSize(9.5);
      bold();
      setTxt(colorNavy);
      doc.text("Hisar Hesti", sigX, yPos);
      yPos += 4.5;
      doc.setFontSize(8.5);
      normal();
      setTxt(colorSoft);
      doc.text("Human Resources (HR) & Legal Manager", sigX, yPos);
      yPos += 3;



      var fileName =
        "SK_" +
        typeLabel +
        "_" +
        (data.fullName
          ? data.fullName.replace(/[^a-zA-Z0-9]/g, "_")
          : "Karyawan") +
        "_" +
        (data.employeeId || "").replace(/[^a-zA-Z0-9]/g, "") +
        ".pdf";
      doc.save(fileName);
      showToast(
        "Surat Keputusan " + typeLabel + " berhasil diunduh: " + fileName,
        "success",
      );
      if (callback) callback(true);
    } catch (err) {
      console.error("Rotation PDF Error:", err);
      showToast(
        "Gagal membuat SK " + (typeLabel || "Rotasi") + " PDF: " + err.message,
        "error",
      );
      if (callback) callback(false);
    }
  }

  // ============================================================
  // HELPER: PROFIL PERUSAHAAN (KOP SURAT) BERDASARKAN BRANCH
  // ============================================================

  // PAKLARING (SURAT KETERANGAN KERJA) PDF EXPORT
  // ============================================================
  function exportPaklaringPDF(emp, evalData, result, callback) {
    if (typeof window.jspdf === "undefined") {
      var s = document.createElement("script");
      s.src =
        "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";
      document.head.appendChild(s);
      s.onload = function () {
        exportPaklaringPDF(emp, evalData, result, callback);
      };
      s.onerror = function () {
        showToast(
          "Gagal memuat library PDF. Periksa koneksi internet.",
          "error",
        );
        if (callback) callback(false);
      };
      return;
    }
    try {
      var jsPDF = window.jspdf.jsPDF;
      var doc = new jsPDF({
        orientation: "portrait",
        unit: "mm",
        format: "a4",
      });
      var pw = doc.internal.pageSize.getWidth();
      var ph = doc.internal.pageSize.getHeight();
      var m = 20;
      var yPos = m;

      evalData = evalData || {};
      result = result || {};

      var branchName =
        (emp && (emp.branch || emp.companyEntity || emp.branchName)) || "";
      var comp = getCompanyProfile(branchName);

      var cPrimary = [0, 0, 0];
      var cNavy = [0, 0, 0];
      var cText = [0, 0, 0];
      var cSoft = [0, 0, 0];

      function sf(c) {
        doc.setFillColor(c[0], c[1], c[2]);
      }
      function sd(c) {
        doc.setDrawColor(c[0], c[1], c[2]);
      }
      function st(c) {
        doc.setTextColor(c[0], c[1], c[2]);
      }
      function bold() {
        doc.setFont("helvetica", "bold");
      }
      function normal() {
        doc.setFont("helvetica", "normal");
      }

      function fmtDateId(isoStr) { return fmtDateLongIndonesia(isoStr); }

      var today = new Date();
      var bulanArr = [
        "Januari",
        "Februari",
        "Maret",
        "April",
        "Mei",
        "Juni",
        "Juli",
        "Agustus",
        "September",
        "Oktober",
        "November",
        "Desember",
      ];
      var todayStr =
        today.getDate() +
        " " +
        bulanArr[today.getMonth()] +
        " " +
        today.getFullYear();

      // ── KOP SURAT ────────────────────────────────────────────────
      yPos = renderKopSuratPDF(doc, comp, pw, m);

      // ── JUDUL SURAT KETERANGAN KERJA ───────────────────────────
      yPos += 6;
      doc.setFontSize(12.5);
      bold();
      st(cNavy);
      doc.text("SURAT KETERANGAN KERJA", pw / 2, yPos, { align: "center" });
      yPos += 7;

      // ── PEMBUKA ────────────────────────────────────────────────
      doc.setFontSize(9);
      normal();
      st(cText);
      doc.text("Yang bertandatangan di bawah ini:", m, yPos);
      yPos += 5;

      // Signer table
      var signerRows = [
        ["Nama", "Hisar Hesti"],
        ["Jabatan", "Human Resources (HR) & Legal Manager"],
      ];
      var lblW = 30;
      signerRows.forEach(function (f) {
        doc.setFontSize(8.5);
        bold();
        st(cText);
        doc.text(f[0], m, yPos);
        normal();
        st(cSoft);
        doc.text(":", m + lblW, yPos);
        st(cText);
        doc.text(f[1], m + lblW + 4, yPos);
        yPos += 5.5;
      });
      yPos += 3;

      doc.setFontSize(9);
      normal();
      st(cText);
      doc.text("Dengan ini menerangkan bahwa:", m, yPos);
      yPos += 5;

      // Employee name
      var empName = emp && emp.fullName ? emp.fullName : "-";
      doc.setFontSize(8.5);
      bold();
      st(cText);
      doc.text("Nama", m, yPos);
      normal();
      st(cSoft);
      doc.text(":", m + lblW, yPos);
      st(cText);
      doc.text(empName, m + lblW + 4, yPos);
      yPos += 7;

      // ── PARAGRAF UTAMA ───────────────────────────────────────────
      doc.setFontSize(9);
      normal();
      st(cText);

      var joinDateStr =
        emp && emp.joinDate ? fmtDateId(emp.joinDate) : "-";
      var positionStr =
        emp && (emp.position || emp.positionCurrent)
          ? emp.position || emp.positionCurrent
          : "Karyawan";
      var endDateStr =
        emp && (emp.lastWorkingDate || emp.resignDate)
          ? fmtDateId(emp.lastWorkingDate || emp.resignDate)
          : todayStr;

      var para1 =
        "Telah bekerja di " +
        comp.name +
        " terhitung sejak " +
        joinDateStr +
        " dengan jabatan terakhir sebagai " +
        positionStr +
        ". Masa kerja di " +
        comp.name +
        " telah berakhir pada tanggal " +
        endDateStr +
        ".";

      yPos += para1Lines.length * 4.8 + 5;

      var para2 =
        "Demikian surat keterangan ini dibuat dan digunakan sebagaimana mestinya.";
      var para2Lines = doc.splitTextToSize(para2, pw - m * 2);
      doc.text(para2Lines, m, yPos);
      yPos += para2Lines.length * 4.8 + 4;

      // ── TANDA TANGAN ─────────────────────────────────────────────
      var sigLineW = 60;
      var sigX = pw - m - sigLineW;

      doc.setFontSize(8.5);
      normal();
      st(cText);
      doc.text("Jakarta, " + todayStr, sigX, yPos);
      yPos += 6;

      doc.setFontSize(9);
      normal();
      st(cText);
      doc.text("Hormat Kami,", sigX, yPos);
      yPos += 14;

      sd(cPrimary);
      doc.setLineWidth(0.4);
      doc.line(sigX, yPos, sigX + sigLineW, yPos);
      doc.setLineWidth(0.2);
      yPos += 6;

      doc.setFontSize(9.5);
      bold();
      st(cNavy);
      doc.text("Hisar Hesti", sigX, yPos);
      yPos += 4.5;
      doc.setFontSize(8.5);
      normal();
      st(cSoft);
      doc.text("HR & Legal Manager", sigX, yPos);
      yPos += 3;



      var safeName =
        emp && emp.fullName
          ? emp.fullName.replace(/[^a-zA-Z0-9 ]/g, "").replace(/\s+/g, "_")
          : "Karyawan";
      var fileName =
        "Paklaring_" +
        safeName +
        "_" +
        (result.evalId || (emp.employeeId || "").replace(/[^a-zA-Z0-9]/g, "")) +
        ".pdf";
      doc.save(fileName);
      showToast(
        "Surat Keterangan Kerja (Paklaring) berhasil diunduh: " + fileName,
        "success",
      );
      if (callback) callback(true);
    } catch (err) {
      console.error("Paklaring PDF Error:", err);
      showToast("Gagal generate Paklaring PDF: " + err.message, "error");
      if (callback) callback(false);
    }
  }

      function detectNumbering(text) {
        var s = String(text || "").trimLeft ? String(text || "").replace(/^\s+/, "") : String(text || "");
        var orig = String(text || "");

        // Level 3: huruf kecil "a." atau "a)" — indent 16mm
        var m1 = s.match(/^([a-z])([.)]\s+)([\s\S]*)$/);
        if (m1) return { level: 3, numStr: m1[1] + m1[2].trim() + " ", body: m1[3], indentMm: 16, numW: 6 };

        // Level 2: angka dengan kurung tutup "1)" — indent 8mm
        var m2 = s.match(/^(\d+)(\)\s+)([\s\S]*)$/);
        if (m2) return { level: 2, numStr: m2[1] + ") ", body: m2[3], indentMm: 8, numW: 6 };

        // Level 1: angka dengan titik "1." — flush kiri (indent 0), body mulai setelah nomor
        var m3 = s.match(/^(\d+)(\.\s+)([\s\S]*)$/);
        if (m3) return { level: 1, numStr: m3[1] + ". ", body: m3[3], indentMm: 0, numW: 6 };

        return null;
      }

      function para(text, baseIndent) {
        baseIndent = baseIndent || 0;
        var contentW = pw - m * 2;
        var lh = 4.8;

        var items = (text || "").split(/\n/);
        items.forEach(function (t) {
          var tStr = String(t);
          if (!tStr.trim()) { curY += 3; return; }

          // Strip leading spaces before numbering detection
          var stripped = tStr.replace(/^[ \t]+/, "");
          var numInfo = detectNumbering(stripped);

          doc.setFontSize(8);
          normal();
          st(cText);

          if (numInfo) {
            // xNum: left edge of the number character
            var xNum  = m + baseIndent + numInfo.indentMm;
            // xBody: left edge of body text (hanging indent — aligns wrapped lines)
            var xBody = xNum + numInfo.numW;
            var bodyW = contentW - baseIndent - numInfo.indentMm - numInfo.numW;

            var lines = doc.splitTextToSize(numInfo.body, bodyW);
            needSpace(Math.max(lines.length * lh + 2, lh + 2));

            // Draw number
            doc.text(numInfo.numStr, xNum, curY);

            // Draw body lines — justify all except last line
            for (var li = 0; li < lines.length; li++) {
              var isLast = (li === lines.length - 1);
              if (!isLast && lines[li].trim().length > 5) {
                doc.text(lines[li], xBody, curY, { align: "justify", maxWidth: bodyW });
              } else {
                doc.text(lines[li], xBody, curY);
              }
              curY += lh;
            }
            curY -= 0.5; // tighten gap between numbered items

          } else {
            // Plain paragraph — full width, justify
            var xBase = m + baseIndent;
            var paraW = contentW - baseIndent;
            var pLines = doc.splitTextToSize(tStr, paraW);
            needSpace(pLines.length * lh + 2);

            for (var pi = 0; pi < pLines.length; pi++) {
              var isLast = (pi === pLines.length - 1);
              if (!isLast && pLines[pi].trim().length > 5) {

              } else {
                doc.text(pLines[pi], xBase, curY);
              }
              curY += lh;
            }
            curY -= 0.5;
          }
        });
      }
