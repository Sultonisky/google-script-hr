name: Deploy MITO HRIS

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mito-hris-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mito-hris-laravel

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, dom, fileinfo, sqlite3
          coverage: none
          tools: composer

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare Laravel environment
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Install Node dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Build frontend assets
        run: npm run build

      - name: Run Laravel tests
        run: php artisan test --without-tty

  deploy:
    needs: verify
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -Eeuo pipefail

            trap 'echo "Deployment failed at line ${LINENO}: ${BASH_COMMAND}" >&2' ERR

            cd /home/ubuntu/hris/mito-hris-laravel

            echo "== Updating source =="
            git fetch --prune origin main
            git reset --hard origin/main

            echo "== Installing PHP dependencies =="
            composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-progress

            echo "== Checking Node dependencies =="
            if [ -f package-lock.json ]; then
              npm ci --no-audit --no-fund
            else
              npm install --no-audit --no-fund
            fi

            echo "== Building frontend assets =="
            npm run build

            echo "== Running Laravel tests =="
            echo "Tests already passed in the verify job. Production deploy skips dev-only PHPUnit dependencies."

            echo "== Running MITO diagnostics =="
            php artisan mito:diagnose

            echo "== Checking Google Sheets =="
            php artisan mito:health-check
            php artisan mito:setup-sheets --fix --no-interaction
            php artisan mito:validate-schema
            php artisan mito:sync

            echo "== Laravel optimization =="
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            echo "== Reloading PHP-FPM =="
            sudo systemctl reload php8.3-fpm

            echo "== Deployment completed successfully =="
