<!-- js/userManagement.html — User Management Client Logic -->
<script>
  // ============================================================
  // User Management Module
  // ============================================================
  var UserManagement = {
    users: [],
    editingEmail: null,

    /**
     * Load all users
     */
    load: function() {
      var tbody = document.getElementById('usersTableBody');
      var sessionToken = typeof getAuthSessionToken === 'function' ? getAuthSessionToken() : '';
      if (tbody) tbody.innerHTML = '<tr><td colspan="5" class="text-center py-4"><div class="spinner-border text-primary" role="status"></div><p class="mt-2 text-muted">Memuat data pengguna...</p></td></tr>';

      google.script.run
        .withSuccessHandler(function(result) {
          if (result.success) {
            UserManagement.users = result.users;
            UserManagement.renderTable();
          } else {
            tbody.innerHTML = '<tr><td colspan="5" class="text-center text-danger py-4"><i class="bi bi-exclamation-triangle"></i> ' + (result.error || 'Gagal memuat data') + '</td></tr>';
          }
        })
        .withFailureHandler(function(err) {
          tbody.innerHTML = '<tr><td colspan="5" class="text-center text-danger py-4">Error: ' + err.message + '</td></tr>';
        })
        .getAllUsers(sessionToken);
    },

    /**
     * Render users table
     */
    renderTable: function() {
      var tbody = document.getElementById('usersTableBody');
      var countEl = document.getElementById('userCount');
      if (countEl) countEl.textContent = UserManagement.users.length + ' pengguna';
      if (!UserManagement.users.length) {
        tbody.innerHTML = '<tr><td colspan="5" class="text-center py-4 text-muted"><i class="bi bi-inbox" style="font-size:2rem;"></i><br>Belum ada pengguna. Klik "Tambah Pengguna" untuk memulai.</td></tr>';
        return;
      }

      var html = '';
      UserManagement.users.forEach(function(u) {
        var statusBadge = u.status === 'Active'
          ? '<span class="badge bg-success">Aktif</span>'
          : '<span class="badge bg-secondary">Nonaktif</span>';
        var roleBadge = UserManagement.getRoleBadge(u.role);
        html += '<tr>' +
          '<td><div class="fw-semibold">' + (u.fullName || '-') + '</div><small class="text-muted">' + u.email + '</small></td>' +
          '<td>' + roleBadge + '</td>' +
          '<td>' + statusBadge + '</td>' +
          '<td><small class="text-muted">' + (u.lastLogin || '-') + '</small></td>' +
          '<td class="text-end">' +
            '<button class="btn btn-sm btn-outline-primary me-1" onclick="UserManagement.openEditModal(\'' + u.email.replace(/'/g, "\\'") + '\')" title="Edit"><i class="bi bi-pencil"></i></button>' +
            '<button class="btn btn-sm btn-outline-danger" onclick="UserManagement.confirmDelete(\'' + u.email.replace(/'/g, "\\'") + '\', \'' + (u.fullName || '').replace(/'/g, "\\'") + '\')" title="Hapus"><i class="bi bi-trash"></i></button>' +
          '</td></tr>';
      });
      tbody.innerHTML = html;
    },

    /**
     * Get badge HTML for role
     */
    getRoleBadge: function(role) {
      var map = {
        'Super Admin': 'bg-danger',
        'HR Admin': 'bg-primary',
        'Recruiter': 'bg-info text-dark',
        'Manager': 'bg-secondary',
        'Viewer': 'bg-light text-dark'
      };
      return '<span class="badge ' + (map[role] || 'bg-secondary') + '">' + role + '</span>';
    },

    /**
     * Filter table by search input
     */
    filterTable: function() {
      var query = (document.getElementById('userSearch')?.value || '').toLowerCase();
      var rows = document.querySelectorAll('#usersTableBody tr');
      rows.forEach(function(row) {
        row.style.display = row.textContent.toLowerCase().indexOf(query) === -1 ? 'none' : '';
      });
    },

    /**
     * Open Add User Modal
     */
    openAddModal: function() {
      UserManagement.editingEmail = null;
      document.getElementById('userModalLabel').textContent = 'Tambah Pengguna';
      document.getElementById('userEmail').value = '';
      document.getElementById('userFullName').value = '';
      document.getElementById('userRole').value = 'Viewer';
      document.getElementById('userEmail').disabled = false;
      var modal = new bootstrap.Modal(document.getElementById('userModal'));
      modal.show();
    },

    /**
     * Open Edit User Modal
     */
    openEditModal: function(email) {
      var user = UserManagement.users.find(function(u) { return u.email === email; });
      if (!user) return;
      UserManagement.editingEmail = email;
      document.getElementById('userModalLabel').textContent = 'Edit Pengguna';
      document.getElementById('userEmail').value = user.email;
      document.getElementById('userEmail').disabled = true;
      document.getElementById('userFullName').value = user.fullName;
      document.getElementById('userRole').value = user.role;
      var modal = new bootstrap.Modal(document.getElementById('userModal'));
      modal.show();
    },

    /**
     * Save user (create or update)
     */
    save: function() {
      var sessionToken = typeof getAuthSessionToken === 'function' ? getAuthSessionToken() : '';
      var email = document.getElementById('userEmail').value.trim().toLowerCase();
      var fullName = document.getElementById('userFullName').value.trim();
      var role = document.getElementById('userRole').value;
      var saveBtn = document.getElementById('saveUserBtn');
      saveBtn.disabled = true;
      saveBtn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Menyimpan...';

      if (UserManagement.editingEmail) {
        // Update
        google.script.run
          .withSuccessHandler(function(result) {
            saveBtn.disabled = false;
            saveBtn.innerHTML = '<i class="bi bi-check-lg"></i> Simpan';
            if (result.success) {
              bootstrap.Modal.getInstance(document.getElementById('userModal')).hide();
              showToast('Pengguna berhasil diperbarui.', 'success');
              UserManagement.load();
            } else {
              showToast(result.error || 'Gagal memperbarui.', 'danger');
            }
          })
          .withFailureHandler(function(err) {
            saveBtn.disabled = false;
            saveBtn.innerHTML = '<i class="bi bi-check-lg"></i> Simpan';
            showToast('Error: ' + err.message, 'danger');
          })
          .updateUser(UserManagement.editingEmail, { fullName: fullName, role: role }, sessionToken);
      } else {
        // Create
        google.script.run
          .withSuccessHandler(function(result) {
            saveBtn.disabled = false;
            saveBtn.innerHTML = '<i class="bi bi-check-lg"></i> Simpan';
            if (result.success) {
              bootstrap.Modal.getInstance(document.getElementById('userModal')).hide();
              showToast('Pengguna berhasil ditambahkan.', 'success');
              UserManagement.load();
            } else {
              showToast(result.error || 'Gagal menyimpan.', 'danger');
            }
          })
          .withFailureHandler(function(err) {
            saveBtn.disabled = false;
            saveBtn.innerHTML = '<i class="bi bi-check-lg"></i> Simpan';
            showToast('Error: ' + err.message, 'danger');
          })
          .addUser({ email: email, fullName: fullName, role: role }, sessionToken);
      }
    },

    /**
     * Confirm and delete user
     */
    confirmDelete: function(email, name) {
      var sessionToken = typeof getAuthSessionToken === 'function' ? getAuthSessionToken() : '';
      if (!confirm('Apakah Anda yakin ingin menghapus pengguna "' + name + '" (' + email + ')?')) return;
      google.script.run
        .withSuccessHandler(function(result) {
          if (result.success) {
            showToast('Pengguna berhasil dihapus.', 'success');
            UserManagement.load();
          } else {
            showToast(result.error || 'Gagal menghapus.', 'danger');
          }
        })
        .withFailureHandler(function(err) {
          showToast('Error: ' + err.message, 'danger');
        })
        .deleteUser(email, sessionToken);
    }
  };
</script>
