<!-- js/employee.html — Employee Page Logic -->
<!-- Depends on: js/helpers.html (escapeHtml, initials, statusBadgeClass, showToast, formatRupiah, parseDdMmYyyy) -->
<script>
  // ============ EMPLOYEE STATE ============
  var EMP = {
    allItems: [],
    filtered: [],
    masterData: {},
    currentPage: 1,
    detailId: null,
    editId: null,
    formModal: null,
  };

  // ============ LOAD DATA ============
  function empLoadAll() {
    var tbody = document.getElementById('empTableBody');
    var loading = document.getElementById('empTableLoading');
    var btn = document.getElementById('btnEmpRefresh');
    if (btn) btn.classList.add('spinning');
    if (loading) loading.classList.remove('d-none');
    if (tbody) tbody.innerHTML = '';

    google.script.run
      .withSuccessHandler(function (result) {
        if (btn) btn.classList.remove('spinning');
        if (loading) loading.classList.add('d-none');
        if (result && result.success) {
          EMP.allItems = result.data || [];
          empRenderStats();
          empPopulateFilters();
          empApplyFilters();
        }
      })
      .withFailureHandler(function (err) {
        if (btn) btn.classList.remove('spinning');
        if (loading) loading.classList.add('d-none');
        if (typeof showToast === 'function') showToast('Gagal memuat data: ' + err.message, 'error');
      })
      .getEmployeeList();
  }

  function empLoadMaster() {
    google.script.run
      .withSuccessHandler(function (result) {
        if (result && result.success) {
          EMP.masterData = result.data || {};
          empPopulateFormSelects();
        }
      })
      .withFailureHandler(function () {})
      .getMasterDataGrouped();
  }

  // ============ STATS ============
  function empRenderStats() {
    var total      = EMP.allItems.length;
    var permanent  = 0;
    var contract   = 0;
    var probation  = 0;
    var outsource  = 0;

    EMP.allItems.forEach(function(e) {
      var s = (e.statusEmployee || '').toLowerCase();
      var isOutsource = Boolean(
        (e.outsourceVendor && e.outsourceVendor.trim()) ||
        e.createdBy === 'System (Outsource Form)' ||
        s === 'outsource'
      );
      if (isOutsource) {
        outsource++;
      } else if (s === 'permanent') {
        permanent++;
      } else if (s === 'contract') {
        contract++;
      } else if (s === 'probation') {
        probation++;
      }
    });

    var totalEl       = document.getElementById('empStatTotal');
    var permEl        = document.getElementById('empStatPermanent');
    var contractEl    = document.getElementById('empStatContract');
    var probEl        = document.getElementById('empStatProbation');
    var outsourceEl   = document.getElementById('empStatOutsource');

    if (totalEl)     animateCounter(totalEl,     total);
    if (permEl)      animateCounter(permEl,      permanent);
    if (contractEl)  animateCounter(contractEl,  contract);
    if (probEl)      animateCounter(probEl,      probation);
    if (outsourceEl) animateCounter(outsourceEl, outsource);
  }

  // ============ FILTERS ============
  function empPopulateFilters() {
    var depts = {};
    EMP.allItems.forEach(function (e) {
      if (e.department) depts[e.department] = true;
    });

    var fDept = document.getElementById('empDeptFilter');
    var curDept = fDept ? fDept.value : '';
    if (fDept) {
      fDept.innerHTML = '<option value="">Semua Dept</option>';
      Object.keys(depts).sort().forEach(function (d) {
        fDept.innerHTML += '<option value="' + escapeHtml(d) + '"' +
          (curDept === d ? ' selected' : '') + '>' + escapeHtml(d) + '</option>';
      });
    }
  }

  function empApplyFilters() {
    var siEl = document.getElementById('empSearchInput');
    var dfEl = document.getElementById('empDeptFilter');
    var sfEl = document.getElementById('empStatusFilter');
    var ssEl = document.getElementById('empSortSelect');

    if (!siEl) return;

    var kw = siEl.value.trim().toLowerCase();
    var dept = dfEl ? dfEl.value : '';
    var status = sfEl ? sfEl.value : '';
    var sort = ssEl ? ssEl.value : 'newest';

    EMP.filtered = EMP.allItems.filter(function (e) {
      var mk = !kw ||
        (e.fullName || '').toLowerCase().indexOf(kw) !== -1 ||
        (e.nik || '').replace(/'/g, '').toLowerCase().indexOf(kw) !== -1 ||
        (e.npwp || '').replace(/'/g, '').toLowerCase().indexOf(kw) !== -1 ||
        (e.personalEmail || e.email || '').toLowerCase().indexOf(kw) !== -1 ||
        (e.workingEmail || '').toLowerCase().indexOf(kw) !== -1 ||
        (e.mobilePhone || e.phone || '').replace(/'/g, '').toLowerCase().indexOf(kw) !== -1 ||
        (e.positionCurrent || e.position || '').toLowerCase().indexOf(kw) !== -1 ||
        (e.department || '').toLowerCase().indexOf(kw) !== -1 ||
        (e.branchName || e.branch || '').toLowerCase().indexOf(kw) !== -1 ||
        (e.jobLevel || '').toLowerCase().indexOf(kw) !== -1 ||
        (e.grade || '').toLowerCase().indexOf(kw) !== -1 ||
        (e.directSuperior || '').toLowerCase().indexOf(kw) !== -1 ||
        (e.indirectSuperior || '').toLowerCase().indexOf(kw) !== -1 ||
        (e.costCenter || '').toLowerCase().indexOf(kw) !== -1 ||
        (e.bankName || '').toLowerCase().indexOf(kw) !== -1 ||
        (e.bankAccount || '').replace(/'/g, '').toLowerCase().indexOf(kw) !== -1 ||
        (e.bpjsKetenagakerjaan || '').replace(/'/g, '').toLowerCase().indexOf(kw) !== -1 ||
        (e.bpjsKesehatan || '').replace(/'/g, '').toLowerCase().indexOf(kw) !== -1 ||
        (e.areaKerja || '').toLowerCase().indexOf(kw) !== -1 ||
        (e.lokasiKerja || e.city || '').toLowerCase().indexOf(kw) !== -1 ||
        (e.outsourceVendor || '').toLowerCase().indexOf(kw) !== -1 ||
        (e.employeeId || '').toLowerCase().indexOf(kw) !== -1;
      var md = !dept || e.department === dept;
      var isOutsource = Boolean(
        (e.outsourceVendor && e.outsourceVendor.trim()) ||
        e.createdBy === 'System (Outsource Form)' ||
        (e.statusEmployee || '').toLowerCase() === 'outsource'
      );
      var ms = !status || (status.toLowerCase() === 'outsource' ? isOutsource : (e.statusEmployee || '').toLowerCase() === status.toLowerCase());
      return mk && md && ms;
    });

    EMP.filtered.sort(function (a, b) {
      switch (sort) {
        case 'oldest':
          return (parseDdMmYyyy(a.createdAt) || 0) - (parseDdMmYyyy(b.createdAt) || 0);
        case 'name_asc':
          return (a.fullName || '').localeCompare(b.fullName || '');
        case 'name_desc':
          return (b.fullName || '').localeCompare(a.fullName || '');
        default:
          return (parseDdMmYyyy(b.createdAt) || 0) - (parseDdMmYyyy(a.createdAt) || 0);
      }
    });

    EMP.currentPage = 1;
    empRenderTable();
  }

  // ============ TABLE ============
  var EMP_PAGE_SIZE = 20;

  function empRenderTable() {
    var tbody = document.getElementById('empTableBody');
    var loading = document.getElementById('empTableLoading');
    var empty = document.getElementById('empTableEmpty');
    var ps = EMP_PAGE_SIZE;

    if (loading) loading.classList.add('d-none');

    if (!EMP.filtered || EMP.filtered.length === 0) {
      if (tbody) tbody.innerHTML = '';
      if (empty) empty.classList.remove('d-none');
      var fc = document.getElementById('empFooterCount');
      if (fc) fc.innerText = 'Menampilkan 0 dari ' + EMP.allItems.length + ' data';
      empRenderPagination(ps);
      return;
    }
    if (empty) empty.classList.add('d-none');

    var totalPages = Math.max(1, Math.ceil(EMP.filtered.length / ps));
    if (EMP.currentPage > totalPages) EMP.currentPage = totalPages;
    var start = (EMP.currentPage - 1) * ps;
    var pageData = EMP.filtered.slice(start, start + ps);

    if (tbody) tbody.innerHTML = pageData.map(function (e) {
      var empStatus = e.statusEmployee || 'Inactive';
      var stBadge = entityStatusBadgeClass(empStatus);
      var displayPos = e.positionCurrent || e.position || '-';
      var displayEmail = e.personalEmail || e.email || '-';
      return '<tr class="emp-row-link" data-id="' + escapeHtml(e.employeeId) + '" style="cursor:pointer;">' +
        '<td><div class="avatar-sm">' + escapeHtml(initials(e.fullName)) + '</div></td>' +
        '<td><span class="id-mono">' + escapeHtml(e.employeeId || '-') + '</span></td>' +
        '<td><div class="cand-name cand-name-link" data-id="' + escapeHtml(e.employeeId) + '">' +
          escapeHtml(e.fullName || '-') + '</div><div class="cand-sub">' + escapeHtml(displayEmail) + '</div></td>' +
        '<td>' + escapeHtml(e.nik || '-') + '</td>' +
        '<td>' + escapeHtml(e.department || '-') + '</td>' +
        '<td>' + escapeHtml(displayPos) + '</td>' +
        '<td><span class="badge-status ' + stBadge + '">' + escapeHtml(empStatus) + '</span></td>' +
        '<td>' + escapeHtml(e.joinDate || '-') + '</td>' +
        '</tr>';
    }).join('');

    var sStart = start + 1;
    var sEnd = Math.min(start + ps, EMP.filtered.length);
    var fc2 = document.getElementById('empFooterCount');
    if (fc2) fc2.innerText = 'Menampilkan ' + sStart + '–' + sEnd +
      ' dari ' + EMP.filtered.length + ' data (total ' + EMP.allItems.length + ')';

    empRenderPagination(ps);
    empAttachRowHandlers();
  }

  function empRenderPagination(ps) {
    var nav = document.getElementById('empPaginationUi');
    if (!nav) return;
    var total = Math.max(1, Math.ceil(EMP.filtered.length / ps));
    var html = '<button class="page-btn" type="button" id="empPrev" ' +
      (EMP.currentPage === 1 ? 'disabled' : '') + '><i class="bi bi-chevron-left"></i></button>';
    var mb = 5;
    var sp = Math.max(1, EMP.currentPage - Math.floor(mb / 2));
    var ep = Math.min(total, sp + mb - 1);
    sp = Math.max(1, ep - mb + 1);
    if (sp > 1) {
      html += '<button class="page-btn" type="button" data-emp-page="1">1</button>';
      if (sp > 2) html += '<span class="page-btn" style="border:none;background:transparent;cursor:default">&hellip;</span>';
    }
    for (var p = sp; p <= ep; p++) {
      html += '<button class="page-btn' + (p === EMP.currentPage ? ' active' : '') +
        '" type="button" data-emp-page="' + p + '">' + p + '</button>';
    }
    if (ep < total) {
      if (ep < total - 1) html += '<span class="page-btn" style="border:none;background:transparent;cursor:default">&hellip;</span>';
      html += '<button class="page-btn" type="button" data-emp-page="' + total + '">' + total + '</button>';
    }
    html += '<button class="page-btn" type="button" id="empNext" ' +
      (EMP.currentPage === total ? 'disabled' : '') + '><i class="bi bi-chevron-right"></i></button>';
    nav.innerHTML = html;
    nav.querySelectorAll('button[data-emp-page]').forEach(function (b) {
      b.addEventListener('click', function () {
        EMP.currentPage = parseInt(b.getAttribute('data-emp-page'), 10);
        empRenderTable();
      });
    });
    var prev = document.getElementById('empPrev');
    var next = document.getElementById('empNext');
    if (prev) prev.addEventListener('click', function () {
      if (EMP.currentPage > 1) { EMP.currentPage--; empRenderTable(); }
    });
    if (next) next.addEventListener('click', function () {
      if (EMP.currentPage < total) { EMP.currentPage++; empRenderTable(); }
    });
  }

  function empAttachRowHandlers() {
    document.querySelectorAll('#empTableBody .emp-row-link[data-id]').forEach(function(el) {
      el.addEventListener('click', function(event) {
        if (event.target.closest('button, a, input, select, textarea, label')) return;
        openEmployeeDrawer(el.getAttribute('data-id'));
      });
    });
    document.querySelectorAll('#empTableBody .cand-name-link').forEach(function(el) {
      el.addEventListener('click', function() {
        openEmployeeDrawer(el.getAttribute('data-id'));
      });
    });
  }

  // ============ FORM MODAL ============
  function empPopulateFormSelects() {
    // mapping: master data category key -> element id
    var selectMap = {
      'department':        'efDept',
      'position':          'efPos',
    };
    Object.keys(selectMap).forEach(function (cat) {
      var sel = document.getElementById(selectMap[cat]);
      if (!sel) return;
      var items = EMP.masterData[cat] || [];
      sel.innerHTML = '<option value="">— Pilih —</option>';
      items.forEach(function (name) {
        var val = typeof name === 'object' ? name.name : name;
        sel.innerHTML += '<option value="' + escapeHtml(val) + '">' + escapeHtml(val) + '</option>';
      });
    });
  }

  function empOpenEdit() {
    var emp = EMP.allItems.find(function (x) {
      return x.employeeId === EMP.detailId;
    });
    if (!emp) return;
    EMP.editId = emp.employeeId;
    document.getElementById('empFormTitle').textContent = 'Edit Karyawan';
    document.getElementById('efId').value              = emp.employeeId;

    // SEKSI 1: Identitas & Data Pribadi
    document.getElementById('efName').value            = emp.fullName        || '';
    document.getElementById('efNik').value             = emp.nik             || '';
    document.getElementById('efNpwp').value            = emp.npwp            || '';
    document.getElementById('efBirthPlace').value      = emp.birthPlace      || '';
    document.getElementById('efBirthDate').value       = toDateInputValue(emp.birthDate);
    setSelectSmart(document.getElementById('efGender'), emp.gender);
    setSelectSmart(document.getElementById('efBloodType'), emp.bloodType);
    setSelectSmart(document.getElementById('efReligion'), emp.religion);
    setSelectSmart(document.getElementById('efMarital'), emp.maritalStatus);
    setSelectSmart(document.getElementById('efPtkp'), emp.ptkpStatus);
    document.getElementById('efEmail').value           = emp.personalEmail   || emp.email || '';
    document.getElementById('efPhone').value           = emp.mobilePhone     || emp.phone || '';
    document.getElementById('efAddress').value         = emp.citizenIdAddress || emp.address || '';
    document.getElementById('efResidentialAddress').value = emp.residentialAddress || '';

    // SEKSI 2: Bank & BPJS
    // efBankName disabled — BCA only, no need to set
    document.getElementById('efBankAccount').value     = (emp.bankAccount || '').replace(/^'/, '');
    document.getElementById('efBankHolder').value      = emp.bankAccountHolder || emp.fullName || '';
    document.getElementById('efBpjsTk').value          = (emp.bpjsKetenagakerjaan || '').replace(/^'/, '');
    document.getElementById('efBpjsKes').value         = (emp.bpjsKesehatan   || '').replace(/^'/, '');
    document.getElementById('efWorkingEmail').value    = emp.workingEmail    || '';

    // SEKSI 3: Struktur Organisasi & Pekerjaan
    setSelectSmart(document.getElementById('efStatusEmployee'), emp.statusEmployee || emp.employmentStatus || emp.status || 'Contract');
    document.getElementById('efBranch').value          = emp.branchName      || emp.branch || '';
    document.getElementById('efDivision').value        = emp.division        || '';
    setSelectSmart(document.getElementById('efDept'), emp.department);
    document.getElementById('efCostCenter').value      = emp.costCenter      || '';
    setSelectSmart(document.getElementById('efPos'), emp.positionCurrent || emp.position);
    document.getElementById('efPosNoLoc').value        = emp.positionNoLocCurrent || '';
    document.getElementById('efJoin').value            = toDateInputValue(emp.joinDate);
    document.getElementById('efJobLevel').value        = emp.jobLevel        || '';
    document.getElementById('efGrade').value           = emp.grade           || '';
    document.getElementById('efDistrict').value        = emp.areaKerja       || emp.district || '';
    document.getElementById('efCity').value            = emp.lokasiKerja     || emp.city || '';
    document.getElementById('efDirectSup').value       = emp.directSuperior  || '';
    document.getElementById('efIndirectSup').value     = emp.indirectSuperior || '';
    var vendorEl = document.getElementById('efOutsourceVendor');
    if (vendorEl) vendorEl.value = emp.outsourceVendor || '';

    // SEKSI 4: Kontrak
    var contractStartEl = document.getElementById('efContractStart');
    var contractDurEl   = document.getElementById('efContractDuration');
    var contractNoEl    = document.getElementById('efContractNumber');
    if (contractStartEl) contractStartEl.value = toDateInputValue(emp.contractStart || emp.startDateContract || '');
    if (contractDurEl)   setSelectSmart(contractDurEl, emp.contractDuration);
    if (contractNoEl)    contractNoEl.value    = emp.contractNumber     || '';
    document.getElementById('efContractEnd').value = toDateInputValue(emp.contractEnd);

    // SEKSI 5: Karier & Mutasi
    var hasMutasi = !!(emp.positionFormer || emp.typeOfRotation);
    document.getElementById('efFormerPos').value    = emp.positionFormer  || '';
    setSelectSmart(document.getElementById('efRotationType'), emp.typeOfRotation);
    document.getElementById('efMutasiDate').value   = toDateInputValue(emp.mutasiDate);
    document.getElementById('efNoSk').value         = emp.nomorSk         || '';
    document.getElementById('efResignDate').value   = toDateInputValue(emp.resignDate);

    // Banner info mutasi
    var infoEl = document.getElementById('efNoMutasiInfo');
    if (infoEl) infoEl.style.display = hasMutasi ? 'none' : 'flex';

    // Resign date: tampilkan hanya jika status offboard
    var resignWrap = document.getElementById('efResignDateWrap');
    if (resignWrap) {
      var s = (emp.statusEmployee || '').toLowerCase();
      var isOffboard = s === 'resigned' || s === 'terminated' || s === 'retired';
      resignWrap.style.display = isOffboard ? '' : 'none';
    }

    // SEKSI 6: Catatan
    var hrNotesEl = document.getElementById('efHrNotes');
    var notesEl   = document.getElementById('efNotes');
    if (hrNotesEl) hrNotesEl.value = emp.hrNotes || '';
    if (notesEl)   notesEl.value   = emp.notes   || '';

    EMP.formModal.show();
  }

  // ============ DELETE ============
  function empDelete() {
    if (!EMP.detailId) return;
    var emp = EMP.allItems.find(function (x) {
      return x.employeeId === EMP.detailId;
    });

  function _refreshOffbDocTypeOptions() {
    var offbType = ((document.getElementById('offbType') || {}).value) || '';
    var types = _getOffbDocTypeOptions(offbType);
    document.querySelectorAll('#offbDocRows .offb-doc-row').forEach(function(row) {

  function _hasRequiredDeathDocument_() {
    var rows = document.querySelectorAll('#offbDocRows .offb-doc-row');
    for (var i = 0; i < rows.length; i++) {
      var typeEl = rows[i].querySelector('.offb-doc-type');
      var fileEl = rows[i].querySelector('.offb-doc-file');
      if (
        typeEl && fileEl &&
        typeEl.value === 'Surat Kematian' &&
        fileEl.files && fileEl.files.length
      ) {
        return true;
      }
    }
    return false;
  }

  function _readFileAsBase64_(file, callback) {
    var reader = new FileReader();
    reader.onload = function(e) {
      var result = String(e.target.result || '');
      var base64 = result.indexOf(',') !== -1 ? result.split(',')[1] : result;
      callback(null, base64);
    };
    reader.onerror = function() {
      callback(new Error('Gagal membaca file "' + file.name + '".'));
    };
    reader.readAsDataURL(file);
  }

  function _collectOffbDocuments_(callback) {
    var rows = document.querySelectorAll('#offbDocRows .offb-doc-row');
    var docs = [];
    var pending = 0;
    var hadError = null;

    if (!rows.length) {
      callback(null, []);
      return;
    }

    rows.forEach(function(row) {
      var typeEl = row.querySelector('.offb-doc-type');
      var fileEl = row.querySelector('.offb-doc-file');
      if (!typeEl || !fileEl || !fileEl.files || !fileEl.files.length) return;
      pending++;
      var file = fileEl.files[0];
      if (file.size > _OFFB_DOC_MAX_BYTES) {
        hadError = 'File "' + file.name + '" melebihi batas 5 MB.';
        pending--;
        return;
      }
      _readFileAsBase64_(file, function(err, base64) {
        if (err && !hadError) hadError = err.message;
        else if (!err) {
          docs.push({
            type: typeEl.value,
            fileName: file.name,
            mimeType: file.type || 'application/octet-stream',
            dataBase64: base64
          });
        }
        pending--;
        if (pending === 0) {
          if (hadError) callback(new Error(hadError), null);
          else callback(null, docs);
        }
      });
    });

    if (pending === 0) {
      if (hadError) callback(new Error(hadError), null);
      else callback(null, docs);
    }
  }

        ['offbType','offbReason','offbBpjsTk','offbBpjsKes','offbApprovedBy','offbNotes'].forEach(function(fid) {
          var el = document.getElementById(fid); if (el) el.value = '';
        });
        var pakEl = document.getElementById('offbPaklaring');
        if (pakEl) pakEl.value = '';
        _resetOffbDocuments();
        var btn = document.getElementById('btnConfirmOffboarding');
        if (btn) btn.disabled = true;
        var tEl = document.getElementById('btnOffbText'); var lEl = document.getElementById('btnOffbLoading');
        if (tEl) tEl.style.display = 'inline-flex';
        if (lEl) lEl.style.display = 'none';
      });
    }

    var confirmBtn = document.getElementById('btnConfirmOffboarding');
    if (confirmBtn) {
      confirmBtn.addEventListener('click', function() {
        var empId = (document.getElementById('offbEmployeeId') || {}).value || '';
        var type  = (document.getElementById('offbType') || {}).value || '';
        var lwd   = (document.getElementById('offbLastWorkingDate') || {}).value || '';
        var rsn   = ((document.getElementById('offbReason') || {}).value || '').trim();
        if (!empId || !type || !lwd || !rsn) return;
        if (type === 'Death' && !_hasRequiredDeathDocument_()) {
          showToast('Tipe Meninggal wajib melampirkan dokumen Surat Kematian.', 'warning');
          return;
        }

        var tEl = document.getElementById('btnOffbText');
        var lEl = document.getElementById('btnOffbLoading');
        confirmBtn.disabled = true;
        if (tEl) tEl.style.display = 'none';
        if (lEl) lEl.style.display = 'inline-flex';

        _collectOffbDocuments_(function(docErr, documents) {
          if (docErr) {
            confirmBtn.disabled = false;
            if (tEl) tEl.style.display = 'inline-flex';
            if (lEl) lEl.style.display = 'none';
            showToast(docErr.message || 'Gagal membaca dokumen.', 'error');
            return;
          }

          var payload = {
            employeeId:          empId,
            offboardingType:     type,
            lastWorkingDate:     lwd,
            reason:              rsn,
            bpjsKetenagakerjaan: (document.getElementById('offbBpjsTk')     || {}).value || '',
            bpjsKesehatan:       (document.getElementById('offbBpjsKes')    || {}).value || '',
            approvedBy:          (document.getElementById('offbApprovedBy') || {}).value || '',
            notes:               (document.getElementById('offbNotes')      || {}).value || '',
            documents:           documents || []
          };

          google.script.run
            .withSuccessHandler(function(res) {
              confirmBtn.disabled = false;
              if (tEl) tEl.style.display = 'inline-flex';
              if (lEl) lEl.style.display = 'none';
              bootstrap.Modal.getInstance(document.getElementById('offboardingModal')).hide();
              if (res && res.success) {
                var docMsg = res.documentsUploaded
                  ? ' · ' + res.documentsUploaded + ' dokumen diunggah'
                  : '';
                showToast('Offboarding <strong>' + escapeHtml((_offbActiveEmp || {}).fullName || '') +
                  '</strong> berhasil — ' + escapeHtml(type) + docMsg, 'success', 5000);
                empLoadAll();

                var emp = _offbActiveEmp || {};
                var empDataObj = res.employeeData || {};
                var prevStatusStr = empDataObj.prevStatus || emp.statusEmployee || emp.employmentStatus || emp.status || '';
                var isPermanent = (typeof empDataObj.isPermanent === 'boolean')
                  ? empDataObj.isPermanent
                  : (String(prevStatusStr).toLowerCase().indexOf('permanent') !== -1 ||
                     String(prevStatusStr).toLowerCase().indexOf('pkwtt') !== -1 ||
                     String(prevStatusStr).toLowerCase().indexOf('tetap') !== -1);

                var offbData = {
                  employeeId:        emp.employeeId || empDataObj.employeeId || payload.employeeId,
                  fullName:          emp.fullName || empDataObj.fullName || '',
                  nik:               emp.nik || empDataObj.nik || '',
                  position:          emp.positionCurrent || emp.position || empDataObj.position || '',
                  department:        emp.department || empDataObj.department || '',
                  joinDate:          emp.joinDate || empDataObj.joinDate || '',
                  lastWorkingDate:   payload.lastWorkingDate || '',
                  branchName:        emp.branchName || empDataObj.branchName || '',
                  division:          emp.division || empDataObj.division || '',
                  citizenIdAddress:  emp.citizenIdAddress || emp.address || empDataObj.citizenIdAddress || empDataObj.address || '',
                  residentialAddress: emp.residentialAddress || empDataObj.residentialAddress || '',
                  skNumber:          res.skNumber || payload.skNumber || '',
                  offboardingType:   payload.offboardingType,
                  reason:            payload.reason,
                  isPermanent:       isPermanent,
                  prevStatus:        prevStatusStr,
                  notes:             payload.notes || '',
                  approvedBy:        payload.approvedBy || '',
                };



                var offbEmpData = {
                  fullName:        offbData.fullName,
                  employeeId:      offbData.employeeId,
                  nik:             offbData.nik,
                  position:        offbData.position,
                  department:      offbData.department,
                  division:        offbData.division,
                  branch:          offbData.branchName,
                  branchName:      offbData.branchName,
                  joinDate:        offbData.joinDate,
                  lastWorkingDate: offbData.lastWorkingDate,
                  citizenIdAddress:   offbData.citizenIdAddress || offbData.residentialAddress || '',
                  residentialAddress: offbData.residentialAddress || offbData.citizenIdAddress || '',
                  address:            offbData.citizenIdAddress || offbData.residentialAddress || '',
                  suratNumber:     offbData.skNumber || '001/HRD-SKK/MSI/VII/2026',
                };

                // 1. Selalu generate SK Offboarding (untuk semua status)
                exportOffboardingLetterPDF(offbData, function(success) {
                  if (!success) {
                    showToast('Gagal membuat PDF SK Offboarding.', 'error');
                  }
                });

                if (isPermanent) {
                  // 2. Karyawan Permanent (Tetap): selalu generate Paklaring
                  setTimeout(function() {
                    exportPaklaringPDF(offbEmpData, {
                      catatan: offbData.notes,
                    }, {
                      evalId: (offbData.skNumber || '').replace(/[^a-zA-Z0-9]/g, '') || offbData.employeeId,
                    });
                  }, 800);
                } else {
                  // 3. Karyawan Kontrak / PKWT / Probation: selalu generate Paklaring
                  exportPaklaringPDF(offbEmpData, {
                    catatan: offbData.notes,
                  }, {
                    evalId: (offbData.skNumber || '').replace(/[^a-zA-Z0-9]/g, '') || offbData.employeeId,
                  }, function(success) {
                    if (!success) {
                      showToast('Gagal membuat PDF Paklaring.', 'error');
                    }
                  });
                }

                // 4. Generate Surat Keterangan BPJS Ketenagakerjaan (untuk semua)
                setTimeout(function() {
                  if (typeof exportSuratBPJS === 'function') {
                    exportSuratBPJS(offbEmpData);
                  }
                }, 500);
              } else {
                showToast('Gagal: ' + (res ? res.message : 'Error'), 'error');
              }
            })
            .withFailureHandler(function(err) {
              confirmBtn.disabled = false;
              if (tEl) tEl.style.display = 'inline-flex';
              if (lEl) lEl.style.display = 'none';
              showToast('Error: ' + (err ? err.message : 'Unknown'), 'error');
            })
            .processOffboarding(payload);
        });
      });
    }
  }

  // GLOBAL EXPORT SHORTCUTS FOR OFFBOARDED EMPLOYEES
  // ============================================================
  window.exportOffboardingLetterPDFFromEmp = function(empId) {
    var emp = (EMP.allItems || []).find(function(e) { return String(e.employeeId) === String(empId); });
    if (!emp) { showToast('Data karyawan tidak ditemukan.', 'error'); return; }

    // Gunakan lastWorkingDate dari berbagai sumber yang tersedia
    var lwd = emp.resignDate || emp.lastWorkingDate || emp.offboardingDate || '';

    exportOffboardingLetterPDF({
      employeeId:      emp.employeeId,
      fullName:        emp.fullName,
      nik:             emp.nik,
      position:        emp.positionCurrent || emp.position,
      department:      emp.department,
      division:        emp.division,
      branchName:      emp.branchName || emp.branch,
      joinDate:        emp.joinDate,
      lastWorkingDate: lwd,
      resignDate:      lwd,
      offboardingType: emp.offboardingType || 'Offboarding',
      reason:          emp.offboardingReason || 'Pengakhiran Hubungan Kerja',
      skNumber:        emp.nomorSk || '',
      approvedBy:      emp.offboardingApprovedBy || '',
      notes:           emp.notes || emp.hrNotes || '',
      statusEmployee:  emp.statusEmployee || emp.employmentStatus || '',
    }, function(ok) {
      if (!ok) showToast('Gagal membuat PDF SK Offboarding.', 'error');
    });
  };

  window.exportPaklaringPDFFromEmp = function(empId) {
    var emp = (EMP.allItems || []).find(function(e) { return String(e.employeeId) === String(empId); });
    if (!emp) { showToast('Data karyawan tidak ditemukan.', 'error'); return; }

    var lwd = emp.resignDate || emp.lastWorkingDate || emp.offboardingDate || '';

    exportPaklaringPDF({
      fullName:           emp.fullName,
      employeeId:         emp.employeeId,
      nik:                emp.nik,
      position:           emp.positionCurrent || emp.position,
      department:         emp.department,
      division:           emp.division,
      branch:             emp.branchName || emp.branch,
      branchName:         emp.branchName || emp.branch,
      joinDate:           emp.joinDate,
      lastWorkingDate:    lwd,
      citizenIdAddress:   emp.citizenIdAddress || emp.address || '',
      residentialAddress: emp.residentialAddress || '',
    }, {
      catatan: emp.notes || emp.hrNotes || '',
    }, {
      evalId: (emp.nomorSk || '').replace(/[^a-zA-Z0-9]/g, '') || emp.employeeId,
    }, function(ok) {
      if (!ok) showToast('Gagal membuat PDF Paklaring.', 'error');
    });
  };

  // ============================================================
  // CONTRACT END MODAL
  // ============================================================
  var _ceActiveEmp = null;

  function openContractEndModal(emp) {
    _ceActiveEmp = emp || null;
    // Fill info karyawan
    var av = document.getElementById('ceAvatar');
    var nm = document.getElementById('ceName');
    var ps = document.getElementById('cePosition');
    var dp = document.getElementById('ceDept');
    var id = document.getElementById('ceEmpIdDisp');
    var jd = document.getElementById('ceJoinDate');
    var hd = document.getElementById('ceEmployeeId');
    var ceEnd = document.getElementById('ceContractEndDisp');
    var lwdEl = document.getElementById('ceLastWorkingDate');
    var bt = document.getElementById('ceBpjsTk');
    var bk = document.getElementById('ceBpjsKes');

    if (av) av.innerText = initials((emp || {}).fullName || '');
    if (nm) nm.innerText = (emp && emp.fullName) || '-';
    if (ps) ps.innerText = (emp && (emp.positionCurrent || emp.position)) || '-';
    if (dp) dp.innerText = (emp && emp.department) || '-';
    if (id) id.innerText = (emp && emp.employeeId) || '-';
    if (jd) jd.innerText = (emp && emp.joinDate) || '-';
    if (hd) hd.value     = (emp && emp.employeeId) || '';

    // Tanggal akhir kontrak — prioritas: contractEnd dari emp, fallback today
    var contractEndVal = (emp && (emp.contractEnd || emp.endDateContract || emp.endDate)) || '';
    if (ceEnd) ceEnd.textContent = contractEndVal || '(tidak terdaftar)';
    if (lwdEl) {
      // Coba format ke YYYY-MM-DD untuk input[type=date]
      var lwdForInput = '';
      if (contractEndVal) {
        // Coba parse DD/MM/YYYY
        var mDMY = contractEndVal.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
        if (mDMY) {
          lwdForInput = mDMY[3] + '-' + ('0'+mDMY[2]).slice(-2) + '-' + ('0'+mDMY[1]).slice(-2);
        } else {
          // Coba parse YYYY-MM-DD atau via Date
          var d = new Date(contractEndVal);
          if (!isNaN(d.getTime())) lwdForInput = d.toISOString().split('T')[0];
        }
      }
      lwdEl.value = lwdForInput || new Date().toISOString().split('T')[0];
    }

    // Auto-fill BPJS dari data karyawan
    if (bt && emp) bt.value = emp.bpjsKetenagakerjaan || '';
    if (bk && emp) bk.value = emp.bpjsKesehatan       || '';

    // Reset catatan & approved by
    ['ceNotes', 'ceApprovedBy'].forEach(function(id) {
      var el = document.getElementById(id); if (el) el.value = '';
    });
    // Reset toggle BPJS ke default aktif
    var bpjsToggle = document.getElementById('ceGenerateBpjs');
    if (bpjsToggle) bpjsToggle.checked = true;

    _updateCeConfirmBtn();
    bootstrap.Modal.getOrCreateInstance(document.getElementById('contractEndModal')).show();
  }

  function _updateCeConfirmBtn() {
    var btn = document.getElementById('btnConfirmContractEnd');
    if (!btn) return;
    var lwd = ((document.getElementById('ceLastWorkingDate') || {}).value || '').trim();
    btn.disabled = !(_ceActiveEmp && lwd);
  }

  function initContractEndModal() {
    var lwdEl = document.getElementById('ceLastWorkingDate');
    if (lwdEl) lwdEl.addEventListener('input', _updateCeConfirmBtn);

    var confirmBtn = document.getElementById('btnConfirmContractEnd');
    if (!confirmBtn) return;

    confirmBtn.addEventListener('click', function() {
      if (!_ceActiveEmp) return;
      var empId = (document.getElementById('ceEmployeeId') || {}).value || '';
      var lwd   = ((document.getElementById('ceLastWorkingDate') || {}).value || '').trim();
      if (!empId || !lwd) return;

      var tEl = document.getElementById('btnCeText');
      var lEl = document.getElementById('btnCeLoading');
      confirmBtn.disabled = true;
      if (tEl) tEl.style.display = 'none';
      if (lEl) lEl.style.display = 'inline-flex';

      var payload = {
        employeeId:      empId,
        offboardingType: 'Contract Finished',
        lastWorkingDate: lwd,
        reason:          'Kontrak PKWT berakhir dan tidak diperpanjang',
        bpjsKetenagakerjaan: ((document.getElementById('ceBpjsTk') || {}).value || '').trim(),
        bpjsKesehatan:       ((document.getElementById('ceBpjsKes') || {}).value || '').trim(),
        approvedBy:          ((document.getElementById('ceApprovedBy') || {}).value || '').trim(),
        notes:               ((document.getElementById('ceNotes') || {}).value || '').trim(),
        documents:           [],
      };

      google.script.run
        .withSuccessHandler(function(res) {
          confirmBtn.disabled = false;
          if (tEl) tEl.style.display = 'inline-flex';
          if (lEl) lEl.style.display = 'none';
          bootstrap.Modal.getInstance(document.getElementById('contractEndModal')).hide();

          if (res && res.success) {
            showToast('Akhir kontrak <strong>' + escapeHtml((_ceActiveEmp || {}).fullName || '') + '</strong> berhasil diproses.', 'success', 5000);
            empLoadAll();

            var emp = _ceActiveEmp || {};
            var empDataObj = res.employeeData || {};

            var offbEmpData = {
              fullName:           emp.fullName || empDataObj.fullName || '',
              employeeId:         emp.employeeId || empDataObj.employeeId || payload.employeeId,
              nik:                emp.nik || empDataObj.nik || '',
              position:           emp.positionCurrent || emp.position || empDataObj.position || '',
              department:         emp.department || empDataObj.department || '',
              division:           emp.division || empDataObj.division || '',
              branch:             emp.branchName || empDataObj.branchName || '',
              branchName:         emp.branchName || empDataObj.branchName || '',
              joinDate:           emp.joinDate || empDataObj.joinDate || '',
              lastWorkingDate:    payload.lastWorkingDate,
              citizenIdAddress:   emp.citizenIdAddress || emp.address || empDataObj.citizenIdAddress || '',
              residentialAddress: emp.residentialAddress || empDataObj.residentialAddress || '',
              address:            emp.citizenIdAddress || emp.address || empDataObj.citizenIdAddress || '',
              suratNumber:        res.skNumber || '',
            };

            var offbData = Object.assign({}, offbEmpData, {
              offboardingType: payload.offboardingType,
              reason:          payload.reason,
              isPermanent:     false,
              skNumber:        res.skNumber || '',
              notes:           payload.notes,
              approvedBy:      payload.approvedBy,
            });

            // TIDAK GENERATE SK OFFBOARDING untuk Contract Finished
            // Hanya generate: Paklaring + Surat BPJS (opsional)

            // 1. Paklaring
            exportPaklaringPDF(offbEmpData, { catatan: payload.notes }, {
              evalId: (res.skNumber || '').replace(/[^a-zA-Z0-9]/g, '') || emp.employeeId,
            }, function(ok) {
              if (!ok) showToast('Gagal membuat PDF Paklaring.', 'error');
            });

            // 2. Surat BPJS — hanya jika checkbox dicentang
            var generateBpjs = (document.getElementById('ceGenerateBpjs') || {}).checked !== false;
            if (generateBpjs) {
              setTimeout(function() {
                if (typeof exportSuratBPJS === 'function') exportSuratBPJS(offbEmpData);
              }, 500);
            }

          } else {
            showToast('Gagal: ' + (res ? res.message : 'Error tidak diketahui'), 'error');
          }
        })
        .withFailureHandler(function(err) {
          confirmBtn.disabled = false;
          if (tEl) tEl.style.display = 'inline-flex';
          if (lEl) lEl.style.display = 'none';
          showToast('Error: ' + (err.message || err), 'error');
        })
        .processOffboarding(payload);
    });
  }

  // AJUKAN ONBOARDING PROBATION MODAL

  var _promoteProbTargetEmp = null;

  function openPromoteToProbationModal(emp) {
    if (!emp) return;
    _promoteProbTargetEmp = emp;

    var empIdEl = document.getElementById('promoteProbEmpId');
    var nameEl  = document.getElementById('promoteProbEmpName');
    var posEl   = document.getElementById('promoteProbPosition');
    var avEl    = document.getElementById('promoteProbAvatar');
    var badgeEl = document.getElementById('promoteProbBadge');
    var startEl = document.getElementById('promoteProbStart');
    var durEl   = document.getElementById('promoteProbDuration');
    var endEl   = document.getElementById('promoteProbEnd');
    var notesEl = document.getElementById('promoteProbNotes');

    if (empIdEl) empIdEl.value = emp.employeeId || '';
    if (nameEl)  nameEl.innerText = emp.fullName || '-';
    if (posEl)   posEl.innerText = (emp.positionCurrent || emp.position || '-') + (emp.department ? ' · ' + emp.department : '');
    if (avEl)    avEl.innerText = (typeof initials === 'function' ? initials(emp.fullName || 'K') : 'K');
    if (badgeEl) badgeEl.innerText = emp.statusEmployee || 'Contract';
    if (startEl) startEl.value = new Date().toISOString().substring(0, 10);
    if (durEl)   durEl.value = '3 Bulan';
    if (notesEl) notesEl.value = '';

    _calcPromoteProbEndDate();

    var modalEl = document.getElementById('promoteToProbationModal');
    if (modalEl) {
      var modal = bootstrap.Modal.getOrCreateInstance(modalEl);
      modal.show();
    }
  }

  function _calcPromoteProbEndDate() {
    var startEl = document.getElementById('promoteProbStart');
    var durEl   = document.getElementById('promoteProbDuration');
    var endEl   = document.getElementById('promoteProbEnd');
    if (!startEl || !durEl || !endEl || !startEl.value || !durEl.value) return;

    var months = 3;
    var durMatch = durEl.value.match(/^(\d+)\s*Bulan/i);
    if (durMatch) months = parseInt(durMatch[1], 10);

    var startDate = new Date(startEl.value);
    startDate.setMonth(startDate.getMonth() + months);
    startDate.setDate(startDate.getDate() - 1);
    var yyyy = startDate.getFullYear();
    var mm   = String(startDate.getMonth() + 1).padStart(2, '0');
    var dd   = String(startDate.getDate()).padStart(2, '0');
    endEl.value = yyyy + '-' + mm + '-' + dd;
  }

  function initPromoteToProbationModal() {
    var startEl = document.getElementById('promoteProbStart');
    var durEl   = document.getElementById('promoteProbDuration');
    if (startEl) startEl.addEventListener('change', _calcPromoteProbEndDate);
    if (durEl)   durEl.addEventListener('change', _calcPromoteProbEndDate);

    var btnSubmit = document.getElementById('btnConfirmPromoteProbation');
    if (btnSubmit) {
      btnSubmit.addEventListener('click', function() {
        var empId = (document.getElementById('promoteProbEmpId') || {}).value;
        if (!empId) return;

        var probStart = (document.getElementById('promoteProbStart') || {}).value;
        var probDur   = (document.getElementById('promoteProbDuration') || {}).value;
        var probEnd   = (document.getElementById('promoteProbEnd') || {}).value;
        var notes     = (document.getElementById('promoteProbNotes') || {}).value;

        if (!probStart || !probDur) {
          showToast('Tanggal mulai dan durasi probation wajib diisi.', 'warning');
          return;
        }

        var payload = {
          probationStart: probStart,
          probationDuration: probDur,
          probationEnd: probEnd,
          notes: notes,
        };

        var user = (typeof currentUser !== 'undefined' && currentUser && currentUser.email)
          ? currentUser.email : 'HR Dashboard';

        var textEl = document.getElementById('btnPromoteProbText');
        var loadEl = document.getElementById('btnPromoteProbLoading');
        btnSubmit.disabled = true;
        if (textEl) textEl.style.display = 'none';
        if (loadEl) loadEl.style.display = 'inline-flex';

        google.script.run
          .withSuccessHandler(function(res) {
            btnSubmit.disabled = false;
            if (textEl) textEl.style.display = 'inline-flex';
            if (loadEl) loadEl.style.display = 'none';

            var modalEl = document.getElementById('promoteToProbationModal');
            if (modalEl) {
              var modal = bootstrap.Modal.getInstance(modalEl);
              if (modal) modal.hide();
            }

            if (res && res.success) {
              showToast(res.message || 'Karyawan berhasil didaftarkan ke Onboarding Probation!', 'success', 5000);
              if (typeof closeDrawer === 'function') closeDrawer();
              empLoadAll();
              if (typeof _loadProbationData === 'function') _loadProbationData(true);
            } else {
              showToast('Gagal mengajukan probation: ' + (res ? res.message : 'Error'), 'error');
            }
          })
          .withFailureHandler(function(err) {
            btnSubmit.disabled = false;
            if (textEl) textEl.style.display = 'inline-flex';
            if (loadEl) loadEl.style.display = 'none';
            showToast('Error: ' + (err ? err.message : 'Unknown'), 'error');
          })
          .promoteEmployeeToProbation(empId, payload, user);
      });
    }
  }
