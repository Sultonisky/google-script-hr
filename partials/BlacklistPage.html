<!-- partials/BlacklistPage.html — Halaman Kandidat Blacklist (independen) -->
<section class="page-section" id="pageBlacklist">

  <!-- Stat cards -->
  <div class="row g-3 mb-4">
    <div class="col-6 col-md-3">
      <div class="stat-card">
        <div class="stat-icon bg-red"><i class="bi bi-slash-circle-fill"></i></div>
        <div><div class="stat-label">Total Blacklist</div><div class="stat-value" id="blStatTotal">0</div></div>
      </div>
    </div>
    <div class="col-6 col-md-3">
      <div class="stat-card">
        <div class="stat-icon bg-gold"><i class="bi bi-calendar-x"></i></div>
        <div><div class="stat-label">Bulan Ini</div><div class="stat-value" id="blStatMonth">0</div></div>
      </div>
    </div>
    <div class="col-6 col-md-3">
      <div class="stat-card">
        <div class="stat-icon bg-blue"><i class="bi bi-briefcase-fill"></i></div>
        <div><div class="stat-label">Posisi Unik</div><div class="stat-value" id="blStatPositions">0</div></div>
      </div>
    </div>
    <div class="col-6 col-md-3">
      <div class="stat-card">
        <div class="stat-icon" style="background:#fef2f2"><i class="bi bi-person-x-fill" style="color:#991b1b"></i></div>
        <div><div class="stat-label">Kota Unik</div><div class="stat-value" id="blStatCities">0</div></div>
      </div>
    </div>
  </div>

  <!-- Table panel -->
  <div class="panel" id="blTablePanel">
    <div class="panel-header">
      <div>
        <h6>Kandidat Blacklist</h6>
        <div class="panel-subtitle" id="blPanelSubtitle">Memuat data...</div>
      </div>
      <div class="export-btns">
        <button class="btn-refresh" id="btnBlRefresh" type="button" title="Muat ulang">
          <i class="bi bi-arrow-clockwise"></i>
        </button>
      </div>
    </div>

    <!-- Filter bar -->
    <div class="filter-bar">
      <div class="table-search">
        <i class="bi bi-search"></i>
        <input type="text" id="blSearchInput" placeholder="Cari ID, nama, posisi, alasan..." />
      </div>
      <select class="filter-select" id="blPositionFilter">
        <option value="">Semua Posisi</option>
      </select>
      <select class="filter-select" id="blSortSelect">
        <option value="newest">Terbaru</option>
        <option value="oldest">Terlama</option>
        <option value="name_asc">Nama A-Z</option>
        <option value="name_desc">Nama Z-A</option>
      </select>
      <button class="btn-reset-filter" type="button" id="btnBlReset">
        <i class="bi bi-arrow-counterclockwise"></i> Reset
      </button>
    </div>

    <!-- Table -->
    <div class="table-responsive">
      <table class="table hr-table">
        <thead>
          <tr>
            <th>Avatar</th>
            <th>Recruitment ID</th>
            <th>Kandidat</th>
            <th>Usia</th>
            <th>Posisi</th>
            <th>Alasan Blacklist</th>
            <th>Tgl Blacklist</th>
            <th>Diproses Oleh</th>
            <th>Aksi</th>
          </tr>
        </thead>
        <tbody id="blTableBody"></tbody>
      </table>
      <div class="table-loading" id="blTableLoading">
        <div class="spinner-border" role="status"></div>
        <p>Mengambil data...</p>
      </div>
      <div class="table-empty d-none" id="blTableEmpty">
        <i class="bi bi-inbox"></i>
        <p>Belum ada kandidat dengan status Blacklist.</p>
      </div>
    </div>

    <div class="panel-footer">
      <span id="blFooterCount">Menampilkan 0 data</span>
      <nav class="pagination-ui" id="blPaginationUi" aria-label="Blacklist Pagination"></nav>
    </div>
  </div>
</section>
