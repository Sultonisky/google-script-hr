<script>
  // ============================================================
  // js/settings.html — APP SETTINGS (localStorage + Server Portal Settings)
  // Depends on: helpers.html
  // ============================================================

  // ---- Default local settings (theme, pageSize, etc.) ----
  var DEFAULT_SETTINGS = {
    theme: 'light',
    pageSize: 10,
    defaultStatus: '',
    defaultSource: '',
    autoRefresh: true,
    refreshInterval: 60
  };

  // ---- Portal settings from server ----
  var portalSettingsCache = null;

  function loadSettings() {
    try {
      var raw = localStorage.getItem('ats_settings');
      if (!raw) return Object.assign({}, DEFAULT_SETTINGS);
      return Object.assign({}, DEFAULT_SETTINGS, JSON.parse(raw));
    } catch (e) {
      return Object.assign({}, DEFAULT_SETTINGS);
    }
  }

  function saveSettingsToStorage(s) {
    localStorage.setItem('ats_settings', JSON.stringify(s));
  }

  var appSettings = loadSettings();
  var pageSize    = Number(appSettings.pageSize) || 10;

  function applyTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme === 'dark' ? 'dark' : 'light');
    var icon = document.querySelector('#btnDarkModeToggle i');
    if (icon) icon.className = theme === 'dark' ? 'bi bi-sun-fill' : 'bi bi-moon-fill';
    var btn = document.getElementById('btnDarkModeToggle');
    if (btn) btn.classList.toggle('active', theme === 'dark');
  }

  // Apply theme early (before DOM ready) to prevent flash
  document.documentElement.setAttribute('data-theme', appSettings.theme === 'dark' ? 'dark' : 'light');

  // ---- Load portal settings from server ----
  function loadPortalSettings(callback) {
    google.script.run
      .withSuccessHandler(function(result) {
        if (result && result.success) {
          portalSettingsCache = result.settings;
          applyPortalSettings(result.settings);
        }
        if (callback) callback(result);
      })
      .withFailureHandler(function(err) {
        console.warn('Failed to load portal settings:', err);
        if (callback) callback(null);
      })
      .getPortalSettings();
  }

  // ---- Apply portal settings to DOM ----
  function applyPortalSettings(s) {
    if (!s) return;
    // Sidebar brand
    var brandStrong = document.querySelector('.sidebar-brand .brand-text strong');
    var brandSmall  = document.querySelector('.sidebar-brand .brand-text small');
    if (brandStrong) brandStrong.textContent = s.portalTitle || 'MITO HRIS';
    if (brandSmall)  brandSmall.textContent  = s.portalSubtitle || 'Applicant Tracking System';
    // Sidebar logo
    var logoBox = document.querySelector('.sidebar-brand .logo-box');
    if (logoBox && s.companyLogo) {
      logoBox.innerHTML = '<img src="' + s.companyLogo + '" alt="Logo" style="width:100%;height:100%;object-fit:contain;border-radius:6px;">';
    }
    // Theme color
    if (s.themeColor) {
      document.documentElement.style.setProperty('--color-primary', s.themeColor);
    }
    // Title
    if (s.portalTitle) document.title = s.portalTitle + ' — Dashboard';
    // Footer
    var footerCopy = document.querySelector('.footer-copy');
    if (footerCopy && s.footer) footerCopy.textContent = s.footer;
  }

  // ---- Hydrate portal settings form ----
  function hydratePortalSettingsForm(s) {
    if (!s) return;
    var mapping = {
      settingCompanyName:     'companyName',
      settingPortalTitle:     'portalTitle',
      settingPortalSubtitle:  'portalSubtitle',
      settingThemeColor:      'themeColor',
      settingCompanyLogo:     'companyLogo',
      settingCompanyAddress:  'companyAddress',
      settingCompanyPhone:    'companyPhone',
      settingCompanyEmail:    'companyEmail',
      settingWebsite:         'website',
      settingFooter:          'footer',
      settingDefaultStatus:   'defaultStatus',
      settingDefaultSource:   'defaultSource'
    };
    Object.keys(mapping).forEach(function(elId) {
      var el = document.getElementById(elId);
      if (el) el.value = s[mapping[elId]] || '';
    });
  }

  // ---- Hydrate local settings form ----
  function hydrateSettingsForm() {
    var t  = document.getElementById('settingTheme');
    var ps = document.getElementById('settingPageSize');
    var ds = document.getElementById('settingDefaultStatus');
    var ar = document.getElementById('settingAutoRefresh');
    var ri = document.getElementById('settingRefreshInterval');
    if (t)  t.value   = appSettings.theme;
    if (ps) ps.value  = String(appSettings.pageSize);
    if (ds) ds.value  = appSettings.defaultStatus;
    if (ar) ar.checked = !!appSettings.autoRefresh;
    if (ri) ri.value  = appSettings.refreshInterval;
  }

  // ---- Save portal settings to server ----
  function savePortalSettingsToServer() {
    var data = {
      companyName:    document.getElementById('settingCompanyName').value.trim(),
      portalTitle:    document.getElementById('settingPortalTitle').value.trim(),
      portalSubtitle: document.getElementById('settingPortalSubtitle').value.trim(),
      themeColor:     document.getElementById('settingThemeColor').value,
      companyLogo:    document.getElementById('settingCompanyLogo').value.trim(),
      companyAddress: document.getElementById('settingCompanyAddress').value.trim(),
      companyPhone:   document.getElementById('settingCompanyPhone').value.trim(),
      companyEmail:   document.getElementById('settingCompanyEmail').value.trim(),
      website:        document.getElementById('settingWebsite').value.trim(),
      footer:         document.getElementById('settingFooter').value.trim(),
      defaultStatus:  document.getElementById('settingDefaultStatus').value,
      defaultSource:  document.getElementById('settingDefaultSource').value
    };

    return new Promise(function(resolve) {
      google.script.run
        .withSuccessHandler(function(result) {
          if (result && result.success) {
            portalSettingsCache = data;
            applyPortalSettings(data);
            showToast('Pengaturan portal berhasil disimpan.', 'success');
          } else {
            showToast(result ? result.message : 'Gagal menyimpan pengaturan portal.', 'danger');
          }
          resolve(result);
        })
        .withFailureHandler(function(err) {
          showToast('Gagal menyimpan: ' + err.message, 'danger');
          resolve(null);
        })
        .savePortalSettings(data);
    });
  }

  // ---- Reset portal settings ----
  function resetPortalSettingsOnServer() {
    return new Promise(function(resolve) {
      google.script.run
        .withSuccessHandler(function(result) {
          if (result && result.success) {
            showToast('Pengaturan portal direset ke default.', 'success');
            loadPortalSettings();
          } else {
            showToast(result ? result.message : 'Gagal mereset.', 'danger');
          }
          resolve(result);
        })
        .withFailureHandler(function(err) {
          showToast('Gagal mereset: ' + err.message, 'danger');
          resolve(null);
        })
        .resetPortalSettings();
    });
  }

  // ---- Initialize settings panel ----
  function initSettingsPanel() {
    // Load portal settings from server
    loadPortalSettings(function(result) {
      if (result && result.success) {
        hydratePortalSettingsForm(result.settings);
      }
      hydrateSettingsForm();
    });

    // Save button
    var btn = document.getElementById('btnSaveSettings');
    if (btn) {
      btn.addEventListener('click', function() {
        // Save local settings
        appSettings.theme           = document.getElementById('settingTheme').value;
        appSettings.pageSize        = Number(document.getElementById('settingPageSize').value) || 10;
        appSettings.defaultStatus   = document.getElementById('settingDefaultStatus').value;
        appSettings.defaultSource   = document.getElementById('settingDefaultSource').value;
        appSettings.autoRefresh     = document.getElementById('settingAutoRefresh').checked;
        appSettings.refreshInterval = Math.max(15, Number(document.getElementById('settingRefreshInterval').value) || 60);

        saveSettingsToStorage(appSettings);
        applyTheme(appSettings.theme);
        pageSize = appSettings.pageSize;

        var sf = document.getElementById('statusFilter');
        if (sf) sf.value = appSettings.defaultStatus;

        setupAutoRefresh();
        applyFilters();

        // Save portal settings to server
        savePortalSettingsToServer();
      });
    }

    // Reset button
    var resetBtn = document.getElementById('btnResetSettings');
    if (resetBtn) {
      resetBtn.addEventListener('click', function() {
        if (confirm('Yakin ingin mereset semua pengaturan ke default?')) {
          // Reset local
          appSettings = Object.assign({}, DEFAULT_SETTINGS);
          saveSettingsToStorage(appSettings);
          applyTheme(appSettings.theme);
          pageSize = appSettings.pageSize;
          // Reset server
          resetPortalSettingsOnServer().then(function() {
            loadPortalSettings(function() {
              hydrateSettingsForm();
            });
          });
        }
      });
    }
  }
</script>
