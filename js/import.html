  function openEmpImportModal() {
    initEmpImportModal();
    var modalEl = document.getElementById('empImportModal');
    if (!modalEl) return;
    empImportFile = null;
    empImportRows = [];
    resetEmpImportSteps();
    var m = bootstrap.Modal.getOrCreateInstance(modalEl);
    m.show();
  }

  function resetEmpImportSteps() {
    var step1 = document.getElementById('empImportStep1');
    var step2 = document.getElementById('empImportStep2');
    var step3 = document.getElementById('empImportStep3');
    var fileInfo = document.getElementById('empImportFileInfo');
    var dropZone = document.getElementById('empImportDropZone');
    var startBtn = document.getElementById('btnEmpImportStart');
    var startBtnText = document.getElementById('btnEmpImportStartText');
    var startLoading = document.getElementById('btnEmpImportLoading');
    var backBtn = document.getElementById('btnEmpImportBack');

    if (step1) step1.style.display = '';
    if (step2) step2.style.display = 'none';
    if (step3) step3.style.display = 'none';
    if (fileInfo) fileInfo.style.display = 'none';
    if (dropZone) dropZone.style.display = '';

    if (startBtn) {
      startBtn.style.display = '';
      startBtn.classList.add('disabled');
      startBtn.disabled = true;
    }
    if (startBtnText) {
      startBtnText.style.display = '';
      startBtnText.innerHTML = '<i class="bi bi-upload me-1"></i>Mulai Import';
    }
    if (startLoading) startLoading.style.display = 'none';
    if (backBtn) backBtn.style.display = 'none';

    var errList = document.getElementById('empImportErrorList');
    var errBox = document.getElementById('empImportResultErrors');
    var tbody = document.getElementById('empImportPreviewBody');
    var badge = document.getElementById('empImportSummaryBadge');

    if (errList) errList.innerHTML = '';
    if (errBox) errBox.style.display = 'none';
    if (tbody) tbody.innerHTML = '';
    if (badge) badge.textContent = '-';
  }

  function initEmpImportModal() {
    if (empImportModalInited) return;
    var dropZone = document.getElementById('empImportDropZone');
    var fileInput = document.getElementById('empImportFileInput');
    var clearBtn = document.getElementById('btnEmpImportClearFile');
    var startBtn = document.getElementById('btnEmpImportStart');
    var backBtn = document.getElementById('btnEmpImportBack');
    var tplBtn = document.getElementById('btnEmpDownloadTemplate');
    var tplXlsBtn = document.getElementById('btnEmpDownloadExcelTemplate');

    if (!dropZone || !fileInput) return;
    empImportModalInited = true;

    if (dropZone && fileInput) {
      dropZone.addEventListener('click', function() { fileInput.click(); });
      dropZone.addEventListener('dragover', function(e) {
        e.preventDefault();
        dropZone.style.background = '#e8f0fe';
      });
      dropZone.addEventListener('dragleave', function() {
        dropZone.style.background = '';
      });
      dropZone.addEventListener('drop', function(e) {
        e.preventDefault();
        dropZone.style.background = '';
        if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
          handleEmpImportFile(e.dataTransfer.files[0]);
        }
      });
      fileInput.addEventListener('change', function() {
        if (fileInput.files && fileInput.files.length > 0) {
          handleEmpImportFile(fileInput.files[0]);
        }
      });
    }

    if (clearBtn) {
      clearBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        empImportFile = null;
        empImportRows = [];
        resetEmpImportSteps();
        if (fileInput) fileInput.value = '';
      });
    }

    if (startBtn) {
      startBtn.addEventListener('click', function() {
        if (empImportRows.length === 0) return;
        runEmpImport();
      });
    }

    if (backBtn) {
      backBtn.addEventListener('click', function() {
        resetEmpImportSteps();
        if (fileInput) fileInput.value = '';
      });
    }

    if (tplBtn) tplBtn.addEventListener('click', downloadEmpCsvTemplate);
    if (tplXlsBtn) tplXlsBtn.addEventListener('click', downloadEmpExcelTemplate);
  }

  function handleEmpImportFile(file) {
    if (!file) return;
    var fname = file.name.toLowerCase();
    if (!fname.endsWith('.csv') && !fname.endsWith('.xlsx') && !fname.endsWith('.xls')) {
      showToast('Hanya file CSV atau Excel (.csv/.xlsx/.xls) yang didukung.', 'error');
      return;
    }
    if (file.size > 10 * 1024 * 1024) {
      showToast('Ukuran file maksimal 10MB.', 'error');
      return;
    }
    empImportFile = file;

    var nameEl = document.getElementById('empImportFileName');
    var sizeEl = document.getElementById('empImportFileSize');
    var infoEl = document.getElementById('empImportFileInfo');
    var dropEl = document.getElementById('empImportDropZone');

    if (nameEl) nameEl.textContent = file.name;
    if (sizeEl) sizeEl.textContent = (file.size / 1024).toFixed(1) + ' KB';
    if (infoEl) infoEl.style.display = '';
    if (dropEl) dropEl.style.display = 'none';

    function done(rows) {
      empImportRows = rows;
      if (!empImportRows || empImportRows.length === 0) {
        showToast('File kosong atau format kolom tidak dikenali.', 'error');
        resetEmpImportSteps();
        return;
      }
      if (empImportRows.length > 500) {
        showToast('Maksimal 500 baris per import. File memiliki ' + empImportRows.length + ' baris.', 'error');
        empImportRows = [];
        resetEmpImportSteps();
        return;
      }
      showEmpImportPreview(empImportRows);
    }

    if (fname.endsWith('.csv')) {
      var reader = new FileReader();
      reader.onload = function(e) {
        try {
          done(parseEmpCSV(e.target.result));
        } catch (err) {
          showToast('Gagal memproses CSV: ' + err.message, 'error');
          resetEmpImportSteps();
        }
      };
      reader.onerror = function() {
        showToast('Gagal membaca file CSV.', 'error');
        resetEmpImportSteps();
      };
      reader.readAsText(file, 'UTF-8');
    } else {
      parseEmpExcel(file, done);
    }
  }

  function empImportNormalizeHeader(h) {
    return String(h || '')
      .trim()
      .replace(/^["']|["']$/g, '')
      .toLowerCase()
      .replace(/[\s_\-\/\.\(\)]/g, '');
  }

  function empRowsFromMatrix(matrix) {
    if (!matrix || matrix.length < 2) return [];
    var headers = (matrix[0] || []).map(empImportNormalizeHeader);
    var rows = [];
    for (var i = 1; i < matrix.length; i++) {
      var vals = matrix[i] || [];
      var any = vals.some(function (v) {
        return v !== '' && v !== null && v !== undefined;
      });
      if (!any) continue;
      var row = {};
      for (var j = 0; j < headers.length; j++) {
        var hNorm = headers[j];
        var key = empImportFieldMap[hNorm] || hNorm;
        if (!key) continue;
        var val = vals[j];
        row[key] = String(val == null ? '' : val).trim().replace(/^["']|["']$/g, '');
      }
      rows.push(row);
    }
    return rows;
  }

  function detectCsvDelimiter(lines) {
    var first = lines[0] || '';
    var commas = (first.match(/,/g) || []).length;
    var semis  = (first.match(/;/g) || []).length;
    var tabs   = (first.match(/\t/g) || []).length;
    if (semis > commas && semis > tabs) return ';';
    if (tabs > commas && tabs > semis) return '\t';
    return ',';
  }

  function splitCsvLine(line, delimiter) {
    delimiter = delimiter || ',';
    var result = [];
    var current = '';
    var inQuotes = false;
    for (var i = 0; i < line.length; i++) {
      var ch = line[i];
      if (ch === '"') {
        if (inQuotes && line[i + 1] === '"') {
          current += '"';
          i++;
        } else {
          inQuotes = !inQuotes;
        }
      } else if (ch === delimiter && !inQuotes) {
        result.push(current);
        current = '';
      } else {
        current += ch;
      }
    }
    result.push(current);
    return result;
  }

  function parseEmpCSV(text) {
    text = (text || '').replace(/^\uFEFF/, '');
    var lines = text.split(/\r?\n/).filter(function (l) {
      return l.trim() !== '';
    });
    if (lines.length < 2) return [];
    var delim = detectCsvDelimiter(lines);
    var matrix = lines.map(function(l) { return splitCsvLine(l, delim); });
    return empRowsFromMatrix(matrix);
  }

  function parseEmpExcel(file, callback) {
    if (typeof XLSX === 'undefined') {
      var s = document.createElement('script');
      s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
      document.head.appendChild(s);
      s.onload = function () { parseEmpExcel(file, callback); };
      s.onerror = function () {
        showToast('Gagal memuat library Excel. Periksa koneksi internet.', 'error');
        if (callback) callback([]);
      };
      return;
    }
    var fr = new FileReader();
    fr.onload = function (e) {
      try {
        var wb = XLSX.read(new Uint8Array(e.target.result), { type: 'array', raw: false });
        // Prefer sheet named "Edited", fallback to first sheet
        var sheetName = wb.SheetNames[0];
        var preferredNames = ['edited', 'data', 'karyawan', 'employee', 'import'];
        for (var si = 0; si < wb.SheetNames.length; si++) {
          var sn = wb.SheetNames[si].toLowerCase().trim();
          for (var pi = 0; pi < preferredNames.length; pi++) {
            if (sn === preferredNames[pi] || sn.indexOf(preferredNames[pi]) !== -1) {
              sheetName = wb.SheetNames[si];
              break;
            }
          }
          if (sheetName !== wb.SheetNames[0]) break;
        }
        var ws = wb.Sheets[sheetName];
        if (!ws) { if (callback) callback([]); return; }
        var matrix = XLSX.utils.sheet_to_json(ws, { header: 1, raw: false, defval: '' });
        // Strip leading apostrophe Excel prefix from all cells
        matrix = matrix.map(function(row) {
          return row.map(function(cell) {
            var s = String(cell == null ? '' : cell);
            return s.replace(/^'+/, '');
          });
        });
        if (callback) callback(empRowsFromMatrix(matrix));
      } catch (err) {
        showToast('Gagal membaca file Excel: ' + err.message, 'error');
        if (callback) callback([]);
      }
    };
    fr.onerror = function () {
      showToast('Gagal membaca file Excel.', 'error');
      if (callback) callback([]);
    };
    fr.readAsArrayBuffer(file);
  }

  function downloadEmpCsvTemplate() {
    var headers = empImportTemplateHeaders();
    var examples = empImportTemplateExamples();
    var lines = [headers.join(',')];
    examples.forEach(function(ex) {
      var rowStr = ex.map(function(v) {
        var str = String(v == null ? '' : v);
        return str.indexOf(',') !== -1 || str.indexOf('"') !== -1 || str.indexOf('\n') !== -1
          ? '"' + str.replace(/"/g, '""') + '"'
          : str;
      }).join(',');
      lines.push(rowStr);
    });

    var bom = '\uFEFF';
    var blob = new Blob([bom + lines.join('\n')], { type: 'text/csv;charset=utf-8;' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'template_import_karyawan.csv';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function downloadEmpExcelTemplate() {
    if (typeof XLSX === 'undefined') {
      var s = document.createElement('script');
      s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
      document.head.appendChild(s);
      s.onload = function () { downloadEmpExcelTemplate(); };
      s.onerror = function () {
        showToast('Gagal memuat library Excel. Periksa koneksi internet.', 'error');
      };
      return;
    }
    var headers = empImportTemplateHeaders();
    var examples = empImportTemplateExamples();
    var data = [headers].concat(examples);
    var ws = XLSX.utils.aoa_to_sheet(data);
    ws['!cols'] = headers.map(function () { return { wch: 26 }; });
    var wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Template Karyawan');
    XLSX.writeFile(wb, 'template_import_karyawan.xlsx');
  }

  function showEmpImportPreview(rows) {
    var step1 = document.getElementById('empImportStep1');
    var step2 = document.getElementById('empImportStep2');
    var step3 = document.getElementById('empImportStep3');
    if (step1) step1.style.display = 'none';
    if (step2) step2.style.display = '';
    if (step3) step3.style.display = 'none';

    var validCount = 0, warnCount = 0;
    rows.forEach(function(r) {
      var nameOk = r.fullName && r.fullName.trim() !== '';
      if (nameOk) validCount++;
      else warnCount++;
    });

    var badge = document.getElementById('empImportSummaryBadge');
    if (badge) {
      badge.textContent = validCount + ' valid' + (warnCount > 0 ? ', ' + warnCount + ' peringatan/error' : '');
      badge.className = 'badge ' + (warnCount > 0 ? 'bg-warning text-dark' : 'bg-success text-white');
      badge.style.fontSize = '12px';
    }

    var tbody = document.getElementById('empImportPreviewBody');
    if (tbody) {
      tbody.innerHTML = rows.map(function(r, i) {
        var nameOk = r.fullName && r.fullName.trim() !== '';
        var nikRaw = (r.nik || '').replace(/['\s]/g, '');
        var nikOk = !nikRaw || /^[0-9]{16}$/.test(nikRaw);
        var warnings = [];
        if (!nameOk) warnings.push('Nama wajib diisi');
        if (!nikOk) warnings.push('NIK format salah');
        var statusClass = warnings.length === 0 ? 'text-success' : 'text-danger';
        var statusIcon = warnings.length === 0 ? 'bi-check-circle-fill' : 'bi-exclamation-triangle-fill';
        var statusText = warnings.length === 0 ? 'OK' : warnings.join(', ');

        var dept = r.department || r.dept || r.departemen || '-';
        var pos = r.positionCurrent || r.position || r.jabatan || '-';
        var branch = r.branchName || r.branch || r.cabang || '-';
        var empStatus = r.statusEmployee || r.status || 'Contract';

        return '<tr>' +
          '<td>' + (i + 1) + '</td>' +
          '<td class="fw-semibold text-dark">' + escapeHtml(r.fullName || '-') + '</td>' +
          '<td style="font-size:11px">' + escapeHtml(r.nik || '-') + '</td>' +
          '<td style="font-size:11px"><span class="badge bg-light text-dark border">' + escapeHtml(dept) + '</span></td>' +
          '<td style="font-size:11px">' + escapeHtml(pos) + '</td>' +
          '<td style="font-size:11px">' + escapeHtml(branch) + '</td>' +
          '<td style="font-size:11px"><span class="badge bg-secondary-subtle text-secondary">' + escapeHtml(empStatus) + '</span></td>' +
          '<td><i class="bi ' + statusIcon + ' ' + statusClass + ' me-1"></i><span class="' + statusClass + '" style="font-size:11px">' + statusText + '</span></td>' +
          '</tr>';
      }).join('');
    }

    var startBtn = document.getElementById('btnEmpImportStart');
    var startBtnText = document.getElementById('btnEmpImportStartText');
    var backBtn = document.getElementById('btnEmpImportBack');

    if (startBtn) {
      startBtn.style.display = 'inline-flex';
      startBtn.disabled = validCount === 0;
      if (validCount === 0) {
        startBtn.classList.add('disabled');
      } else {
        startBtn.classList.remove('disabled');
      }
    }
    if (startBtnText) {
      startBtnText.style.display = '';
      startBtnText.innerHTML = '<i class="bi bi-cloud-arrow-up-fill me-1"></i>Submit &amp; Import (' + rows.length + ' Karyawan)';
    }
    if (backBtn) {
      backBtn.style.display = 'inline-flex';
    }
  }

  // ============================================================
  // SUBMIT IMPORT TO GOOGLE APPS SCRIPT
  // ============================================================
  function runEmpImport() {
    if (!empImportRows || empImportRows.length === 0) return;

    var startBtn = document.getElementById('btnEmpImportStart');
    var startBtnText = document.getElementById('btnEmpImportStartText');
    var startLoading = document.getElementById('btnEmpImportLoading');
    var backBtn = document.getElementById('btnEmpImportBack');

    if (startBtnText) startBtnText.style.display = 'none';
    if (startLoading) startLoading.style.display = '';
    if (startBtn) {
      startBtn.classList.add('disabled');
      startBtn.disabled = true;
    }
    if (backBtn) backBtn.style.display = 'none';

    google.script.run
      .withSuccessHandler(function(result) {
        var step2 = document.getElementById('empImportStep2');
        var step3 = document.getElementById('empImportStep3');
        if (step2) step2.style.display = 'none';
        if (step3) step3.style.display = '';

        var icon = document.getElementById('empImportResultIcon');
        var title = document.getElementById('empImportResultTitle');
        var msg = document.getElementById('empImportResultMessage');
        var errDiv = document.getElementById('empImportResultErrors');
        var errList = document.getElementById('empImportErrorList');

        if (result && result.success) {
          if (icon) {
            icon.className = 'bi bi-check-circle-fill fs-1';
            icon.style.color = 'var(--color-success)';
          }
          if (title) {
            title.textContent = 'Import Berhasil!';
            title.className = 'mt-3 mb-1 text-success';
          }
        } else {
          if (icon) {
            icon.className = 'bi bi-exclamation-triangle-fill fs-1';
            icon.style.color = '#e67700';
          }
          if (title) {
            title.textContent = 'Import Selesai dengan Catatan';
            title.className = 'mt-3 mb-1';
          }
        }

        if (msg) {
          msg.textContent = result ? (result.message || (result.imported + ' karyawan berhasil diimport.')) : 'Import selesai.';
        }

        if (result && result.errors && result.errors.length > 0) {
          if (errDiv) errDiv.style.display = '';
          if (errList) {
            errList.innerHTML = result.errors.map(function(e) {
              return '<li>' + escapeHtml(e) + '</li>';
            }).join('');
          }
        }

        if (startBtnText) startBtnText.style.display = '';
        if (startLoading) startLoading.style.display = 'none';
        if (startBtn) startBtn.style.display = 'none';
        if (backBtn) backBtn.style.display = 'none';

        if (typeof empLoadAll === 'function') empLoadAll();

        showToast(result && result.message ? result.message : 'Import selesai.', (result && result.success) ? 'success' : 'error');
      })
      .withFailureHandler(function(err) {
        var step2 = document.getElementById('empImportStep2');
        var step3 = document.getElementById('empImportStep3');
        if (step2) step2.style.display = 'none';
        if (step3) step3.style.display = '';

        var icon = document.getElementById('empImportResultIcon');
        var title = document.getElementById('empImportResultTitle');
        var msg = document.getElementById('empImportResultMessage');

        if (icon) {
          icon.className = 'bi bi-exclamation-circle-fill fs-1';
          icon.style.color = '#991b1b';
        }
        if (title) {
          title.textContent = 'Import Gagal';
          title.className = 'mt-3 mb-1 text-danger';
        }
        if (msg) {
          msg.textContent = err.message || 'Terjadi kesalahan saat import.';
        }

        if (startBtnText) startBtnText.style.display = '';
        if (startLoading) startLoading.style.display = 'none';
        if (startBtn) startBtn.style.display = 'none';
        if (backBtn) backBtn.style.display = 'inline-flex';

        showToast('Import gagal: ' + (err.message || err), 'error');
      })
      .importEmployees(empImportRows);
  }

  document.addEventListener('DOMContentLoaded', initEmpImportModal);
</script>
