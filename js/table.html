<script>
  // ============================================================
  // js/table.html — TABLE RENDER, PAGINATION & BULK ACTIONS
  // Depends on: helpers.html, settings.html, filters.html
  // ============================================================

  // ---- BULK ACTIONS STATE ----
  var selectedCandidateIds = [];

  function getSelectedCandidateIds() {
    return selectedCandidateIds;
  }

  function clearBulkSelection() {
    selectedCandidateIds = [];
    var selAll = document.getElementById('selectAll');
    if (selAll) selAll.checked = false;
    updateBulkBar();
  }

  function updateBulkBar() {
    var bar     = document.getElementById('bulkActionBar');
    var counter = document.getElementById('bulkSelectedCount');
    if (bar) {
      if (selectedCandidateIds.length > 0) {
        bar.classList.remove('d-none');
      } else {
        bar.classList.add('d-none');
      }
    }
    if (counter) counter.textContent = selectedCandidateIds.length;

    // Sync row checkboxes
    document.querySelectorAll('.row-select-cb').forEach(function(cb) {
      cb.checked = selectedCandidateIds.indexOf(cb.getAttribute('data-id')) !== -1;
    });
  }

  function initBulkActions() {
    // Select All checkbox
    var selAll = document.getElementById('selectAll');
    if (selAll) {
      selAll.addEventListener('change', function() {
        var ps    = Number(appSettings.pageSize) || 10;
        var start = (currentPage - 1) * ps;
        var pageData = filteredCandidates.slice(start, start + ps);
        pageData.forEach(function(row) {
          var idx = selectedCandidateIds.indexOf(row.recruitmentId);
          if (selAll.checked && idx === -1) {
            selectedCandidateIds.push(row.recruitmentId);
          } else if (!selAll.checked && idx !== -1) {
            selectedCandidateIds.splice(idx, 1);
          }
        });
        updateBulkBar();
      });
    }

    // Bulk status change
    document.querySelectorAll('.bulk-status-btn').forEach(function(btn) {
      btn.addEventListener('click', function(e) {
        e.preventDefault();
        var newStatus = btn.getAttribute('data-status');
        if (selectedCandidateIds.length === 0 || !newStatus) return;
        if (!confirm('Ubah status ' + selectedCandidateIds.length + ' kandidat menjadi "' + newStatus + '"?')) return;
        showBulkLoading(true);
        google.script.run
          .withSuccessHandler(function(result) {
            showBulkLoading(false);
            showToast(result.message || 'Selesai', result.success ? 'success' : 'error');
            clearBulkSelection();
            loadCandidates();
          })
          .withFailureHandler(function(err) {
            showBulkLoading(false);
            showToast('Gagal: ' + (err.message || err), 'error');
          })
          .bulkUpdateStatus(selectedCandidateIds, newStatus);
      });
    });

    // Bulk delete
    var delBtn = document.getElementById('bulkDeleteBtn');
    if (delBtn) {
      delBtn.addEventListener('click', function() {
        if (selectedCandidateIds.length === 0) return;
        if (!confirm('HAPUS permanen ' + selectedCandidateIds.length + ' kandidat? Tindakan ini tidak dapat dibatalkan.')) return;
        showBulkLoading(true);
        google.script.run
          .withSuccessHandler(function(result) {
            showBulkLoading(false);
            showToast(result.message || 'Selesai', result.success ? 'success' : 'error');
            clearBulkSelection();
            loadCandidates();
          })
          .withFailureHandler(function(err) {
            showBulkLoading(false);
            showToast('Gagal: ' + (err.message || err), 'error');
          })
          .bulkDeleteCandidates(selectedCandidateIds);
      });
    }

    // Deselect all
    var deselBtn = document.getElementById('bulkDeselectBtn');
    if (deselBtn) {
      deselBtn.addEventListener('click', function() { clearBulkSelection(); });
    }
  }

  function showBulkLoading(on) {
    var el = document.getElementById('tableLoading');
    if (!el) return;
    if (on) {
      el.classList.remove('d-none');
      el.querySelector('p').textContent = 'Memproses data...';
    } else {
      el.classList.add('d-none');
    }
  }

  // ---- TABLE RENDER ----
  function renderTable() {
    var tbody   = document.getElementById('tableBody');
    var loading = document.getElementById('tableLoading');
    var empty   = document.getElementById('tableEmpty');
    var ps      = Number(appSettings.pageSize) || 10;

    if (loading) loading.classList.add('d-none');

    if (!filteredCandidates || filteredCandidates.length === 0) {
      if (tbody) tbody.innerHTML = '';
      if (empty) empty.classList.remove('d-none');
      var fc = document.getElementById('footerCount');
      if (fc) fc.innerText = 'Menampilkan 0 dari ' + allCandidates.length + ' data';
      renderPagination(ps);
      return;
    }
    if (empty) empty.classList.add('d-none');

    var totalPages = Math.max(1, Math.ceil(filteredCandidates.length / ps));
    if (currentPage > totalPages) currentPage = totalPages;
    var start    = (currentPage - 1) * ps;
    var pageData = filteredCandidates.slice(start, start + ps);

    if (tbody) tbody.innerHTML = pageData.map(function(row) {
      var isChecked = selectedCandidateIds.indexOf(row.recruitmentId) !== -1;
      return '<tr>' +
        '<td><input type="checkbox" class="form-check-input row-select-cb" data-id="' + escapeHtml(row.recruitmentId) + '"' + (isChecked ? ' checked' : '') + ' /></td>' +
        '<td><div class="avatar-sm">' + escapeHtml(initials(row.fullName)) + '</div></td>' +
        '<td><span class="id-mono">' + escapeHtml(row.recruitmentId) + '</span></td>' +
        '<td><div class="cand-name cand-name-link" style="cursor:pointer;color:var(--color-primary);" data-id="' + escapeHtml(row.recruitmentId) + '">' +
          escapeHtml(row.fullName) + '</div><div class="cand-sub">' + escapeHtml(row.email) + '</div></td>' +
        '<td>' + escapeHtml(row.age) + ' Th</td>' +
        '<td>' + escapeHtml(row.gender || '-') + '</td>' +
        '<td>' + escapeHtml(row.positionApplied) + '</td>' +
        '<td><span class="badge-status ' + statusBadgeClass(row.status) + '">' + escapeHtml(row.status || 'Pending') + '</span></td>' +
        '<td>' + escapeHtml(row.createdDate) + '</td>' +
        '</tr>';
    }).join('');

    var shownStart = start + 1;
    var shownEnd   = Math.min(start + ps, filteredCandidates.length);
    var fc2 = document.getElementById('footerCount');
    if (fc2) fc2.innerText = 'Menampilkan ' + shownStart + '\u2013' + shownEnd +
      ' dari ' + filteredCandidates.length + ' data (total ' + allCandidates.length + ')';

    renderPagination(ps);
    attachViewHandlers();
  }

  function renderPagination(ps) {
    var nav   = document.getElementById('paginationUi');
    if (!nav) return;
    var total = Math.max(1, Math.ceil(filteredCandidates.length / ps));
    var html  = '<button class="page-btn" type="button" id="pagePrev" ' + (currentPage===1?'disabled':'') + '><i class="bi bi-chevron-left"></i></button>';
    var mb = 5, sp = Math.max(1, currentPage - Math.floor(mb/2)), ep = Math.min(total, sp + mb - 1);
    sp = Math.max(1, ep - mb + 1);
    if (sp > 1) { html += '<button class="page-btn" type="button" data-page="1">1</button>'; if (sp > 2) html += '<span class="page-btn" style="border:none;background:transparent;cursor:default">&hellip;</span>'; }
    for (var p = sp; p <= ep; p++) html += '<button class="page-btn' + (p===currentPage?' active':'') + '" type="button" data-page="' + p + '">' + p + '</button>';
    if (ep < total) { if (ep < total-1) html += '<span class="page-btn" style="border:none;background:transparent;cursor:default">&hellip;</span>'; html += '<button class="page-btn" type="button" data-page="' + total + '">' + total + '</button>'; }
    html += '<button class="page-btn" type="button" id="pageNext" ' + (currentPage===total?'disabled':'') + '><i class="bi bi-chevron-right"></i></button>';
    nav.innerHTML = html;
    nav.querySelectorAll('button[data-page]').forEach(function(b) {
      b.addEventListener('click', function() { currentPage = parseInt(b.getAttribute('data-page'), 10); renderTable(); });
    });
    var prev = document.getElementById('pagePrev');
    var next = document.getElementById('pageNext');
    if (prev) prev.addEventListener('click', function() { if (currentPage > 1) { currentPage--; renderTable(); } });
    if (next) next.addEventListener('click', function() { if (currentPage < total) { currentPage++; renderTable(); } });
  }

  function attachViewHandlers() {
    document.querySelectorAll('.cand-name-link').forEach(function(el) {
      el.addEventListener('click', function() {
        openCandidateDrawer(el.getAttribute('data-id'));
      });
    });

    // Row checkbox click — add/remove from bulk selection
    document.querySelectorAll('.row-select-cb').forEach(function(cb) {
      cb.addEventListener('change', function() {
        var id = cb.getAttribute('data-id');
        var idx = selectedCandidateIds.indexOf(id);
        if (cb.checked && idx === -1) {
          selectedCandidateIds.push(id);
        } else if (!cb.checked && idx !== -1) {
          selectedCandidateIds.splice(idx, 1);
        }
        // Sync Select All checkbox
        var ps    = Number(appSettings.pageSize) || 10;
        var start = (currentPage - 1) * ps;
        var pageIds = filteredCandidates.slice(start, start + ps).map(function(r) { return r.recruitmentId; });
        var allChecked = pageIds.length > 0 && pageIds.every(function(id) { return selectedCandidateIds.indexOf(id) !== -1; });
        var selAll = document.getElementById('selectAll');
        if (selAll) selAll.checked = allChecked;
        updateBulkBar();
      });
    });
  }

  function updateStats(data) {
    function ct(fn) { return data.filter(fn).length; }
    var recPending = ct(function(r){ return (r.status||'Pending').toLowerCase() === 'pending'; });
    var recEl = document.getElementById('recStatPending');
    if (recEl) animateCounter(recEl, recPending);

    // Stat cards global (total, pending, accepted, hold, blacklist) dari backend
    if (typeof loadDashboardStatusCounts === 'function') {
      loadDashboardStatusCounts();
    } else {
      var elTotal = document.getElementById('statTotal');
      if (elTotal) animateCounter(elTotal, data.length);
      var elPending = document.getElementById('statPending');
      if (elPending) animateCounter(elPending, recPending);
    }

    var navCount = document.getElementById('navRecruitmentCount');
    if (navCount) navCount.innerText = data.length;
  }

  function initTableSortHeaders() {
    document.querySelectorAll('table.hr-table thead th').forEach(function(th, idx) {
      var sortKeyMap = { 3: 'name', 4: 'age', 8: 'date' };
      if (!(idx in sortKeyMap)) return;
      th.addEventListener('click', function() {
        var key = sortKeyMap[idx];
        var sel = document.getElementById('sortSelect');
        if (!sel) return;
        if (key === 'name')  sel.value = sel.value === 'name_asc'  ? 'name_desc'  : 'name_asc';
        if (key === 'age')   sel.value = sel.value === 'age_desc'  ? 'age_asc'    : 'age_desc';
        if (key === 'date')  sel.value = sel.value === 'newest'    ? 'oldest'     : 'newest';
        applyFilters();
      });
    });
  }
</script>
