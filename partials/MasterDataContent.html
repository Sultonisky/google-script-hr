<!-- partials/MasterDataContent.html — MASTER DATA PAGE CONTENT (SPA partial) -->
<!-- Digunakan di dalam <section id="pageMasterData"> di Dashboard.html -->

<!-- Summary Cards -->
<div class="md-card" id="mdSummaryCard">
  <div class="md-card-body">
    <div class="md-summary" id="mdSummaryGrid"></div>
  </div>
</div>

<!-- Main Table Card -->
<div class="md-card">
  <div class="md-card-header">
    <h6><i class="bi bi-list-ul"></i> <span id="mdCurrentCategoryLabel">Semua Data</span></h6>
    <!-- TOMBOL TAMBAH ITEM DINONAKTIFKAN SEMENTARA (backup: kembalikan dengan menghapus komentar)
    <button class="btn-md-add" id="btnMdAdd" type="button">
      <i class="bi bi-plus-lg"></i> Tambah Item
    </button>
    -->
  </div>

  <!-- Category Nav -->
  <div class="md-cat-nav" id="mdCatNav"></div>

  <!-- Toolbar -->
  <div class="md-toolbar">
    <div class="md-search">
      <i class="bi bi-search"></i>
      <input type="text" id="mdSearch" placeholder="Cari item..." autocomplete="off" />
    </div>
    <div class="text-muted small" id="mdCountInfo">0 item</div>
  </div>

  <!-- Table -->
  <div class="md-card-body">
    <div style="overflow-x:auto;">
      <table class="md-table" id="mdTable">
        <thead>
          <tr>
            <th style="width:50px;">#</th>
            <th>Nama</th>
            <th>Deskripsi</th>
            <th>Kategori</th>
            <th style="width:80px;">Aksi</th>
          </tr>
        </thead>
        <tbody id="mdTableBody"></tbody>
      </table>
    </div>
    <div class="md-empty" id="mdEmpty" style="display:none;">
      <i class="bi bi-inbox"></i>
      <div>Belum ada data ditemukan.</div>
    </div>
  </div>
</div>

<!-- Add/Edit Modal dipindah ke partials/EntityModals.html agar z-index tidak terpotong stacking context -->

<!-- Toast Notification -->
<div class="position-fixed bottom-0 end-0 p-3" style="z-index:9999;pointer-events:none;">
  <div id="mdToast" class="toast align-items-center border-0 shadow" role="alert" aria-live="assertive" aria-atomic="true" style="pointer-events:auto;">
    <div class="d-flex">
      <div class="toast-body" id="mdToastBody"></div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Tutup"></button>
    </div>
  </div>
</div>
