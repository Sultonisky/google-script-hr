<script>
  // ============================================================
  // js/probation.html — Halaman Probation & Evaluasi
  // Depends on: helpers.html, pdfExport.html, api.html
  // ============================================================

  var PROB_PAGE = null;
  var _probData = [];
  var _probFiltered = [];
  var _probPage = 1;
  var _probPs = 10;

  // ============================================================
  // INIT
  // ============================================================
  function initProbationPage() {
    _loadProbationData(false);

    var btnRef = document.getElementById('btnProbRefresh');
    if (btnRef) btnRef.addEventListener('click', function() { _loadProbationData(false); });

    var btnEval = document.getElementById('btnOpenEvalModal');
    if (btnEval) btnEval.addEventListener('click', function() { openEvalModal(null); });

    var si = document.getElementById('probSearchInput');
    var df = document.getElementById('probDeptFilter');
    var ss = document.getElementById('probSortSelect');
    var rb = document.getElementById('btnProbReset');
    if (si) si.addEventListener('input',  _probApplyFilter);
    if (df) df.addEventListener('change', _probApplyFilter);
    if (ss) ss.addEventListener('change', _probApplyFilter);
    if (rb) rb.addEventListener('click', function() {
      if (si) si.value = '';
      if (df) df.value = '';
      if (ss) ss.value = 'newest';
      _probApplyFilter();
    });

    initEvalModal();
  }

  function probationOnNavigate() {
    _loadProbationData(true);
  }

  function _normProbEmpId(id) {
    return String(id || '').replace(/^'+/, '').trim();
  }

  // ============================================================
  // DATA LOAD & FILTER
  // ============================================================
  function _loadProbationData(silent) {
    var loadEl  = document.getElementById('probTableLoading');
    var emptyEl = document.getElementById('probTableEmpty');
    if (!silent && loadEl)  loadEl.classList.remove('d-none');
    if (!silent && emptyEl) emptyEl.classList.add('d-none');

    google.script.run
      .withSuccessHandler(function(res) {
        _probData = res || [];
        if (loadEl) loadEl.classList.add('d-none');
        var subEl = document.getElementById('probPanelSubtitle');
        if (subEl) subEl.innerText = 'Terakhir dimuat: ' + new Date().toLocaleString('id-ID');
        _populateProbDeptFilter();
        _updateProbStats();
        _probApplyFilter();
        if (!silent) showToast('Data probation dimuat (' + _probData.length + ' karyawan).', 'success');
      })
      .withFailureHandler(function(err) {
        if (loadEl) loadEl.classList.add('d-none');
        if (!silent) showToast('Gagal memuat data probation: ' + (err.message || err), 'error');
      })
      .getProbationList();
  }

  function _populateProbDeptFilter() {
    var sel = document.getElementById('probDeptFilter');
    if (!sel) return;
    var depts = [];
    _probData.forEach(function(r) {
      if (r.department && depts.indexOf(r.department) === -1) depts.push(r.department);
    });
    sel.innerHTML = '<option value="">Semua Dept</option>' +
      depts.sort().map(function(d) {
        return '<option value="' + escapeHtml(d) + '">' + escapeHtml(d) + '</option>';
      }).join('');
  }

  function _updateProbStats() {
    var total     = _probData.length;
    var workflow  = _probData.filter(function(r) { return r.fromOnboardingWorkflow; }).length;
    var legacy    = total - workflow;
    var evaluated = _probData.filter(function(r) { return r.lastEvalDate && r.lastEvalDate !== '-'; }).length;
    var passed    = _probData.filter(function(r) {
      var k = r.lastKeputusan || r.decision || '';
      return k.indexOf('Lulus') === 0 || k.indexOf('Pass') === 0;
    }).length;
    var extended  = _probData.filter(function(r) {
      var k = r.lastKeputusan || r.decision || '';
      return k.indexOf('Tidak Lulus') !== -1 || k.indexOf('Perpanjang') !== -1 || k.indexOf('Extend') !== -1;
    }).length;
    var elT = document.getElementById('probStatTotal');
    var elW = document.getElementById('probStatWorkflow');
    var elE = document.getElementById('probStatEvaluated');
    var elP = document.getElementById('probStatPassed');
    var elX = document.getElementById('probStatExtended');
    if (elT) animateCounter(elT, total);
    if (elW) animateCounter(elW, workflow);
    if (elE) animateCounter(elE, evaluated);
    if (elP) animateCounter(elP, passed);
    if (elX) animateCounter(elX, extended);

    var subEl = document.getElementById('probPanelSubtitle');
    if (subEl && subEl.innerText.indexOf('Terakhir dimuat') !== -1) {
      subEl.innerText =
        'Terakhir dimuat: ' + new Date().toLocaleString('id-ID') +
        ' · Onboarding: ' + workflow + ' · Legacy: ' + legacy;
    }
  }

  function _probApplyFilter() {
    var search = ((document.getElementById('probSearchInput')  || {}).value || '').toLowerCase();
    var dept   =  (document.getElementById('probDeptFilter')   || {}).value || '';
    var sortV  =  (document.getElementById('probSortSelect')   || {}).value || 'newest';

    _probFiltered = _probData.filter(function(r) {
      var ms = !search ||
        (r.fullName     || '').toLowerCase().indexOf(search) !== -1 ||
        (r.employeeId   || '').toLowerCase().indexOf(search) !== -1 ||
        (r.position     || '').toLowerCase().indexOf(search) !== -1 ||
        (r.department   || '').toLowerCase().indexOf(search) !== -1;
      var md = !dept || r.department === dept;
      return ms && md;
    });

    _probFiltered.sort(function(a, b) {
      if (sortV === 'name_asc')   return (a.fullName || '').localeCompare(b.fullName || '');
      if (sortV === 'name_desc')  return (b.fullName || '').localeCompare(a.fullName || '');
      if (sortV === 'score_desc') return (Number(b.lastAvgScore) || 0) - (Number(a.lastAvgScore) || 0);
      if (sortV === 'score_asc')  return (Number(a.lastAvgScore) || 0) - (Number(b.lastAvgScore) || 0);
      // newest / oldest by contractStart
      var ta = a.contractStart || a.joinDate || '';
      var tb = b.contractStart || b.joinDate || '';
      return sortV === 'oldest' ? ta.localeCompare(tb) : tb.localeCompare(ta);
    });

    _probPage = 1;
    _renderProbTable();
  }

  // ============================================================
  // RENDER TABLE
  // ============================================================
  function _renderProbTable() {
    var tbody   = document.getElementById('probTableBody');
    var emptyEl = document.getElementById('probTableEmpty');
    var footEl  = document.getElementById('probFooterCount');

    if (!_probFiltered || _probFiltered.length === 0) {
      if (tbody)   tbody.innerHTML = '';
      if (emptyEl) emptyEl.classList.remove('d-none');
      if (footEl)  footEl.innerText = 'Menampilkan 0 dari ' + _probData.length + ' data';
      _renderProbPagination();
      return;
    }
    if (emptyEl) emptyEl.classList.add('d-none');

    var totalPages = Math.max(1, Math.ceil(_probFiltered.length / _probPs));
    if (_probPage > totalPages) _probPage = totalPages;
    var start    = (_probPage - 1) * _probPs;
    var pageData = _probFiltered.slice(start, start + _probPs);

    if (tbody) tbody.innerHTML = pageData.map(function(r) {
      // Badge skor
      var scoreHtml = '-';
      if (r.lastAvgScore !== '' && r.lastAvgScore !== undefined) {
        var s = Number(r.lastAvgScore);
        var cls = s >= 7 ? 'accepted' : s >= 5 ? 'hold' : 'blacklist';
        scoreHtml = '<span class="badge-status ' + cls + '" style="font-size:11px;padding:2px 8px">' + s.toFixed(1) + '</span>';
      }
      // Badge keputusan
      var kepHtml = '<span style="color:#9ca3af;font-size:12px">Not yet evaluated</span>';
      var keputusan = r.lastKeputusan || r.decision || '';
      if (keputusan) {
        var isLulus = keputusan.indexOf('Lulus') === 0 || keputusan.indexOf('Pass') === 0;
        var isTerm  = keputusan.indexOf('Putus Kontrak') !== -1 || keputusan.indexOf('Paklaring') !== -1;
        var isExt   = !isLulus && !isTerm;
        
        if (isLulus) {
          kepHtml = '<span class="badge-status accepted" style="font-size:10px;padding:2px 8px">' +
            '<i class="bi bi-check-circle-fill me-1"></i>Passed</span>';
        } else if (isTerm) {
          kepHtml = '<span class="badge-status rejected" style="font-size:10px;padding:2px 8px">' +
            '<i class="bi bi-x-circle-fill me-1"></i>Terminated</span>';
        } else {
          kepHtml = '<span class="badge-status hold" style="font-size:10px;padding:2px 8px">' +
            '<i class="bi bi-arrow-repeat me-1"></i>Extended</span>';
        }
      }

      return '<tr>' +
        '<td><div class="avatar-sm" style="background:#7c3aed;color:#fff">' + escapeHtml(initials(r.fullName)) + '</div></td>' +
        '<td><span class="id-mono" style="font-size:11px">' + escapeHtml(r.employeeId) + '</span></td>' +
        '<td><div class="fw-semibold" style="font-size:13px">' + escapeHtml(r.fullName) + '</div>' +
             '<div class="cand-sub">' + escapeHtml(r.email || '') + '</div></td>' +
        '<td><div style="font-size:13px">' + escapeHtml(r.position || '-') + '</div>' +
             '<div class="cand-sub">' + escapeHtml(r.department || '-') + '</div></td>' +
        '<td><small>' + escapeHtml(formatDisplayDate(r.contractStart || r.joinDate)) + '</small></td>' +
        '<td><small>' + escapeHtml(formatDisplayDate(r.contractEnd)) + '</small></td>' +
        '<td>' + scoreHtml + '</td>' +
        '<td>' + kepHtml + '</td>' +
        '<td>' +
          '<button class="btn btn-sm prob-btn-eval" data-id="' + escapeHtml(r.employeeId) + '"' +
          ' title="Evaluasi" style="background:#f5f3ff;color:#7c3aed;border:1px solid #ddd6fe;border-radius:6px;padding:4px 8px">' +
          '<i class="bi bi-clipboard-check"></i></button> ' +
          '<button class="btn btn-sm prob-btn-history" data-id="' + escapeHtml(r.employeeId) + '" data-name="' + escapeHtml(r.fullName) + '"' +
          ' title="Riwayat Evaluasi" style="background:#f0f7ff;color:#0b4a86;border:1px solid #c7dff7;border-radius:6px;padding:4px 8px">' +
          '<i class="bi bi-clock-history"></i></button>' +
        '</td>' +
        '</tr>';
    }).join('');

    var shownEnd = Math.min(start + _probPs, _probFiltered.length);
    if (footEl) footEl.innerText =
      'Menampilkan ' + (start + 1) + '–' + shownEnd + ' dari ' + _probFiltered.length +
      ' data (total ' + _probData.length + ')';

    _renderProbPagination();
    _attachProbRowHandlers();
  }

  function _renderProbPagination() {
    var nav   = document.getElementById('probPaginationUi');
    if (!nav) return;
    var total = Math.max(1, Math.ceil(_probFiltered.length / _probPs));
    var html  = '<button class="page-btn" type="button" id="probPagePrev"' + (_probPage === 1 ? ' disabled' : '') + '><i class="bi bi-chevron-left"></i></button>';
    for (var p = 1; p <= total; p++) {
      html += '<button class="page-btn' + (p === _probPage ? ' active' : '') + '" type="button" data-page="' + p + '">' + p + '</button>';
    }
    html += '<button class="page-btn" type="button" id="probPageNext"' + (_probPage === total ? ' disabled' : '') + '><i class="bi bi-chevron-right"></i></button>';
    nav.innerHTML = html;
    nav.querySelectorAll('button[data-page]').forEach(function(b) {
      b.addEventListener('click', function() { _probPage = parseInt(b.getAttribute('data-page'), 10); _renderProbTable(); });
    });
    var prev = document.getElementById('probPagePrev');
    var next = document.getElementById('probPageNext');
    if (prev) prev.addEventListener('click', function() { if (_probPage > 1)     { _probPage--; _renderProbTable(); } });
    if (next) next.addEventListener('click', function() { if (_probPage < total) { _probPage++; _renderProbTable(); } });
  }

  function _attachProbRowHandlers() {
    document.querySelectorAll('#probTableBody .prob-btn-eval').forEach(function(btn) {
      btn.addEventListener('click', function() {
        var id  = btn.getAttribute('data-id');
        var emp = _probData.find(function(r) { return _normProbEmpId(r.employeeId) === _normProbEmpId(id); });
        if (emp) openEvalModal(emp);
      });
    });
    document.querySelectorAll('#probTableBody .prob-btn-history').forEach(function(btn) {
      btn.addEventListener('click', function() {
        var id   = btn.getAttribute('data-id');
        var name = btn.getAttribute('data-name');
        openEvalHistoryModal(id, name);
      });
    });
  }

  // ============================================================
  // EVALUASI MODAL — open, search, scoring, submit
  // ============================================================
  var _activeEvalEmp = null;

  function openEvalModal(emp) {
    _activeEvalEmp = emp || null;
    var searchEl = document.getElementById('evalEmpSearch');
    var clearEl  = document.getElementById('evalEmpSearchClear');
    var dropEl   = document.getElementById('evalEmpDropdown');
    if (searchEl) searchEl.value = emp ? emp.fullName : '';
    if (clearEl)  clearEl.style.display = emp ? 'block' : 'none';
    if (dropEl)   dropEl.style.display  = 'none';
    _fillEvalEmpPreview(emp);
    // Reset sliders to 5
    ['evalScorePerformance','evalScoreDiscipline','evalScoreCommunication','evalScoreInitiative','evalScoreTeamwork'].forEach(function(id) {
      var el = document.getElementById(id); if (el) el.value = 5;
    });
    _updateEvalBadgesAndAvg();
    // Reset keputusan
    var decVal = document.getElementById('evalDecisionValue');
    if (!decVal) {
      var hid = document.createElement('input');
      hid.type = 'hidden'; hid.id = 'evalDecisionValue'; hid.value = '';
      document.getElementById('evalDecisionOptions').appendChild(hid);
    } else {
      decVal.value = '';
    }
    document.querySelectorAll('.eval-decision-opt').forEach(function(o) {
      o.style.borderColor = '#e5e7eb'; o.style.background = '';
      var dot = o.querySelector('.eval-dec-dot'); var inner = o.querySelector('.eval-dec-dot > div');
      if (dot) { dot.style.borderColor = '#d1d5db'; dot.style.background = 'transparent'; }
      if (inner) inner.style.background = 'transparent';
    });
    var extSection = document.getElementById('evalExtendSection');
    if (extSection) extSection.style.display = 'none';
    _updateEvalConfirmBtn();
    var modal = bootstrap.Modal.getOrCreateInstance(document.getElementById('evalProbationModal'));
    modal.show();
  }

  function _fillEvalEmpPreview(emp) {
    var previewEl = document.getElementById('evalEmpPreview');
    if (!emp) { if (previewEl) previewEl.style.display = 'none'; return; }
    if (previewEl) previewEl.style.display = 'block';
    var avatarEl  = document.getElementById('evalEmpAvatar');
    var nameEl    = document.getElementById('evalEmpName');
    var posEl     = document.getElementById('evalEmpPosition');
    var deptEl    = document.getElementById('evalEmpDept');
    var idDispEl  = document.getElementById('evalEmpIdDisp');
    var endEl     = document.getElementById('evalEmpContractEnd');
    var hidIdEl   = document.getElementById('evalEmployeeId');
    var hidRidEl  = document.getElementById('evalRecruitmentId');
    var hidPidEl  = document.getElementById('evalProbationId');
    if (avatarEl)  avatarEl.innerText  = initials(emp.fullName);
    if (nameEl)    nameEl.innerText    = emp.fullName       || '-';
    if (posEl)     posEl.innerText     = emp.position       || '-';
    if (deptEl)    deptEl.innerText    = emp.department     || '-';
    if (idDispEl)  idDispEl.innerText  = emp.employeeId     || '-';
    if (endEl)     endEl.innerText     = formatDisplayDate(emp.contractEnd);
    if (hidIdEl)   hidIdEl.value       = emp.employeeId     || '';
    if (hidRidEl)  hidRidEl.value      = emp.recruitmentId  || '';
    if (hidPidEl)  hidPidEl.value      = emp.probationId    || '';
    setTimeout(_updateEvalConfirmBtn, 0);
  }

  function _updateEvalBadgesAndAvg() {
    var ids      = ['evalScorePerformance','evalScoreDiscipline','evalScoreCommunication','evalScoreInitiative','evalScoreTeamwork'];
    var badgeIds = ['badgePerformance','badgeDiscipline','badgeCommunication','badgeInitiative','badgeTeamwork'];
    var sum = 0;
    ids.forEach(function(id, idx) {
      var el  = document.getElementById(id);
      var bEl = document.getElementById(badgeIds[idx]);
      var val = el ? Number(el.value) : 5;
      sum += val;
      if (bEl) {
        bEl.innerText = val;
        bEl.style.background   = val >= 7 ? '#d1fae5' : val >= 5 ? '#fef3c7' : '#fee2e2';
        bEl.style.color        = val >= 7 ? '#166534' : val >= 5 ? '#92400e' : '#991b1b';
        bEl.style.borderRadius = '6px';
        bEl.style.padding      = '2px 6px';
        bEl.style.fontSize     = '12px';
        bEl.style.fontWeight   = '700';
      }
    });
    var avg = Math.round((sum / 5) * 10) / 10;
    var avgEl = document.getElementById('evalAvgScore');
    if (avgEl) {
      avgEl.innerText   = avg.toFixed(1);
      avgEl.style.color = avg >= 7 ? '#166534' : avg >= 5 ? '#d97706' : '#991b1b';
    }
    
    // Update decision buttons state based on score
    _updateDecisionButtonsState(avg);
  }

  function _updateDecisionButtonsState(avg) {
    var passBtn = document.querySelector('.eval-decision-opt[data-value="Lulus → Karyawan Tetap"]');
    var termBtn = document.querySelector('.eval-decision-opt[data-value="Tidak Lolos → Putus Kontrak (Paklaring)"]');
    var extBtn = document.querySelector('.eval-decision-opt[data-value="Tidak Lolos → Perpanjang Probation (Evaluasi Ulang)"]');

    // Passing score: >= 7.0 (dapat pilih Lulus)
    // Failing score: < 5.0 (harus Putus Kontrak atau Perpanjang, tidak boleh Lulus)
    // Middle score: 5.0 - 6.9 (dapat pilih Perpanjang atau Putus Kontrak)
    
    if (passBtn) {
      if (avg >= 7.0) {
        passBtn.style.opacity = '1';
        passBtn.style.pointerEvents = 'auto';
        passBtn.style.cursor = 'pointer';
      } else {
        passBtn.style.opacity = '0.4';
        passBtn.style.pointerEvents = 'none';
        passBtn.style.cursor = 'not-allowed';
        // Deselect if currently selected
        var currentDecision = (document.getElementById('evalDecisionValue') || {}).value;
        if (currentDecision === 'Lulus → Karyawan Tetap') {
          passBtn.style.borderColor = '#e5e7eb';
          passBtn.style.background = '';
          var dot = passBtn.querySelector('.eval-dec-dot');
          var inner = passBtn.querySelector('.eval-dec-dot > div');
          if (dot) { dot.style.borderColor = '#d1d5db'; dot.style.background = 'transparent'; }
          if (inner) inner.style.background = 'transparent';
          var decEl = document.getElementById('evalDecisionValue');
          if (decEl) decEl.value = '';
          _updateEvalConfirmBtn();
        }
      }
    }

    // Term and Extend always enabled
    if (termBtn) {
      termBtn.style.opacity = '1';
      termBtn.style.pointerEvents = 'auto';
      termBtn.style.cursor = 'pointer';
    }
    if (extBtn) {
      extBtn.style.opacity = '1';
      extBtn.style.pointerEvents = 'auto';
      extBtn.style.cursor = 'pointer';
    }
  }

  function _updateEvalConfirmBtn() {
    var btn = document.getElementById('btnConfirmEval');
    if (!btn) return;
    var hasCand = !!_activeEvalEmp;
    var decVal  = (document.getElementById('evalDecisionValue') || {}).value || '';
    var hasDecision = !!decVal;
    var isExtend = decVal === 'Tidak Lolos → Perpanjang Probation (Evaluasi Ulang)';
    var isPass   = decVal === 'Lulus → Karyawan Tetap';
    var isTerm   = decVal === 'Tidak Lolos → Putus Kontrak (Paklaring)';

    var hasExtendValid = true;
    if (isExtend) {
      hasExtendValid = !!((document.getElementById('evalDurasiPerpanjang') || {}).value) &&
                       !!((document.getElementById('evalKontrakBaruStart')  || {}).value);
    }

    var tEl = document.getElementById('btnEvalText');
    if (tEl) {
      if (isPass) {
        btn.style.background = '#166534';
        tEl.innerHTML = '<i class="bi bi-file-earmark-pdf me-1"></i>Save &amp; Generate SK Tetap';
      } else if (isTerm) {
        btn.style.background = '#991b1b';
        tEl.innerHTML = '<i class="bi bi-file-earmark-pdf me-1"></i>Save &amp; Generate Paklaring';
      } else if (isExtend) {
        btn.style.background = '#d97706';
        tEl.innerHTML = '<i class="bi bi-check2-circle me-1"></i>Save Extension';
      } else {
        btn.style.background = '#7c3aed';
        tEl.innerHTML = '<i class="bi bi-clipboard-check me-1"></i>Save Evaluation';
      }
    }

    btn.disabled = !(hasCand && hasDecision && hasExtendValid);
  }

  // ============================================================
  // INIT EVAL MODAL — event listeners
  // ============================================================
  function initEvalModal() {
    var searchEl = document.getElementById('evalEmpSearch');
    var clearEl  = document.getElementById('evalEmpSearchClear');
    var dropEl   = document.getElementById('evalEmpDropdown');

    // ── Live search ────────────────────────────────────────────
    function renderEvalDropdown(query) {
      if (!dropEl) return;
      var q = (query || '').trim().toLowerCase();
      if (!q) { dropEl.style.display = 'none'; return; }
      var matched = _probData.filter(function(r) {
        return (r.fullName   || '').toLowerCase().indexOf(q) !== -1 ||
               (r.employeeId || '').toLowerCase().indexOf(q) !== -1;
      }).slice(0, 8);
      if (matched.length === 0) {
        dropEl.innerHTML = '<div class="px-3 py-2 text-muted" style="font-size:13px">Tidak ada karyawan probation ditemukan</div>';
        dropEl.style.display = 'block';
        return;
      }
      dropEl.innerHTML = matched.map(function(r) {
        return '<div class="eval-search-item px-3 py-2 d-flex align-items-center gap-2" ' +
          'style="cursor:pointer;border-bottom:1px solid #f0f0f0;font-size:13px" data-id="' + escapeHtml(r.employeeId) + '">' +
          '<div class="avatar-sm" style="width:28px;height:28px;font-size:11px;flex-shrink:0;background:#7c3aed;color:#fff;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:700">' +
            escapeHtml(initials(r.fullName)) + '</div>' +
          '<div><div class="fw-semibold">' + escapeHtml(r.fullName) + '</div>' +
          '<div class="text-muted" style="font-size:11px">' + escapeHtml(r.position || '-') + ' · ' + escapeHtml(r.employeeId) + '</div></div>' +
          '</div>';
      }).join('');
      dropEl.style.display = 'block';
      dropEl.querySelectorAll('.eval-search-item').forEach(function(item) {
        item.addEventListener('mouseenter', function() { item.style.background = '#f5f3ff'; });
        item.addEventListener('mouseleave', function() { item.style.background = ''; });
        item.addEventListener('click', function() {
          var id   = item.getAttribute('data-id');
          var found = _probData.find(function(r) { return _normProbEmpId(r.employeeId) === _normProbEmpId(id); });
          if (found) {
            _activeEvalEmp = found;
            if (searchEl) searchEl.value = found.fullName;
            if (clearEl)  clearEl.style.display = 'block';
            dropEl.style.display = 'none';
            _fillEvalEmpPreview(found);
          }
        });
      });
    }

    if (searchEl) {
      searchEl.addEventListener('input', function() {
        _activeEvalEmp = null; _fillEvalEmpPreview(null); _updateEvalConfirmBtn();
        if (clearEl) clearEl.style.display = searchEl.value ? 'block' : 'none';
        renderEvalDropdown(searchEl.value);
      });
    }
    if (clearEl) {
      clearEl.addEventListener('click', function() {
        if (searchEl) searchEl.value = '';
        clearEl.style.display = 'none';
        if (dropEl) dropEl.style.display = 'none';
        _activeEvalEmp = null; _fillEvalEmpPreview(null); _updateEvalConfirmBtn();
      });
    }
    document.addEventListener('click', function(e) {
      if (dropEl && !dropEl.contains(e.target) && e.target !== searchEl) dropEl.style.display = 'none';
    });

    // ── Slider events ──────────────────────────────────────────
    ['evalScorePerformance','evalScoreDiscipline','evalScoreCommunication','evalScoreInitiative','evalScoreTeamwork'].forEach(function(id) {
      var el = document.getElementById(id);
      if (el) el.addEventListener('input', _updateEvalBadgesAndAvg);
    });

    // ── Keputusan card click ───────────────────────────────────
    document.querySelectorAll('.eval-decision-opt').forEach(function(opt) {
      opt.addEventListener('click', function() {
        var val     = opt.getAttribute('data-value');
        var isPerp  = val === 'Tidak Lolos → Perpanjang Probation (Evaluasi Ulang)';
        var isLulus = val === 'Lulus → Karyawan Tetap';
        var isTerm  = val === 'Tidak Lolos → Putus Kontrak (Paklaring)';

        var colorMap = {
          'Lulus → Karyawan Tetap':                           { border: '#166534', bg: '#f0fdf4' },
          'Tidak Lolos → Putus Kontrak (Paklaring)':          { border: '#991b1b', bg: '#fef2f2' },
          'Tidak Lolos → Perpanjang Probation (Evaluasi Ulang)': { border: '#d97706', bg: '#fffbeb' },
        };
        document.querySelectorAll('.eval-decision-opt').forEach(function(o) {
          var isThis = o === opt;
          var c = colorMap[o.getAttribute('data-value')] || { border: '#e5e7eb', bg: '' };
          o.style.borderColor = isThis ? c.border : '#e5e7eb';
          o.style.background  = isThis ? c.bg : '';
          var dot   = o.querySelector('.eval-dec-dot');
          var inner = o.querySelector('.eval-dec-dot > div');
          if (dot)   { dot.style.borderColor = isThis ? c.border : '#d1d5db'; dot.style.background = isThis ? c.border : 'transparent'; }
          if (inner) { inner.style.background = isThis ? '#fff' : 'transparent'; }
        });
        // upsert hidden input
        var decEl = document.getElementById('evalDecisionValue');
        if (!decEl) {
          decEl = document.createElement('input'); decEl.type = 'hidden'; decEl.id = 'evalDecisionValue';
          document.getElementById('evalDecisionOptions').appendChild(decEl);
        }
        decEl.value = val;
        // show/hide extend section
        var extSec = document.getElementById('evalExtendSection');
        if (extSec) extSec.style.display = isPerp ? 'block' : 'none';
        _updateEvalConfirmBtn();
      });
    });

    // ── Auto-calc extend end date ──────────────────────────────
    var durEl   = document.getElementById('evalDurasiPerpanjang');
    var startEl = document.getElementById('evalKontrakBaruStart');
    function calcExtendEnd() {
      var endEl   = document.getElementById('evalKontrakBaruEnd');
      var hintEl  = document.getElementById('evalExtendEndHint');
      if (!durEl || !startEl || !endEl || !durEl.value || !startEl.value) return;
      var m = durEl.value.match(/^(\d+)\s*Bulan/i);
      if (!m) return;
      var d = new Date(startEl.value);
      d.setMonth(d.getMonth() + parseInt(m[1], 10));
      endEl.value = d.toISOString().split('T')[0];
      if (hintEl) hintEl.innerText = 'Auto-dihitung dari durasi ' + durEl.value;
    }
    if (durEl)   durEl.addEventListener('change',   function() { calcExtendEnd(); _updateEvalConfirmBtn(); });
    if (startEl) startEl.addEventListener('change', function() { calcExtendEnd(); _updateEvalConfirmBtn(); });
    var durElW   = document.getElementById('evalDurasiPerpanjang');
    var startElW = document.getElementById('evalKontrakBaruStart');
    if (durElW)   durElW.addEventListener('input',  _updateEvalConfirmBtn);
    if (startElW) startElW.addEventListener('input', _updateEvalConfirmBtn);

    // ── Reset on modal close ───────────────────────────────────
    var modalEl = document.getElementById('evalProbationModal');
    if (modalEl) {
      modalEl.addEventListener('hidden.bs.modal', function() {
        _activeEvalEmp = null;
        if (searchEl) searchEl.value = '';
        if (clearEl)  clearEl.style.display = 'none';
        if (dropEl)   dropEl.style.display  = 'none';
        var prev = document.getElementById('evalEmpPreview');
        if (prev) prev.style.display = 'none';
        var decEl = document.getElementById('evalDecisionValue');
        if (decEl) decEl.value = '';
        var extSec = document.getElementById('evalExtendSection');
        if (extSec) extSec.style.display = 'none';
        ['evalDurasiPerpanjang','evalKontrakBaruStart','evalKontrakBaruEnd','evalCatatan'].forEach(function(id) {
          var el = document.getElementById(id); if (el) el.value = '';
        });
        ['evalScorePerformance','evalScoreDiscipline','evalScoreCommunication','evalScoreInitiative','evalScoreTeamwork'].forEach(function(id) {
          var el = document.getElementById(id); if (el) el.value = 5;
        });
        _updateEvalBadgesAndAvg();
        var btn = document.getElementById('btnConfirmEval');
        if (btn) {
          btn.disabled = true;
          btn.style.background = '#7c3aed';
        }
        var tEl = document.getElementById('btnEvalText'); var lEl = document.getElementById('btnEvalLoading');
        if (tEl) {
          tEl.style.display = 'inline-flex';
          tEl.innerHTML = '<i class="bi bi-clipboard-check me-1"></i>Simpan Evaluasi';
        }
        if (lEl) lEl.style.display = 'none';
      });
    }

    // ── Submit ─────────────────────────────────────────────────
    var confirmBtn = document.getElementById('btnConfirmEval');
    if (confirmBtn) {
      confirmBtn.addEventListener('click', function() {
        var empId   = (document.getElementById('evalEmployeeId')    || {}).value || '';
        var ridId   = (document.getElementById('evalRecruitmentId') || {}).value || '';
        var decVal  = (document.getElementById('evalDecisionValue') || {}).value || '';
        if (!empId || !decVal) return;

        var evalData = {
          employeeId:        empId,
          recruitmentId:     ridId,
          probationId:       (document.getElementById('evalProbationId')        || {}).value || '',
          skorKinerja:       (document.getElementById('evalScorePerformance')    || {}).value || 5,
          skorKedisiplinan:  (document.getElementById('evalScoreDiscipline')     || {}).value || 5,
          skorKomunikasi:    (document.getElementById('evalScoreCommunication')  || {}).value || 5,
          skorInisiatif:     (document.getElementById('evalScoreInitiative')     || {}).value || 5,
          skorTeamwork:      (document.getElementById('evalScoreTeamwork')       || {}).value || 5,
          keputusan:         decVal,
          durasiPerpanjang:  (document.getElementById('evalDurasiPerpanjang')    || {}).value || '',
          kontrakBaruStart:  (document.getElementById('evalKontrakBaruStart')    || {}).value || '',
          kontrakBaruEnd:    (document.getElementById('evalKontrakBaruEnd')      || {}).value || '',
          catatan:           (document.getElementById('evalCatatan')             || {}).value || '',
        };
        var evaluatedBy = (typeof currentUser !== 'undefined' && currentUser && currentUser.email)
          ? currentUser.email : 'HR Dashboard';

        var tEl = document.getElementById('btnEvalText'); var lEl = document.getElementById('btnEvalLoading');
        confirmBtn.disabled = true;
        if (tEl) tEl.style.display = 'none';
        if (lEl) lEl.style.display = 'inline-flex';

        google.script.run
          .withSuccessHandler(function(res) {
            confirmBtn.disabled = false;
            if (tEl) tEl.style.display = 'inline-flex';
            if (lEl) lEl.style.display = 'none';
            var modal = bootstrap.Modal.getInstance(document.getElementById('evalProbationModal'));
            if (modal) modal.hide();
            if (res && res.success) {
              if (res.isLulus) {
                showToast(
                  'Evaluation submitted! <strong>' + escapeHtml((_activeEvalEmp || {}).fullName || '') + '</strong> — ' +
                  '<span style="color:#166534">Passed → Permanent Employee</span> | Score: <strong>' + (res.nilaiRataRata || '-') + '</strong>',
                  'success', 6000
                );
                // Generate SK Pengangkatan Tetap PDF
                exportSKTetapPDF(_activeEvalEmp, evalData, res);
              } else if (res.isPutusKontrak) {
                showToast(
                  'Evaluation submitted! <strong>' + escapeHtml((_activeEvalEmp || {}).fullName || '') + '</strong> — ' +
                  '<span style="color:#991b1b">Terminated &amp; Paklaring Issued</span> | Score: <strong>' + (res.nilaiRataRata || '-') + '</strong>',
                  'success', 6000
                );
                // Generate Surat Keterangan Kerja (Paklaring) PDF
                exportPaklaringPDF(_activeEvalEmp, evalData, res);
              } else if (res.isPerpanjang) {
                showToast(
                  'Evaluation submitted! Probation period for <strong>' + escapeHtml((_activeEvalEmp || {}).fullName || '') + '</strong> ' +
                  'extended by <strong>' + escapeHtml(evalData.durasiPerpanjang || 'extension period') + '</strong>.',
                  'success', 6000
                );
                // Tanpa generate PDF untuk opsi perpanjang/evaluasi ulang
              }
              // Reload tabel probation
              _loadProbationData(true);
            } else {
              showToast('Failed to save evaluation: ' + (res ? res.message : 'Error'), 'error');
            }
          })
          .withFailureHandler(function(err) {
            confirmBtn.disabled = false;
            if (tEl) tEl.style.display = 'inline-flex';
            if (lEl) lEl.style.display = 'none';
            showToast('Error: ' + (err ? err.message : 'Unknown'), 'error');
          })
          .saveProbationEval(evalData, evaluatedBy);
      });
    }
  }

  // RIWAYAT EVALUASI MODAL

  function openEvalHistoryModal(employeeId, empName) {
    var nameEl = document.getElementById('evalHistoryEmpName');
    var bodyEl = document.getElementById('evalHistoryBody');
    if (nameEl) nameEl.innerText = empName || '-';
    if (bodyEl) bodyEl.innerHTML = '<div class="text-center text-muted py-4" style="font-size:13px"><span class="spinner-border spinner-border-sm me-2"></span>Memuat riwayat...</div>';
    var modal = bootstrap.Modal.getOrCreateInstance(document.getElementById('evalHistoryModal'));
    modal.show();

    google.script.run
      .withSuccessHandler(function(history) {
        if (!bodyEl) return;
        if (!history || history.length === 0) {
          bodyEl.innerHTML = '<div class="text-center text-muted py-4" style="font-size:13px">Belum ada riwayat evaluasi untuk karyawan ini.</div>';
          return;
        }
        bodyEl.innerHTML = history.map(function(ev, idx) {
          var keputusan = ev.keputusan || ev.decision || '';
          var isLulus   = keputusan.indexOf('Lulus') === 0 || keputusan.indexOf('Pass') === 0;
          var isTerm    = keputusan.indexOf('Putus Kontrak') !== -1 || keputusan.indexOf('Paklaring') !== -1;
          var kepClass  = isLulus ? 'accepted' : (isTerm ? 'rejected' : 'hold');
          var kepLabel  = isLulus ? 'Passed → Permanent' : (isTerm ? 'Terminated → Paklaring' : 'Extended');
          
          var sPerf  = ev.scorePerformance   || ev.skorKinerja      || '-';
          var sDisc  = ev.scoreDiscipline    || ev.skorKedisiplinan  || '-';
          var sComm  = ev.scoreCommunication || ev.skorKomunikasi    || '-';
          var sInit  = ev.scoreInitiative    || ev.skorInisiatif     || '-';
          var sTeam  = ev.scoreTeamwork      || ev.skorTeamwork      || '-';
          var sAvg   = ev.averageScore       || ev.nilaiRataRata     || 0;
          var sDur   = ev.extensionDuration  || ev.durasiPerpanjang  || '';
          var sStart = ev.newContractStart   || ev.kontrakBaruStart  || '-';
          var sEnd   = ev.newContractEnd     || ev.kontrakBaruEnd    || '-';
          var sNote  = ev.evaluatorNotes     || ev.catatan           || '';
          var avgNum = Number(sAvg);
          return '<div class="p-3 rounded-3 mb-3" style="background:#f9fafb;border:1px solid #e5e7eb">' +
            '<div class="d-flex justify-content-between align-items-start mb-2">' +
              '<div>' +
                '<span class="fw-bold" style="font-size:13px">#' + (idx + 1) + ' — ' + escapeHtml(formatDisplayDate(ev.evalDate)) + '</span>' +
                '<span class="text-muted ms-2" style="font-size:11px">by ' + escapeHtml(ev.evaluator || '-') + '</span>' +
              '</div>' +
              '<span class="badge-status ' + kepClass + '" style="font-size:10px;padding:2px 8px">' + escapeHtml(kepLabel) + '</span>' +
            '</div>' +
            '<div class="row g-2 mb-2" style="font-size:12px">' +
              '<div class="col-4"><div class="text-muted">Performance</div><strong>' + escapeHtml(String(sPerf)) + '</strong></div>' +
              '<div class="col-4"><div class="text-muted">Discipline</div><strong>' + escapeHtml(String(sDisc)) + '</strong></div>' +
              '<div class="col-4"><div class="text-muted">Communication</div><strong>' + escapeHtml(String(sComm)) + '</strong></div>' +
              '<div class="col-4"><div class="text-muted">Initiative</div><strong>' + escapeHtml(String(sInit)) + '</strong></div>' +
              '<div class="col-4"><div class="text-muted">Teamwork</div><strong>' + escapeHtml(String(sTeam)) + '</strong></div>' +
              '<div class="col-4"><div class="text-muted">Average</div>' +
                '<strong style="font-size:14px;color:' + (avgNum >= 7 ? '#166534' : avgNum >= 5 ? '#d97706' : '#991b1b') + '">' +
                avgNum.toFixed(1) + '</strong></div>' +
            '</div>' +
            (sNote ? '<div class="text-muted" style="font-size:11px;font-style:italic">"' + escapeHtml(sNote) + '"</div>' : '') +
            (sDur  ? '<div style="font-size:11px;color:#d97706" class="mt-1"><i class="bi bi-calendar-range me-1"></i>Extended ' + escapeHtml(sDur) + ' (' + escapeHtml(sStart) + ' – ' + escapeHtml(sEnd) + ')</div>' : '') +
          '</div>';
        }).join('');
      })
      .withFailureHandler(function(err) {
        if (bodyEl) bodyEl.innerHTML = '<div class="text-center text-muted py-4" style="font-size:13px">Gagal memuat riwayat.</div>';
      })
      .getProbationEvalHistory(employeeId);
  }

  // ============================================================
  // PDF EXPORT 1: SK PENGANGKATAN KARYAWAN TETAP (PKWTT)
  // ============================================================
  function exportSKTetapPDF(emp, evalData, result) {
    if (typeof window.jspdf === 'undefined') {
      var s = document.createElement('script');
      s.src = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
      document.head.appendChild(s);
      s.onload = function() { exportSKTetapPDF(emp, evalData, result); };
      return;
    }
    try {
      var jsPDF = window.jspdf.jsPDF;
      var doc   = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
      var pw    = doc.internal.pageSize.getWidth();
      var ph    = doc.internal.pageSize.getHeight();
      var m     = 20;
      var yPos  = m;

      var branchName = (emp && (emp.branch || emp.companyEntity || emp.branchName)) || '';
      var comp       = getCompanyProfile(branchName);

      var cNavy    = [0, 0, 0];
      var cText    = [0, 0, 0];
      var cSoft    = [0, 0, 0];

      function sf(c) { doc.setFillColor(c[0],c[1],c[2]); }
      function sd(c) { doc.setDrawColor(c[0],c[1],c[2]); }
      function st(c) { doc.setTextColor(c[0],c[1],c[2]); }
      function bold()   { doc.setFont('helvetica','bold'); }
      function normal() { doc.setFont('helvetica','normal'); }

      function fmtDateId(isoStr) {
        if (!isoStr) return '-';
        var bulan = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
        var p = String(isoStr).split('-');
        if (p.length < 3) return isoStr;
        return parseInt(p[2], 10) + ' ' + (bulan[parseInt(p[1], 10) - 1] || '') + ' ' + p[0];
      }

      function getCityFromAddress(addr) {
        var match = addr && addr.match(/Kota\s+([\w\s]+?)(,|$)/i);
        if (match && match[1]) return match[1].trim();
        match = addr && addr.match(/(\w+)\s*,\s*[A-Z]{2}\s+\d{5}/);
        if (match) return match[1].trim();
        return 'Jakarta';
      }

      var today = new Date();
      var todayStr = fmtDateId(today.toISOString().split('T')[0]);
      var yearStr  = String(today.getFullYear());

      var fullName = emp ? emp.fullName : '-';
      var position = emp ? emp.position || emp.positionCurrent || 'Jabatan' : 'Jabatan';
      var department = emp ? emp.department || 'Departemen' : 'Departemen';
      var division = emp ? emp.division || 'Divisi' : 'Divisi';
      var joinDate = emp ? fmtDateId(emp.joinDate) : '-';
      var companyName = comp.name;
      var city = getCityFromAddress(comp.address);

      // SK number from backend (already generated) or fallback
      var skNumber = result && result.skNumber ? result.skNumber : (result && result.evalId ? result.evalId : '001/HRD-PK/MSI/VII/2026');

      // ── KOP SURAT ────────────────────────────────────────────────
      yPos = renderKopSuratPDF(doc, comp, pw, m);

      // ── JUDUL ──────────────────────────────────────────────────
      yPos += 6;
      doc.setFontSize(12); bold(); st(cNavy);
      doc.text('SURAT KEPUTUSAN', pw / 2, yPos, { align: 'center' });
      yPos += 5;

      doc.setFontSize(8.5); bold(); st(cSoft);
      doc.text('Nomor: ' + skNumber, pw / 2, yPos, { align: 'center' });
      yPos += 6;

      doc.setFontSize(10); bold(); st(cNavy);
      doc.text('Perusahaan ' + companyName, pw / 2, yPos, { align: 'center' });
      yPos += 7;

      // ── MENIMBANG ──────────────────────────────────────────────
      var lblW = 30;
      var label = 'Menimbang';
      var value = 'Bahwa berdasarkan hasil evaluasi masa percobaan serta kebutuhan Perusahaan, dipandang perlu mengangkat karyawan sebagai Karyawan Tetap sesuai dengan Peraturan Perusahaan dan ketentuan peraturan perundang-undangan yang berlaku.';

      doc.setFontSize(8.5); bold(); st(cText);
      doc.text(label, m, yPos);
      normal(); st(cSoft);
      doc.text(':', m + lblW, yPos);
      st(cText);
      var valLines = doc.splitTextToSize(value, pw - m * 2 - lblW - 6);
      doc.text(valLines, m + lblW + 4, yPos);
      yPos += valLines.length * 4.5 + 2;

      // ── MENGINGAT ──────────────────────────────────────────────
      label = 'Mengingat';
      var values = [
        'Undang-Undang Ketenagakerjaan beserta peraturan pelaksanaannya.',
        'Peraturan Perusahaan ' + companyName + '.',
        'Hasil evaluasi kinerja selama masa percobaan.'
      ];
      values.forEach(function(v, idx) {
        if (idx > 0) {
          doc.setFontSize(8.5); bold(); st(cText);
          doc.text('', m, yPos);
          normal(); st(cSoft);
          doc.text(':', m + lblW, yPos);
          st(cText);
        } else {
          doc.setFontSize(8.5); bold(); st(cText);
          doc.text(label, m, yPos);
          normal(); st(cSoft);
          doc.text(':', m + lblW, yPos);
          st(cText);
        }
        var vLines = doc.splitTextToSize(v, pw - m * 2 - lblW - 6);
        doc.text(vLines, m + lblW + 4, yPos);
        yPos += vLines.length * 4.5 + 1;
      });
      yPos += 4;

      // ── MEMUTUSKAN ─────────────────────────────────────────────
      doc.setFontSize(10); bold(); st(cNavy);
      doc.text('MEMUTUSKAN', pw / 2, yPos, { align: 'center' });
      yPos += 5;

      // ── MENETAPKAN ─────────────────────────────────────────────
      doc.setFontSize(8.5); bold(); st(cText);
      doc.text('Menetapkan', m, yPos);
      normal(); st(cSoft);
      doc.text(':', m + lblW, yPos);
      yPos += 5;

      var ketetapan = 'Mengangkat ' + fullName + ' sebagai Karyawan Tetap dengan jabatan ' + position + ', Departemen ' + department + ', Divisi ' + division + ', terhitung sejak surat keputusan ini ditetapkan dan ditandatangani.';
      var ketetapanLines = doc.splitTextToSize(ketetapan, pw - m * 2 - lblW - 6);
      doc.setFontSize(8.5); bold(); st(cText);
      doc.text('', m, yPos);
      normal(); st(cSoft);
      doc.text(':', m + lblW, yPos);
      st(cText);
      doc.text(ketetapanLines, m + lblW + 4, yPos);
      yPos += ketetapanLines.length * 4.5 + 6;

      // ── PENUTUP ──────────────────────────────────────────────────
      var penutup = 'Demikian Surat Keputusan ini dibuat, untuk dilaksanakan sesuai Peraturan Perusahaan yang berlaku.';
      doc.setFontSize(8.5); normal(); st(cText);
      var penutupLines = doc.splitTextToSize(penutup, pw - m * 2);
      doc.text(penutupLines, m, yPos);
      yPos += penutupLines.length * 4.5 + 4;

      // ── TANDA TANGAN ────────────────────────────────────────────
      var sigLineW = 60;
      var sigX = pw - m - sigLineW;

      doc.setFontSize(8.5); normal(); st(cText);
      doc.text(city + ', ' + todayStr, sigX, yPos);
      yPos += 6;

      doc.setFontSize(9); normal(); st(cText);
      doc.text('Hormat Kami,', sigX, yPos);
      yPos += 5;

      doc.setFontSize(9.5); bold(); st(cNavy);
      doc.text(companyName, sigX, yPos);
      yPos += 12;

      sd([0, 0, 0]);
      doc.setLineWidth(0.4);
      doc.line(sigX, yPos, sigX + sigLineW, yPos);
      doc.setLineWidth(0.2);
      yPos += 6;

      doc.setFontSize(9.5); bold(); st(cNavy);
      doc.text('Hisar Hesti', sigX, yPos);
      yPos += 4.5;
      doc.setFontSize(8.5); normal(); st(cSoft);
      doc.text('Human Resources (HR) & Legal Manager', sigX, yPos);
      yPos += 3;



      var safeName = (emp && emp.fullName ? emp.fullName.replace(/[^a-zA-Z0-9 ]/g,'').replace(/\s+/g,'_') : 'Karyawan');
      var fileName = 'SK_Tetap_' + safeName + '_' + (result.evalId || '').replace(/[^a-zA-Z0-9]/g,'') + '.pdf';
      doc.save(fileName);
      showToast('SK Pengangkatan Tetap berhasil diunduh: ' + fileName, 'success');
    } catch(err) {
      console.error('SK Tetap PDF Error:', err);
      showToast('Gagal generate SK Tetap PDF: ' + err.message, 'error');
    }
  }

  // ============================================================
  // PDF EXPORT 2: SURAT KETERANGAN KERJA (PAKLARING)
  // ============================================================
  function exportPaklaringPDF(emp, evalData, result) {
    if (typeof window.jspdf === 'undefined') {
      var s = document.createElement('script');
      s.src = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
      document.head.appendChild(s);
      s.onload = function() { exportPaklaringPDF(emp, evalData, result); };
      return;
    }
    try {
      var jsPDF = window.jspdf.jsPDF;
      var doc   = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
      var pw    = doc.internal.pageSize.getWidth();
      var ph    = doc.internal.pageSize.getHeight();
      var m     = 20;
      var yPos  = m;

      var branchName = (emp && (emp.branch || emp.companyEntity || emp.branchName)) || '';
      var comp       = getCompanyProfile(branchName);

      var cNavy    = comp.navy;
      var cText    = [31, 41, 55];
      var cSoft    = [107, 114, 128];

      function sd(c) { doc.setDrawColor(c[0],c[1],c[2]); }
      function st(c) { doc.setTextColor(c[0],c[1],c[2]); }
      function bold()   { doc.setFont('helvetica','bold'); }
      function normal() { doc.setFont('helvetica','normal'); }

      function fmtDateId(isoStr) {
        if (!isoStr) return '-';
        var bulan = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
        var p = String(isoStr).split('-');
        if (p.length < 3) return isoStr;
        return parseInt(p[2], 10) + ' ' + (bulan[parseInt(p[1], 10) - 1] || '') + ' ' + p[0];
      }

      var today = new Date();
      var bulanArr = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
      var todayStr = today.getDate() + ' ' + bulanArr[today.getMonth()] + ' ' + today.getFullYear();

      // ── KOP SURAT ────────────────────────────────────────────────
      yPos = renderKopSuratPDF(doc, comp, pw, m);

      // ── JUDUL SURAT KETERANGAN KERJA ───────────────────────────
      yPos += 6;
      doc.setFontSize(12.5); bold(); st(cNavy);
      doc.text('SURAT KETERANGAN KERJA', pw / 2, yPos, { align: 'center' });
      yPos += 7;

      // ── PEMBUKA ────────────────────────────────────────────────
      doc.setFontSize(9); normal(); st(cText);
      doc.text('Yang bertandatangan di bawah ini:', m, yPos);
      yPos += 5;

      // Signer table
      var signerRows = [
        ['Nama', 'Hisar Hesti'],
        ['Jabatan', 'Human Resources (HR) & Legal Manager']
      ];
      var lblW = 30;
      signerRows.forEach(function(f) {
        doc.setFontSize(8.5); bold(); st(cText);
        doc.text(f[0], m, yPos);
        normal(); st(cSoft);
        doc.text(':', m + lblW, yPos);
        st(cText);
        doc.text(f[1], m + lblW + 4, yPos);
        yPos += 5.5;
      });
      yPos += 3;

      doc.setFontSize(9); normal(); st(cText);
      doc.text('Dengan ini menerangkan bahwa:', m, yPos);
      yPos += 5;

      // Employee name
      var empName = emp && emp.fullName ? emp.fullName : '-';
      doc.setFontSize(8.5); bold(); st(cText);
      doc.text('Nama', m, yPos);
      normal(); st(cSoft);
      doc.text(':', m + lblW, yPos);
      st(cText);
      doc.text(empName, m + lblW + 4, yPos);
      yPos += 7;

      // ── PARAGRAF UTAMA ───────────────────────────────────────────
      doc.setFontSize(9); normal(); st(cText);

      var joinDateStr = emp && emp.joinDate ? fmtDateId(emp.joinDate) : '-';
      var positionStr = emp && (emp.position || emp.positionCurrent) ? (emp.position || emp.positionCurrent) : 'Karyawan';
      var endDateStr = emp && (emp.lastWorkingDate || emp.resignDate) ? fmtDateId(emp.lastWorkingDate || emp.resignDate) : todayStr;

      var para1 = 'Telah bekerja di ' + comp.name + ' terhitung sejak ' + joinDateStr + ' dengan jabatan terakhir sebagai ' + positionStr + '. Masa kerja di ' + comp.name + ' telah berakhir pada tanggal ' + endDateStr + '.';
      var para1Lines = doc.splitTextToSize(para1, pw - m * 2);
      doc.text(para1Lines, m, yPos);
      yPos += para1Lines.length * 4.8 + 5;

      var para2 = 'Demikian surat keterangan ini dibuat dan digunakan sebagaimana mestinya.';
      var para2Lines = doc.splitTextToSize(para2, pw - m * 2);
      doc.text(para2Lines, m, yPos);
      yPos += para2Lines.length * 4.8 + 8;

      // ── TANDA TANGAN ─────────────────────────────────────────────
      var sigLineW = 60;
      var sigX = pw - m - sigLineW;

      doc.setFontSize(8.5); normal(); st(cText);
      doc.text('Jakarta, ' + todayStr, sigX, yPos);
      yPos += 6;

      doc.setFontSize(9); normal(); st(cText);
      doc.text('Hormat Kami,', sigX, yPos);
      yPos += 14;

      sd([0, 0, 0]);
      doc.setLineWidth(0.4);
      doc.line(sigX, yPos, sigX + sigLineW, yPos);
      doc.setLineWidth(0.2);
      yPos += 6;

      doc.setFontSize(9.5); bold(); st(cNavy);
      doc.text('Hisar Hesti', sigX, yPos);
      yPos += 4.5;
      doc.setFontSize(8.5); normal(); st(cSoft);
      doc.text('HR & Legal Manager', sigX, yPos);
      yPos += 3;



      var safeName = (emp && emp.fullName ? emp.fullName.replace(/[^a-zA-Z0-9 ]/g,'').replace(/\s+/g,'_') : 'Karyawan');
      var fileName = 'Paklaring_' + safeName + '_' + (result.evalId || '').replace(/[^a-zA-Z0-9]/g,'') + '.pdf';
      doc.save(fileName);
      showToast('Surat Keterangan Kerja (Paklaring) berhasil diunduh: ' + fileName, 'success');
    } catch(err) {
      console.error('Paklaring PDF Error:', err);
      showToast('Gagal generate Paklaring PDF: ' + err.message, 'error');
    }
  }
</script>
