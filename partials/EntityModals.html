<!-- ===== EMPLOYEE FORM MODAL (Add / Edit) ===== -->
<div class="modal fade" id="empFormModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-xl modal-dialog-centered modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h6 class="modal-title fw-bold" id="empFormTitle">Tambah Karyawan</h6>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="efId" />

        <!-- ── SEKSI: Data Pribadi ── -->
        <p class="fw-bold mb-2 mt-1" style="font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:#eb1c24;">
          <i class="bi bi-person-fill me-1"></i> Data Pribadi
        </p>
        <div class="row g-3 mb-3">
          <div class="col-md-6">
            <label class="form-label fw-semibold">Nama Lengkap *</label>
            <input type="text" class="form-control" id="efName" />
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold">NIK</label>
            <input type="text" class="form-control" id="efNik" maxlength="16" placeholder="16 digit" />
          </div>
          <div class="col-md-4">
            <label class="form-label fw-semibold">Tanggal Lahir</label>
            <input type="date" class="form-control" id="efBirthDate" />
          </div>
          <div class="col-md-4">
            <label class="form-label fw-semibold">Usia</label>
            <input type="number" class="form-control" id="efAge" min="17" max="99" />
          </div>
          <div class="col-md-4">
            <label class="form-label fw-semibold">Jenis Kelamin</label>
            <select class="form-select" id="efGender">
              <option value="">— Pilih —</option>
              <option value="Male">Male</option>
              <option value="Female">Female</option>
            </select>
          </div>
          <div class="col-md-4">
            <label class="form-label fw-semibold">Status Pernikahan</label>
            <select class="form-select" id="efMarital">
              <option value="">— Pilih —</option>
              <option value="Single">Single</option>
              <option value="Married">Married</option>
              <option value="Divorced">Divorced</option>
              <option value="Widowed">Widowed</option>
            </select>
          </div>
          <div class="col-md-4">
            <label class="form-label fw-semibold">Email</label>
            <input type="email" class="form-control" id="efEmail" />
          </div>
          <div class="col-md-4">
            <label class="form-label fw-semibold">No. Handphone</label>
            <input type="text" class="form-control" id="efPhone" placeholder="628xxx" />
          </div>
          <div class="col-md-8">
            <label class="form-label fw-semibold">Alamat</label>
            <input type="text" class="form-control" id="efAddress" />
          </div>
          <div class="col-md-4">
            <label class="form-label fw-semibold">Kecamatan / Distrik</label>
            <input type="text" class="form-control" id="efDistrict" />
          </div>
          <div class="col-md-4">
            <label class="form-label fw-semibold">Kota / Kabupaten</label>
            <input type="text" class="form-control" id="efCity" />
          </div>
          <div class="col-md-4">
            <label class="form-label fw-semibold">Pendidikan Terakhir</label>
            <select class="form-select" id="efEducation"><option value="">— Pilih —</option></select>
          </div>
          <div class="col-md-4">
            <label class="form-label fw-semibold">Pengalaman Kerja</label>
            <select class="form-select" id="efWorkExp"><option value="">— Pilih —</option></select>
          </div>
        </div>

        <hr class="my-2" />

        <!-- ── SEKSI: Data Pekerjaan ── -->
        <p class="fw-bold mb-2" style="font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:#eb1c24;">
          <i class="bi bi-briefcase-fill me-1"></i> Data Pekerjaan
        </p>
        <div class="row g-3 mb-3">
          <div class="col-md-4">
            <label class="form-label fw-semibold">Entitas Perusahaan</label>
            <select class="form-select" id="efCompanyEntity"><option value="">— Pilih —</option></select>
          </div>

            <label class="form-label fw-semibold">Tipe Karyawan</label>
            <select class="form-select" id="efType"><option value="">— Pilih —</option></select>
          </div>

            <label class="form-label fw-semibold">Status Kepegawaian</label>

              <option value="Resigned">Resigned</option>
              <option value="Terminated">Terminated</option>
              <option value="Inactive">Inactive</option>

          <div class="col-md-4">
            <label class="form-label fw-semibold">Departemen</label>
            <select class="form-select" id="efDept"><option value="">— Pilih —</option></select>
          </div>
          <div class="col-md-4">
            <label class="form-label fw-semibold">Divisi</label>
            <input type="text" class="form-control" id="efDivision" />
          </div>
          <div class="col-md-4">
            <label class="form-label fw-semibold">Cabang</label>
            <input type="text" class="form-control" id="efBranch" />
          </div>
          <div class="col-md-4">
            <label class="form-label fw-semibold">Posisi</label>
            <select class="form-select" id="efPos"><option value="">— Pilih —</option></select>
          </div>
          <div class="col-md-4">
            <label class="form-label fw-semibold">Tanggal Masuk</label>
            <input type="date" class="form-control" id="efJoin" />
          </div>
          <div class="col-md-4">
            <label class="form-label fw-semibold">Sumber Rekrutmen</label>
            <select class="form-select" id="efRecruitSource"><option value="">— Pilih —</option></select>
          </div>
        </div>

        <hr class="my-2" />

        <!-- ── SEKSI: Data Kontrak & Gaji ── -->
        <p class="fw-bold mb-2" style="font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:#eb1c24;">
          <i class="bi bi-file-earmark-text-fill me-1"></i> Kontrak &amp; Gaji
        </p>
        <div class="row g-3 mb-3">
          <div class="col-md-4">
            <label class="form-label fw-semibold">Status Employment</label>
            <select class="form-select" id="efEmpStatus"><option value="">— Pilih —</option></select>
          </div>
          <div class="col-md-4">
            <label class="form-label fw-semibold">Mulai Kontrak</label>
            <input type="date" class="form-control" id="efContractStart" />
          </div>
          <div class="col-md-4">
            <label class="form-label fw-semibold">Akhir Kontrak</label>
            <input type="date" class="form-control" id="efContractEnd" />
          </div>
          <div class="col-md-4">
            <label class="form-label fw-semibold">Durasi Kontrak</label>
            <select class="form-select" id="efContractDuration"><option value="">— Pilih —</option></select>
          </div>
          <div class="col-md-4">
            <label class="form-label fw-semibold">No. Kontrak</label>
            <input type="text" class="form-control" id="efContractNumber" />
          </div>
          <div class="col-md-4">
            <label class="form-label fw-semibold">Outsource Vendor</label>
            <input type="text" class="form-control" id="efOutsourceVendor" />
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold">Gaji</label>
            <input type="number" class="form-control" id="efSalary" min="0" placeholder="Nominal angka" />
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold">Tipe Gaji</label>
            <select class="form-select" id="efSalaryType"><option value="">— Pilih —</option></select>
          </div>
        </div>

        <hr class="my-2" />

        <!-- ── SEKSI: Catatan ── -->
        <p class="fw-bold mb-2" style="font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:#eb1c24;">
          <i class="bi bi-chat-text-fill me-1"></i> Catatan
        </p>
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label fw-semibold">Catatan HR</label>
            <textarea class="form-control" id="efHrNotes" rows="2"></textarea>
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold">Catatan Umum</label>
            <textarea class="form-control" id="efNotes" rows="2"></textarea>
          </div>
        </div>

      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-light btn-sm fw-semibold" data-bs-dismiss="modal">Batal</button>
        <button type="button" class="btn btn-primary btn-sm fw-semibold" id="btnEmpSave"
          style="background:#eb1c24;border:none;">
          <i class="bi bi-check2-circle me-1"></i> Simpan
        </button>
      </div>
    </div>
  </div>
</div>

<!-- ===== MASTER DATA ITEM MODAL (Add / Edit) ===== -->
<div class="modal fade" id="mdItemModal" tabindex="-1" aria-labelledby="mdItemModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content" style="border-radius:12px;box-shadow:0 8px 40px rgba(0,0,0,0.12);">

        <h6 class="modal-title fw-bold" id="mdItemModalLabel">Tambah Item</h6>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Tutup"></button>
      </div>
      <div class="modal-body" style="padding:20px;">
        <input type="hidden" id="mdItemId" />
        <div class="mb-3">
          <label class="form-label fw-semibold" style="font-size:13px;">
            Kategori <span class="text-danger">*</span>
          </label>
          <select class="form-select" id="mdItemCategory" style="font-size:13px;">
            <option value="">— Pilih Kategori —</option>
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold" style="font-size:13px;">
            Nama <span class="text-danger">*</span>
          </label>
          <input type="text" class="form-control" id="mdItemName" placeholder="Nama item" style="font-size:13px;" />
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold" style="font-size:13px;">Deskripsi</label>
          <input type="text" class="form-control" id="mdItemDesc" placeholder="Deskripsi singkat (opsional)" style="font-size:13px;" />
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold" style="font-size:13px;">Urutan</label>
          <input type="number" class="form-control" id="mdItemOrder" min="1" value="1" style="font-size:13px;width:100px;" />
        </div>
      </div>
      <div class="modal-footer" style="border-top:1px solid var(--border-color,#f0f0f0);padding:12px 20px;">
        <button type="button" class="btn btn-light btn-sm fw-semibold" data-bs-dismiss="modal">Batal</button>
        <button type="button" class="btn btn-primary btn-sm fw-semibold" id="btnMdSaveItem"
          style="background:#eb1c24;border:none;">
          <i class="bi bi-check2-circle me-1"></i> Simpan
        </button>
      </div>
    </div>
  </div>
</div>

<!-- ===== USER MANAGEMENT MODAL (Add / Edit) ===== -->
<div class="modal fade" id="userModal" tabindex="-1" aria-labelledby="userModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header border-0">
        <h5 class="modal-title fw-bold" id="userModalLabel">Tambah Pengguna</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Tutup"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3">
          <label for="userEmail" class="form-label fw-semibold">
            Email Google <span class="text-danger">*</span>
          </label>
          <input type="email" class="form-control" id="userEmail"
            placeholder="contoh@google.com" required />
          <div class="form-text">Gunakan alamat email Google aktif pengguna.</div>
        </div>
        <div class="mb-3">
          <label for="userFullName" class="form-label fw-semibold">
            Nama Lengkap <span class="text-danger">*</span>
          </label>
          <input type="text" class="form-control" id="userFullName"
            placeholder="Nama lengkap pengguna" required />
        </div>
        <div class="mb-3">
          <label for="userRole" class="form-label fw-semibold">Role</label>
          <select class="form-select" id="userRole">
            <option value="Viewer">Viewer — Hanya melihat data</option>
            <option value="Manager">Manager — Melihat & export data</option>
            <option value="Recruiter">Recruiter — Kelola kandidat</option>
            <option value="HR Admin">HR Admin — Akses penuh (kecuali user)</option>
            <option value="Super Admin">Super Admin — Akses penuh termasuk user</option>
          </select>
        </div>
      </div>
      <div class="modal-footer border-0">
        <button type="button" class="btn btn-light" data-bs-dismiss="modal">Batal</button>
        <button type="button" class="btn btn-primary" id="saveUserBtn" onclick="UserManagement.save()">
          <i class="bi bi-check-lg"></i> Simpan
        </button>
      </div>
    </div>
  </div>
</div>
