  <div class="emp-ct">

    </div>
    <div class="emp-hdr">
      <div>
        <h4><i class="bi bi-people-fill me-2"></i>Manajemen Karyawan</h4>
        <small class="text-muted">Data master karyawan aktif</small>

      <div style="display:flex;gap:8px;">
        <button class="btn-eo" id="btnEmpRefresh" type="button"><i class="bi bi-arrow-clockwise"></i></button>

      </div>
    </div>
    <div class="emp-card"><div class="emp-card-body"><div class="emp-stats" id="empStats"></div></div></div>
    <div class="emp-card">
      <div class="emp-card-hdr">
        <h6><i class="bi bi-list-ul"></i> Daftar Karyawan</h6>
        <div class="text-muted small" id="empCnt">0 karyawan</div>
      </div>
      <div class="emp-tb">
        <div class="emp-srch"><i class="bi bi-search"></i><input type="text" id="empQ" placeholder="Cari nama, NIK, email..." /></div>
        <div class="emp-flt">
          <select id="fDept"><option value="">Semua Dept</option></select>
          <select id="fSt"><option value="">Semua Status</option><option value="Active">Active</option><option value="Inactive">Inactive</option></select>
          <select id="fType"><option value="">Semua Tipe</option></select>
        </div>
      </div>
      <div class="emp-card-body">
        <div style="overflow-x:auto;">
          <table class="emp-tbl"><thead><tr>
            <th>Karyawan</th><th>Dept</th><th>Posisi</th><th>Lokasi</th><th>Tipe</th><th>Status</th>
          </tr></thead><tbody id="empTB"></tbody></table>
        </div>
        <div class="emp-empty" id="empEmp" style="display:none;"><i class="bi bi-people"></i><div>Belum ada data karyawan.</div></div>
      </div>
    </div>
  </div>

  <!-- Detail Modal -->
  <div class="modal fade" id="empDetModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
      <div class="modal-content" style="border-radius:12px;">
        <div class="modal-header" style="border-bottom:1px solid #f0f0f0;padding:16px 20px;">
          <h6 class="modal-title fw-bold" id="empDetTitle">Detail Karyawan</h6>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" id="empDetBody" style="padding:20px;"></div>
        <div class="modal-footer" style="border-top:1px solid #f0f0f0;padding:12px 20px;">
          <button type="button" class="btn btn-danger btn-sm fw-semibold" id="btnEmpDel" style="border:none;"><i class="bi bi-trash3 me-1"></i>Hapus</button>
          <div style="flex:1;"></div>
          <button type="button" class="btn btn-light btn-sm fw-semibold" data-bs-dismiss="modal">Tutup</button>
          <button type="button" class="btn btn-primary btn-sm fw-semibold" id="btnEmpEdit" style="background:#005BAC;border:none;"><i class="bi bi-pencil me-1"></i>Edit</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Form Modal -->
  <div class="modal fade" id="empFormModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content" style="border-radius:12px;">
        <div class="modal-header" style="border-bottom:1px solid #f0f0f0;padding:16px 20px;">
          <h6 class="modal-title fw-bold" id="empFormTitle">Tambah Karyawan</h6>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" style="padding:20px;">
          <input type="hidden" id="efId" />
          <div class="row g-3">
            <div class="col-md-6"><label class="form-label fw-semibold" style="font-size:13px;">Nama Lengkap *</label><input type="text" class="form-control" id="efName" style="font-size:13px;" /></div>
            <div class="col-md-6"><label class="form-label fw-semibold" style="font-size:13px;">NIK</label><input type="text" class="form-control" id="efNik" style="font-size:13px;" /></div>
            <div class="col-md-6"><label class="form-label fw-semibold" style="font-size:13px;">Email</label><input type="email" class="form-control" id="efEmail" style="font-size:13px;" /></div>
            <div class="col-md-6"><label class="form-label fw-semibold" style="font-size:13px;">No. Handphone</label><input type="text" class="form-control" id="efPhone" style="font-size:13px;" /></div>

            <div class="col-md-6"><label class="form-label fw-semibold" style="font-size:13px;">Posisi</label><select class="form-select" id="efPos" style="font-size:13px;"><option value="">— Pilih —</option></select></div>
            <div class="col-md-6"><label class="form-label fw-semibold" style="font-size:13px;">Lokasi Kerja</label><select class="form-select" id="efLoc" style="font-size:13px;"><option value="">— Pilih —</option></select></div>
            <div class="col-md-6"><label class="form-label fw-semibold" style="font-size:13px;">Tipe Karyawan</label><select class="form-select" id="efType" style="font-size:13px;"><option value="">— Pilih —</option></select></div>
            <div class="col-md-6"><label class="form-label fw-semibold" style="font-size:13px;">Tanggal Masuk</label><input type="date" class="form-control" id="efJoin" style="font-size:13px;" /></div>
            <div class="col-md-6"><label class="form-label fw-semibold" style="font-size:13px;">Status</label><select class="form-select" id="efStatus" style="font-size:13px;"><option value="Active">Active</option><option value="Inactive">Inactive</option></select></div>
            <div class="col-12"><label class="form-label fw-semibold" style="font-size:13px;">Catatan HR</label><textarea class="form-control" id="efNotes" rows="2" style="font-size:13px;"></textarea></div>
          </div>
        </div>
        <div class="modal-footer" style="border-top:1px solid #f0f0f0;padding:12px 20px;">
          <button type="button" class="btn btn-light btn-sm fw-semibold" data-bs-dismiss="modal">Batal</button>
          <button type="button" class="btn btn-primary btn-sm fw-semibold" id="btnEmpSave" style="background:#005BAC;border:none;"><i class="bi bi-check2-circle me-1"></i>Simpan</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="position-fixed bottom-0 end-0 p-3" style="z-index:9999;">
    <div id="empToast" class="toast align-items-center border-0 shadow" role="alert"><div class="d-flex"><div class="toast-body" id="empToastB"></div><button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button></div></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    function empToast(m,t){var e=document.getElementById('empToast');document.getElementById('empToastB').textContent=m;e.className='toast align-items-center border-0 shadow text-bg-'+(t||'primary');new bootstrap.Toast(e,{delay:3500}).show();}
  </script>
