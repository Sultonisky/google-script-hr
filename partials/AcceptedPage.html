<!-- partials/AcceptedPage.html — Halaman Kandidat Accepted (independen) -->
<section class="page-section" id="pageAccepted">

  <!-- Stat card -->
  <div class="row g-3 mb-4">
    <div class="col-6 col-md-4">
      <div class="stat-card">
        <div class="stat-icon bg-green"><i class="bi bi-check-circle-fill"></i></div>
        <div><div class="stat-label">Total Diterima</div><div class="stat-value" id="accStatTotal">0</div></div>
      </div>
    </div>
    <div class="col-6 col-md-4">
      <div class="stat-card">
        <div class="stat-icon bg-blue"><i class="bi bi-file-earmark-text-fill"></i></div>
        <div><div class="stat-label">Total Offering Letter</div><div class="stat-value" id="accStatOffering">0</div></div>
      </div>
    </div>
    <div class="col-6 col-md-4">
      <div class="stat-card">
        <div class="stat-icon bg-navy"><i class="bi bi-file-earmark-check-fill"></i></div>
        <div><div class="stat-label">Kontrak PKWT Selesai</div><div class="stat-value" id="accStatOnboarding">0</div></div>
      </div>
    </div>
  </div>

  <!-- Table panel -->
  <div class="panel" id="accTablePanel">
    <div class="panel-header">
      <div>
        <h6>Kandidat Diterima</h6>
        <div class="panel-subtitle" id="accPanelSubtitle">Memuat data...</div>
      </div>
      <div class="export-btns">
        <button class="btn-refresh" id="btnAccRefresh" type="button" title="Muat ulang">
          <i class="bi bi-arrow-clockwise"></i>
        </button>
        <button class="btn btn-sm text-white ms-2" style="background:var(--color-primary);border:none;border-radius:8px;padding:6px 14px;font-size:13px" id="btnOpenOfferingModal" type="button">
          <i class="bi bi-file-earmark-text me-1"></i>Buat Offering Letter
        </button>
        <button class="btn btn-sm text-white ms-2" style="background:#166534;border:none;border-radius:8px;padding:6px 14px;font-size:13px" id="btnOpenOnboardingModal" type="button">
          <i class="bi bi-file-earmark-check-fill me-1"></i>Proses Kontrak PKWT
        </button>
      </div>
    </div>

    <!-- Filter bar -->
    <div class="filter-bar">
      <div class="table-search">
        <i class="bi bi-search"></i>
        <input type="text" id="accSearchInput" placeholder="Cari ID, nama, posisi, Employee ID..." />
      </div>
      <select class="filter-select" id="accPositionFilter">
        <option value="">Semua Posisi</option>
      </select>
      <select class="filter-select" id="accSortSelect">
        <option value="newest">Terbaru</option>
        <option value="oldest">Terlama</option>
        <option value="name_asc">Nama A-Z</option>
        <option value="name_desc">Nama Z-A</option>
      </select>
      <button class="btn-reset-filter" type="button" id="btnAccReset">
        <i class="bi bi-arrow-counterclockwise"></i> Reset
      </button>
    </div>

    <!-- Table -->
    <div class="table-responsive">
      <table class="table hr-table">
        <thead>
          <tr>
            <th>Avatar</th>
            <th>Recruitment ID</th>
            <th>Kandidat</th>
            <th>Usia</th>
            <th>Posisi</th>
            <th>Offering Letter</th>
            <th>Tgl Diterima</th>
            <th>Diproses Oleh</th>
            <th>Aksi</th>
          </tr>
        </thead>
        <tbody id="accTableBody"></tbody>
      </table>
      <div class="table-loading" id="accTableLoading">
        <div class="spinner-border" role="status"></div>
        <p>Mengambil data...</p>
      </div>
      <div class="table-empty d-none" id="accTableEmpty">
        <i class="bi bi-inbox"></i>
        <p>Belum ada kandidat dengan status Accepted.</p>
      </div>
    </div>

    <div class="panel-footer">
      <span id="accFooterCount">Menampilkan 0 data</span>
      <nav class="pagination-ui" id="accPaginationUi" aria-label="Accepted Pagination"></nav>
    </div>
  </div>
</section>
