<!-- partials/EmployeeContent.html — EMPLOYEE PAGE CONTENT (for SPA include) -->
<!-- Contains only the body content; scripts & styles are loaded by Dashboard.html -->

<!-- Stat Cards — ditampilkan di atas tabel -->
<div class="row g-3 mb-4" id="employeeStatsPanel">
  <div class="col-6 col-md-4">
    <div class="stat-card">
      <div class="stat-icon bg-blue"><i class="bi bi-people-fill"></i></div>
      <div>
        <div class="stat-label">Total Karyawan</div>
        <div class="stat-value" data-current="0" id="empStatTotal">0</div>
      </div>
    </div>
  </div>
  <div class="col-6 col-md-4">
    <div class="stat-card">
      <div class="stat-icon bg-green"><i class="bi bi-check-circle-fill"></i></div>
      <div>
        <div class="stat-label">Active</div>
        <div class="stat-value" data-current="0" id="empStatActive">0</div>
      </div>
    </div>
  </div>
  <div class="col-6 col-md-4">
    <div class="stat-card">
      <div class="stat-icon bg-red"><i class="bi bi-slash-circle-fill"></i></div>
      <div>
        <div class="stat-label">Inactive</div>
        <div class="stat-value" data-current="0" id="empStatInactive">0</div>
      </div>
    </div>
  </div>
</div>

<div class="panel" id="employeePanel">
  <div class="panel-header">
    <div>
      <h6>Daftar Karyawan</h6>
      <div class="panel-subtitle" id="empPanelSubtitle">Memuat data...</div>
    </div>
    <div class="export-btns">
      <button class="btn-export" style="background:var(--color-primary);color:#fff;border:1px solid var(--color-primary);"
        type="button" id="btnEmpAdd">
        <i class="bi bi-plus-lg"></i> Tambah
      </button>
      <button class="btn-export csv" id="btnEmpExportCsv" type="button">
        <i class="bi bi-filetype-csv"></i> CSV
      </button>
      <button class="btn-export xlsx" id="btnEmpExportXlsx" type="button">
        <i class="bi bi-file-earmark-excel"></i> Excel
      </button>
    </div>
  </div>

  <!-- FILTER BAR -->
  <div class="filter-bar">
    <div class="table-search">
      <i class="bi bi-search"></i>
      <input type="text" id="empSearchInput" placeholder="Cari nama, NIK, email, posisi, dept..." />
    </div>
    <select class="filter-select" id="empDeptFilter">
      <option value="">Semua Dept</option>
    </select>
    <select class="filter-select" id="empTypeFilter">
      <option value="">Semua Tipe</option>
    </select>
    <select class="filter-select" id="empStatusFilter">
      <option value="">Semua Status</option>
      <option value="Active">Active</option>
      <option value="Inactive">Inactive</option>
    </select>
    <select class="filter-select" id="empSortSelect">
      <option value="newest">Terbaru</option>
      <option value="oldest">Terlama</option>
      <option value="name_asc">Nama A-Z</option>
      <option value="name_desc">Nama Z-A</option>
    </select>
    <button class="btn-refresh" id="btnEmpRefresh" type="button" title="Muat ulang data">
      <i class="bi bi-arrow-clockwise"></i>
    </button>
  </div>

  <!-- TABLE -->
  <div class="table-responsive">
    <table class="table hr-table">
      <thead>
        <tr>
          <th>Avatar</th>
          <th>Employee ID</th>
          <th>Karyawan</th>
          <th>NIK</th>
          <th>Departemen</th>
          <th>Posisi</th>
          <th>Tipe</th>
          <th>Status</th>
          <th>Tanggal Masuk</th>
        </tr>
      </thead>
      <tbody id="empTableBody"></tbody>
    </table>
    <div class="table-loading" id="empTableLoading">
      <div class="spinner-border" role="status"></div>
      <p>Mengambil data dari spreadsheet...</p>
    </div>
    <div class="table-empty d-none" id="empTableEmpty">
      <i class="bi bi-inbox"></i>
      <p>Belum ada data karyawan.</p>
    </div>
  </div>

  <div class="panel-footer">
    <span id="empFooterCount">Menampilkan 0 data</span>
    <nav class="pagination-ui" id="empPaginationUi" aria-label="Pagination"></nav>
  </div>
</div>

<!-- Form Modal (Add / Edit) — detail sekarang di drawer bersama -->
<div class="modal fade" id="empFormModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h6 class="modal-title fw-bold" id="empFormTitle">Tambah Karyawan</h6>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="efId" />
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label fw-semibold">Nama Lengkap *</label>
            <input type="text" class="form-control" id="efName" />
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold">NIK</label>
            <input type="text" class="form-control" id="efNik" />
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold">Email</label>
            <input type="email" class="form-control" id="efEmail" />
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold">No. Handphone</label>
            <input type="text" class="form-control" id="efPhone" />
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold">Departemen</label>
            <select class="form-select" id="efDept"><option value="">— Pilih —</option></select>
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold">Posisi</label>
            <select class="form-select" id="efPos"><option value="">— Pilih —</option></select>
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold">Lokasi Kerja</label>
            <select class="form-select" id="efLoc"><option value="">— Pilih —</option></select>
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold">Tipe Karyawan</label>
            <select class="form-select" id="efType"><option value="">— Pilih —</option></select>
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold">Tanggal Masuk</label>
            <input type="date" class="form-control" id="efJoin" />
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold">Status</label>
            <select class="form-select" id="efStatus">
              <option value="Active">Active</option>
              <option value="Inactive">Inactive</option>
            </select>
          </div>
          <div class="col-12">
            <label class="form-label fw-semibold">Catatan HR</label>
            <textarea class="form-control" id="efNotes" rows="2"></textarea>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-light btn-sm fw-semibold" data-bs-dismiss="modal">Batal</button>
        <button type="button" class="btn btn-primary btn-sm fw-semibold" id="btnEmpSave"
          style="background:#005bac;border:none;">
          <i class="bi bi-check2-circle me-1"></i> Simpan
        </button>
      </div>
    </div>
  </div>
</div>
