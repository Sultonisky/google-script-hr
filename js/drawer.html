<script>
  // ============================================================
  // js/drawer.html — SHARED PROFILE DRAWER
  // Modes: "candidate" | "employee" | "outsource"
  // Depends on: helpers.html, filters.html, api.html
  // ============================================================

  var activeCandidateId  = null;
  var notesAutoSaveTimer = null;
  var drawerOverlay      = null;
  var drawerPanel        = null;

  // ---- Open / Close ----
  function openDrawer() {
    if (drawerOverlay) drawerOverlay.classList.add('show');
    if (drawerPanel)   drawerPanel.classList.add('show');
    document.body.style.overflow = 'hidden';
  }

  function closeDrawer() {
    if (drawerOverlay) drawerOverlay.classList.remove('show');
    if (drawerPanel)   drawerPanel.classList.remove('show');
    document.body.style.overflow = '';
  }

  // ---- Switch drawer mode ----
  // mode: 'candidate' | 'employee' | 'outsource'
  function setDrawerMode(mode) {
    if (drawerPanel) drawerPanel.setAttribute('data-mode', mode);

    // Toggle body sections via .active class (not inline style — avoids CSS specificity conflict)
    ['Candidate', 'Employee', 'Outsource'].forEach(function(m) {
      var sec = document.getElementById('drawerSection' + m);
      if (!sec) return;
      if (m.toLowerCase() === mode) {
        sec.classList.add('active');
      } else {
        sec.classList.remove('active');
      }
    });

    // Footer
    var footerCand   = document.getElementById('drawerFooterCandidate');
    var footerEntity = document.getElementById('drawerFooterEntity');
    if (footerCand)   footerCand.style.display   = (mode === 'candidate') ? '' : 'none';
    if (footerEntity) footerEntity.style.display = (mode !== 'candidate') ? '' : 'none';

    // Header buttons
    var btnPrint = document.getElementById('btnDrawerPrint');
    var btnEdit  = document.getElementById('btnDrawerEdit');
    if (btnPrint) btnPrint.style.display = (mode === 'candidate') ? '' : 'none';
    if (btnEdit)  btnEdit.style.display  = (mode !== 'candidate') ? '' : 'none';
  }

  // ---- Set header meta row ----
  function setDrawerMeta(items) {
    // items: [{label, value}, ...]
    var el = document.getElementById('drawerIdMeta');
    if (!el) return;
    el.innerHTML = items.map(function(item) {
      return '<span>' + escapeHtml(item.label) + '<strong>' + escapeHtml(item.value) + '</strong></span>';
    }).join('');
  }

  function drawerTextValue(value) {
    if (value === null || value === undefined) return '-';
    var text = String(value).trim();
    return text ? text : '-';
  }

  function drawerAgeValue(value) {
    return drawerTextValue(value) === '-' ? '-' : String(value).trim() + ' Tahun';
  }

  function drawerGenderValue(value) {
    if (value === 'Male') return 'Laki-laki';
    if (value === 'Female') return 'Perempuan';
    return drawerTextValue(value);
  }

  function setDrawerText(id, value) {
    var el = document.getElementById(id);
    if (el) el.innerText = drawerTextValue(value);
  }

  function setDrawerMoney(id, value) {
    var el = document.getElementById(id);
    if (!el) return;
    if (value === null || value === undefined || String(value).trim() === '') {
      el.innerText = '-';
      return;
    }
    el.innerText = formatRupiah(value);
  }

  function renderOffboardingDocsHtml(emp) {
    var docs = (emp && emp.offboardingDocuments) || [];
    var folder = emp && emp.offboardingDocumentsFolder;
    if ((!docs || !docs.length) && !folder) {
      return '-';
    }
    var html = '';
    if (folder) {
      html += '<div class="mb-2"><a href="' + escapeHtml(folder) +
        '" target="_blank" rel="noopener"><i class="bi bi-folder2-open me-1"></i>Buka folder Drive</a></div>';
    }
    if (docs && docs.length) {
      html += '<ul class="list-unstyled mb-0" style="font-size:13px">';
      docs.forEach(function(doc) {
        var label = (doc.type || 'Dokumen') + ' — ' + (doc.fileName || doc.driveFileName || 'file');
        if (doc.url) {
          html += '<li class="mb-1"><a href="' + escapeHtml(doc.url) +
            '" target="_blank" rel="noopener"><i class="bi bi-file-earmark-arrow-down me-1"></i>' +
            escapeHtml(label) + '</a></li>';
        } else {
          html += '<li class="mb-1">' + escapeHtml(label) + '</li>';
        }
      });
      html += '</ul>';
    }
    return html || '-';
  }

  function setDrawerHtml(id, html) {
    var el = document.getElementById(id);
    if (el) el.innerHTML = html || '-';
  }

  // ============================================================
  // MODE: CANDIDATE
  // ============================================================
  function renderTimeline(items, fallbackCreatedDate) {
    var wrap = document.getElementById('drawerTimeline');
    if (!wrap) return;
    if (!items || items.length === 0) {
      wrap.innerHTML = '<div class="timeline-empty">Belum ada riwayat aktivitas selain pendaftaran (' +
        escapeHtml(fallbackCreatedDate || '-') + ').</div>';
      return;
    }
    var iconMap     = { 'Created':'bi-plus-circle-fill','Update Status':'bi-arrow-repeat','Hold':'bi-pause-fill','Blacklist':'bi-slash-circle-fill','Accepted':'bi-check-lg' };
    var dotClassMap = { 'Created':'created','Accepted':'accepted','Hold':'hold','Blacklist':'blacklist' };
    wrap.innerHTML = items.map(function(ev) {
      var dotClass = dotClassMap[ev.action] || 'pending';
      var icon     = iconMap[ev.action]     || 'bi-dot';
      return '<div class="timeline-item">' +
        '<div class="timeline-dot ' + dotClass + '"><i class="bi ' + icon + '"></i></div>' +
        '<div class="timeline-title">' + escapeHtml(ev.action) + '</div>' +
        '<div class="timeline-desc">'  + escapeHtml(ev.oldValue) + ' &rarr; ' + escapeHtml(ev.newValue) + '</div>' +
        '<div class="timeline-time"><i class="bi bi-clock"></i> ' + escapeHtml(ev.timestamp) +
        ' &middot; ' + escapeHtml(ev.user) + '</div>' +
        '</div>';
    }).join('');
  }

  function openCandidateDrawer(id) {
    var c = allCandidates.find(function(x) { return x.recruitmentId === id; });
    if (!c) return;
    activeCandidateId = id;
    setDrawerMode('candidate');

    // Header
    var avatarEl = document.getElementById('drawerAvatar');
    if (avatarEl) avatarEl.innerText = initials(c.fullName);
    var nameEl = document.getElementById('drawerCandidateName');
    if (nameEl) nameEl.innerText = c.fullName || '-';
    var posEl = document.getElementById('drawerPosition');
    if (posEl) posEl.innerText = c.positionApplied || '-';
    var badgeWrap = document.getElementById('drawerStatusBadgeWrap');
    if (badgeWrap) badgeWrap.innerHTML =
      '<span class="badge-status lg ' + statusBadgeClass(c.status) + '">' +
      escapeHtml(c.status || 'Pending') + '</span>';
    setDrawerMeta([
      { label: 'Recruitment ID', value: c.recruitmentId || '-' },
      { label: 'Tanggal Daftar', value: c.createdDate || '-' }
    ]);

    // Personal fields
    var fields = {
      cvFullName: c.fullName, cvBirthDate: c.birthDate,
      cvAge:      c.age ? c.age + ' Tahun' : '-',
      cvGender:   c.gender || '-',
      cvMaritalStatus: c.maritalStatus, cvNik: c.nik,
      cvPhone: c.phone, cvEmail: c.email, cvAddress: c.address, cvCity: c.city,
      cvPosition: c.positionApplied, cvEducation: c.education,
      cvExperience: c.workExperience, cvLastCompany: c.lastCompany,
      cvEmploymentStatus: c.currentEmploymentStatus, cvAvailability: c.availableToJoin,
      cvSalary: formatRupiah(c.expectedSalary), cvSource: c.recruitmentSource
    };
    Object.keys(fields).forEach(function(id) {
      var el = document.getElementById(id);
      if (el) el.innerText = fields[id] || '-';
    });

    // HR Notes
    var notesEl = document.getElementById('cvHrNotes');
    if (notesEl) notesEl.value = c.hrNotes || '';
    var charEl = document.getElementById('notesCharCounter');
    if (charEl) charEl.innerText = (c.hrNotes || '').length + ' / 2000 karakter';
    var lastEl = document.getElementById('notesLastUpdated');
    if (lastEl) lastEl.innerText = c.updatedAt || '-';
    var stateEl = document.getElementById('notesSaveState');
    if (stateEl) { stateEl.innerText = 'Tersimpan otomatis'; stateEl.className = 'notes-save-state'; }

    updateStatusButtonsUI(c.status || 'Pending');

    // Sembunyikan tombol offering response & onboarding (hanya tampil via openStatusDrawer untuk Accepted)
    var respWrap = document.getElementById('drawerOfferingRespWrap');
    if (respWrap) respWrap.style.display = 'none';

    // Timeline
    var tl = document.getElementById('drawerTimeline');
    if (tl) tl.innerHTML = '<div class="timeline-empty">Memuat riwayat...</div>';
    google.script.run
      .withSuccessHandler(function(events) { renderTimeline(events, c.createdDate); })
      .withFailureHandler(function()       { renderTimeline([], c.createdDate); })
      .getAuditLogForCandidate(id);

    openDrawer();
  }

  function updateStatusButtonsUI(currentStatus) {
    var map = { Accept:'Accepted', Hold:'Hold', Blacklist:'Blacklist' };
    Object.keys(map).forEach(function(key) {
      var btn = document.getElementById('btn' + key);
      if (!btn) return;
      btn.classList.toggle('current', map[key].toLowerCase() === (currentStatus||'').toLowerCase());
    });
  }

  // ============================================================
  // MODE: EMPLOYEE
  // ============================================================
  function openEmployeeDrawer(id) {
    var emp = EMP.allItems.find(function(x) { return x.employeeId === id; });
    if (!emp) return;
    activeCandidateId = null;
    EMP.detailId = id;
    setDrawerMode('employee');

    var displayStatus = emp.statusEmployee || emp.employmentStatus || emp.status || 'Active';
    var displayPos    = emp.positionCurrent || emp.position || '-';
    var displayEmail  = emp.personalEmail || emp.email || '-';

    // Header
    var avatarEl = document.getElementById('drawerAvatar');
    if (avatarEl) avatarEl.innerText = initials(emp.fullName);
    var nameEl = document.getElementById('drawerCandidateName');
    if (nameEl) nameEl.innerText = emp.fullName || '-';
    var posEl = document.getElementById('drawerPosition');
    if (posEl) posEl.innerText = displayPos + (emp.department ? ' · ' + emp.department : '');
    // Badge status di header dihapus — status sudah tampil di field empDrStatusEmployee
    var badgeWrap = document.getElementById('drawerStatusBadgeWrap');
    if (badgeWrap) badgeWrap.innerHTML = '';
    setDrawerMeta([
      { label: 'Employee ID',   value: emp.employeeId || '-' },
      { label: 'Tanggal Masuk', value: emp.joinDate   || '-' }
    ]);

    // SEKSI 1: Identitas & Data Pribadi
    setDrawerText('empDrEmployeeId',       emp.employeeId);
    setDrawerText('empDrNik',              emp.nik);
    setDrawerText('empDrNpwp',             emp.npwp);
    setDrawerText('empDrFullName',         emp.fullName);
    setDrawerText('empDrBirthPlace',       emp.birthPlace);
    setDrawerText('empDrBirthDate',        emp.birthDate);
    setDrawerText('empDrBloodType',        emp.bloodType);
    setDrawerText('empDrGender',           drawerGenderValue(emp.gender));
    setDrawerText('empDrReligion',         emp.religion);
    setDrawerText('empDrMarital',          emp.maritalStatus);
    setDrawerText('empDrPtkp',             emp.ptkpStatus);
    setDrawerText('empDrStatusEmployee',   displayStatus);
    setDrawerText('empDrEmail',            displayEmail);
    setDrawerText('empDrWorkingEmail',     emp.workingEmail);
    setDrawerText('empDrPhone',            emp.mobilePhone || emp.phone);
    setDrawerText('empDrCity',             emp.lokasiKerja || emp.city);
    setDrawerText('empDrDistrict',         emp.areaKerja || emp.district);
    setDrawerText('empDrAddress',          emp.citizenIdAddress || emp.address);
    setDrawerText('empDrResidentialAddress', emp.residentialAddress || emp.citizenIdAddress || emp.address);

    // SEKSI 2: Bank & BPJS
    setDrawerText('empDrBankName',         emp.bankName);
    setDrawerText('empDrBankHolder',       emp.bankAccountHolder);
    setDrawerText('empDrBankAccount',      emp.bankAccount);
    setDrawerText('empDrBpjsTk',           emp.bpjsKetenagakerjaan);
    setDrawerText('empDrBpjsKes',          emp.bpjsKesehatan);
    setDrawerText('empDrVendor',           emp.outsourceVendor);

    // SEKSI 3: Struktur Organisasi & Pekerjaan
    setDrawerText('empDrBranch',           emp.branchName || emp.branch);
    setDrawerText('empDrDivision',         emp.division);
    setDrawerText('empDrDept',             emp.department);
    setDrawerText('empDrCostCenter',       emp.costCenter);
    setDrawerText('empDrPosition',         displayPos);
    setDrawerText('empDrPosNoLoc',         emp.positionNoLocCurrent);
    setDrawerText('empDrJobLevel',         emp.jobLevel);
    setDrawerText('empDrGrade',            emp.grade);
    setDrawerText('empDrJoinDate',         emp.joinDate);
    setDrawerText('empDrDirectSup',        emp.directSuperior);
    setDrawerText('empDrIndirectSup',      emp.indirectSuperior);

    // SEKSI 4: Kontrak & Karier
    setDrawerText('empDrContractNo',       emp.contractNumber);
    setDrawerText('empDrContractDur',      emp.contractDuration);
    setDrawerText('empDrContractStart',    emp.contractStart);
    setDrawerText('empDrContractEnd',      emp.contractEnd);
    setDrawerText('empDrFormerPos',        emp.positionFormer);
    setDrawerText('empDrRotationType',     emp.typeOfRotation);
    setDrawerText('empDrMutasiDate',       emp.mutasiDate);
    setDrawerText('empDrNoSk',             emp.nomorSk);
    setDrawerText('empDrResignDate',       emp.resignDate);
    setDrawerText('empDrOffbType',         emp.offboardingType);
    setDrawerText('empDrOffbReason',       emp.offboardingReason);
    setDrawerText('empDrOffbApprovedBy',   emp.offboardingApprovedBy);
    setDrawerHtml('empDrOffbDocs',         renderOffboardingDocsHtml(emp));
    setDrawerText('empDrEmpStatus',        emp.statusEmployee || '-');

    // Catatan & Metadata
    setDrawerText('empDrCreatedBy',        emp.createdBy);
    setDrawerText('empDrCreated',          emp.createdAt || emp.joinDate);
    setDrawerText('empDrUpdated',          emp.updatedAt || emp.createdAt || emp.joinDate);
    setDrawerText('empDrGeneralNotes',     emp.notes);
    setDrawerText('empDrNotes',            emp.hrNotes);

    // Footer buttons wiring
    var btnEdit = document.getElementById('btnDrawerEntityEdit');
    var btnDel  = document.getElementById('btnDrawerEntityDelete');
    if (btnEdit) { btnEdit.onclick = function() { empOpenEdit(); }; }
    if (btnDel)  { btnDel.onclick  = function() { empDelete();  }; }

    // Edit icon in header
    var headerEdit = document.getElementById('btnDrawerEdit');
    if (headerEdit) { headerEdit.onclick = function() { empOpenEdit(); }; }

    openDrawer();
  }

  // ============================================================
  // MODE: OUTSOURCE
  // ============================================================
  function openOutsourceDrawer(id) {
    var os = OS.allItems.find(function(x) { return x.employeeId === id; });
    if (!os) return;
    activeCandidateId = null;
    OS.detailId = id;
    setDrawerMode('outsource');

    // Header
    var empStatus   = os.employeeStatus || os.employmentStatus || os.status || 'Active';
    var avatarEl = document.getElementById('drawerAvatar');
    if (avatarEl) avatarEl.innerText = initials(os.fullName);
    var nameEl = document.getElementById('drawerCandidateName');
    if (nameEl) nameEl.innerText = os.fullName || '-';
    var posEl = document.getElementById('drawerPosition');
    if (posEl) posEl.innerText = (os.position || '-') + (os.outsourceVendor || os.vendorCompany ? ' · ' + (os.outsourceVendor || os.vendorCompany) : '');
    // Badge status di header dihapus — status sudah tampil di field osDrStatusEmployee
    var badgeWrap = document.getElementById('drawerStatusBadgeWrap');
    if (badgeWrap) badgeWrap.innerHTML = '';
    setDrawerMeta([
      { label: 'Employee ID',   value: os.employeeId || '-' },
      { label: 'Tanggal Masuk', value: os.joinDate   || '-' }
    ]);

    // SEKSI 1: Identitas & Data Pribadi
    setDrawerText('osDrEmployeeId',       os.employeeId);
    setDrawerText('osDrNik',              os.nik);
    setDrawerText('osDrNpwp',             os.npwp);
    setDrawerText('osDrFullName',         os.fullName);
    setDrawerText('osDrBirthPlace',       os.birthPlace);
    setDrawerText('osDrBirthDate',        os.birthDate);
    setDrawerText('osDrBloodType',        os.bloodType);
    setDrawerText('osDrGender',           drawerGenderValue(os.gender));
    setDrawerText('osDrReligion',         os.religion);
    setDrawerText('osDrMarital',          os.maritalStatus);
    setDrawerText('osDrPtkp',             os.ptkpStatus);
    setDrawerText('osDrStatusEmployee',   empStatus);
    setDrawerText('osDrEmail',            os.email);
    setDrawerText('osDrWorkingEmail',     os.workingEmail);
    setDrawerText('osDrPhone',            os.phone);
    setDrawerText('osDrCity',             os.lokasiKerja || os.city);
    setDrawerText('osDrDistrict',         os.areaKerja || os.district);
    setDrawerText('osDrAddress',          os.citizenIdAddress || os.address);
    setDrawerText('osDrResidentialAddress', os.residentialAddress || os.citizenIdAddress || os.address);

    // SEKSI 2: Bank & BPJS
    setDrawerText('osDrBankName',         os.bankName);
    setDrawerText('osDrBankHolder',       os.bankAccountHolder);
    setDrawerText('osDrBankAccount',      os.bankAccount);
    setDrawerText('osDrBpjsTk',           os.bpjsKetenagakerjaan);
    setDrawerText('osDrBpjsKes',          os.bpjsKesehatan);
    setDrawerText('osDrVendor',           os.outsourceVendor || os.vendorCompany);

    // SEKSI 3: Struktur Organisasi & Pekerjaan
    setDrawerText('osDrBranch',           os.branchName || os.branch);
    setDrawerText('osDrDivision',         os.division);
    setDrawerText('osDrDept',             os.department);
    setDrawerText('osDrCostCenter',       os.costCenter);
    setDrawerText('osDrPosition',         os.positionCurrent || os.position);
    setDrawerText('osDrPosNoLoc',         os.positionNoLocCurrent);
    setDrawerText('osDrJobLevel',         os.jobLevel);
    setDrawerText('osDrGrade',            os.grade);
    setDrawerText('osDrJoinDate',         os.joinDate);
    setDrawerText('osDrDirectSup',        os.directSuperior);
    setDrawerText('osDrIndirectSup',      os.indirectSuperior);

    // SEKSI 4: Kontrak & Karier
    setDrawerText('osDrContractEnd',      os.contractEnd);
    setDrawerText('osDrFormerPos',        os.positionFormer);
    setDrawerText('osDrRotationType',     os.typeOfRotation);
    setDrawerText('osDrMutasiDate',       os.mutasiDate);
    setDrawerText('osDrNoSk',             os.nomorSk);
    setDrawerText('osDrResignDate',       os.resignDate);

    // Catatan & Metadata
    setDrawerText('osDrCreatedBy',        os.createdBy);
    setDrawerText('osDrCreated',          os.createdDate);
    setDrawerText('osDrUpdated',          os.updatedAt || os.createdDate);
    setDrawerText('osDrGeneralNotes',     os.notes);
    setDrawerText('osDrNotes',            os.hrNotes);

    // Footer buttons wiring
    var btnEdit = document.getElementById('btnDrawerEntityEdit');
    var btnDel  = document.getElementById('btnDrawerEntityDelete');
    if (btnEdit) { btnEdit.onclick = function() { openOsForm(OS.detailId); }; }
    if (btnDel)  { btnDel.onclick  = function() { deleteOsData(); }; }

    // Edit icon in header
    var headerEdit = document.getElementById('btnDrawerEdit');
    if (headerEdit) { headerEdit.onclick = function() { openOsForm(OS.detailId); }; }

    openDrawer();
  }

  // ============================================================
  // INIT DRAWER
  // ============================================================
  function initDrawer() {
    drawerOverlay = document.getElementById('drawerOverlay');
    drawerPanel   = document.getElementById('drawerPanel');

    var closeBtn = document.getElementById('btnDrawerClose');
    if (closeBtn) closeBtn.addEventListener('click', closeDrawer);
    if (drawerOverlay) drawerOverlay.addEventListener('click', closeDrawer);

    // PDF export (candidate mode)
    var printBtn = document.getElementById('btnDrawerPrint');
    if (printBtn) printBtn.addEventListener('click', function() {
      if (activeCandidateId) {
        exportCandidatePDF(activeCandidateId);
      } else {
        showToast('Tidak ada kandidat yang aktif.', 'warning');
      }
    });

    // HR Notes auto-save (candidate mode)
    var notesEl = document.getElementById('cvHrNotes');
    if (notesEl) {
      notesEl.addEventListener('input', function() {
        var charEl  = document.getElementById('notesCharCounter');
        var stateEl = document.getElementById('notesSaveState');
        if (charEl)  charEl.innerText  = notesEl.value.length + ' / 2000 karakter';
        if (stateEl) { stateEl.innerText = 'Menyimpan...'; stateEl.className = 'notes-save-state saving'; }
        clearTimeout(notesAutoSaveTimer);
        notesAutoSaveTimer = setTimeout(persistHrNotes, 1200);
      });
    }

    var saveBtn = document.getElementById('btnSaveNotesManual');
    if (saveBtn) saveBtn.addEventListener('click', function() {
      clearTimeout(notesAutoSaveTimer);
      persistHrNotes();
    });
  }

  function persistHrNotes() {
    if (!activeCandidateId) return;
    var notesEl = document.getElementById('cvHrNotes');
    var stateEl = document.getElementById('notesSaveState');
    var value   = notesEl ? notesEl.value : '';
    google.script.run
      .withSuccessHandler(function(result) {
        if (result && result.success) {
          var target = allCandidates.find(function(c) { return c.recruitmentId === activeCandidateId; });
          if (target) { target.hrNotes = value; target.updatedAt = result.updatedAt; }
          var lastEl = document.getElementById('notesLastUpdated');
          if (lastEl) lastEl.innerText = result.updatedAt;
          if (stateEl) { stateEl.innerText = 'Tersimpan otomatis'; stateEl.className = 'notes-save-state saved'; }
        } else {
          if (stateEl) { stateEl.innerText = 'Gagal menyimpan'; stateEl.className = 'notes-save-state'; }
        }
      })
      .withFailureHandler(function() {
        if (stateEl) { stateEl.innerText = 'Gagal menyimpan'; stateEl.className = 'notes-save-state'; }
      })
      .saveHrNotes(activeCandidateId, value);
  }
</script>
