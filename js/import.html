<script>
  // ============================================================
  // js/import.html — CSV IMPORT LOGIC (Master Data / Employee)
  // Depends on: helpers.html (showToast)
  // Schema v2 (2026-08-14) — 55 kolom Employee sheet
  // ============================================================

  var empImportFile = null;
  var empImportRows = [];

  function openEmpImportModal() {
    var modalEl = document.getElementById('empImportModal');
    if (!modalEl) return;
    empImportFile = null;
    empImportRows = [];
    resetEmpImportSteps();
    var m = bootstrap.Modal.getOrCreateInstance(modalEl);
    m.show();
  }

  function resetEmpImportSteps() {
    document.getElementById('empImportStep1').style.display = '';
    document.getElementById('empImportStep2').style.display = 'none';
    document.getElementById('empImportStep3').style.display = 'none';
    document.getElementById('empImportFileInfo').style.display = 'none';
    document.getElementById('empImportDropZone').style.display = '';
    document.getElementById('btnEmpImportStart').classList.add('disabled');
    document.getElementById('btnEmpImportStart').disabled = true;
    document.getElementById('btnEmpImportStartText').style.display = '';
    document.getElementById('btnEmpImportLoading').style.display = 'none';
    document.getElementById('btnEmpImportBack').style.display = 'none';
    document.getElementById('empImportErrorList').innerHTML = '';
    document.getElementById('empImportResultErrors').style.display = 'none';
    document.getElementById('empImportPreviewBody').innerHTML = '';
    document.getElementById('empImportSummaryBadge').textContent = '-';
  }

  function initEmpImportModal() {
    var dropZone = document.getElementById('empImportDropZone');
    var fileInput = document.getElementById('empImportFileInput');
    var clearBtn = document.getElementById('btnEmpImportClearFile');
    var startBtn = document.getElementById('btnEmpImportStart');
    var backBtn = document.getElementById('btnEmpImportBack');
    var tplBtn = document.getElementById('btnEmpDownloadTemplate');

    if (dropZone && fileInput) {
      dropZone.addEventListener('click', function() { fileInput.click(); });
      dropZone.addEventListener('dragover', function(e) {
        e.preventDefault();
        dropZone.style.background = '#e8f0fe';
      });
      dropZone.addEventListener('dragleave', function() {
        dropZone.style.background = '';
      });
      dropZone.addEventListener('drop', function(e) {
        e.preventDefault();
        dropZone.style.background = '';
        if (e.dataTransfer.files.length > 0) handleEmpImportFile(e.dataTransfer.files[0]);
      });
      fileInput.addEventListener('change', function() {
        if (fileInput.files.length > 0) handleEmpImportFile(fileInput.files[0]);
      });
    }

    if (clearBtn) clearBtn.addEventListener('click', function() {
      empImportFile = null;
      empImportRows = [];
      resetEmpImportSteps();
      if (fileInput) fileInput.value = '';
    });

    if (startBtn) startBtn.addEventListener('click', function() {
      if (empImportRows.length === 0) return;
      runEmpImport();
    });

    if (backBtn) backBtn.addEventListener('click', function() {
      resetEmpImportSteps();
      if (empImportRows.length > 0) showEmpImportPreview(empImportRows);
    });

    if (tplBtn) tplBtn.addEventListener('click', downloadEmpCsvTemplate);
  }

  function handleEmpImportFile(file) {
    var fname = file.name.toLowerCase();
    if (!fname.endsWith('.csv') && !fname.endsWith('.xlsx') && !fname.endsWith('.xls')) {
      showToast('Hanya file CSV yang didukung.', 'error');
      return;
    }
    if (!fname.endsWith('.csv')) {
      showToast('Format Excel (.xlsx/.xls) belum didukung langsung — harap simpan sebagai CSV terlebih dahulu.', 'error');
      return;
    }
    if (file.size > 5 * 1024 * 1024) {
      showToast('Ukuran file maksimal 5MB.', 'error');
      return;
    }
    empImportFile = file;

    document.getElementById('empImportFileName').textContent = file.name;
    document.getElementById('empImportFileSize').textContent = (file.size / 1024).toFixed(1) + ' KB';
    document.getElementById('empImportFileInfo').style.display = '';
    document.getElementById('empImportDropZone').style.display = 'none';

    var reader = new FileReader();
    reader.onload = function(e) {
      var text = e.target.result;
      empImportRows = parseEmpCSV(text);

      if (empImportRows.length === 0) {
        showToast('File CSV kosong atau format tidak sesuai.', 'error');
        return;
      }
      if (empImportRows.length > 500) {
        showToast('Maksimal 500 baris per import. File memiliki ' + empImportRows.length + ' baris.', 'error');
        empImportRows = [];
        return;
      }

      showEmpImportPreview(empImportRows);
    };
    reader.readAsText(file, 'UTF-8');
  }

  // ============================================================
  // parseEmpCSV — Normalize header → camelCase key yang diterima
  // importEmployees() backend (schema v2).
  //
  // Setiap entry: normHeader(kolom CSV) → camelCase key.
  // Support: header bahasa Indonesia & Inggris, dengan/tanpa spasi.
  // ============================================================
  function parseEmpCSV(text) {
    var lines = text.split(/\r?\n/).filter(function(l) { return l.trim() !== ''; });
    if (lines.length < 2) return [];

    // Normalize: lowercase, strip quotes, strip whitespace/underscore/slash/dash/dot/bracket
    function normHeader(h) {
      return h.trim()
        .replace(/^["']|["']$/g, '')
        .toLowerCase()
        .replace(/[\s_\-\/\.\(\)]/g, '');
    }

    var headers = splitCsvLine(lines[0]).map(normHeader);

    // ── Schema v2 field map ───────────────────────────────────
    // Format: 'normalizedHeader': 'camelCaseKeyForBackend'
    var fieldMap = {
      // BLOK 1 — Identitas
      'employeeid':                     'employeeId',          // opsional, diabaikan saat import (auto-generate)
      'recruitmentid':                  'recruitmentId',
      'recruitmentsystemlink':          'recruitmentId',
      'namalengkap':                    'fullName',
      'fullname':                       'fullName',
      'nama':                           'fullName',
      'nik':                            'nik',
      'niknpwp16digit':                 'nik',
      'niknpwp':                        'nik',
      'nomorinduk':                     'nik',
      'npwp':                           'npwp',
      'npwp16digit':                    'npwp',
      'tempatlahir':                    'birthPlace',
      'birthplace':                     'birthPlace',
      'tanggallahir':                   'birthDate',
      'birthdate':                      'birthDate',
      'tgllahir':                       'birthDate',
      // Age removed — no longer in Employee sheet schema

      // BLOK 2 — Data Pribadi
      'jeniskelamin':                   'gender',
      'gender':                         'gender',
      'agama':                          'religion',
      'religion':                       'religion',
      'statuspernikahan':               'maritalStatus',
      'maritalstatus':                  'maritalStatus',
      'golongandarah':                  'bloodType',
      'bloodtype':                      'bloodType',
      'statusptkp':                     'ptkpStatus',
      'ptkp':                           'ptkpStatus',
      'ptkpstatus':                     'ptkpStatus',
      'alamatktp':                      'citizenIdAddress',
      'alamatsesuaiktp':                'citizenIdAddress',
      'citizenidaddress':               'citizenIdAddress',
      'address':                        'citizenIdAddress',    // fallback lama
      'alamat':                         'citizenIdAddress',    // fallback lama
      'alamatdomisili':                 'residentialAddress',
      'alamattempattinggal':            'residentialAddress',
      'residentialaddress':             'residentialAddress',
      'nohp':                           'mobilePhone',
      'hp':                             'mobilePhone',
      'nomortelepon':                   'mobilePhone',
      'telepon':                        'mobilePhone',
      'phone':                          'mobilePhone',
      'mobilephone':                    'mobilePhone',
      'emailpribadi':                   'personalEmail',
      'personalemail':                  'personalEmail',
      'email':                          'personalEmail',       // fallback lama
      'emailkantor':                    'workingEmail',
      'workingemail':                   'workingEmail',

      // BLOK 3 — Bank & BPJS
      'namabank':                       'bankName',
      'bankname':                       'bankName',
      'bank':                           'bankName',
      'nomorrekening':                  'bankAccount',
      'bankaccount':                    'bankAccount',
      'rekening':                       'bankAccount',
      'atasnama':                       'bankAccountHolder',
      'atasnamamekening':               'bankAccountHolder',
      'bankaccountholder':              'bankAccountHolder',
      'nomorbpjsketenagakerjaan':       'bpjsKetenagakerjaan',
      'bpjsketenagakerjaan':            'bpjsKetenagakerjaan',
      'bpjstk':                         'bpjsKetenagakerjaan',
      'nomorbpjskesehatan':             'bpjsKesehatan',
      'bpjskesehatan':                  'bpjsKesehatan',
      'bpjskes':                        'bpjsKesehatan',

      // BLOK 4 — Organisasi & Pekerjaan
      'tipekaryawan':                   'employeeType',
      'employeetype':                   'employeeType',
      'tipe':                           'employeeType',
      'entitasperusahaan':              'companyEntity',
      'companyentity':                  'companyEntity',
      'perusahaan':                     'companyEntity',
      'cabang':                         'branchName',
      'namacanabng':                    'branchName',           // typo-safe
      'branchname':                     'branchName',
      'branch':                         'branchName',
      'divisi':                         'division',
      'division':                       'division',
      'departemen':                     'department',
      'department':                     'department',
      'dept':                           'department',
      'jabatan':                        'positionCurrent',
      'jabatancurrent':                 'positionCurrent',
      'jobpositioncurrent':             'positionCurrent',
      'positioncurrent':                'positionCurrent',
      'position':                       'positionCurrent',     // fallback lama
      'posisi':                         'positionCurrent',     // fallback lama
      'jabatantanpalokasikerja':        'positionNoLocCurrent',
      'jabatannoloc':                   'positionNoLocCurrent',
      'positionnoloccurrent':           'positionNoLocCurrent',
      'positionnoloc':                  'positionNoLocCurrent',
      'joblevel':                       'jobLevel',
      'level':                          'jobLevel',
      'grade':                          'grade',
      'gradekaryawan':                  'grade',
      'areakerja':                      'areaKerja',
      'kecamatan':                      'areaKerja',
      'district':                       'areaKerja',           // fallback lama
      'lokasikerja':                    'lokasiKerja',
      'kota':                           'lokasiKerja',
      'city':                           'lokasiKerja',         // fallback lama
      'costcenter':                     'costCenter',
      'pusatbiaya':                     'costCenter',
      'atasanlangsung':                 'directSuperior',
      'directsuperior':                 'directSuperior',
      'atasantidaklangsung':            'indirectSuperior',
      'indirectsuperior':               'indirectSuperior',

      // BLOK 5 — Status & Kontrak
      'statuskaryawan':                 'statusEmployee',
      'statusemployee':                 'statusEmployee',
      'status':                         'statusEmployee',      // fallback lama
      'statuskepegawaian':              'statusEmployee',
      'employmentstatus':               'statusEmployee',      // fallback lama
      'statuskerja':                    'statusEmployee',      // fallback lama
      'tanggalmasuk':                   'joinDate',
      'joindate':                       'joinDate',
      'tglmasuk':                       'joinDate',
      'mulaikontrak':                   'startDateContract',
      'tanggalmulaikontrak':            'startDateContract',
      'startdatecontract':              'startDateContract',
      'contractstart':                  'startDateContract',   // fallback lama
      'kontrakmulai':                   'startDateContract',   // fallback lama
      'akhirkontrak':                   'endDateContract',
      'tanggalberakhirkontrak':         'endDateContract',
      'enddatecontract':                'endDateContract',
      'contractend':                    'endDateContract',     // fallback lama
      'kontrakberakhir':                'endDateContract',     // fallback lama
      'durasikontrak':                  'contractDuration',
      'contractduration':               'contractDuration',
      'nokontrak':                      'contractNumber',
      'nomorkontrak':                   'contractNumber',
      'contractnumber':                 'contractNumber',
      'vendoroutsource':                'outsourceVendor',
      'outsourcevendor':                'outsourceVendor',
      'vendor':                         'outsourceVendor',

      // BLOK 6 — Karier & Mutasi
      'jabatansebelumnya':              'positionFormer',
      'jabatanformer':                  'positionFormer',
      'positionformer':                 'positionFormer',
      'jenisrotasi':                    'typeOfRotation',
      'typeofrotation':                 'typeOfRotation',
      'rotasi':                         'typeOfRotation',
      'tanggalmutasi':                  'mutasiDate',
      'tanggalmutasidemosipromosi':     'mutasiDate',
      'mutasidate':                     'mutasiDate',
      'nomorsk':                        'nomorSk',
      'nosk':                           'nomorSk',
      'nomorsurat':                     'nomorSk',
      'tanggalresign':                  'resignDate',
      'resigndate':                     'resignDate',

      // BLOK 7 — Catatan
      'catatan':                        'notes',
      'notes':                          'notes',
      'catatanumum':                    'notes',
      'catatanhr':                      'hrNotes',
      'hrnotes':                        'hrNotes',

      // Kolom lama yang masih diizinkan sebagai alias (backward compat)
      'pendidikan':                     'education',           // dikirim ke backend tapi diabaikan di v2
      'education':                      'education',
      'pengalamankerja':                'workExperience',
      'workexperience':                 'workExperience',
      'pengalaman':                     'workExperience',
      'gaji':                           'salary',
      'salary':                         'salary',
      'tipegaji':                       'salaryType',
      'salarytype':                     'salaryType',
    };

    var rows = [];
    for (var i = 1; i < lines.length; i++) {
      var vals = splitCsvLine(lines[i]);
      var row = {};
      for (var j = 0; j < headers.length; j++) {
        var key = fieldMap[headers[j]] || headers[j];
        row[key] = (vals[j] || '').trim().replace(/^["']|["']$/g, '');
      }
      rows.push(row);
    }
    return rows;
  }

  // ---- Proper CSV line splitter (handles quoted fields with commas) ----
  function splitCsvLine(line) {
    var result = [];
    var current = '';
    var inQuotes = false;
    for (var i = 0; i < line.length; i++) {
      var ch = line[i];
      if (ch === '"') {
        if (inQuotes && line[i + 1] === '"') { current += '"'; i++; }
        else { inQuotes = !inQuotes; }
      } else if (ch === ',' && !inQuotes) {
        result.push(current);
        current = '';
      } else {
        current += ch;
      }
    }
    result.push(current);
    return result;
  }

  // ============================================================
  // downloadEmpCsvTemplate — Download CSV template dengan semua
  // kolom schema v2 yang dapat diimport.
  // ============================================================
  function downloadEmpCsvTemplate() {
    var headers = [
      // WAJIB
      'fullName',
      // Data Pribadi
      'nik', 'npwp', 'birthPlace', 'birthDate', 'age', 'gender',
      'religion', 'maritalStatus', 'bloodType', 'ptkpStatus',
      'citizenIdAddress', 'residentialAddress', 'mobilePhone', 'personalEmail', 'workingEmail',
      // Bank & BPJS
      'bankName', 'bankAccount', 'bankAccountHolder',
      'bpjsKetenagakerjaan', 'bpjsKesehatan',
      // Organisasi
      'companyEntity', 'employeeType', 'branchName', 'division', 'department',
      'positionCurrent', 'positionNoLocCurrent', 'jobLevel', 'grade',
      'areaKerja', 'lokasiKerja', 'costCenter', 'directSuperior', 'indirectSuperior',
      // Status & Kontrak
      'statusEmployee', 'joinDate',
      'startDateContract', 'endDateContract', 'contractDuration', 'contractNumber',
      'outsourceVendor',
      // Karier & Mutasi
      'positionFormer', 'typeOfRotation', 'mutasiDate', 'nomorSk', 'resignDate',
      // Catatan
      'hrNotes', 'notes',
      // System (opsional)
      'recruitmentId',
    ];

    // Baris contoh
    var example = [
      'Budi Santoso',                          // fullName
      '3201234567890001',                      // nik
      '',                                      // npwp
      'Jakarta',                               // birthPlace
      '1995-03-15',                            // birthDate (YYYY-MM-DD)
      '29',                                    // age
      'Laki-laki',                             // gender
      'Islam',                                 // religion
      'Menikah',                               // maritalStatus
      'O',                                     // bloodType
      'K/1',                                   // ptkpStatus
      'Jl. Contoh No. 1 Jakarta',             // citizenIdAddress
      '',                                      // residentialAddress
      '628123456789',                          // mobilePhone
      'budi@gmail.com',                        // personalEmail
      'budi@mitogroup.co.id',                  // workingEmail
      'BCA',                                   // bankName
      '1234567890',                            // bankAccount
      'Budi Santoso',                          // bankAccountHolder
      '',                                      // bpjsKetenagakerjaan
      '',                                      // bpjsKesehatan
      'PT Mahakarya Sukses Indonesia',         // companyEntity
      'PKWTT',                                 // employeeType
      'Jakarta',                               // branchName
      'Operations',                            // division
      'Human Resources',                       // department
      'Staff HR - Jakarta',                    // positionCurrent
      'Staff HR',                              // positionNoLocCurrent
      '',                                      // jobLevel
      '',                                      // grade
      'Jakarta Selatan',                       // areaKerja
      'Jakarta',                               // lokasiKerja
      '',                                      // costCenter
      '',                                      // directSuperior
      '',                                      // indirectSuperior
      'Active',                                // statusEmployee
      '2024-01-15',                            // joinDate
      '',                                      // startDateContract
      '',                                      // endDateContract
      '',                                      // contractDuration
      '',                                      // contractNumber
      '',                                      // outsourceVendor
      '',                                      // positionFormer
      '',                                      // typeOfRotation
      '',                                      // mutasiDate
      '',                                      // nomorSk
      '',                                      // resignDate
      '',                                      // hrNotes
      '',                                      // notes
      '',                                      // recruitmentId
    ];

    var csvContent = headers.join(',') + '\n' +
      example.map(function(v) {
        // Quote fields containing commas or quotes
        return v.indexOf(',') !== -1 || v.indexOf('"') !== -1
          ? '"' + v.replace(/"/g, '""') + '"'
          : v;
      }).join(',') + '\n';

    var bom = '\uFEFF'; // UTF-8 BOM agar Excel tidak garble karakter Indonesia
    var blob = new Blob([bom + csvContent], { type: 'text/csv;charset=utf-8;' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'template_import_karyawan_v2.csv';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function showEmpImportPreview(rows) {
    document.getElementById('empImportStep1').style.display = 'none';
    document.getElementById('empImportStep2').style.display = '';

    // Count valid / warning rows
    var validCount = 0, warnCount = 0;
    rows.forEach(function(r) {
      if (r.fullName && r.fullName.trim() !== '') validCount++;
      else warnCount++;
    });

    var badge = document.getElementById('empImportSummaryBadge');
    badge.textContent = validCount + ' valid' + (warnCount > 0 ? ', ' + warnCount + ' error' : '');
    badge.className = 'badge ' + (warnCount > 0 ? 'bg-warning text-dark' : 'bg-primary');
    badge.style.fontSize = '12px';

    var tbody = document.getElementById('empImportPreviewBody');
    tbody.innerHTML = rows.map(function(r, i) {
      var nameOk = r.fullName && r.fullName.trim() !== '';
      var nikOk  = !r.nik || /^[0-9]{16}$/.test(r.nik.replace(/'/g, ''));
      var warnings = [];
      if (!nameOk) warnings.push('Nama kosong');
      if (!nikOk)  warnings.push('NIK tidak 16 digit');
      var statusClass = warnings.length === 0 ? 'text-success' : 'text-danger';
      var statusIcon  = warnings.length === 0 ? 'bi-check-circle-fill' : 'bi-x-circle-fill';
      var statusText  = warnings.length === 0 ? 'OK' : warnings.join(', ');
      return '<tr>' +
        '<td>' + (i + 1) + '</td>' +
        '<td>' + escapeHtml(r.fullName || '-') + '</td>' +
        '<td style="font-size:11px">' + escapeHtml(r.nik || '-') + '</td>' +
        '<td style="font-size:11px">' + escapeHtml(r.department || '-') + '</td>' +
        '<td style="font-size:11px">' + escapeHtml(r.statusEmployee || r.status || '-') + '</td>' +
        '<td><i class="bi ' + statusIcon + ' ' + statusClass + '"></i> <span class="' + statusClass + '" style="font-size:11px">' + statusText + '</span></td>' +
        '</tr>';
    }).join('');

    document.getElementById('btnEmpImportStart').classList.remove('disabled');
    document.getElementById('btnEmpImportStart').disabled = false;
    document.getElementById('btnEmpImportBack').style.display = '';
  }

  function runEmpImport() {
    if (empImportRows.length === 0) return;

    document.getElementById('btnEmpImportStartText').style.display = 'none';
    document.getElementById('btnEmpImportLoading').style.display = '';
    document.getElementById('btnEmpImportStart').classList.add('disabled');
    document.getElementById('btnEmpImportStart').disabled = true;
    document.getElementById('btnEmpImportBack').style.display = 'none';

    google.script.run
      .withSuccessHandler(function(result) {
        document.getElementById('empImportStep2').style.display = 'none';
        document.getElementById('empImportStep3').style.display = '';

        var icon = document.getElementById('empImportResultIcon');
        var title = document.getElementById('empImportResultTitle');
        var msg = document.getElementById('empImportResultMessage');
        var errDiv = document.getElementById('empImportResultErrors');
        var errList = document.getElementById('empImportErrorList');

        if (result.success) {
          icon.className = 'bi bi-check-circle-fill fs-1';
          icon.style.color = 'var(--color-success)';
          title.textContent = 'Import Berhasil!';
          title.className = 'mt-3 mb-1 text-success';
        } else {
          icon.className = 'bi bi-exclamation-triangle-fill fs-1';
          icon.style.color = '#e67700';
          title.textContent = 'Import Selesai dengan Error';
          title.className = 'mt-3 mb-1';
        }

        msg.textContent = result.message || (result.imported + ' karyawan berhasil diimport.');

        if (result.errors && result.errors.length > 0) {
          errDiv.style.display = '';
          errList.innerHTML = result.errors.map(function(e) {
            return '<li>' + escapeHtml(e) + '</li>';
          }).join('');
        }

        document.getElementById('btnEmpImportStartText').style.display = '';
        document.getElementById('btnEmpImportLoading').style.display = 'none';
        document.getElementById('btnEmpImportStart').style.display = 'none';
        document.getElementById('btnEmpImportBack').style.display = 'none';

        if (typeof empLoadAll === 'function') empLoadAll();

        showToast(result.message || 'Import selesai.', result.success ? 'success' : 'error');
      })
      .withFailureHandler(function(err) {
        document.getElementById('empImportStep2').style.display = 'none';
        document.getElementById('empImportStep3').style.display = '';
        document.getElementById('empImportResultIcon').className = 'bi bi-exclamation-circle-fill fs-1';
        document.getElementById('empImportResultIcon').style.color = '#991b1b';
        document.getElementById('empImportResultTitle').textContent = 'Import Gagal';
        document.getElementById('empImportResultTitle').className = 'mt-3 mb-1 text-danger';
        document.getElementById('empImportResultMessage').textContent = err.message || 'Terjadi kesalahan saat import.';
        document.getElementById('btnEmpImportStartText').style.display = '';
        document.getElementById('btnEmpImportLoading').style.display = 'none';
        document.getElementById('btnEmpImportStart').style.display = 'none';
        document.getElementById('btnEmpImportBack').style.display = '';
        showToast('Import gagal: ' + (err.message || err), 'error');
      })
      .importEmployees(empImportRows);
  }
</script>
