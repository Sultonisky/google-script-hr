- name: Deploy via SSH
  uses: appleboy/ssh-action@v1.2.2
  with:
    host: ${{ secrets.SERVER_HOST }}
    username: ${{ secrets.SERVER_USER }}
    key: ${{ secrets.SERVER_SSH_KEY }}
    command_timeout: 30m
    script: |
      set -e

      cd /home/ubuntu/hris/mito-hris-laravel

      echo "== Updating source =="
      git fetch origin main
      git reset --hard origin/main

      echo "== Installing dependencies =="
      composer install --no-dev --optimize-autoloader --no-interaction

      echo "== Running Laravel tests =="
      php artisan test

      echo "== Running MITO diagnostics =="
      php artisan mito:diagnose

      echo "== Checking Google Sheets =="
      php artisan mito:health-check
      php artisan mito:setup-sheets
      php artisan mito:validate-schema
      php artisan mito:sync

      echo "== Laravel optimization =="
      php artisan optimize:clear
      php artisan config:cache
      php artisan route:cache
      php artisan view:cache

      echo "== Deployment completed successfully =="
