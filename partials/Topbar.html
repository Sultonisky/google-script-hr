<!-- partials/Topbar.html — SHARED TOPBAR -->
<header class="topbar">
  <button class="btn-burger" id="btnBurger" type="button" aria-label="Menu">
    <i class="bi bi-list"></i>
  </button>
  <div class="page-title">
    <h5 id="pageTitleText">Dashboard</h5>
    <small id="pageSubtitleText">Ringkasan rekrutmen & data kandidat</small>
  </div>
  <div class="topbar-actions">
    <!-- User Menu Dropdown -->
    <div class="topbar-user-menu" id="topbarUserMenu">
      <button class="topbar-user-btn" type="button" id="topbarUserBtn" aria-label="Menu Pengguna">
        <div class="topbar-avatar" id="topbarAvatar">HR</div>
        <div class="topbar-user-meta d-none d-md-flex">
          <span class="topbar-user-name" id="topbarUserName">HR Team</span>
          <span class="topbar-user-role sidebar-role-badge" id="topbarUserRole">-</span>
        </div>
        <i class="bi bi-chevron-down"></i>
      </button>
      <!-- Dropdown -->
      <div class="user-dropdown-menu" id="userDropdownMenu">
        <div class="dropdown-user-card">
          <div class="dropdown-avatar" id="dropdownAvatar">HR</div>
          <div class="dropdown-user-info">
            <strong id="dropdownUserName">HR Team</strong>
            <small id="dropdownUserEmail">-</small>
            <span class="sidebar-role-badge" id="dropdownUserRole">-</span>
          </div>
        </div>
        <div class="dropdown-divider"></div>
        <button class="dropdown-item-custom" type="button" id="btnDropdownUserManagement" style="display:none;">
          <i class="bi bi-people-fill"></i> Manajemen Pengguna
        </button>
        <button class="dropdown-item-custom" type="button" id="btnDropdownSettings" style="display:none;">
          <i class="bi bi-gear-fill"></i> Pengaturan
        </button>
        <div class="dropdown-divider"></div>
        <button class="dropdown-item-custom dropdown-item-danger" type="button" id="btnDropdownLogout">
          <i class="bi bi-box-arrow-right"></i> Keluar
        </button>
      </div>
    </div>
    <button class="icon-btn" id="btnDarkModeToggle" title="Toggle tema">
      <i class="bi bi-moon-fill"></i>
    </button>
  </div>
</header>
