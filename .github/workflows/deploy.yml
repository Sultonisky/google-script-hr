name: Deploy MITO HRIS

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  test:
    name: Laravel Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, bcmath, intl, pdo, pdo_sqlite
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Install Node dependencies
        run: npm ci

      - name: Prepare Laravel environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run Laravel tests
        run: php artisan test

      - name: Build frontend assets
        run: npm run build

  deploy:
    name: Deploy Production
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 30m

          script: |
            set -e

            cd /home/ubuntu/hris/mito-hris-laravel

            echo "========================================"
            echo "       MITO HRIS PRODUCTION DEPLOY"
            echo "========================================"

            echo "== Updating source =="
            git fetch origin main
            git reset --hard origin/main

            echo "== Installing production PHP dependencies =="
            composer install \
              --no-dev \
              --no-interaction \
              --prefer-dist \
              --optimize-autoloader

            echo "== Checking Node dependencies =="
            if [ ! -d "node_modules" ]; then
              npm ci
            fi

            echo "== Building frontend assets =="
            npm run build

            echo "== Running MITO diagnostics =="
            php artisan mito:diagnose

            echo "== Checking Google Sheets =="
            php artisan mito:health-check
            php artisan mito:setup-sheets
            php artisan mito:validate-schema
            php artisan mito:sync

            echo "== Laravel optimization =="
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            echo "== Reloading PHP-FPM =="
            sudo systemctl reload php8.3-fpm

            echo "========================================"
            echo "   DEPLOYMENT COMPLETED SUCCESSFULLY"
            echo "========================================"
