<script>
  // ============================================================
  // js/app.html — MAIN APP INIT & SIDEBAR / PAGE NAVIGATION
  // Depends on: ALL other js/* modules
  // Must be included LAST in the HTML file.
  //
  // SPA Router: sidebar uses data-page="pageX" / data-external="employee"
  // attributes. The router (js/router.html) handles showing/hiding
  // page sections and updating the URL hash state.
  // ============================================================

  // ============================================================
  // SIDEBAR INIT — mobile toggle, active state, overlay
  // ============================================================
  function initSidebar() {
    var sidebar = document.getElementById("sidebar");
    var overlay = document.getElementById("sidebarOverlay");
    var btnBurger = document.getElementById("btnBurger");

    function openSidebar() {
      if (sidebar) sidebar.classList.add("show");
      if (overlay) overlay.classList.add("show");
    }
    function closeSidebar() {
      if (sidebar) sidebar.classList.remove("show");
      if (overlay) overlay.classList.remove("show");
    }

    if (btnBurger) btnBurger.addEventListener("click", openSidebar);
    if (overlay) overlay.addEventListener("click", closeSidebar);

    // Sidebar nav items — data-page / data-external driven
    document
      .querySelectorAll(".sidebar-nav .nav-item")
      .forEach(function (item) {
        item.addEventListener("click", function () {
          // Remove active from all, add to clicked
          document
            .querySelectorAll(".sidebar-nav .nav-item")
            .forEach(function (i) {
              i.classList.remove("active");
            });
          item.classList.add("active");

          var pageId = item.getAttribute("data-page");
          var external = item.getAttribute("data-external");
          var status = item.getAttribute("data-status");
          var scroll = item.getAttribute("data-scroll");

          if (external) {
            // External navigation (e.g. open spreadsheet)
            handleExternalNav(external);
          } else if (pageId && typeof SPA !== "undefined") {
            // Build params from data attributes
            var params = {};
            if (status) params.status = status;
            if (scroll) params.scroll = scroll;
            SPA.navigate(pageId, Object.keys(params).length ? params : null);
          }

          // Close mobile sidebar
          if (window.innerWidth < 992) closeSidebar();
        });
      });
  }

  // ============================================================
  // STAT CARD NAVIGATION — dashboard stat cards act like sidebar
  // items using data-page="pageX" attributes + SPA.navigate()
  // ============================================================
  function initStatCardNav() {
    document
      .querySelectorAll(".stat-card[data-page]")
      .forEach(function (card) {
        card.addEventListener("click", function () {
          var pageId = card.getAttribute("data-page");
          var status = card.getAttribute("data-status");
          var scroll = card.getAttribute("data-scroll");

          if (pageId && typeof SPA !== "undefined") {
            var params = {};
            if (status) params.status = status;
            if (scroll) params.scroll = scroll;
            SPA.navigate(pageId, Object.keys(params).length ? params : null);
          }
        });
      });
  }

  // ============================================================
  // EXTERNAL NAVIGATION HANDLER
  // data-external="employee" -> open spreadsheet
  // ============================================================
  function handleExternalNav(external) {
    if (external === "employee") {
      showToast(
        'Buka sheet "Employee" di spreadsheet untuk melihat Master Data karyawan.',
        "success",
      );
    } else {
      showToast("Navigasi eksternal: " + external, "info");
    }
  }

  // ============================================================
  // DARK MODE TOGGLE
  // ============================================================
  function initDarkModeToggle() {
    var darkBtn = document.getElementById("btnDarkModeToggle");
    if (!darkBtn) return;
    darkBtn.addEventListener("click", function () {
      appSettings.theme = appSettings.theme === "dark" ? "light" : "dark";
      applyTheme(appSettings.theme);
      saveSettingsToStorage(appSettings);
      var stEl = document.getElementById("settingTheme");
      if (stEl) stEl.value = appSettings.theme;
      if (
        typeof filteredCandidates !== "undefined" &&
        filteredCandidates.length > 0
      )
        renderCharts(filteredCandidates);
    });
  }

  // ============================================================
  // FAB SPEED DIAL
  // ============================================================
  function initFab() {
    var fabMain = document.getElementById("fabMain");
    var fabActions = document.getElementById("fabActions");
    if (!fabMain || !fabActions) return;

    fabMain.addEventListener("click", function () {
      fabMain.classList.toggle("open");
      fabActions.classList.toggle("d-none");
    });

    function closeFab() {
      fabMain.classList.remove("open");
      fabActions.classList.add("d-none");
    }

    var fabRefresh = document.getElementById("fabRefresh");
    if (fabRefresh)
      fabRefresh.addEventListener("click", function () {
        closeFab();
        loadCandidates();
      });
  }

  // ============================================================
  // KEYBOARD SHORTCUTS
  // ============================================================
  function initKeyboardShortcuts() {
    document.addEventListener("keydown", function (e) {
      // Escape: close drawer
      if (e.key === "Escape") {
        var dp = document.getElementById("drawerPanel");
        if (dp && dp.classList.contains("show")) {
          closeDrawer();
          e.preventDefault();
        }
      }
    });
  }

  // ============================================================
  // ENTRANCE ANIMATION — plays on fresh login redirect
  // ============================================================
  function playDashboardEntrance() {
    var params = new URLSearchParams(window.location.search || "");
    var loginSuccess = params.get("loginSuccess");

    // Only animate on fresh login; remove param so refresh doesn't replay
    if (loginSuccess !== "1") return;

    // Clean URL (remove loginSuccess param)
    try {
      var url = new URL(window.location.href);
      url.searchParams.delete("loginSuccess");
      window.history.replaceState({}, "", url.toString());
    } catch (e) {}

    // Add entrance CSS if not already present
    if (!document.getElementById("dashboardEntranceCSS")) {
      var style = document.createElement("style");
      style.id = "dashboardEntranceCSS";
      style.textContent = [
        ".dashboard-entrance { opacity: 0; transform: translateY(18px); transition: opacity 0.5s ease, transform 0.5s ease; }",
        ".dashboard-entrance.visible { opacity: 1; transform: translateY(0); }",
        ".dashboard-entrance-stagger { opacity: 0; transform: translateY(14px); transition: opacity 0.4s ease, transform 0.4s ease; }",
        ".dashboard-entrance-stagger.visible { opacity: 1; transform: translateY(0); }",
      ].join("\n");
      document.head.appendChild(style);
    }

    // Collect elements to animate
    var sidebar = document.querySelector(".sidebar, #sidebar");
    var topbar = document.querySelector(".topbar, #topbar, .navbar, nav");
    var mainContent = document.querySelector(
      ".main-content, .content-wrapper, main, #mainContent, .container-fluid"
    );
    var cards = document.querySelectorAll(
      ".stat-card, .chart-card, .card, [class*='stat'], [class*='chart']"
    );

    // Apply initial hidden state + stagger delay
    var allElements = [];

    if (sidebar) {
      sidebar.style.transition =
        "transform 0.55s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.4s ease";
      sidebar.style.transform = "translateX(-20px)";
      sidebar.style.opacity = "0";
    }

    if (topbar) {
      topbar.classList.add("dashboard-entrance");
      allElements.push({ el: topbar, delay: 0 });
    }

    if (mainContent) {
      mainContent.classList.add("dashboard-entrance");
      allElements.push({ el: mainContent, delay: 80 });
    }

    cards.forEach(function (card, i) {
      card.classList.add("dashboard-entrance-stagger");
      allElements.push({ el: card, delay: 160 + i * 70 });
    });

    // Trigger animations
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        // Sidebar slides in
        if (sidebar) {
          sidebar.style.transform = "translateX(0)";
          sidebar.style.opacity = "1";
        }

        // Topbar, main content, cards fade in with stagger
        allElements.forEach(function (item) {
          setTimeout(function () {
            item.el.classList.add("visible");
          }, item.delay);
        });
      });
    });
  }

  // ============================================================
  // INIT ALL — ordered by dependency
  // ============================================================
  function initApp() {
    // 1. Init settings form (from js/settings.html)
    if (typeof hydrateSettingsForm === "function") hydrateSettingsForm();

    // 2. Init sidebar mobile toggle & dark mode
    initSidebar();
    initStatCardNav();
    initDarkModeToggle();

    // 3. Init dashboard data + charts + filters + table + drawer + exports
    if (typeof initDashboard === "function") initDashboard();

    // 3b. Init status pages (Hold / Accepted / Blacklist)
    if (typeof initStatusPages === "function") initStatusPages();

    // 4. SPA Router — after dashboard init, set up hash-based navigation
    if (typeof SPA !== "undefined" && typeof SPA.init === "function") {
      SPA.init();
    }

    // 5. FAB speed dial & keyboard shortcuts
    initFab();
    initKeyboardShortcuts();

    // 6. Auto-refresh setup
    if (typeof setupAutoRefresh === "function") setupAutoRefresh();

    // 7. Dashboard entrance animation (on fresh login)
    playDashboardEntrance();
  }

  document.addEventListener("DOMContentLoaded", initApp);
</script>
