name: Deploy MITO HRIS

on:
  workflow_run:
    workflows:
      - "CI - MITO HRIS"
    types:
      - completed

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mito-hris-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main'
      )

    runs-on: ubuntu-latest
    timeout-minutes: 30

    environment:
      name: production

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 30m

          script: |
            set -Eeuo pipefail

            trap 'echo "Deployment failed at line ${LINENO}: ${BASH_COMMAND}" >&2' ERR

            echo "== Server identity =="
            hostname
            whoami
            pwd
            id

            echo "== OS =="
            cat /etc/os-release | head -n 5

            echo "== /opt =="
            ls -la /opt || true

            echo "== /opt/mito-hris =="
            ls -la /opt/mito-hris || true

            echo "== /opt/mito-hris/app =="
            ls -la /opt/mito-hris/app || true

            REPO_DIR="/opt/mito-hris/app"
            COMPOSE_DIR="/opt/mito-hris"
            DEPLOY_SHA="${{ github.event.workflow_run.head_sha }}"

            echo "== Deployment target =="
            echo "Commit: $DEPLOY_SHA"

            echo "== Updating source =="

            cd "$REPO_DIR"

            git fetch --prune origin main

            git reset --hard "$DEPLOY_SHA"

            echo "== Verifying deployed commit =="

            test "$(git rev-parse HEAD)" = "$DEPLOY_SHA" || {
              echo "Server checkout does not match CI commit." >&2
              echo "Expected: $DEPLOY_SHA" >&2
              echo "Actual:   $(git rev-parse HEAD)" >&2
              exit 1
            }

            echo "Deploying commit: $(git rev-parse --short HEAD)"

            echo "== Building HRIS Docker image =="

            cd "$COMPOSE_DIR"

            docker compose build hris-app

            echo "== Updating containers =="

            docker compose up -d hris-app hris-nginx

            echo "== Waiting for HRIS container =="

            for i in {1..30}; do
              if docker inspect -f '{{.State.Running}}' hris-app 2>/dev/null | grep -q true; then
                echo "hris-app is running."
                break
              fi

              if [ "$i" -eq 30 ]; then
                echo "hris-app failed to start." >&2
                docker logs --tail 100 hris-app >&2 || true
                exit 1
              fi

              sleep 2
            done

            echo "== Applying database migrations =="

            docker exec hris-app php artisan migrate --force

            echo "== Running MITO diagnostics =="

            docker exec hris-app php artisan optimize:clear
            docker exec hris-app php artisan mito:diagnose

            echo "== Checking Google Sheets =="

            docker exec hris-app php artisan mito:health-check
            docker exec hris-app php artisan mito:setup-sheets --fix --no-interaction
            docker exec hris-app php artisan mito:validate-schema
            docker exec hris-app php artisan mito:sync

            echo "== Laravel optimization =="

            docker exec hris-app php artisan config:cache
            docker exec hris-app php artisan route:cache
            docker exec hris-app php artisan view:cache

            echo "== Post-deploy application check =="

            docker exec hris-app php artisan about >/dev/null

            echo "== Container status =="

            docker compose ps

            echo "== Deployment completed successfully =="
