name: Deploy MITO HRIS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mito-hris-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -Eeuo pipefail

            trap 'echo "Deployment failed at line ${LINENO}: ${BASH_COMMAND}" >&2' ERR

            cd /home/ubuntu/hris/mito-hris-laravel

            echo "== Updating source =="
            git fetch --prune origin main
            git reset --hard origin/main
            test "$(git rev-parse HEAD)" = "${{ github.sha }}" || {
              echo "Server checkout does not match the workflow commit." >&2
              exit 1
            }

            echo "== Installing PHP dependencies =="
            composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-progress

            echo "== Checking Node dependencies =="
            if [ -f package-lock.json ]; then
              npm ci --no-audit --no-fund
            else
              npm install --no-audit --no-fund
            fi

            echo "== Building frontend assets =="
            npm run build

            echo "== Preparing writable Laravel directories =="
            PHP_FPM_USER="${PHP_FPM_USER:-www-data}"
            if ! id "$PHP_FPM_USER" >/dev/null 2>&1; then
              echo "PHP-FPM user '$PHP_FPM_USER' does not exist. Set PHP_FPM_USER to the server's PHP-FPM account." >&2
              exit 1
            fi
            sudo mkdir -p storage/framework/cache storage/framework/sessions storage/framework/views storage/logs bootstrap/cache database
            sudo chown -R "$(id -un):$PHP_FPM_USER" storage bootstrap/cache database
            sudo chmod -R ug+rwX storage bootstrap/cache database

            echo "== Running Laravel tests =="
            echo "Tests already passed in the verify job. Production deploy skips dev-only PHPUnit dependencies."

            echo "== Running MITO diagnostics =="
            # Clear framework caches before the Google Sheets sync so the
            # freshly synchronized sheet data remains available to the first
            # production request after deployment.
            php artisan optimize:clear
            php artisan mito:diagnose

            echo "== Checking Google Sheets =="
            php artisan mito:health-check
            php artisan mito:setup-sheets --fix --no-interaction
            php artisan mito:validate-schema
            php artisan mito:sync

            echo "== Laravel optimization =="
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            echo "== Reloading PHP-FPM =="
            sudo systemctl reload php8.3-fpm

            echo "== Post-deploy application check =="
            php artisan about >/dev/null

            echo "== Deployment completed successfully =="
