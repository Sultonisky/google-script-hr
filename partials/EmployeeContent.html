<!-- partials/EmployeeContent.html — EMPLOYEE PAGE CONTENT (for SPA include) -->
<!-- Contains only the body content; scripts & styles are loaded by Dashboard.html -->

<!-- Stat Cards — ditampilkan di atas tabel -->
<div class="row g-3 mb-4" id="employeeStatsPanel">
  <div class="col-6 col-md-4">
    <div class="stat-card">
      <div class="stat-icon bg-blue"><i class="bi bi-people-fill"></i></div>
      <div>
        <div class="stat-label">Total Karyawan</div>
        <div class="stat-value" data-current="0" id="empStatTotal">0</div>
      </div>
    </div>
  </div>
  <div class="col-6 col-md-4">
    <div class="stat-card">
      <div class="stat-icon bg-green"><i class="bi bi-check-circle-fill"></i></div>
      <div>
        <div class="stat-label">Active</div>
        <div class="stat-value" data-current="0" id="empStatActive">0</div>
      </div>
    </div>
  </div>
  <div class="col-6 col-md-4">
    <div class="stat-card">
      <div class="stat-icon bg-red"><i class="bi bi-slash-circle-fill"></i></div>
      <div>
        <div class="stat-label">Inactive</div>
        <div class="stat-value" data-current="0" id="empStatInactive">0</div>
      </div>
    </div>
  </div>
</div>

<div class="panel" id="employeePanel">
  <div class="panel-header">
    <div>
      <h6>Daftar Karyawan</h6>
      <div class="panel-subtitle" id="empPanelSubtitle">Memuat data...</div>
      <div class="panel-subtitle">Klik baris atau nama untuk melihat detail lengkap dari spreadsheet.</div>
    </div>
    <div class="export-btns">
      <!-- TOMBOL TAMBAH KARYAWAN DINONAKTIFKAN SEMENTARA (backup: kembalikan dengan menghapus komentar)
      <button class="btn-export" style="background:var(--color-primary);color:#fff;border:1px solid var(--color-primary);"
        type="button" id="btnEmpAdd">
        <i class="bi bi-plus-lg"></i> Tambah
      </button>
      -->
      <button class="btn-export csv" id="btnEmpExportCsv" type="button">
        <i class="bi bi-filetype-csv"></i> CSV
      </button>
      <button class="btn-export xlsx" id="btnEmpExportXlsx" type="button">
        <i class="bi bi-file-earmark-excel"></i> Excel
      </button>
    </div>
  </div>

  <!-- FILTER BAR -->
  <div class="filter-bar">
    <div class="table-search">
      <i class="bi bi-search"></i>
      <input type="text" id="empSearchInput" placeholder="Cari nama, NIK, email, posisi, dept..." />
    </div>
    <select class="filter-select" id="empDeptFilter">
      <option value="">Semua Dept</option>
    </select>
    <select class="filter-select" id="empTypeFilter">
      <option value="">Semua Tipe</option>
    </select>
    <select class="filter-select" id="empStatusFilter">
      <option value="">Semua Status</option>
      <option value="Active">Active</option>
      <option value="Probation">Probation</option>
      <option value="On Leave">On Leave</option>
      <option value="Resigned">Resigned</option>
      <option value="Terminated">Terminated</option>
      <option value="Inactive">Inactive</option>
    </select>
    <select class="filter-select" id="empSortSelect">
      <option value="newest">Terbaru</option>
      <option value="oldest">Terlama</option>
      <option value="name_asc">Nama A-Z</option>
      <option value="name_desc">Nama Z-A</option>
    </select>
    <button class="btn-refresh" id="btnEmpRefresh" type="button" title="Muat ulang data">
      <i class="bi bi-arrow-clockwise"></i>
    </button>
  </div>

  <!-- TABLE -->
  <div class="table-responsive">
    <table class="table hr-table">
      <thead>
        <tr>
          <th>Avatar</th>
          <th>Employee ID</th>
          <th>Karyawan</th>
          <th>NIK</th>
          <th>Departemen</th>
          <th>Posisi</th>
          <th>Tipe</th>
          <th>Status</th>
          <th>Tanggal Masuk</th>
        </tr>
      </thead>
      <tbody id="empTableBody"></tbody>
    </table>
    <div class="table-loading" id="empTableLoading">
      <div class="spinner-border" role="status"></div>
      <p>Mengambil data dari spreadsheet...</p>
    </div>
    <div class="table-empty d-none" id="empTableEmpty">
      <i class="bi bi-inbox"></i>
      <p>Belum ada data karyawan.</p>
    </div>
  </div>

  <div class="panel-footer">
    <span id="empFooterCount">Menampilkan 0 data</span>
    <nav class="pagination-ui" id="empPaginationUi" aria-label="Pagination"></nav>
  </div>
</div>

<!-- Form modal dipindah ke partials/EntityModals.html agar z-index tidak terpotong stacking context .page-section -->
