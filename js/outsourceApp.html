<script>
  // ============================================================
  // js/outsourceApp.html — OUTSOURCE REGISTRATION FORM LOGIC
  // Depends on: js/regions.html (REGIONS must be defined first)
  // ============================================================

  var form                 = document.getElementById('formOutsource');
  var agreementCheckbox    = document.getElementById('agreement');
  var agreementError       = document.getElementById('agreementError');
  var submitBtn            = document.getElementById('submitBtn');
  var submitSpinner        = document.getElementById('submitSpinner');
  var submitText           = document.getElementById('submitText');
  var emailInput           = document.getElementById('email');
  var emailValidation      = document.getElementById('emailValidation');
  var loadingOverlay       = document.getElementById('loadingOverlay');
  var nikInput             = document.getElementById('nik');
  var birthDateInput       = document.getElementById('birth_date');
  var ageInput             = document.getElementById('age');
  var genderSelect         = document.getElementById('gender');
  var provinceSelect       = document.getElementById('province');
  var citySelect           = document.getElementById('city');
  var districtInput        = document.getElementById('district');
  var districtLoading      = document.getElementById('districtLoading');
  var districtManualWrap   = document.getElementById('districtManualWrap');
  var districtManualInput  = document.getElementById('districtManual');
  var nikFeedback          = document.getElementById('nikFeedback');
  var progressFill         = document.getElementById('progressFill');
  var progressCount        = document.getElementById('progressCount');
  var progressMessage      = document.getElementById('progressMessage');
  var phoneInput           = document.getElementById('phone');
  var salaryInput          = document.getElementById('salary');
  var employeeTypeSelect   = document.getElementById('employee_type');
  var vendorSection        = document.getElementById('vendorSection');
  var vendorInput          = document.getElementById('outsource_vendor');
  var contractDurationSel  = document.getElementById('contract_duration');

  var nikDebounceTimer       = null;
  var nikCheckTimer          = null;
  var manualBirthDateChanged = false;
  var isSubmitting           = false;

  // Duplicate NIK warning element
  var nikDuplicateWarning = document.createElement('div');
  nikDuplicateWarning.className = 'nik-feedback';
  nikDuplicateWarning.id = 'nikDuplicateWarning';
  nikFeedback.parentNode.insertBefore(nikDuplicateWarning, nikFeedback.nextSibling);

  // ============================================================
  // SESSION GUARD
  // ============================================================
  var SESSION_KEY = 'msi_outsource_submitted';
  function markSubmitted(nik){ try { sessionStorage.setItem(SESSION_KEY, nik||'1'); } catch(e){} }
  function isAlreadySubmitted(){ try { return !!sessionStorage.getItem(SESSION_KEY); } catch(e){ return false; } }
  function showAlreadySubmittedPage(){
    document.getElementById('registrationForm').style.display = 'none';
    var sp = document.getElementById('successPage');
    sp.classList.add('show');
    var msg = sp.querySelector('.success-message');
    if(msg) msg.innerHTML = 'Data Anda telah terdaftar pada sesi ini.<br><br>Hubungi HR apabila ada pertanyaan.';
  }
  if(isAlreadySubmitted()){ showAlreadySubmittedPage(); }

  // ============================================================
  // EMPLOYEE TYPE — show/hide vendor section & contract required
  // ============================================================
  function handleEmployeeTypeChange() {
    var type = employeeTypeSelect ? employeeTypeSelect.value : '';
    var isOutsource   = type === 'Outsource';
    var needsContract = type === 'Outsource' || type === 'PKWT' || type === 'Intern';

    // Vendor section: show only for Outsource
    if (vendorSection) vendorSection.style.display = isOutsource ? 'block' : 'none';

    // Vendor field: required only for Outsource
    if (vendorInput) {
      vendorInput.required = isOutsource;
      var vr = document.getElementById('vendorRequired');
      if (vr) vr.style.display = isOutsource ? 'inline' : 'none';
    }

    // Contract duration & tanggal kontrak: required untuk Outsource & PKWT
    if (contractDurationSel) {
      contractDurationSel.required = (type === 'Outsource' || type === 'PKWT');
      var cr = document.getElementById('contractDurationRequired');
      if (cr) cr.style.display = (type === 'Outsource' || type === 'PKWT') ? 'inline' : 'none';
    }
    var csEl = document.getElementById('contract_start');
    var ceEl = document.getElementById('contract_end');
    if (csEl) csEl.required = (type === 'Outsource' || type === 'PKWT');
    if (ceEl) ceEl.required = (type === 'Outsource' || type === 'PKWT');

    // Contract date fields: show for time-limited contracts
    var csg = document.getElementById('contractStartGroup');
    var ceg = document.getElementById('contractEndGroup');
    var cdg = document.getElementById('contractDurationGroup');
    if (csg) csg.style.display = needsContract ? 'block' : 'none';
    if (ceg) ceg.style.display = needsContract ? 'block' : 'none';
    if (cdg) cdg.style.display = needsContract ? 'block' : 'none';

    updateProgress();
  }

  if (employeeTypeSelect) {
    employeeTypeSelect.addEventListener('change', function() {
      validateField(this);
      handleEmployeeTypeChange();
    });
  }

  // ============================================================
  // FIELD VALIDATION HELPER
  // ============================================================
  function validateField(el){
    if(!el) return;
    if(el.id === 'birth_date'){ validateBirthDate(); return; }
    var container = el.closest('.col-md-6, .col-md-4, .col-12');
    var feedback  = container ? container.querySelector('.invalid-feedback') : null;
    if(el.value && el.checkValidity()){
      el.classList.remove('is-invalid'); el.classList.add('is-valid');
      if(feedback) feedback.style.display = 'none';
    } else if(el.value && !el.checkValidity()){
      el.classList.add('is-invalid'); el.classList.remove('is-valid');
      if(feedback) feedback.style.display = 'flex';
    } else {
      el.classList.remove('is-valid','is-invalid');
      if(feedback) feedback.style.display = 'none';
    }
  }

  // ============================================================
  // PROGRESS & STRUCTURED VALIDATION
  // Validasi dihitung per seksi. Checkbox persetujuan adalah
  // LANGKAH TERAKHIR: hanya bisa dicentang setelah seluruh seksi
  // lengkap. Tombol submit aktif hanya jika semua seksi lengkap
  // DAN checkbox persetujuan dicentang.
  // ============================================================
  var FORM_SECTIONS = [
    { id:'sectionPersonal',   badgeId:'secBadgePersonal',   fields:['nik','full_name','birth_date','age','gender','marital_status','education'] },
    { id:'sectionContact',    badgeId:'secBadgeContact',    fields:['email','phone','province','city','address'], district:true },
    { id:'sectionEmployment', badgeId:'secBadgeEmployment', fields:['company_entity','employee_type','position','employment_status','join_date','salary','salary_type'], contract:true },
    { id:'vendorSection',     badgeId:'secBadgeVendor',     fields:['outsource_vendor'], vendorOnly:true },
  ];

  function isVendorRequired(){
    return employeeTypeSelect ? employeeTypeSelect.value === 'Outsource' : false;
  }
  function isContractRequired(){
    var t = employeeTypeSelect ? employeeTypeSelect.value : '';
    return t === 'Outsource' || t === 'PKWT';
  }
  function isDistrictValid(){
    if (districtManualWrap && districtManualWrap.style.display !== 'none') {
      return (districtManualInput.value || '').trim() !== '';
    }
    return !districtInput.disabled && (districtInput.value || '').trim() !== '';
  }
  function isFieldValid(el){
    if (!el) return false;
    if (el.type === 'checkbox') return !!el.checked;
    var v = (el.value || '').trim();
    if (v === '') return false;
    if (el.checkValidity) return el.checkValidity();
    return true;
  }
  function getSectionFieldIds(sec){
    if (sec.vendorOnly && !isVendorRequired()) return [];
    var ids = sec.fields.slice();
    if (sec.district) ids.push('__district__');
    if (sec.contract && isContractRequired()) {
      ids = ids.concat(['contract_start','contract_end','contract_duration']);
    }
    return ids;
  }
  function isSectionComplete(sec){
    var ids = getSectionFieldIds(sec);
    for (var i = 0; i < ids.length; i++) {
      var id = ids[i];
      if (id === '__district__') { if (!isDistrictValid()) return false; continue; }
      if (!isFieldValid(document.getElementById(id))) return false;
    }
    return true;
  }
  function countSection(sec){
    var ids = getSectionFieldIds(sec);
    var valid = 0;
    for (var i = 0; i < ids.length; i++) {
      var id = ids[i];
      if (id === '__district__') { if (isDistrictValid()) valid++; continue; }
      var el = document.getElementById(id);
      if (el && isFieldValid(el)) valid++;
    }
    return { total: ids.length, valid: valid };
  }
  function setSectionBadge(sec, complete){
    var b = document.getElementById(sec.badgeId);
    if (!b) return;
    b.className = 'section-status' + (complete ? ' done' : '');
    b.innerHTML = complete
      ? '<i class="bi bi-check-circle-fill"></i> Lengkap'
      : '<i class="bi bi-hourglass-split"></i> Belum lengkap';
  }
  function updateFormState(){
    var allComplete = true;
    FORM_SECTIONS.forEach(function(sec){
      var done = isSectionComplete(sec);
      if (!done) allComplete = false;
      setSectionBadge(sec, done);
    });

    // Checkbox persetujuan = langkah TERAKHIR
    agreementCheckbox.disabled = !allComplete;
    if (!allComplete) {
      agreementCheckbox.checked = false;
      agreementCheckbox.classList.remove('is-valid','is-invalid');
    }
    var hint = document.getElementById('agreementHint');
    if (hint) hint.style.display = allComplete ? 'none' : 'block';

    submitBtn.disabled = !(allComplete && agreementCheckbox.checked);
  }

  var progressMessages = [
    {min:0,  text:'Mulai mengisi formulir...'},
    {min:25, text:'Awal yang bagus! \uD83C\uDF89'},
    {min:50, text:'Form sudah setengah selesai.'},
    {min:75, text:'Hampir selesai. Centang persetujuan di langkah terakhir.'},
    {min:100,text:'Semua data telah lengkap. Silakan kirim.'}
  ];

  function updateProgress(){
    var total = 0, valid = 0;
    FORM_SECTIONS.forEach(function(sec){
      var c = countSection(sec);
      total += c.total; valid += c.valid;
    });
    total += 1; // langkah terakhir: checkbox persetujuan
    if (agreementCheckbox.checked) valid += 1;

    var percent = total === 0 ? 0 : Math.min(100, Math.round((valid / total) * 100));
    progressFill.style.width = percent + '%';
    progressCount.textContent = valid + ' dari ' + total + ' data telah lengkap';
    var msg = progressMessages[0].text;
    for (var i = progressMessages.length-1; i >= 0; i--) { if (percent >= progressMessages[i].min) { msg = progressMessages[i].text; break; } }
    progressMessage.textContent = msg;

    updateFormState();
  }

  // ============================================================
  // BIRTH DATE — auto-slash + strict validation
  // ============================================================
  birthDateInput.addEventListener('input', function(){
    manualBirthDateChanged = true;
    var val = this.value.replace(/[^0-9]/g,'');
    var f = '';
    if(val.length > 0){ f = val.substring(0,2); if(val.length > 2) f += '/' + val.substring(2,4); if(val.length > 4) f += '/' + val.substring(4,8); }
    this.value = f;
    calculateAge();
    if(f.length === 10) validateBirthDate();
    else this.classList.remove('is-valid','is-invalid');
    updateProgress();
  });
  birthDateInput.addEventListener('blur', function(){ if(this.value.trim().length > 0) validateBirthDate(); updateProgress(); });

  function validateBirthDate(){
    var el = birthDateInput;
    var container = el.closest('.col-md-6');
    var feedback  = container ? container.querySelector('.invalid-feedback') : null;
    var val = el.value.trim();
    function setInvalid(msg){ el.classList.add('is-invalid'); el.classList.remove('is-valid'); if(feedback){feedback.textContent=msg;feedback.style.display='flex';} }
    function setValid()     { el.classList.remove('is-invalid'); el.classList.add('is-valid'); if(feedback) feedback.style.display='none'; }
    if(!val||val.length<10){ setInvalid('Tanggal lahir wajib diisi dengan format DD/MM/YYYY.'); return false; }
    var p=val.split('/');
    if(p.length!==3||p[0].length!==2||p[1].length!==2||p[2].length!==4){ setInvalid('Format tidak valid. Gunakan DD/MM/YYYY.'); return false; }
    var day=parseInt(p[0],10),month=parseInt(p[1],10),year=parseInt(p[2],10),curYear=new Date().getFullYear();
    if(isNaN(day)||isNaN(month)||isNaN(year)){ setInvalid('Tanggal lahir mengandung karakter tidak valid.'); return false; }
    if(month<1||month>12){ setInvalid('Bulan tidak valid (01–12).'); return false; }
    if(day<1||day>31){ setInvalid('Tanggal tidak valid (01–31).'); return false; }
    if(year<1900||year>curYear){ setInvalid('Tahun lahir tidak valid.'); return false; }
    var d=new Date(year,month-1,day);
    if(d.getFullYear()!==year||d.getMonth()!==month-1||d.getDate()!==day){ setInvalid('Tanggal tidak ada dalam kalender.'); return false; }
    var today=new Date(); today.setHours(0,0,0,0);
    if(d>today){ setInvalid('Tanggal lahir tidak boleh tanggal yang akan datang.'); return false; }
    var age=today.getFullYear()-year,mDiff=today.getMonth()-(month-1);
    if(mDiff<0||(mDiff===0&&today.getDate()<day)) age--;
    if(age<17){ setInvalid('Usia minimal 17 tahun.'); return false; }
    setValid(); return true;
  }

  function calculateAge(){
    var val=birthDateInput.value.trim();
    if(!val||val.length<10){ ageInput.value=''; return; }
    var p=val.split('/'); if(p.length!==3) return;
    var day=parseInt(p[0],10),month=parseInt(p[1],10),year=parseInt(p[2],10);
    if(!day||!month||!year||month<1||month>12||day<1||day>31) return;
    var bd=new Date(year,month-1,day),today=new Date();
    var age=today.getFullYear()-bd.getFullYear(),m=today.getMonth()-bd.getMonth();
    if(m<0||(m===0&&today.getDate()<bd.getDate())) age--;
    ageInput.value=(age>=0&&age<=120)?age:'';
    validateField(ageInput);
  }

  // ============================================================
  // NIK PARSER + AUTO-FILL
  // ============================================================
  function parseNIK(nik){
    if(!nik||nik.length!==16||!/^[0-9]{16}$/.test(nik)) return null;
    var day=parseInt(nik.substring(6,8),10),gender=(day>40)?'Female':'Male';
    if(day>40) day-=40;
    var month=parseInt(nik.substring(8,10),10),year=parseInt(nik.substring(10,12),10);
    var fullYear=(year<=24)?2000+year:1900+year;
    if(month<1||month>12||day<1||day>31) return null;
    return {birthDate:{day:day,month:month,year:fullYear,formatted:('0'+day).slice(-2)+'/'+('0'+month).slice(-2)+'/'+fullYear},gender:gender,provinceCode:nik.substring(0,2),cityCode:nik.substring(0,4)};
  }

  nikInput.addEventListener('input', function(){
    this.value=this.value.replace(/[^0-9]/g,'').substring(0,16);
    clearTimeout(nikDebounceTimer);
    if(this.value.length===16) processNIK(this.value);
    else nikDebounceTimer=setTimeout(function(){ if(nikInput.value.length===16) processNIK(nikInput.value); },400);
    validateField(this); updateProgress();
  });

  nikInput.addEventListener('blur', function(){
    var nik=this.value.trim();
    if(nik.length!==16) return;
    if(isAlreadySubmitted()){ showAlreadySubmittedPage(); return; }
    clearTimeout(nikCheckTimer);
    nikCheckTimer=setTimeout(function(){
      google.script.run
        .withSuccessHandler(function(list){
          var isDup=list&&list.some(function(c){ return String(c.nik||'').replace(/'/g,'').trim()===nik; });
          if(isDup){
            nikDuplicateWarning.classList.add('show');
            nikDuplicateWarning.innerHTML='<div class="alert alert-warning" style="margin-top:10px;"><i class="bi bi-exclamation-triangle-fill"></i> <strong>NIK ini sudah terdaftar dalam sistem.</strong><br>Hubungi HR apabila ini adalah kesalahan.</div>';
            nikInput.classList.add('is-invalid'); nikInput.classList.remove('is-valid');
          }
        })
        .withFailureHandler(function(){})
        .getOutsourceList();
    },600);
  });

  function processNIK(nik){
    var r=parseNIK(nik);
    if(!r){ showNIKFeedback(false); return; }
    if(!manualBirthDateChanged){ birthDateInput.value=r.birthDate.formatted; calculateAge(); validateBirthDate(); }
    genderSelect.value=r.gender; validateField(genderSelect);
    if(REGIONS.provinces[r.provinceCode]){
      provinceSelect.value=r.provinceCode; validateField(provinceSelect); populateCities(r.provinceCode);
      if(REGIONS.cities[r.cityCode]){ citySelect.value=r.cityCode; validateField(citySelect); loadDistricts(r.cityCode); }
    }
    showNIKFeedback(true,r); updateProgress();
  }

  function showNIKFeedback(success,r){
    nikFeedback.classList.add('show');
    if(success){
      var det=['Birth Date: '+r.birthDate.formatted,'Gender: '+r.gender];
      if(REGIONS.provinces[r.provinceCode]) det.push('Province: '+REGIONS.provinces[r.provinceCode]);
      if(REGIONS.cities[r.cityCode]) det.push('City: '+REGIONS.cities[r.cityCode]);
      nikFeedback.innerHTML='<div class="alert alert-success"><i class="bi bi-check-circle-fill"></i> <strong>NIK data recognized</strong><ul>'+det.map(function(d){return '<li>'+d+'</li>';}).join('')+'</ul></div>';
    } else {
      nikFeedback.innerHTML='<div class="alert alert-warning"><i class="bi bi-exclamation-triangle-fill"></i> <strong>NIK tidak valid.</strong></div>';
    }
  }

  // ============================================================
  // REGION DROPDOWNS
  // ============================================================
  function populateProvinces(){
    var html='<option value="">-- Select Province --</option>';
    Object.keys(REGIONS.provinces).sort().forEach(function(c){ html+='<option value="'+c+'">'+REGIONS.provinces[c]+'</option>'; });
    provinceSelect.innerHTML=html;
  }
  function populateCities(pCode){
    citySelect.innerHTML='<option value="">-- Select City/Regency --</option>';
    resetDistrict();
    if(!pCode) return;
    Object.keys(REGIONS.cities).filter(function(c){ return c.substring(0,2)===pCode; }).sort()
      .forEach(function(c){ citySelect.innerHTML+='<option value="'+c+'">'+REGIONS.cities[c]+'</option>'; });
  }
  function resetDistrict(){
    districtInput.innerHTML='<option value="">-- Select City first --</option>';
    districtInput.disabled=true; districtInput.value='';
    districtInput.classList.remove('is-valid','is-invalid');
    districtLoading.style.display='none';
    districtManualWrap.style.display='none';
    districtManualInput.value=''; districtManualInput.required=false;
    districtInput.required=true;
  }
  function loadDistricts(cityCode){
    if(!cityCode){ resetDistrict(); return; }
    if(REGIONS.districts[cityCode]){
      populateDistrictOptions(REGIONS.districts[cityCode].map(function(n){ return {id:n,nama:n}; })); return;
    }
    districtInput.innerHTML='<option value="">Memuat kecamatan...</option>';
    districtInput.disabled=true; districtLoading.style.display='block';
    districtManualWrap.style.display='none'; districtManualInput.required=false; districtInput.required=true;
    google.script.run
      .withSuccessHandler(function(list){ districtLoading.style.display='none'; if(list&&list.length>0) populateDistrictOptions(list); else showDistrictManual(); })
      .withFailureHandler(function(){ districtLoading.style.display='none'; showDistrictManual(); })
      .getKecamatan(cityCode);
  }
  function populateDistrictOptions(list){
    var html='<option value="">-- Select District --</option>';
    list.forEach(function(item){ html+='<option value="'+item.nama+'">'+item.nama+'</option>'; });
    districtInput.innerHTML=html; districtInput.disabled=false; districtInput.required=true;
    districtManualWrap.style.display='none'; districtManualInput.required=false;
  }
  function showDistrictManual(){
    districtInput.innerHTML='<option value="">-</option>'; districtInput.disabled=true; districtInput.required=false;
    districtManualWrap.style.display='block'; districtManualInput.required=true; districtManualInput.focus();
  }

  provinceSelect.addEventListener('change',function(){ populateCities(this.value); validateField(this); updateProgress(); });
  citySelect.addEventListener('change',    function(){ validateField(this); loadDistricts(this.value); updateProgress(); });
  districtInput.addEventListener('change', function(){ validateField(this); updateProgress(); });
  districtManualInput.addEventListener('input',function(){
    this.classList.toggle('is-valid',this.value.trim()!=='');
    if(this.value.trim()!=='') this.classList.remove('is-invalid');
    updateProgress();
  });
  districtManualInput.addEventListener('blur',function(){
    if(this.value.trim()!=='') this.classList.add('is-valid');
    else if(this.required) this.classList.add('is-invalid');
  });

  // ============================================================
  // PHONE & SALARY FORMATTING
  // ============================================================
  phoneInput.addEventListener('input',function(){
    this.value=this.value.replace(/[^0-9]/g,'').substring(0,13);
    validateField(this); updateProgress();
  });
  salaryInput.addEventListener('input',function(){
    var raw=this.value.replace(/[^0-9]/g,'');
    this.value=raw.length>0?parseInt(raw,10).toLocaleString('id-ID'):'';
    validateField(this); updateProgress();
  });

  // ============================================================
  // EMAIL TYPO DETECTION
  // ============================================================
  var commonTypos={'gmial.com':'gmail.com','gmai.com':'gmail.com','gmail.con':'gmail.com','hotnail.com':'hotmail.com','outlok.com':'outlook.com'};
  emailInput.addEventListener('blur',function(){
    var email=this.value.trim();
    if(!email){ emailValidation.style.display='none'; return; }
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ emailValidation.className='email-validation invalid'; emailValidation.innerHTML='<i class="bi bi-x-circle-fill"></i> Format email tidak valid'; emailValidation.style.display='flex'; return; }
    var domain=email.split('@')[1];
    if(commonTypos[domain]){ emailValidation.className='email-validation suggestion'; emailValidation.innerHTML='<i class="bi bi-lightbulb-fill"></i> Apakah maksud Anda: <strong>'+email.split('@')[0]+'@'+commonTypos[domain]+'</strong>?'; emailValidation.style.display='flex'; }
    else { emailValidation.className='email-validation valid'; emailValidation.innerHTML='<i class="bi bi-check-circle-fill"></i> Format email valid'; emailValidation.style.display='flex'; }
  });
  emailInput.addEventListener('input',function(){ if(emailValidation.style.display==='flex') emailValidation.style.display='none'; validateField(this); updateProgress(); });

  // ============================================================
  // AGREEMENT
  // ============================================================
  agreementCheckbox.addEventListener('change',function(){
    if(this.checked){ agreementError.style.display='none'; this.classList.add('is-valid'); this.classList.remove('is-invalid'); }
    else { this.classList.remove('is-valid'); }
    updateProgress();
  });

  // ============================================================
  // FORM SUBMISSION
  // ============================================================
  form.addEventListener('submit',function(e){
    e.preventDefault();
    if(isSubmitting) return;
    if(isAlreadySubmitted()){ showAlreadySubmittedPage(); return; }
    if(!agreementCheckbox.checked){ agreementError.style.display='flex'; agreementCheckbox.classList.add('is-invalid'); return; }
    agreementError.style.display='none';
    if(!form.checkValidity()||!validateBirthDate()){ form.classList.add('was-validated'); return; }

    isSubmitting=true; submitBtn.disabled=true;
    submitSpinner.classList.remove('d-none'); submitText.textContent='Memeriksa...';
    loadingOverlay.classList.add('show');

    var enteredNIK   = nikInput.value.trim();
    var phoneVal     = phoneInput.value.replace(/[^0-9]/g,'');
    var salaryVal    = salaryInput.value.replace(/[^0-9]/g,'');
    var cityCode     = citySelect.value;
    var cityName     = REGIONS.cities[cityCode] || cityCode;
    var districtValue = districtInput.disabled ? districtManualInput.value.trim() : districtInput.value.trim();

    var formData = {
      full_name:          document.getElementById('full_name').value.trim(),
      nik:                enteredNIK,
      birth_date:         document.getElementById('birth_date').value,
      age:                document.getElementById('age').value,
      gender:             document.getElementById('gender').value,
      marital_status:     document.getElementById('marital_status').value,
      email:              document.getElementById('email').value.trim(),
      phone:              '62' + phoneVal,
      address:            document.getElementById('address').value.trim(),
      city:               cityName + (districtValue ? ', Kec. ' + districtValue : ''),
      education:          document.getElementById('education').value,
      work_experience:    document.getElementById('work_experience').value,
      company_entity:     document.getElementById('company_entity').value,
      employee_type:      document.getElementById('employee_type').value,
      department:         document.getElementById('department').value.trim(),
      position:           document.getElementById('position').value.trim(),
      employment_status:  document.getElementById('employment_status').value,
      join_date:          document.getElementById('join_date').value,
      contract_start:     document.getElementById('contract_start') ? document.getElementById('contract_start').value : '',
      contract_end:       document.getElementById('contract_end')   ? document.getElementById('contract_end').value   : '',
      contract_duration:  document.getElementById('contract_duration') ? document.getElementById('contract_duration').value : '',
      salary:             salaryVal,
      salary_type:        document.getElementById('salary_type').value,
      outsource_vendor:   document.getElementById('outsource_vendor') ? document.getElementById('outsource_vendor').value.trim() : '',
      recruitment_source: document.getElementById('recruitment_source') ? document.getElementById('recruitment_source').value : ''
    };

    function doSubmit(){
      submitText.textContent='Mengirim...';
      google.script.run
        .withSuccessHandler(function(response){
          loadingOverlay.classList.remove('show'); submitSpinner.classList.add('d-none');
          submitText.textContent='Kirim Data'; isSubmitting=false;
          if(response==='Sukses'){ markSubmitted(enteredNIK); document.getElementById('registrationForm').style.display='none'; document.getElementById('successPage').classList.add('show'); }
          else { alert('Error: '+response); submitBtn.disabled=false; }
        })
        .withFailureHandler(function(err){
          loadingOverlay.classList.remove('show'); submitSpinner.classList.add('d-none');
          submitText.textContent='Kirim Data'; isSubmitting=false;
          alert('Gagal mengirim data: '+err.message); submitBtn.disabled=false;
        })
        .simpanDataOutsource(formData);
    }

    // Duplicate NIK check against Employee sheet
    google.script.run
      .withSuccessHandler(function(list){
        var isDup=list&&list.some(function(c){ return String(c.nik||'').replace(/'/g,'').trim()===enteredNIK; });
        if(isDup){
          loadingOverlay.classList.remove('show'); submitSpinner.classList.add('d-none');
          submitText.textContent='Kirim Data'; isSubmitting=false; submitBtn.disabled=false;
          nikDuplicateWarning.classList.add('show');
          nikDuplicateWarning.innerHTML='<div class="alert alert-warning" style="margin-top:10px;"><i class="bi bi-exclamation-triangle-fill"></i> <strong>NIK sudah terdaftar dalam sistem Employee.</strong><br>Hubungi HR apabila ini adalah kesalahan.</div>';
          nikInput.scrollIntoView({behavior:'smooth',block:'center'}); nikInput.focus();
        } else { doSubmit(); }
      })
      .withFailureHandler(function(){ doSubmit(); })
      .getOutsourceList();
  });

  // ============================================================
  // REAL-TIME VALIDATION
  // ============================================================
  var inputs=form.querySelectorAll('input[required],select[required],textarea[required]');
  inputs.forEach(function(input){
    if(input.id==='birth_date') return;
    input.addEventListener('blur',   function(){ validateField(this); updateProgress(); });
    input.addEventListener('input',  function(){ validateField(this); updateProgress(); });
    input.addEventListener('change', function(){ validateField(this); updateProgress(); });
  });

  // ============================================================
  // MASTER DATA LOADING
  // ============================================================
  function populateMasterDropdowns() {
    google.script.run
      .withSuccessHandler(function(result) {
        if (result && result.success && result.data) {
          var data = result.data;
          var cats = ['department', 'employee_type'];
          var ids  = ['department', 'employee_type'];
          for (var c = 0; c < cats.length; c++) {
            var sel = document.getElementById(ids[c]);
            if (!sel) continue;
            var items = data[cats[c]] || [];
            var cur = sel.value;
            var opts = '<option value="">';
            if (ids[c] === 'department') opts += '-- Select Department --';
            else if (ids[c] === 'employee_type') opts += '-- Select Type --';
            opts += '</option>';
            items.forEach(function(name) {
              var val = typeof name === 'object' ? name.name : name;
              opts += '<option value="' + val + '"' + (cur === val ? ' selected' : '') + '>' + val + '</option>';
            });
            sel.innerHTML = opts;
          }
          // Default tipe karyawan = Outsource (form registrasi outsource)
          var etDefault = document.getElementById('employee_type');
          if (etDefault && !etDefault.value && etDefault.options.length > 1) {
            etDefault.value = 'Outsource';
          }
          handleEmployeeTypeChange();
        }
      })
      .withFailureHandler(function() {})
      .getMasterDataGrouped();
  }

  // ============================================================
  // DYNAMIC-REQUIRED FIELDS — explicit listeners
  // Field-field ini tidak punya attr `required` di HTML saat load
  // (di-set dinamis via JS), sehingga querySelectorAll('input[required]')
  // di atas tidak menangkap mereka. Listener di-attach secara eksplisit.
  // ============================================================
  (function attachDynamicFieldListeners(){
    var dynamicFields = [
      'outsource_vendor',   // required hanya saat Outsource
      'contract_number',    // opsional tapi perlu update progress
      'contract_start',     // required saat Outsource/PKWT
      'contract_end',       // required saat Outsource/PKWT
      'contract_duration'   // required saat Outsource/PKWT
    ];
    dynamicFields.forEach(function(fid){
      var el = document.getElementById(fid);
      if (!el) return;
      ['input', 'blur', 'change'].forEach(function(ev){
        el.addEventListener(ev, function(){ validateField(this); updateProgress(); });
      });
    });
  })();

  // ============================================================
  // INIT
  // ============================================================
  populateMasterDropdowns();
  populateProvinces();
  handleEmployeeTypeChange(); // set initial state (vendor hidden, contract optional)
  updateProgress();
</script>
