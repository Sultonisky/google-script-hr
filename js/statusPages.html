<script>
  // ============================================================
  // js/statusPages.html — Hold / Accepted / Blacklist Pages
  // Depends on: helpers.html, api.html
  // ============================================================

  // ============================================================
  // GENERIC STATUS PAGE CONTROLLER
  // ============================================================
  function createStatusPageCtrl(cfg) {
    // cfg: { loadFn, pageId, prefix, statusName, statusLabel }
    var data = [];
    var filtered = [];
    var page = 1;
    var ps = 10;

    function el(id) { return document.getElementById(cfg.prefix + id); }

    function loadData(silent) {
      var loadingEl = el('TableLoading');
      var emptyEl   = el('TableEmpty');
      var subtitleEl = el('PanelSubtitle');
      if (!silent && loadingEl) loadingEl.classList.remove('d-none');
      if (!silent && emptyEl) emptyEl.classList.add('d-none');
      google.script.run
        .withSuccessHandler(function(res) {
          data = res || [];
          if (subtitleEl) subtitleEl.innerText = 'Terakhir dimuat: ' + new Date().toLocaleString('id-ID');
          if (loadingEl) loadingEl.classList.add('d-none');
          populateFilter();
          updateStats();
          applyFilter();
          if (!silent) showToast('Data ' + cfg.statusLabel + ' dimuat (' + data.length + ' data).', 'success');
        })
        .withFailureHandler(function(err) {
          if (loadingEl) loadingEl.classList.add('d-none');
          if (!silent) showToast('Gagal memuat data ' + cfg.statusLabel + ': ' + err.message, 'error');
        })
        [cfg.loadFn]();
    }

    function populateFilter() {
      var sel = el('PositionFilter');
      if (!sel) return;
      var positions = [];
      data.forEach(function(r) {
        if (r.positionApplied && positions.indexOf(r.positionApplied) === -1)
          positions.push(r.positionApplied);
      });
      sel.innerHTML = '<option value="">Semua Posisi</option>' +
        positions.sort().map(function(p) {
          return '<option value="' + escapeHtml(p) + '">' + escapeHtml(p) + '</option>';
        }).join('');
    }

    function updateStats() {
      var totalEl = el('StatTotal');
      if (totalEl) animateCounter(totalEl, data.length);

      // Stat tambahan khusus page Accepted
      if (cfg.statusName === 'accepted') {
        var offeringEl = el('StatOffering');
        if (offeringEl) {
          var offeringCount = data.filter(function (r) {
            return r.offeringCreated && r.offeringCreated !== '-' && r.offeringCreated !== '';
          }).length;
          animateCounter(offeringEl, offeringCount);
        }
        var onboardingEl = el('StatOnboarding');
        if (onboardingEl) {
          var onboardingCount = data.filter(function (r) {
            return String(r.onboardingStatus || '').trim().toLowerCase() === 'probation';
          }).length;
          animateCounter(onboardingEl, onboardingCount);
        }
      }
    }

    function applyFilter() {
      var searchEl   = el('SearchInput');
      var posEl      = el('PositionFilter');
      var sortEl     = el('SortSelect');
      var search     = searchEl ? searchEl.value.toLowerCase() : '';
      var posFilter  = posEl ? posEl.value : '';
      var sortVal    = sortEl ? sortEl.value : 'newest';

      filtered = data.filter(function(r) {
        var matchSearch = !search ||
          (r.fullName || '').toLowerCase().indexOf(search) !== -1 ||
          (r.recruitmentId || '').toLowerCase().indexOf(search) !== -1 ||
          (r.positionApplied || '').toLowerCase().indexOf(search) !== -1 ||
          (r.city || '').toLowerCase().indexOf(search) !== -1 ||
          (r.email || '').toLowerCase().indexOf(search) !== -1 ||
          (r.phone || '').toLowerCase().indexOf(search) !== -1 ||
          (r.holdReason || '').toLowerCase().indexOf(search) !== -1 ||
          (r.blacklistReason || '').toLowerCase().indexOf(search) !== -1 ||
          (r.employeeId || '').toLowerCase().indexOf(search) !== -1;
        var matchPos = !posFilter || r.positionApplied === posFilter;
        return matchSearch && matchPos;
      });

      filtered.sort(function(a, b) {
        function toTs(s) {
          if (!s || s === '-') return 0;
          var p = String(s).split(' '), d = p[0].split('/');
          var t = p[1] ? p[1].split(':') : ['00', '00'];
          if (d.length < 3) return 0;
          return new Date(d[2], d[1]-1, d[0], t[0], t[1]).getTime();
        }
        if (sortVal === 'newest') return toTs(b.processedDate || b.createdDate) - toTs(a.processedDate || a.createdDate);
        if (sortVal === 'oldest') return toTs(a.processedDate || a.createdDate) - toTs(b.processedDate || b.createdDate);
        if (sortVal === 'name_asc')  return (a.fullName || '').localeCompare(b.fullName || '');
        if (sortVal === 'name_desc') return (b.fullName || '').localeCompare(a.fullName || '');
        return 0;
      });

      page = 1;
      renderTable();
    }

    function renderTable() {
      var tbody   = el('TableBody');
      var emptyEl = el('TableEmpty');
      var footerEl = el('FooterCount');

      if (!filtered || filtered.length === 0) {
        if (tbody) tbody.innerHTML = '';
        if (emptyEl) emptyEl.classList.remove('d-none');
        if (footerEl) footerEl.innerText = 'Menampilkan 0 dari ' + data.length + ' data';
        renderPagination();
        return;
      }
      if (emptyEl) emptyEl.classList.add('d-none');

      var totalPages = Math.max(1, Math.ceil(filtered.length / ps));
      if (page > totalPages) page = totalPages;
      var start = (page - 1) * ps;
      var pageData = filtered.slice(start, start + ps);

      if (tbody) tbody.innerHTML = pageData.map(function(r) {
        return renderRow(r);
      }).join('');

      var shownEnd = Math.min(start + ps, filtered.length);
      if (footerEl) footerEl.innerText =
        'Menampilkan ' + (start+1) + '–' + shownEnd + ' dari ' + filtered.length +
        ' data (total ' + data.length + ')';

      renderPagination();
      attachRowHandlers();
    }

    function renderRow(r) {
      var extraCol = '';
      if (cfg.statusName === 'hold') {
        extraCol =
          '<td><small style="color:#666">' + escapeHtml(r.holdReason || '-') + '</small></td>' +
          '<td><small>' + escapeHtml(r.holdFollowUpDate || '-') + '</small></td>';
      } else if (cfg.statusName === 'accepted') {
        // Badge offering: tampilkan timestamp Offering Created jika ada, "-" jika belum
        var offeringDisplay = r.offeringCreated && r.offeringCreated !== '-'
          ? '<span class="badge-status accepted" style="font-size:10px;padding:2px 8px;white-space:nowrap">' +
            '<i class="bi bi-check2-circle me-1"></i>' + escapeHtml(r.offeringCreated) + '</span>'
          : '<span style="color:#aaa;font-size:12px">-</span>';
        extraCol = '<td>' + offeringDisplay + '</td>';
      } else if (cfg.statusName === 'blacklist') {
        extraCol =
          '<td><small style="color:#991b1b">' + escapeHtml(r.blacklistReason || '-') + '</small></td>';
      }

      var actionBtns =
        '<button class="btn btn-sm btn-outline-secondary btn-status-move" ' +
        'data-id="' + escapeHtml(r.recruitmentId) + '" data-from="' + cfg.statusLabel + '" title="Ubah Status">' +
        '<i class="bi bi-arrow-repeat"></i></button>';

      if (cfg.statusName === 'accepted' && r.offeringCreated && r.offeringCreated !== '-') {
        // Tombol preview info offering — hanya muncul jika sudah pernah digenerate
        var previewTitle = 'Dibuat: ' + escapeHtml(r.offeringCreated) + ' oleh ' + escapeHtml(r.offeringCreatedBy || '-') +
          (r.offeringUpdated && r.offeringUpdated !== '-'
            ? ' | Update: ' + escapeHtml(r.offeringUpdated) + ' oleh ' + escapeHtml(r.offeringUpdatedBy || '-')
            : '');
        actionBtns +=
          ' <button class="btn btn-sm btn-offering-preview" ' +
          'data-id="' + escapeHtml(r.recruitmentId) + '" ' +
          'title="' + previewTitle + '" ' +
          'style="background:#e8f4e8;color:#166534;border:1px solid #bbf7d0;border-radius:6px;padding:4px 8px">' +
          '<i class="bi bi-eye"></i></button>';
      }

      return '<tr>' +
        '<td><div class="avatar-sm">' + escapeHtml(initials(r.fullName)) + '</div></td>' +
        '<td><span class="id-mono">' + escapeHtml(r.recruitmentId) + '</span></td>' +
        '<td><div class="cand-name cand-name-link" style="cursor:pointer;color:var(--color-primary);" data-id="' + escapeHtml(r.recruitmentId) + '" data-from="' + cfg.statusLabel + '">' + escapeHtml(r.fullName) + '</div>' +
        '<div class="cand-sub">' + escapeHtml(r.email || '') + '</div></td>' +
        '<td>' + escapeHtml(String(r.age || '-')) + ' Th</td>' +
        '<td>' + escapeHtml(r.positionApplied || '-') + '</td>' +
        extraCol +
        '<td><small>' + escapeHtml(r.processedDate || r.createdDate || '-') + '</small></td>' +
        '<td><small>' + escapeHtml(r.processedBy || '-') + '</small></td>' +
        '<td>' + actionBtns + '</td>' +
        '</tr>';
    }

    function renderPagination() {
      var nav = el('PaginationUi');
      if (!nav) return;
      var total = Math.max(1, Math.ceil(filtered.length / ps));
      var html = '<button class="page-btn" type="button" id="' + cfg.prefix + 'PagePrev" ' + (page===1?'disabled':'') + '><i class="bi bi-chevron-left"></i></button>';
      for (var p = 1; p <= total; p++) {
        html += '<button class="page-btn' + (p===page?' active':'') + '" type="button" data-page="' + p + '">' + p + '</button>';
      }
      html += '<button class="page-btn" type="button" id="' + cfg.prefix + 'PageNext" ' + (page===total?'disabled':'') + '><i class="bi bi-chevron-right"></i></button>';
      nav.innerHTML = html;
      nav.querySelectorAll('button[data-page]').forEach(function(b) {
        b.addEventListener('click', function() { page = parseInt(b.getAttribute('data-page'), 10); renderTable(); });
      });
      var prev = document.getElementById(cfg.prefix + 'PagePrev');
      var next = document.getElementById(cfg.prefix + 'PageNext');
      if (prev) prev.addEventListener('click', function() { if (page > 1) { page--; renderTable(); } });
      if (next) next.addEventListener('click', function() { if (page < total) { page++; renderTable(); } });
    }

    function attachRowHandlers() {
      document.querySelectorAll('#' + cfg.prefix + 'TableBody .cand-name-link').forEach(function(el) {
        el.addEventListener('click', function() {
          var id = el.getAttribute('data-id');
          var row = data.find(function(r) { return r.recruitmentId === id; });
          if (row) openStatusDrawer(row, cfg.statusLabel, cfg.statusName);
        });
      });
      document.querySelectorAll('#' + cfg.prefix + 'TableBody .btn-status-move').forEach(function(btn) {
        btn.addEventListener('click', function() {
          var id   = btn.getAttribute('data-id');
          var from = btn.getAttribute('data-from');
          openMoveStatusModal(id, from);
        });
      });

      if (cfg.statusName === 'accepted') {
        document.querySelectorAll('#' + cfg.prefix + 'TableBody .btn-offering-preview').forEach(function(btn) {
          btn.addEventListener('click', function() {
            var id = btn.getAttribute('data-id');
            var row = data.find(function(r) { return r.recruitmentId === id; });
            if (row) openOfferingPreviewModal(row);
          });
        });
      }
    }

    function onNavigate() {
      if (data.length === 0) loadData(false);
    }

    function refresh() { loadData(false); }

    function getData() { return data; }

    return { loadData: loadData, onNavigate: onNavigate, refresh: refresh, applyFilter: applyFilter, _getData: getData };
  }

  // ============================================================
  // INSTANSIASI CONTROLLER PER STATUS
  // ============================================================
  var HOLD_PAGE, ACC_PAGE, BL_PAGE;

  function initStatusPages() {
    HOLD_PAGE = createStatusPageCtrl({
      loadFn: 'getHoldList', pageId: 'pageHold',
      prefix: 'hold', statusName: 'hold', statusLabel: 'Hold'
    });
    ACC_PAGE = createStatusPageCtrl({
      loadFn: 'getAcceptedList', pageId: 'pageAccepted',
      prefix: 'acc', statusName: 'accepted', statusLabel: 'Accepted'
    });
    BL_PAGE = createStatusPageCtrl({
      loadFn: 'getBlacklistList', pageId: 'pageBlacklist',
      prefix: 'bl', statusName: 'blacklist', statusLabel: 'Blacklist'
    });

    // Refresh buttons
    var btnHoldRef = document.getElementById('btnHoldRefresh');
    var btnAccRef  = document.getElementById('btnAccRefresh');
    var btnBlRef   = document.getElementById('btnBlRefresh');
    if (btnHoldRef) btnHoldRef.addEventListener('click', function() { HOLD_PAGE.refresh(); });
    if (btnAccRef)  btnAccRef.addEventListener('click',  function() { ACC_PAGE.refresh(); });
    if (btnBlRef)   btnBlRef.addEventListener('click',   function() { BL_PAGE.refresh(); });

    // Tombol panel "Buat Offering Letter" di header AcceptedPage
    var btnOpenOffering = document.getElementById('btnOpenOfferingModal');
    if (btnOpenOffering) {
      btnOpenOffering.addEventListener('click', function() {
        openOfferingModal(null);
      });
    }

    // Tombol panel "Onboarding Probation" di header AcceptedPage
    var btnOpenOnboarding = document.getElementById('btnOpenOnboardingModal');
    if (btnOpenOnboarding) {
      btnOpenOnboarding.addEventListener('click', function() {
        openOnboardingModal(null);
      });
    }

    // Filter inputs
    (function() {
      var filterConfigs = [
        { prefix: 'hold', ctrl: null },
        { prefix: 'acc',  ctrl: null },
        { prefix: 'bl',   ctrl: null },
      ];
      // assign ctrl after instantiation
      filterConfigs[0].ctrl = HOLD_PAGE;
      filterConfigs[1].ctrl = ACC_PAGE;
      filterConfigs[2].ctrl = BL_PAGE;

      var resetIds = { hold: 'btnHoldReset', acc: 'btnAccReset', bl: 'btnBlReset' };

      filterConfigs.forEach(function(fc) {
        (function(prefix, ctrl) {
          var si = document.getElementById(prefix + 'SearchInput');
          var pf = document.getElementById(prefix + 'PositionFilter');
          var ss = document.getElementById(prefix + 'SortSelect');
          var rb = document.getElementById(resetIds[prefix]);
          if (si) si.addEventListener('input',  function() { if (ctrl.applyFilter) ctrl.applyFilter(); });
          if (pf) pf.addEventListener('change', function() { if (ctrl.applyFilter) ctrl.applyFilter(); });
          if (ss) ss.addEventListener('change', function() { if (ctrl.applyFilter) ctrl.applyFilter(); });
          if (rb) rb.addEventListener('click',  function() {
            if (si) si.value = '';
            if (pf) pf.value = '';
            if (ss) ss.value = 'newest';
            if (ctrl.applyFilter) ctrl.applyFilter();
          });
        })(fc.prefix, fc.ctrl);
      });
    })();

    // Move status modal
    initMoveStatusModal();

    // Offering letter modal
    initOfferingModal();

    // Offering response modal
    initOfferingResponseModal();

    // Onboarding probation modal
    initOnboardingModal();
  }

  // ============================================================
  // MOVE STATUS MODAL
  // ============================================================
  function openMoveStatusModal(recruitmentId, fromStatus) {
    var idEl   = document.getElementById('moveStatusRecruitmentId');
    var fromEl = document.getElementById('moveStatusFromStatus');
    var titleEl = document.getElementById('moveStatusModalTitle');
    var targetEl = document.getElementById('moveStatusTarget');
    var reasonEl = document.getElementById('moveStatusReason');
    var notesEl  = document.getElementById('moveStatusHrNotes');
    if (idEl)    idEl.value   = recruitmentId;
    if (fromEl)  fromEl.value = fromStatus;
    if (titleEl) titleEl.innerText = 'Ubah Status: ' + recruitmentId;
    if (reasonEl) reasonEl.value = '';
    if (notesEl)  notesEl.value  = '';

    // Exclude current status from dropdown
    if (targetEl) {
      Array.from(targetEl.options).forEach(function(opt) {
        opt.disabled = opt.value === fromStatus;
      });
      // Select first enabled
      var firstEnabled = Array.from(targetEl.options).find(function(o) { return !o.disabled; });
      if (firstEnabled) targetEl.value = firstEnabled.value;
    }

    var modal = bootstrap.Modal.getOrCreateInstance(document.getElementById('moveStatusModal'));
    modal.show();
  }

  function initMoveStatusModal() {
    var confirmBtn = document.getElementById('btnConfirmMoveStatus');
    if (!confirmBtn) return;
    confirmBtn.addEventListener('click', function() {
      var recruitmentId = (document.getElementById('moveStatusRecruitmentId') || {}).value;
      var fromStatus    = (document.getElementById('moveStatusFromStatus') || {}).value;
      var toStatus      = (document.getElementById('moveStatusTarget') || {}).value;
      var reason        = (document.getElementById('moveStatusReason') || {}).value;
      var hrNotes       = (document.getElementById('moveStatusHrNotes') || {}).value;

      if (!recruitmentId || !fromStatus || !toStatus) return;
      confirmBtn.disabled = true;

      google.script.run
        .withSuccessHandler(function(result) {
          confirmBtn.disabled = false;
          var modal = bootstrap.Modal.getInstance(document.getElementById('moveStatusModal'));
          if (modal) modal.hide();
          if (result && result.success) {
            showToast('Status berhasil diubah ke ' + toStatus + '.', 'success');
            // Refresh sumber dan tujuan
            var refreshMap = { 'Hold': HOLD_PAGE, 'Accepted': ACC_PAGE, 'Blacklist': BL_PAGE };
            if (refreshMap[fromStatus]) refreshMap[fromStatus].loadData(true);
            if (refreshMap[toStatus])   refreshMap[toStatus].loadData(true);
          } else {
            showToast('Gagal: ' + (result ? result.message : 'Unknown error'), 'error');
          }
        })
        .withFailureHandler(function(err) {
          confirmBtn.disabled = false;
          showToast('Error: ' + err.message, 'error');
        })
        .moveStatusCandidate(recruitmentId, fromStatus, toStatus, reason, hrNotes);
    });
  }

  // ============================================================
  // STATUS DRAWER — reuses existing Drawer partial in candidate mode
  // ============================================================
  function openStatusDrawer(row, statusLabel, statusName) {
    activeCandidateId = row.recruitmentId;
    setDrawerMode('candidate');

    var avatarEl = document.getElementById('drawerAvatar');
    if (avatarEl) avatarEl.innerText = initials(row.fullName);
    var nameEl = document.getElementById('drawerCandidateName');
    if (nameEl) nameEl.innerText = row.fullName || '-';
    var posEl = document.getElementById('drawerPosition');
    if (posEl) posEl.innerText = row.positionApplied || '-';

    // Badge utama status + badge offering response (jika ada)
    var badgeWrap = document.getElementById('drawerStatusBadgeWrap');
    if (badgeWrap) {
      var mainBadge = '<span class="badge-status lg ' + statusBadgeClass(statusLabel) + '">' +
        escapeHtml(statusLabel) + '</span>';

      var respBadge = '';
      if (statusName === 'accepted' && row.offeringResponse) {
        var respClass = 'hold'; // default: menunggu (kuning)
        var respIcon  = 'bi-hourglass-split';
        if (row.offeringResponse === 'Diterima') { respClass = 'accepted'; respIcon = 'bi-check-circle-fill'; }
      if (row.offeringResponse === 'Ditolak')  { respClass = 'blacklist'; respIcon = 'bi-x-circle-fill'; }
        respBadge = ' <span class="badge-status lg ' + respClass + '" style="font-size:10px">' +
          '<i class="bi ' + respIcon + ' me-1"></i>' + escapeHtml(row.offeringResponse) + '</span>';
      }
      badgeWrap.innerHTML = mainBadge + respBadge;
    }

    setDrawerMeta([
      { label: 'Recruitment ID', value: row.recruitmentId || '-' },
      { label: 'Status', value: statusLabel },
      { label: 'Diproses', value: row.processedDate || '-' }
    ]);

    var fields = {
      cvFullName: row.fullName, cvBirthDate: row.birthDate,
      cvAge: row.age ? row.age + ' Tahun' : '-',
      cvGender: row.gender || '-',
      cvMaritalStatus: row.maritalStatus, cvNik: row.nik,
      cvPhone: row.phone, cvEmail: row.email, cvAddress: row.address, cvCity: row.city,
      cvPosition: row.positionApplied, cvEducation: row.education,
      cvExperience: row.workExperience, cvLastCompany: row.lastCompany,
      cvEmploymentStatus: row.currentEmploymentStatus, cvAvailability: row.availableToJoin,
      cvSalary: formatRupiah(row.expectedSalary), cvSource: row.recruitmentSource
    };
    Object.keys(fields).forEach(function(id) {
      var el = document.getElementById(id);
      if (el) el.innerText = fields[id] || '-';
    });

    var notesEl = document.getElementById('cvHrNotes');
    if (notesEl) notesEl.value = row.hrNotes || '';
    var charEl = document.getElementById('notesCharCounter');
    if (charEl) charEl.innerText = (row.hrNotes || '').length + ' / 2000 karakter';
    var lastEl = document.getElementById('notesLastUpdated');
    if (lastEl) lastEl.innerText = row.updatedAt || row.processedDate || '-';
    var stateEl = document.getElementById('notesSaveState');
    if (stateEl) { stateEl.innerText = 'Tersimpan otomatis'; stateEl.className = 'notes-save-state'; }

    updateStatusButtonsUI(statusLabel);

    // Tampilkan tombol Update Respons Offering hanya untuk:
    // - status Accepted
    // - offering letter sudah pernah dibuat (offeringCreated terisi)
    var respWrap = document.getElementById('drawerOfferingRespWrap');
    var respBtn  = document.getElementById('btnUpdateOfferResp');
    if (respWrap) {
      var showRespBtn = statusName === 'accepted' &&
                        row.offeringCreated && row.offeringCreated !== '-';
      respWrap.style.display = showRespBtn ? 'block' : 'none';
    }
    if (respBtn) {
      respBtn.onclick = function() { openOfferingResponseModal(row); };
    }

    var tl = document.getElementById('drawerTimeline');
    if (tl) tl.innerHTML = '<div class="timeline-empty">Memuat riwayat...</div>';
    google.script.run
      .withSuccessHandler(function(events) { renderTimeline(events, row.createdDate); })
      .withFailureHandler(function()       { renderTimeline([], row.createdDate); })
      .getAuditLogForCandidate(row.recruitmentId);

    openDrawer();
  }

  // ============================================================
  // OFFERING LETTER MODAL
  // ============================================================
  var _offeringCurrentCandidate = null;
  // Memory store: { recruitmentId: { candidate, offerData, generatedBy } }
  var _offeringDataStore = {};

  function _setSelectOrValue(el, value) {
    if (!el || value == null || value === '') return;
    var val = String(value);
    if (el.tagName === 'SELECT') {
      var exists = Array.prototype.some.call(el.options, function (o) {
        return o.value === val;
      });
      if (!exists) {
        var opt = document.createElement('option');
        opt.value = val;
        opt.textContent = val;
        el.appendChild(opt);
      }
    }
    el.value = val;
  }

  function _suggestWorkingEmail(fullName) {
    if (!fullName) return '';
    var slug = String(fullName).toLowerCase().replace(/[^a-z0-9\s]/g, '').trim().replace(/\s+/g, '.');
    return slug ? slug + '@mito.co.id' : '';
  }

  function _suggestCostCenter(areaKerja, lokasiKerja) {
    var area = String(areaKerja || '');
    if (area === 'Head Office (HO)') return 'HRD';
    if (area === 'Pabrik') return 'Manufacture ' + (lokasiKerja || '');
    if (area.indexOf('Depo') !== -1) return area;
    return area;
  }

  function _normalizeOfferData(src, row) {
    src = src || {};
    row = row || {};
    var branchName = src.branchName || src.companyEntity || row.offeringBranchName || row.offeringCompanyEntity || '';
    return {
      branchName: branchName,
      companyEntity: branchName,
      position: src.position || row.offeringPosition || (row.positionApplied || ''),
      department: src.department || row.offeringDepartment || row.department || '',
      division: src.division || row.offeringDivision || '',
      jobLevel: src.jobLevel || row.offeringJobLevel || '',
      areaKerja: src.areaKerja || row.offeringAreaKerja || '',
      lokasiKerja: src.lokasiKerja || row.offeringLokasiKerja || row.city || '',
      salary: src.salary || row.offeringSalary || '',
      salaryBasic: src.salaryBasic || row.offeringSalaryBasic || '',
      allowPulsa: src.allowPulsa || row.offeringAllowPulsa || '',
      allowTransport: src.allowTransport || row.offeringAllowTransport || '',
      employmentStatus: src.employmentStatus || row.offeringEmploymentStatus || 'Perjanjian Kerja Waktu Tertentu',
      contractDuration: src.contractDuration || row.offeringContractDuration || '12 bulan',
      workingHours: src.workingHours || row.offeringWorkingHours || '',
      joinDate: src.joinDate || row.offeringJoinDate || '',
      notes: src.notes || row.offeringNotes || '',
    };
  }

  function _syncOfferSalaryTotal() {
    var basicEl = document.getElementById('offerSalaryBasic');
    var pulsaEl = document.getElementById('offerAllowPulsa');
    var transpEl = document.getElementById('offerAllowTransport');
    var totalEl = document.getElementById('offerSalary');
    if (!totalEl) return;
    function numOf(el) { return Number(String((el && el.value) || '').replace(/[^\d]/g, '')) || 0; }
    var total = numOf(basicEl) + numOf(pulsaEl) + numOf(transpEl);
    totalEl.value = total ? String(total) : '';
  }

  function _getMoney(id) {
    var el = document.getElementById(id);
    return el ? String(el.value).replace(/[^\d]/g, '') : '';
  }

  function _readOfferingForm() {
    var branchName = (document.getElementById('offerBranchName') || {}).value || '';
    var workingHoursInput = (document.getElementById('offerWorkingHours') || {}).value || '';
    var whPreset = (document.getElementById('offerWorkingHoursPreset') || {}).value || '';
    var workingHours = workingHoursInput || (whPreset === 'custom' ? '' : whPreset);
    return {
      branchName: branchName,
      companyEntity: branchName,
      position: (document.getElementById('offerPosition') || {}).value || '',
      department: (document.getElementById('offerDepartment') || {}).value || '',
      division: (document.getElementById('offerDivision') || {}).value || '',
      jobLevel: (document.getElementById('offerJobLevel') || {}).value || '',
      lokasiKerja: (document.getElementById('offerLokasiKerja') || {}).value || '',
      salary: (document.getElementById('offerSalary') || {}).value || '',
      salaryBasic: _getMoney('offerSalaryBasic'),
      allowPulsa: _getMoney('offerAllowPulsa'),
      allowTransport: _getMoney('offerAllowTransport'),
      employmentStatus: (document.getElementById('offerEmploymentStatus') || {}).value || '',
      contractDuration: (document.getElementById('offerContractDuration') || {}).value || '',
      workingHours: workingHours,
      joinDate: (document.getElementById('offerJoinDate') || {}).value || '',
    };
  }

  function _fillOfferingForm(src, row) {
    var data = _normalizeOfferData(src, row);
    _setSelectOrValue(document.getElementById('offerBranchName'), data.branchName);
    var posEl = document.getElementById('offerPosition');
    if (posEl) posEl.value = data.position || '';
    
    _setSelectOrValue(document.getElementById('offerDivision'), data.division);
    _setSelectOrValue(document.getElementById('offerJobLevel'), data.jobLevel);
    _setSelectOrValue(document.getElementById('offerAreaKerja'), data.areaKerja);
    var lokEl = document.getElementById('offerLokasiKerja');
    if (lokEl) lokEl.value = data.lokasiKerja || '';
    var salEl = document.getElementById('offerSalary');
    if (salEl) salEl.value = data.salary || '';
    var basicEl = document.getElementById('offerSalaryBasic');
    if (basicEl) basicEl.value = data.salaryBasic || '';
    var pulsaEl = document.getElementById('offerAllowPulsa');
    if (pulsaEl) pulsaEl.value = data.allowPulsa || '';
    var transpEl = document.getElementById('offerAllowTransport');
    if (transpEl) transpEl.value = data.allowTransport || '';
    _setSelectOrValue(document.getElementById('offerEmploymentStatus'), data.employmentStatus || 'Perjanjian Kerja Waktu Tertentu');
    _setSelectOrValue(document.getElementById('offerContractDuration'), data.contractDuration || '12 bulan');
    var whEl = document.getElementById('offerWorkingHours');
    if (whEl) whEl.value = data.workingHours || '';
    if (typeof _syncOfferSalaryTotal === 'function') _syncOfferSalaryTotal();
    var joinEl = document.getElementById('offerJoinDate');
    if (joinEl) {
      var normJoin = data.joinDate ? (typeof toDateInputValue === 'function' ? toDateInputValue(data.joinDate) : data.joinDate) : '';
      joinEl.value = normJoin || joinEl.value || '';
    }
    var notesEl = document.getElementById('offerNotes');
    if (notesEl) notesEl.value = data.notes || '';
  }

  // Buka modal offering — row bisa null (dari tombol panel) atau object kandidat (dari baris)
  function openOfferingModal(row) {
    _offeringCurrentCandidate = row || null;

    // Reset & isi search input
    var searchEl = document.getElementById('offeringCandidateSearch');
    var clearEl  = document.getElementById('offeringSearchClear');
    var dropEl   = document.getElementById('offeringSearchDropdown');
    if (searchEl) searchEl.value = row ? row.fullName : '';
    if (clearEl)  clearEl.style.display = row ? 'block' : 'none';
    if (dropEl)   dropEl.style.display  = 'none';

    _fillOfferingCandidatePreview(row);
    _updateOfferingGenerateBtn();

    // Default join date = today jika belum diisi
    var joinDateEl = document.getElementById('offerJoinDate');
    if (joinDateEl && !joinDateEl.value) {
      joinDateEl.value = new Date().toISOString().split('T')[0];
    }
    if (row) _fillOfferingForm(null, row);

    var modal = bootstrap.Modal.getOrCreateInstance(document.getElementById('offeringModal'));
    modal.show();
  }

  // Buka modal preview offering letter — load data dari store atau dari row spreadsheet
  function openOfferingPreviewModal(row) {
    var store = _offeringDataStore[row.recruitmentId];

    // Tentukan sumber data: dari memory store jika ada, fallback ke row (data dari spreadsheet)
    function hasData(d) {
      return d && (d.branchName || d.companyEntity || d.position || d.department || d.salary || d.joinDate);
    }
    var hasStoreData = !!(store && hasData(store.offerData));
    var ssOffer = _normalizeOfferData(null, row);
    var hasSsData = hasData(ssOffer);
    var offerData = hasStoreData ? _normalizeOfferData(store.offerData, row) : (hasSsData ? ssOffer : null);

    // Isi header preview
    var avatarEl  = document.getElementById('prevOfferCandAvatar');
    var nameEl    = document.getElementById('prevOfferCandName');
    var posEl     = document.getElementById('prevOfferCandPos');
    var ridEl     = document.getElementById('prevOfferCandRid');
    var createdEl = document.getElementById('prevOfferCreated');
    var updatedEl = document.getElementById('prevOfferUpdated');
    var byEl      = document.getElementById('prevOfferCreatedBy');

    if (avatarEl)  avatarEl.innerText  = initials(row.fullName);
    if (nameEl)    nameEl.innerText    = row.fullName || '-';
    if (posEl)     posEl.innerText     = row.positionApplied || '-';
    if (ridEl)     ridEl.innerText     = row.recruitmentId || '-';
    if (createdEl) createdEl.innerText = row.offeringCreated || '-';
    if (updatedEl) updatedEl.innerText = (row.offeringUpdated && row.offeringUpdated !== '-') ? row.offeringUpdated : '-';
    if (byEl)      byEl.innerText      = row.offeringCreatedBy || '-';

    // Isi detail penawaran (dari offerData jika ada)
    function disp(v) { return v ? v : '-'; }
    function dispRp(v) {
      if (!v || v === '-') return '-';
      var n = Number(String(v).replace(/[^\d]/g, ''));
      return isNaN(n) || n === 0 ? (String(v) || '-') : 'Rp ' + n.toLocaleString('id-ID');
    }
    var fields = {
      prevOfferCompany:          offerData ? disp(offerData.branchName || offerData.companyEntity) : '-',
      prevOfferPosition:         offerData ? disp(offerData.position)          : '-',
      prevOfferDept:             offerData ? disp(offerData.department)         : '-',
      prevOfferDivision:         offerData ? disp(offerData.division)           : '-',
      prevOfferJobLevel:         offerData ? disp(offerData.jobLevel)           : '-',
      prevOfferLokasiKerja:      offerData ? disp(offerData.lokasiKerja)        : '-',
      prevOfferSalaryBasic:      offerData ? dispRp(offerData.salaryBasic)      : '-',
      prevOfferAllowPulsa:       offerData ? dispRp(offerData.allowPulsa)       : '-',
      prevOfferAllowTransport:   offerData ? dispRp(offerData.allowTransport)   : '-',
      prevOfferSalary:           offerData ? dispRp(offerData.salary || offerData.salaryBasic) : '-',
      prevOfferJoinDate:         offerData ? disp(offerData.joinDate)           : '-',
      prevOfferContractDuration: offerData ? disp(offerData.contractDuration)   : '-',
      prevOfferEmploymentStatus: offerData ? disp(offerData.employmentStatus)   : '-',
      prevOfferWorkingHours:     offerData ? disp(offerData.workingHours)       : '-',
      prevOfferNotes:            offerData ? (offerData.notes   || '-')         : '-',
    };
    Object.keys(fields).forEach(function(id) {
      var el = document.getElementById(id);
      if (el) el.innerText = fields[id];
    });

    // Tampilkan warning hanya jika data TIDAK ADA di store DAN TIDAK ADA di spreadsheet
    var warningEl = document.getElementById('prevOfferNoDataWarn');
    if (warningEl) {
      warningEl.classList.toggle('d-none', !(!store && !hasSsData));
      warningEl.classList.toggle('d-flex', !store && !hasSsData);
    }

    // Candidate object untuk PDF: pakai store.candidate jika ada, fallback ke row
    var candForPdf = store ? store.candidate : row;

    // Simpan referensi untuk tombol download — enable jika ada offerData dari sumber apapun
    var dlBtn = document.getElementById('btnDownloadOffering');
    if (dlBtn) {
      dlBtn.onclick = function() {
        if (!offerData) {
          showToast('Data detail offering tidak tersedia. Klik Edit untuk mengisi detail offering terlebih dahulu.', 'warning', 5000);
          return;
        }
        dlBtn.disabled = true;
        dlBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>Mengunduh...';
        exportOfferingLetterPDF(candForPdf, offerData, function(success) {
          dlBtn.disabled = false;
          dlBtn.innerHTML = '<i class="bi bi-download me-1"></i>Download PDF';
          if (!success) showToast('Gagal mengunduh PDF.', 'error');
        });
      };
      dlBtn.disabled = !offerData;
    }

    // Tombol edit — buka kembali modal create dengan data yang sudah ada
    var editBtn = document.getElementById('btnEditOffering');
    if (editBtn) {
      editBtn.onclick = function() {
        var previewModal = bootstrap.Modal.getInstance(document.getElementById('offeringPreviewModal'));
        if (previewModal) previewModal.hide();
        setTimeout(function() {
          openOfferingModal(row);
          _fillOfferingForm(offerData, row);
          _updateOfferingGenerateBtn();
        }, 350);
      };
    }

    var modal = bootstrap.Modal.getOrCreateInstance(document.getElementById('offeringPreviewModal'));
    modal.show();
  }

  function _fillOfferingCandidatePreview(row) {
    var previewEl = document.getElementById('offeringCandidatePreview');
    var step2El   = document.getElementById('offeringStep2');
    if (!row) {
      if (previewEl) previewEl.style.display = 'none';
      if (step2El)   step2El.style.display   = 'none';
      return;
    }
    if (previewEl) previewEl.style.display = 'block';
    if (step2El)   step2El.style.display   = 'block';

    var avatarEl = document.getElementById('offeringCandAvatar');
    var nameEl   = document.getElementById('offeringCandName');
    var posEl    = document.getElementById('offeringCandPosition');
    var ridEl    = document.getElementById('offeringCandRecruitId');
    var nikEl    = document.getElementById('offeringCandNik');
    var emailEl  = document.getElementById('offeringCandEmail');
    var phoneEl  = document.getElementById('offeringCandPhone');
    var cityEl   = document.getElementById('offeringCandCity');

    if (avatarEl) avatarEl.innerText = initials(row.fullName);
    if (nameEl)   nameEl.innerText   = row.fullName        || '-';
    if (posEl)    posEl.innerText    = row.positionApplied || '-';
    if (ridEl)    ridEl.innerText    = row.recruitmentId   || '-';
    if (nikEl)    nikEl.innerText    = (row.nik   || '-').replace(/^'+/, '');
    if (emailEl)  { emailEl.innerText  = row.email || '-'; emailEl.title = row.email || ''; }
    if (phoneEl)  phoneEl.innerText  = (row.phone || '-').replace(/^'+/, '');
    if (cityEl)   cityEl.innerText   = row.city            || '-';

    if (row) {
      var lokEl = document.getElementById('offerLokasiKerja');
      if (lokEl && !lokEl.value) lokEl.value = row.city || '';
      var posEl = document.getElementById('offerPosition');
      if (posEl && !posEl.value) posEl.value = row.positionApplied || '';
    }

    // Panggil update button setelah step2 visible agar field terbaca
    setTimeout(_updateOfferingGenerateBtn, 0);
  }

  function _updateOfferingGenerateBtn() {
    var btn = document.getElementById('btnGenerateOffering');
    if (!btn) return;
    var hasCand   = !!_offeringCurrentCandidate;
    var hasEntity = !!((document.getElementById('offerBranchName') || {}).value);
    var hasPos    = !!((document.getElementById('offerPosition')      || {}).value);
    var basicEl   = document.getElementById('offerSalaryBasic');
    var hasSal    = !!((basicEl && basicEl.value) || (document.getElementById('offerSalary') || {}).value);
    var hasDate   = !!((document.getElementById('offerJoinDate')      || {}).value);
    btn.disabled  = !(hasCand && hasEntity && hasPos && hasSal && hasDate);
  }

  function initOfferingModal() {
    var searchEl = document.getElementById('offeringCandidateSearch');
    var clearEl  = document.getElementById('offeringSearchClear');
    var dropEl   = document.getElementById('offeringSearchDropdown');

    // ── Search kandidat live ─────────────────────────────────
    function renderSearchDropdown(query) {
      if (!dropEl) return;
      var q = (query || '').trim().toLowerCase();
      if (!q) { dropEl.style.display = 'none'; return; }

      var accData = (ACC_PAGE && ACC_PAGE._getData) ? ACC_PAGE._getData() : [];
      var matched = accData.filter(function(r) {
        // Kandidat yang sudah memiliki offering tidak boleh dibuatkan offering baru —
        // revisi dilakukan lewat tombol Edit (drawer / preview offering).
        var hasOffer = r.offeringCreated && r.offeringCreated !== '-' && r.offeringCreated !== '';
        if (hasOffer) return false;
        return (r.fullName || '').toLowerCase().indexOf(q) !== -1 ||
               (r.recruitmentId || '').toLowerCase().indexOf(q) !== -1;
      }).slice(0, 8);

      if (matched.length === 0) {
        dropEl.innerHTML = '<div class="px-3 py-2 text-muted" style="font-size:13px">Tidak ada kandidat ditemukan</div>';
        dropEl.style.display = 'block';
        return;
      }

      dropEl.innerHTML = matched.map(function(r) {
        var offerBadge = r.offeringCreated && r.offeringCreated !== '-'
          ? '<span class="badge text-bg-success ms-2" style="font-size:10px">Sudah Offering</span>'
          : '';
        return '<div class="offering-search-item px-3 py-2 d-flex align-items-center gap-2" ' +
          'style="cursor:pointer;border-bottom:1px solid #f0f0f0;font-size:13px" ' +
          'data-id="' + escapeHtml(r.recruitmentId) + '">' +
          '<div class="avatar-sm" style="width:28px;height:28px;font-size:11px;flex-shrink:0">' +
            escapeHtml(initials(r.fullName)) + '</div>' +
          '<div>' +
            '<div class="fw-semibold">' + escapeHtml(r.fullName) + offerBadge + '</div>' +
            '<div class="text-muted" style="font-size:11px">' +
              escapeHtml(r.positionApplied || '-') + ' · ' + escapeHtml(r.recruitmentId) +
            '</div>' +
          '</div></div>';
      }).join('');
      dropEl.style.display = 'block';

      dropEl.querySelectorAll('.offering-search-item').forEach(function(item) {
        item.addEventListener('mouseenter', function() { item.style.background = '#f0f7ff'; });
        item.addEventListener('mouseleave', function() { item.style.background = ''; });
        item.addEventListener('click', function() {
          var id = item.getAttribute('data-id');
          var found = (ACC_PAGE && ACC_PAGE._getData)
            ? ACC_PAGE._getData().find(function(r) { return r.recruitmentId === id; })
            : null;
          if (found) {
            _offeringCurrentCandidate = found;
            if (searchEl) searchEl.value = found.fullName;
            if (clearEl)  clearEl.style.display = 'block';
            dropEl.style.display = 'none';
            _fillOfferingCandidatePreview(found);
            _fillOfferingForm(null, found);
            _updateOfferingGenerateBtn();
          }
        });
      });
    }

    if (searchEl) {
      searchEl.addEventListener('input', function() {
        _offeringCurrentCandidate = null;
        _fillOfferingCandidatePreview(null);
        _updateOfferingGenerateBtn();
        if (clearEl) clearEl.style.display = searchEl.value ? 'block' : 'none';
        renderSearchDropdown(searchEl.value);
      });
    }
    if (clearEl) {
      clearEl.addEventListener('click', function() {
        if (searchEl) searchEl.value = '';
        clearEl.style.display = 'none';
        if (dropEl) dropEl.style.display = 'none';
        _offeringCurrentCandidate = null;
        _fillOfferingCandidatePreview(null);
        _updateOfferingGenerateBtn();
      });
    }
    // Tutup dropdown saat klik di luar modal
    document.addEventListener('click', function(e) {
      if (dropEl && !dropEl.contains(e.target) && e.target !== searchEl) {
        dropEl.style.display = 'none';
      }
    });

    // ── Live validation field wajib ──────────────────────────
    ['offerBranchName', 'offerPosition', 'offerDepartment', 'offerSalary', 'offerSalaryBasic', 'offerJoinDate'].forEach(function(id) {
      var el = document.getElementById(id);
      if (el) { el.addEventListener('input', _updateOfferingGenerateBtn); el.addEventListener('change', _updateOfferingGenerateBtn); }
    });

    // ── Reset saat modal ditutup ─────────────────────────────
    var modalEl = document.getElementById('offeringModal');
    if (modalEl) {
      modalEl.addEventListener('hidden.bs.modal', function() {
        _offeringCurrentCandidate = null;
        ['offerPosition','offerSalary','offerSalaryBasic','offerAllowPulsa','offerAllowTransport',
         'offerJobLevel','offerAreaKerja','offerLokasiKerja','offerNotes','offerWorkingHours',
         'offerWorkingHoursPreset','offerJoinDate','offerEmploymentStatus','offerContractDuration'].forEach(function(id) {
          var el = document.getElementById(id); if (el) el.value = '';
        });
        ['offerBranchName','offerDivision'].forEach(function(id) {
          var sel = document.getElementById(id);
          if (sel) sel.value = '';
        });
        var previewEl = document.getElementById('offeringCandidatePreview');
        if (previewEl) previewEl.style.display = 'none';
        var step2El = document.getElementById('offeringStep2');
        if (step2El) step2El.style.display = 'none';
        if (searchEl) searchEl.value = '';
        if (clearEl)  clearEl.style.display = 'none';
        if (dropEl)   dropEl.style.display  = 'none';
        var btn = document.getElementById('btnGenerateOffering');
        if (btn) btn.disabled = true;
      });
    }

    // ── Auto-hitung Total Gaji (Gaji Pokok + Tunjangan) → offerSalary ──
    ['offerSalaryBasic','offerAllowPulsa','offerAllowTransport'].forEach(function(id) {
      var el = document.getElementById(id);
      if (el) {
        el.addEventListener('input', function() { _syncOfferSalaryTotal(); });
        el.addEventListener('change', function() { _syncOfferSalaryTotal(); });
      }
    });

    // ── Preset Jam Kerja ──
    var whPresetEl = document.getElementById('offerWorkingHoursPreset');
    var whInputEl  = document.getElementById('offerWorkingHours');
    if (whPresetEl && whInputEl) {
      whPresetEl.addEventListener('change', function() {
        var v = whPresetEl.value;
        if (v && v !== 'custom') whInputEl.value = v;
        else if (v === 'custom' && !whInputEl.value) whInputEl.value = whInputEl.getAttribute('placeholder') || '';
      });
    }

    // ── Helper format mata uang ──
    function getMoney(id) {
      var el = document.getElementById(id);
      return el ? String(el.value).replace(/[^\d]/g, '') : '';
    }

    // Listener untuk input angka otomatis (pemisah ribuan)
    document.querySelectorAll('.money-input').forEach(function(el) {
      el.addEventListener('input', function(e) {
        var raw = e.target.value.replace(/[^\d]/g, '');
        e.target.value = raw ? raw.replace(/\B(?=(\d{3})+(?!\d))/g, ".") : '';
        _syncOfferSalaryTotal();
      });
    });

    // ── Submit: simpan ke memory + backend ────
    var genBtn = document.getElementById('btnGenerateOffering');
    if (genBtn) {
      genBtn.addEventListener('click', function() {
        if (!_offeringCurrentCandidate) return;
        var offerData = _readOfferingForm();

        var textEl = document.getElementById('btnOfferingText');
        var loadEl = document.getElementById('btnOfferingLoading');
        genBtn.disabled = true;
        if (textEl) textEl.style.display = 'none';
        if (loadEl) loadEl.style.display = 'inline-flex';

        var candidateId = _offeringCurrentCandidate.recruitmentId;
        var generatedBy = (typeof currentUser !== 'undefined' && currentUser && currentUser.email)
          ? currentUser.email : 'HR Dashboard';

        // Simpan offerData ke memory — key by recruitmentId
        _offeringDataStore[candidateId] = {
          candidate: _offeringCurrentCandidate,
          offerData: offerData,
          generatedBy: generatedBy,
        };

        // Simpan ke backend (tanpa PDF)
        google.script.run
          .withSuccessHandler(function(res) {
            genBtn.disabled = false;
            if (textEl) textEl.style.display = 'inline-flex';
            if (loadEl) loadEl.style.display = 'none';

            if (res && res.success) {
              if (ACC_PAGE) ACC_PAGE.loadData(true);
              showToast('Offering letter tersimpan. Klik ikon 👁 untuk preview & download PDF.', 'success', 5000);
            } else {
              showToast('Gagal menyimpan: ' + (res ? res.message : 'Error'), 'error');
            }
            var modal = bootstrap.Modal.getInstance(document.getElementById('offeringModal'));
            if (modal) modal.hide();
          })
          .withFailureHandler(function(err) {
            genBtn.disabled = false;
            if (textEl) textEl.style.display = 'inline-flex';
            if (loadEl) loadEl.style.display = 'none';
            showToast('Error: ' + (err ? err.message : 'Unknown'), 'error');
          })
          .saveOfferingStatus(candidateId, generatedBy, offerData);
      });
    }
  }

  // ============================================================
  // OFFERING RESPONSE MODAL
  // ============================================================
  var _activeOfferRespRow = null; // referensi row saat ini untuk update in-memory

  function openOfferingResponseModal(row) {
    _activeOfferRespRow = row; // simpan reference untuk sukses handler
    var idEl   = document.getElementById('offerRespRecruitmentId');
    var nameEl = document.getElementById('offerRespCandName');
    if (idEl)   idEl.value   = row.recruitmentId || '';
    if (nameEl) nameEl.innerText = (row.fullName || '-') + ' · ' + (row.recruitmentId || '');

    // Default "Menunggu" jika belum ada response
    var defaultResp = 'Menunggu';
    var currentResp = row.offeringResponse || '';
    if (!currentResp || currentResp === '-') currentResp = defaultResp;

    // Set nilai ke hidden input & render style
    var hiddenEl = document.getElementById('offerRespValue');
    if (hiddenEl) hiddenEl.value = currentResp;
    _updateOfferRespOptionStyles();

    var notesEl = document.getElementById('offerRespNotes');
    if (notesEl) notesEl.value = row.offeringResponseNotes || '';

    var confirmBtn = document.getElementById('btnConfirmOfferResp');
    if (confirmBtn) confirmBtn.disabled = false; // selalu enable karena ada default value

    var modal = bootstrap.Modal.getOrCreateInstance(document.getElementById('offeringResponseModal'));
    modal.show();
  }

  function _updateOfferRespOptionStyles() {
    var colorMap = {
      'Menunggu': { border: '#d97706', bg: '#fffbeb' },
      'Diterima': { border: '#166534', bg: '#f0fdf4' },
      'Ditolak':  { border: '#991b1b', bg: '#fff1f2' },
    };
    var selectedVal = (document.getElementById('offerRespValue') || {}).value || '';
    document.querySelectorAll('.offer-resp-opt').forEach(function(opt) {
      var val   = opt.getAttribute('data-value');
      var dot   = opt.querySelector('.offer-resp-dot');
      var inner = opt.querySelector('.offer-resp-dot-inner');
      var isSelected = val === selectedVal;
      var colors = colorMap[val] || { border: '#e5e7eb', bg: '' };

      opt.style.borderColor = isSelected ? colors.border : '#e5e7eb';
      opt.style.background  = isSelected ? colors.bg : '';

      if (dot) {
        dot.style.borderColor  = isSelected ? colors.border : '#d1d5db';
        dot.style.background   = isSelected ? colors.border : 'transparent';
      }
      if (inner) {
        inner.style.background = isSelected ? '#fff' : 'transparent';
      }
    });
  }

  function initOfferingResponseModal() {
    // Click handler untuk custom card-style option selector
    document.querySelectorAll('.offer-resp-opt').forEach(function(opt) {
      opt.addEventListener('click', function() {
        var val = opt.getAttribute('data-value');
        var hiddenEl = document.getElementById('offerRespValue');
        if (hiddenEl) hiddenEl.value = val;
        _updateOfferRespOptionStyles();
        var confirmBtn = document.getElementById('btnConfirmOfferResp');
        if (confirmBtn) confirmBtn.disabled = false;
      });
    });

    var confirmBtn = document.getElementById('btnConfirmOfferResp');
    if (confirmBtn) {
      confirmBtn.addEventListener('click', function() {
        var recruitmentId = (document.getElementById('offerRespRecruitmentId') || {}).value;
        var response = (document.getElementById('offerRespValue') || {}).value || '';
        var notes    = (document.getElementById('offerRespNotes') || {}).value || '';
        if (!recruitmentId || !response) return;

        var origBtnHtml = confirmBtn.innerHTML;
        confirmBtn.disabled = true;
        confirmBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>Menyimpan...';
        var generatedBy = (typeof currentUser !== 'undefined' && currentUser && currentUser.email)
          ? currentUser.email : 'HR Dashboard';

        google.script.run
          .withSuccessHandler(function(res) {
            confirmBtn.disabled = false;
            confirmBtn.innerHTML = origBtnHtml;
            var modal = bootstrap.Modal.getInstance(document.getElementById('offeringResponseModal'));
            if (modal) modal.hide();
            if (res && res.success) {
              // Update object row di memory agar modal selanjutnya pre-select nilai terbaru
              if (_activeOfferRespRow) {
                _activeOfferRespRow.offeringResponse      = response;
                _activeOfferRespRow.offeringResponseNotes = notes;
              }

              showToast('Respons offering berhasil disimpan: <strong>' + escapeHtml(response) + '</strong>', 'success', 4000);

              // Update badge di drawer header secara live tanpa reload penuh
              var badgeWrap = document.getElementById('drawerStatusBadgeWrap');
              if (badgeWrap) {
                var respClass = 'hold';
                var respIcon  = 'bi-hourglass-split';
                if (response === 'Diterima') { respClass = 'accepted'; respIcon = 'bi-check-circle-fill'; }
                if (response === 'Ditolak')  { respClass = 'blacklist'; respIcon = 'bi-x-circle-fill'; }

                // Pertahankan badge status utama (Accepted), tambah/ganti badge respons
                var mainBadge = badgeWrap.querySelector('.badge-status.lg:first-child');
                var mainHtml  = mainBadge ? mainBadge.outerHTML : '<span class="badge-status lg accepted">Accepted</span>';
                var respHtml  = ' <span class="badge-status lg ' + respClass + '" style="font-size:10px">' +
                  '<i class="bi ' + respIcon + ' me-1"></i>' + escapeHtml(response) + '</span>';
                badgeWrap.innerHTML = mainHtml + respHtml;
              }

              // Update label tombol di footer drawer
              var respBtn = document.getElementById('btnUpdateOfferResp');
              if (respBtn) {
                respBtn.innerHTML = '<i class="bi bi-reply-fill me-1"></i>Update Respons Offering';
              }

              // Reload data ACC_PAGE di background agar tabel sinkron
              if (ACC_PAGE) ACC_PAGE.loadData(true);
            } else {
              showToast('Gagal: ' + (res ? res.message : 'Error'), 'error');
            }
          })
          .withFailureHandler(function(err) {
            confirmBtn.disabled = false;
            confirmBtn.innerHTML = origBtnHtml;
            showToast('Error: ' + (err ? err.message : 'Unknown'), 'error');
          })
          .saveOfferingResponse(recruitmentId, response, notes, generatedBy);
      });
    }
  }

  // ============================================================
  // ONBOARDING PROBATION MODAL
  // Flow: search kandidat (Accepted + Diterima) → isi form kontrak
  // ============================================================
  var _activeOnboardingRow = null;

  function openOnboardingModal(row) {
    // row bisa null (dari tombol panel) atau object (dipanggil langsung)
    _activeOnboardingRow = row || null;

    var searchEl = document.getElementById('onboardingCandSearch');
    var clearEl  = document.getElementById('onboardingSearchClear');
    var dropEl   = document.getElementById('onboardingSearchDropdown');

    if (searchEl) searchEl.value = row ? row.fullName : '';
    if (clearEl)  clearEl.style.display = row ? 'block' : 'none';
    if (dropEl)   dropEl.style.display  = 'none';

    _fillOnboardingCandPreview(row);
    _updateOnboardingConfirmBtn();

    // Default join date = hari ini
    var joinEl = document.getElementById('onbJoinDate');
    if (joinEl && !joinEl.value) joinEl.value = new Date().toISOString().split('T')[0];

    var modal = bootstrap.Modal.getOrCreateInstance(document.getElementById('onboardingModal'));
    modal.show();
  }

  function _fillOnboardingCandPreview(row) {
    var previewEl = document.getElementById('onboardingCandPreview');
    if (!row) {
      if (previewEl) previewEl.style.display = 'none';
      return;
    }
    if (previewEl) previewEl.style.display = 'block';

    var avatarEl  = document.getElementById('onboardingCandAvatar');
    var nameEl    = document.getElementById('onboardingCandName');
    var posEl     = document.getElementById('onboardingCandPosition');
    var emailEl   = document.getElementById('onboardingCandEmail');
    var ridEl     = document.getElementById('onboardingCandRid');
    var empIdEl   = document.getElementById('onboardingCandEmpId');
    var hidRidEl  = document.getElementById('onboardingRecruitmentId');
    var hidEmpEl  = document.getElementById('onboardingEmployeeId');

    if (avatarEl) avatarEl.innerText  = initials(row.fullName);
    if (nameEl)   nameEl.innerText    = row.fullName        || '-';
    if (posEl)    posEl.innerText     = row.positionApplied || '-';
    if (emailEl)  emailEl.innerText   = row.email           || '-';
    if (ridEl)    ridEl.innerText     = row.recruitmentId   || '-';
    if (empIdEl)  empIdEl.innerText   = row.employeeId      || '-';
    if (hidRidEl) hidRidEl.value      = row.recruitmentId   || '';
    if (hidEmpEl) hidEmpEl.value      = row.employeeId      || '';

    // Pre-fill dari Offering Letter — field selaras EMPLOYEE_HEADERS
    var offer = _normalizeOfferData(null, row);

    _setSelectOrValue(document.getElementById('onbBranchName'), offer.branchName);
    _setSelectOrValue(document.getElementById('onbDivision'), offer.division);
    _setSelectOrValue(document.getElementById('onbDepartment'), offer.department);

    var posInput = document.getElementById('onbPosition');
    if (posInput) posInput.value = offer.position || '';

    var directSup = document.getElementById('onbDirectSuperior');
    if (directSup) directSup.value = offer.directSuperior || '';

    var joinInput = document.getElementById('onbJoinDate');
    if (joinInput && offer.joinDate) {
      var normJoin = typeof toDateInputValue === 'function' ? toDateInputValue(offer.joinDate) : offer.joinDate;
      if (normJoin) joinInput.value = normJoin;
    } else if (joinInput && !joinInput.value) {
      joinInput.value = new Date().toISOString().substring(0, 10);
    }

    var durSel = document.getElementById('onbContractDuration');
    if (durSel && !durSel.value) durSel.value = '12 Bulan';

    var docDateEl = document.getElementById('onbDocDate');
    if (docDateEl && !docDateEl.value) {
      docDateEl.value = new Date().toISOString().substring(0, 10);
    }

    var jamEl = document.getElementById('onbJamMasuk');
    if (jamEl && !jamEl.value) jamEl.value = 'mulai pukul 07.00 WIB dan selambat-lambatnya sampai dengan pukul 07.15 WIB';

    var wsEl = document.getElementById('onbWorkSchedule');
    if (wsEl && !wsEl.value) wsEl.value = 'Normal';

    var salInput = document.getElementById('onbSalaryBasic');
    if (salInput) salInput.value = offer.salary ? 'Rp ' + String(offer.salary).replace(/[^\d]/g, '').replace(/\B(?=(\d{3})+(?!\d))/g, '.') : (row.expectedSalary || '');

    var allowInput = document.getElementById('onbSalaryAllowance');
    if (allowInput) allowInput.value = offer.allowTransport || offer.allowPulsa || '';

    if (typeof _calcOnboardingEndDate === 'function') _calcOnboardingEndDate();

    // Klausul jangka waktu (free text) — di-generate dari join/durasi/akhir kontrak
    // (dibuat setelah end date terhitung agar tanggal akhir kontrak terisi)
    var tenorEl = document.getElementById('onbTenorText');
    var joinV = (document.getElementById('onbJoinDate') || {}).value || '';
    var durV = (durSel && durSel.value) || '12 Bulan';
    var endV = (document.getElementById('onbContractEnd') || {}).value || '';
    if (tenorEl && !tenorEl.value) {
      var monthsNum = 12;
      var mm = String(durV).match(/^(\d+)\s*bulan/i);
      var yy = String(durV).match(/^(\d+)\s*tahun/i);
      if (mm) monthsNum = parseInt(mm[1], 10);
      else if (yy) monthsNum = parseInt(yy[1], 10) * 12;
      var durWords = numToWords(monthsNum);
      var clause = 'PIHAK PERTAMA dengan ini menyatakan persetujuannya untuk mempekerjakan PIHAK KEDUA sebagai Karyawan PIHAK PERTAMA dengan jangka waktu ' +
        monthsNum + ' (' + durWords + ') bulan terhitung sejak tanggal ' + fmtDateLongIndonesia(joinV) +
        ' sampai dengan tanggal ' + fmtDateLongIndonesia(endV) + '.';
      tenorEl.value = clause;
    }

    setTimeout(_updateOnboardingConfirmBtn, 0);
  }

  function _updateOnboardingConfirmBtn() {
    var confirmBtn = document.getElementById('btnConfirmOnboarding');
    if (!confirmBtn) return;
    var hasCand      = !!_activeOnboardingRow;
    var hasBranch    = !!((document.getElementById('onbBranchName')       || {}).value);
    var hasDept      = !!((document.getElementById('onbDepartment')       || {}).value);
    var hasPos       = !!((document.getElementById('onbPosition')         || {}).value);
    var hasDuration  = !!((document.getElementById('onbContractDuration') || {}).value);
    var hasJoin      = !!((document.getElementById('onbJoinDate')        || {}).value);
    confirmBtn.disabled = !(hasCand && hasBranch && hasDept && hasPos && hasDuration && hasJoin);
  }

  function _calcOnboardingEndDate() {
    var startEl    = document.getElementById('onbJoinDate');
    var durationEl = document.getElementById('onbContractDuration');
    var endEl      = document.getElementById('onbContractEnd');
    var hintEl     = document.getElementById('onbContractEndHint');
    if (!startEl || !durationEl || !endEl || !startEl.value || !durationEl.value) return;
    var months = 12;
    var durVal = durationEl.value.toLowerCase();
    var monthMatch = durVal.match(/^(\d+)\s*bulan/i);
    var yearMatch = durVal.match(/^(\d+)\s*tahun/i);
    if (monthMatch) {
      months = parseInt(monthMatch[1], 10);
    } else if (yearMatch) {
      months = parseInt(yearMatch[1], 10) * 12;
    }

    var startDate = new Date(startEl.value);
    startDate.setMonth(startDate.getMonth() + months);
    // kurangi 1 hari agar tepat akhir periode kontrak
    startDate.setDate(startDate.getDate() - 1);
    var yyyy = startDate.getFullYear();
    var mm   = String(startDate.getMonth() + 1).padStart(2, '0');
    var dd   = String(startDate.getDate()).padStart(2, '0');
    endEl.value = yyyy + '-' + mm + '-' + dd;
    if (hintEl) hintEl.innerText = 'Auto-hitung dari durasi ' + durationEl.value;
  }

  function initOnboardingModal() {
    var searchEl = document.getElementById('onboardingCandSearch');
    var clearEl  = document.getElementById('onboardingSearchClear');
    var dropEl   = document.getElementById('onboardingSearchDropdown');

    // ── Live search dropdown ─────────────────────────────────
    function renderOnboardingDropdown(query) {
      if (!dropEl) return;
      var q = (query || '').trim().toLowerCase();
      if (!q) { dropEl.style.display = 'none'; return; }

      var accData = (ACC_PAGE && ACC_PAGE._getData) ? ACC_PAGE._getData() : [];
      // Filter: hanya yang Accepted + offeringResponse = Diterima
      var matched = accData.filter(function(r) {
        var eligible = r.offeringResponse === 'Diterima';
        var notYet   = !r.onboardingStatus || r.onboardingStatus === '' || r.onboardingStatus === 'Belum Onboarding';
        var nameMatch = (r.fullName || '').toLowerCase().indexOf(q) !== -1;
        var idMatch   = (r.recruitmentId || '').toLowerCase().indexOf(q) !== -1;
        return eligible && notYet && (nameMatch || idMatch);
      }).slice(0, 8);

      if (matched.length === 0) {
        dropEl.innerHTML = '<div class="px-3 py-2 text-muted" style="font-size:13px">Tidak ada kandidat yang memenuhi syarat (harus: Accepted + Offering Diterima + belum kontrak PKWT)</div>';
        dropEl.style.display = 'block';
        return;
      }

      dropEl.innerHTML = matched.map(function(r) {
        return '<div class="onb-search-item px-3 py-2 d-flex align-items-center gap-2" ' +
          'style="cursor:pointer;border-bottom:1px solid #f0f0f0;font-size:13px" ' +
          'data-id="' + escapeHtml(r.recruitmentId) + '">' +
          '<div class="avatar-sm" style="width:28px;height:28px;font-size:11px;flex-shrink:0;background:var(--color-primary);color:#fff;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:700">' +
            escapeHtml(initials(r.fullName)) + '</div>' +
          '<div>' +
            '<div class="fw-semibold">' + escapeHtml(r.fullName) + '</div>' +
            '<div class="text-muted" style="font-size:11px">' +
              escapeHtml(r.positionApplied || '-') + ' · ' + escapeHtml(r.recruitmentId) +
              ' · <span style="color:#166534">Offering Diterima</span>' +
            '</div>' +
          '</div></div>';
      }).join('');
      dropEl.style.display = 'block';

      dropEl.querySelectorAll('.onb-search-item').forEach(function(item) {
        item.addEventListener('mouseenter', function() { item.style.background = '#f0f7ff'; });
        item.addEventListener('mouseleave', function() { item.style.background = ''; });
        item.addEventListener('click', function() {
          var id    = item.getAttribute('data-id');
          var found = (ACC_PAGE && ACC_PAGE._getData)
            ? ACC_PAGE._getData().find(function(r) { return r.recruitmentId === id; })
            : null;
          if (found) {
            _activeOnboardingRow = found;
            if (searchEl) searchEl.value = found.fullName;
            if (clearEl)  clearEl.style.display = 'block';
            dropEl.style.display = 'none';
            _fillOnboardingCandPreview(found);
          }
        });
      });
    }

    if (searchEl) {
      searchEl.addEventListener('input', function() {
        _activeOnboardingRow = null;
        _fillOnboardingCandPreview(null);
        _updateOnboardingConfirmBtn();
        if (clearEl) clearEl.style.display = searchEl.value ? 'block' : 'none';
        renderOnboardingDropdown(searchEl.value);
      });
    }
    if (clearEl) {
      clearEl.addEventListener('click', function() {
        if (searchEl) searchEl.value = '';
        clearEl.style.display = 'none';
        if (dropEl) dropEl.style.display = 'none';
        _activeOnboardingRow = null;
        _fillOnboardingCandPreview(null);
        _updateOnboardingConfirmBtn();
      });
    }
    // Tutup dropdown klik di luar
    document.addEventListener('click', function(e) {
      if (dropEl && !dropEl.contains(e.target) && e.target !== searchEl) {
        dropEl.style.display = 'none';
      }
    });

    // ── Live validation field wajib ──────────────────────────
    ['onbBranchName','onbDepartment','onbPosition','onbContractDuration','onbJoinDate'].forEach(function(id) {
      var el = document.getElementById(id);
      if (el) {
        el.addEventListener('input',  _updateOnboardingConfirmBtn);
        el.addEventListener('change', _updateOnboardingConfirmBtn);
      }
    });

  // ── Auto-hitung end date ─────────────────────────────────
    var durationEl = document.getElementById('onbContractDuration');
    var joinDateEl = document.getElementById('onbJoinDate');
    if (durationEl) durationEl.addEventListener('change', function() { _calcOnboardingEndDate(); _updateOnboardingConfirmBtn(); });
    if (joinDateEl) joinDateEl.addEventListener('change', function() { _calcOnboardingEndDate(); _updateOnboardingConfirmBtn(); });

    // ── Reset saat modal ditutup ─────────────────────────────
    var modalEl = document.getElementById('onboardingModal');
    if (modalEl) {
      modalEl.addEventListener('hidden.bs.modal', function() {
        _activeOnboardingRow = null;
        if (searchEl) searchEl.value = '';
        if (clearEl)  clearEl.style.display = 'none';
        if (dropEl)   dropEl.style.display  = 'none';
        var previewEl = document.getElementById('onboardingCandPreview');
        if (previewEl) previewEl.style.display = 'none';
        ['onbBranchName','onbDivision','onbDepartment','onbPosition','onbDirectSuperior',
         'onbJoinDate','onbContractNumber','onbContractDuration',
         'onbContractEnd','onbSalaryBasic','onbSalaryAllowance','onbDocDate','onbJamMasuk',
         'onbWorkSchedule','onbTenorText'].forEach(function(fid) {
          var el = document.getElementById(fid); if (el) el.value = '';
        });
        var hintEl = document.getElementById('onbContractEndHint');
        if (hintEl) hintEl.innerText = 'Terisi otomatis dari durasi kontrak';
        var confirmBtn = document.getElementById('btnConfirmOnboarding');
        if (confirmBtn) confirmBtn.disabled = true;
        var textEl = document.getElementById('btnOnboardingText');
        var loadEl = document.getElementById('btnOnboardingLoading');
        if (textEl) textEl.style.display = 'inline-flex';
        if (loadEl) loadEl.style.display = 'none';
      });
    }

    // ── Submit Kontrak PKWT ──────────────────────────────────
    var confirmBtn = document.getElementById('btnConfirmOnboarding');
    if (confirmBtn) {
      confirmBtn.addEventListener('click', function() {
        var recruitmentId = (document.getElementById('onboardingRecruitmentId') || {}).value;
        if (!recruitmentId) return;

        var contractData = {
          employeeId:       (document.getElementById('onboardingEmployeeId') || {}).value || '',
          branchName:       (document.getElementById('onbBranchName')       || {}).value || '',
          division:         (document.getElementById('onbDivision')         || {}).value || '',
          department:       (document.getElementById('onbDepartment')       || {}).value || '',
          position:         (document.getElementById('onbPosition')         || {}).value || '',
          directSuperior:   (document.getElementById('onbDirectSuperior')   || {}).value || '',
          joinDate:         (document.getElementById('onbJoinDate')         || {}).value || '',
          contractNumber:   (document.getElementById('onbContractNumber')   || {}).value || '',
          contractDuration: (document.getElementById('onbContractDuration') || {}).value || '',
          contractStart:    (document.getElementById('onbJoinDate')         || {}).value || '',
          contractEnd:      (document.getElementById('onbContractEnd')      || {}).value || '',
          salaryBasic:      (document.getElementById('onbSalaryBasic')      || {}).value || '',
          salaryAllowance:  (document.getElementById('onbSalaryAllowance')  || {}).value || '',
          docDate:          (document.getElementById('onbDocDate')          || {}).value || '',
          jamMasuk:         (document.getElementById('onbJamMasuk')         || {}).value || '',
          workSchedule:     (document.getElementById('onbWorkSchedule')     || {}).value || '',
          tenorText:        (document.getElementById('onbTenorText')        || {}).value || '',
        };

        var processedBy = (typeof currentUser !== 'undefined' && currentUser && currentUser.email)
          ? currentUser.email : 'HR Dashboard';

        var textEl = document.getElementById('btnOnboardingText');
        var loadEl = document.getElementById('btnOnboardingLoading');
        confirmBtn.disabled = true;
        if (textEl) textEl.style.display = 'none';
        if (loadEl) loadEl.style.display = 'inline-flex';

        google.script.run
          .withSuccessHandler(function(res) {
            confirmBtn.disabled = false;
            if (textEl) textEl.style.display = 'inline-flex';
            if (loadEl) loadEl.style.display = 'none';

            var modal = bootstrap.Modal.getInstance(document.getElementById('onboardingModal'));
            if (modal) modal.hide();

            if (res && res.success) {
              if (_activeOnboardingRow) {
                _activeOnboardingRow.onboardingStatus = 'Contract';
                _activeOnboardingRow.onboardingDate   = res.onboardingDate || '';
                _activeOnboardingRow.onboardingBy     = res.onboardingBy   || '';
              }
              var candidateName = (_activeOnboardingRow || {}).fullName || (res.candidateData || {}).fullName || 'Karyawan';
              showToast(
                'Kontrak PKWT berhasil diproses! <strong>' + escapeHtml(candidateName) +
                '</strong> kini berstatus <strong>Contract</strong>.',
                'success', 5000
              );

              // Auto-generate dan download PDF Kontrak PKWT
              if (typeof exportKontrakPKWTPDF === 'function') {
                exportKontrakPKWTPDF(res.candidateData || _activeOnboardingRow, res.contractData || contractData);
              }

              if (ACC_PAGE) ACC_PAGE.loadData(true);
              if (typeof empLoadAll === 'function') empLoadAll();
            } else {
              showToast('Gagal proses kontrak: ' + (res ? res.message : 'Error'), 'error');
            }
          })
          .withFailureHandler(function(err) {
            confirmBtn.disabled = false;
            if (textEl) textEl.style.display = 'inline-flex';
            if (loadEl) loadEl.style.display = 'none';
            showToast('Error: ' + (err ? err.message : 'Unknown'), 'error');
          })
          .processContractOnboarding(recruitmentId, contractData.employeeId, contractData, processedBy);
      });
    }
  }

  // ============================================================
  // NAVIGATE HOOKS — dipanggil dari router
  // ============================================================
  function holdOnNavigate()      { if (HOLD_PAGE) HOLD_PAGE.onNavigate(); }
  function acceptedOnNavigate()  { if (ACC_PAGE)  ACC_PAGE.onNavigate(); }
  function blacklistOnNavigate() { if (BL_PAGE)   BL_PAGE.onNavigate(); }
</script>
