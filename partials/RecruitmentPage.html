<!-- partials/RecruitmentPage.html — RECRUITMENT IN-PAGE SECTION (inside Dashboard) -->
<section class="page-section" id="pageRecruitment">

  <!-- Stat cards -->
  <div class="row g-3 mb-4">
    <div class="col-6 col-md-3">
      <div class="stat-card">
        <div class="stat-icon bg-blue"><i class="bi bi-people-fill"></i></div>
        <div><div class="stat-label">Total</div><div class="stat-value" id="recStatTotal">0</div></div>
      </div>
    </div>
    <div class="col-6 col-md-3">
      <div class="stat-card">
        <div class="stat-icon bg-gold"><i class="bi bi-hourglass-split"></i></div>
        <div><div class="stat-label">Pending</div><div class="stat-value" id="recStatPending">0</div></div>
      </div>
    </div>
    <div class="col-6 col-md-3">
      <div class="stat-card">
        <div class="stat-icon" style="background:#f0f4ff"><i class="bi bi-briefcase-fill" style="color:#005BAC"></i></div>
        <div><div class="stat-label">Posisi Unik</div><div class="stat-value" id="recStatPositions">0</div></div>
      </div>
    </div>
    <div class="col-6 col-md-3">
      <div class="stat-card">
        <div class="stat-icon" style="background:#f0fdf4"><i class="bi bi-geo-alt-fill" style="color:#166534"></i></div>
        <div><div class="stat-label">Kota</div><div class="stat-value" id="recStatCities">0</div></div>
      </div>
    </div>
  </div>

  <!-- NOTE: CandidateTable partial is inlined here — Apps Script include() does NOT
       support nested <?!= ?> tags, so the full panel HTML is written directly. -->

  <!-- Table panel -->
  <div class="panel" id="tablePanel">
    <div class="panel-header">
      <div>
        <h6>Data Kandidat</h6>
        <div class="panel-subtitle" id="panelSubtitle">Memuat data...</div>
      </div>
    </div>

    <!-- FILTER BAR — basic -->
    <div class="filter-bar">
      <div class="table-search">
        <i class="bi bi-search"></i>
        <input type="text" id="searchInput" placeholder="Cari ID, nama, HP, email, posisi, kota..." />
      </div>
      <select class="filter-select" id="statusFilter">
        <option value="">Semua Status</option>
        <option>Pending</option>
      </select>
      <select class="filter-select" id="positionFilter">
        <option value="">Semua Posisi</option>
      </select>
      <select class="filter-select" id="sortSelect">
        <option value="newest">Terbaru</option>
        <option value="oldest">Terlama</option>
        <option value="name_asc">Nama A-Z</option>
        <option value="name_desc">Nama Z-A</option>
        <option value="age_desc">Usia Tertinggi</option>
        <option value="age_asc">Usia Terendah</option>
        <option value="salary_desc">Gaji Tertinggi</option>
        <option value="salary_asc">Gaji Terendah</option>
      </select>
      <button class="btn-toggle-more" id="btnToggleMore" type="button">
        <i class="bi bi-sliders"></i> Filter Lanjutan
      </button>
      <button class="btn-reset-filter" type="button" id="btnResetFilter">
        <i class="bi bi-arrow-counterclockwise"></i> Reset
      </button>
      <button class="btn-refresh" id="btnRefresh" type="button" title="Muat ulang data">
        <i class="bi bi-arrow-clockwise"></i>
      </button>
    </div>

    <!-- FILTER BAR — advanced (collapsible) -->
    <div class="filter-bar filter-bar-collapse" id="filterBarMore">
      <select class="filter-select" id="genderFilter">
        <option value="">Semua Gender</option>
        <option value="Male">Laki-laki</option>
        <option value="Female">Perempuan</option>
      </select>
      <select class="filter-select" id="educationFilter"><option value="">Semua Pendidikan</option></select>
      <select class="filter-select" id="experienceFilter"><option value="">Semua Pengalaman</option></select>
      <select class="filter-select" id="cityFilter"><option value="">Semua Kota</option></select>
      <select class="filter-select" id="sourceFilter"><option value="">Semua Sumber</option></select>
      <select class="filter-select" id="employmentStatusFilter"><option value="">Semua Status Kerja</option></select>
      <div class="filter-range-group">
        <input type="number" class="filter-number" id="salaryMinFilter" placeholder="Gaji min" />
        <span>&ndash;</span>
        <input type="number" class="filter-number" id="salaryMaxFilter" placeholder="Gaji max" />
      </div>
      <div class="filter-range-group">
        <input type="number" class="filter-number" id="ageMinFilter" placeholder="Usia min" />
        <span>&ndash;</span>
        <input type="number" class="filter-number" id="ageMaxFilter" placeholder="Usia max" />
      </div>
      <input type="date" class="filter-date" id="dateFromFilter" title="Dari tanggal" />
      <input type="date" class="filter-date" id="dateToFilter"   title="Sampai tanggal" />
      <button class="btn-reset-filter" type="button" id="btnApplyMoreFilter">
        <i class="bi bi-check2"></i> Terapkan
      </button>
    </div>

    <!-- BULK ACTION BAR -->
    <div class="bulk-action-bar d-none" id="bulkActionBar">
      <div class="bulk-action-info">
        <span id="bulkSelectedCount">0</span> kandidat dipilih
      </div>
      <div class="bulk-action-buttons">
        <div class="dropdown">
          <button class="btn btn-sm btn-outline-primary dropdown-toggle" type="button"
            data-bs-toggle="dropdown" data-bs-auto-close="outside">
            <i class="bi bi-arrow-repeat"></i> Ubah Status
          </button>
          <ul class="dropdown-menu dropdown-menu-end">
            <li><a class="dropdown-item bulk-status-btn" href="#" data-status="Pending">
              <i class="bi bi-hourglass-split text-warning"></i> Pending</a></li>
            <li><a class="dropdown-item bulk-status-btn" href="#" data-status="Accepted">
              <i class="bi bi-check-circle text-success"></i> Accepted</a></li>
            <li><a class="dropdown-item bulk-status-btn" href="#" data-status="Hold">
              <i class="bi bi-pause-circle text-primary"></i> Hold</a></li>
            <li><a class="dropdown-item bulk-status-btn" href="#" data-status="Blacklist">
              <i class="bi bi-x-circle text-danger"></i> Blacklist</a></li>
          </ul>
        </div>
        <button class="btn btn-sm btn-outline-danger" id="bulkDeleteBtn" type="button">
          <i class="bi bi-trash"></i> Hapus
        </button>
        <button class="btn btn-sm btn-outline-secondary" id="bulkDeselectBtn" type="button">
          <i class="bi bi-x-lg"></i> Batal Pilih
        </button>
      </div>
    </div>

    <!-- TABLE -->
    <div class="table-responsive">
      <table class="table hr-table">
        <thead>
          <tr>
            <th class="col-check">
              <input type="checkbox" class="form-check-input" id="selectAll" title="Pilih semua" />
            </th>
            <th>Avatar</th>
            <th>Recruitment ID</th>
            <th>Kandidat</th>
            <th>Usia</th>
            <th>Gender</th>
            <th>Posisi</th>
            <th>Status</th>
            <th>Tanggal Daftar</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
      <div class="table-loading" id="tableLoading">
        <div class="spinner-border" role="status"></div>
        <p>Mengambil data dari spreadsheet...</p>
      </div>
      <div class="table-empty d-none" id="tableEmpty">
        <i class="bi bi-inbox"></i>
        <p>Belum ada data kandidat.</p>
      </div>
    </div>

    <div class="panel-footer">
      <span id="footerCount">Menampilkan 0 data</span>
      <nav class="pagination-ui" id="paginationUi" aria-label="Pagination"></nav>
    </div>
  </div>

</section>
