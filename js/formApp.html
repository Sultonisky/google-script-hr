<script>
  // ============================================================
  // js/formApp.html — FORM PENDAFTARAN LOGIC
  // Depends on: js/regions.html (REGIONS must be defined first)
  // ============================================================

  var form                 = document.getElementById('formPendaftaran');
  var agreementCheckbox    = document.getElementById('agreement');
  var agreementError       = document.getElementById('agreementError');
  var submitBtn            = document.getElementById('submitBtn');
  var submitSpinner        = document.getElementById('submitSpinner');
  var submitText           = document.getElementById('submitText');
  var emailInput           = document.getElementById('email');
  var emailValidation      = document.getElementById('emailValidation');
  var workExperienceSelect = document.getElementById('work_experience');
  var lastCompanyGroup     = document.getElementById('lastCompanyGroup');
  var loadingOverlay       = document.getElementById('loadingOverlay');
  var nikInput             = document.getElementById('nik');
  var birthDateInput       = document.getElementById('birth_date');
  var ageInput             = document.getElementById('age');
  var genderSelect         = document.getElementById('gender');
  var provinceSelect       = document.getElementById('province');
  var citySelect           = document.getElementById('city');
  var districtInput        = document.getElementById('district');
  var districtLoading      = document.getElementById('districtLoading');
  var districtManualWrap   = document.getElementById('districtManualWrap');
  var districtManualInput  = document.getElementById('districtManual');
  var nikFeedback          = document.getElementById('nikFeedback');
  var progressFill         = document.getElementById('progressFill');
  var progressCount        = document.getElementById('progressCount');
  var progressMessage      = document.getElementById('progressMessage');
  var phoneInput           = document.getElementById('phone');
  var salaryInput          = document.getElementById('expected_salary');

  var nikDebounceTimer    = null;
  var nikCheckTimer       = null;
  var manualBirthDateChanged = false;
  var isSubmitting        = false;

  // Duplicate NIK warning element (injected after nikFeedback)
  var nikDuplicateWarning = document.createElement('div');
  nikDuplicateWarning.className = 'nik-feedback';
  nikDuplicateWarning.id = 'nikDuplicateWarning';
  nikFeedback.parentNode.insertBefore(nikDuplicateWarning, nikFeedback.nextSibling);

  // ============================================================
  // SESSION GUARD
  // ============================================================
  var SESSION_KEY = 'msi_form_submitted';
  function markSubmitted(nik){ try { sessionStorage.setItem(SESSION_KEY, nik||'1'); } catch(e){} }
  function isAlreadySubmitted(){ try { return !!sessionStorage.getItem(SESSION_KEY); } catch(e){ return false; } }
  function showAlreadySubmittedPage(){
    document.getElementById('registrationForm').style.display = 'none';
    var sp = document.getElementById('successPage');
    sp.classList.add('show');
    var msg = sp.querySelector('.success-message');
    if(msg) msg.innerHTML = 'Anda telah mengirimkan lamaran pada sesi ini.<br><br>Apabila Anda merasa ini adalah kesalahan, silakan hubungi tim Human Resources PT Mahakarya Sukses Indonesia.';
  }
  if(isAlreadySubmitted()){ showAlreadySubmittedPage(); }

  // ============================================================
  // MASTER DATA — DYNAMIC DROPDOWNS
  // ============================================================
  (function loadMasterDataDropdowns(){
    var selects = document.querySelectorAll('select[data-master]');
    if(selects.length === 0) return;
    var cats = [];
    selects.forEach(function(sel){ cats.push(sel.getAttribute('data-master')); });
    google.script.run
      .withSuccessHandler(function(result){
        if(!result || !result.success || !result.data) return;
        selects.forEach(function(sel){
          var key  = sel.getAttribute('data-master');
          var cats = result.data[key];
          if(!cats || !cats.items || cats.items.length === 0) return;
          // Remove the placeholder <option> — keep it as the first option
          var placeholder = sel.querySelector('option[value=""]');
          sel.innerHTML = '';
          if(placeholder) sel.appendChild(placeholder);
          cats.items.forEach(function(item){
            var opt = document.createElement('option');
            opt.value       = item.name;
            opt.textContent = item.displayName;
            sel.appendChild(opt);
          });
        });
      })
      .withFailureHandler(function(){})
      .getMasterDataForCategories(cats);
  })();

  // ============================================================
  // FIELD VALIDATION HELPER
  // ============================================================
  function validateField(el){
    if(!el) return;
    if(el.id === 'birth_date'){ validateBirthDate(); return; }
    var container = el.closest('.col-md-6, .col-md-4, .col-12');
    var feedback  = container ? container.querySelector('.invalid-feedback') : null;
    if(el.value && el.checkValidity()){
      el.classList.remove('is-invalid'); el.classList.add('is-valid');
      if(feedback) feedback.style.display = 'none';
    } else if(el.value && !el.checkValidity()){
      el.classList.add('is-invalid'); el.classList.remove('is-valid');
      if(feedback) feedback.style.display = 'flex';
    } else {
      el.classList.remove('is-valid','is-invalid');
      if(feedback) feedback.style.display = 'none';
    }
  }

  // ============================================================
  // PROGRESS TRACKER
  // ============================================================
  var requiredFields = [
    'full_name','nik','birth_date','age','gender','marital_status',
    'email','phone','province','city','address',
    'position_applied','education','work_experience',
    'current_employment_status','available_to_join',
    'expected_salary','recruitment_source','agreement'
  ];
  var TOTAL_WITH_DISTRICT = 20;
  var progressMessages = [
    {min:0,  text:'Mulai mengisi formulir...'},
    {min:25, text:'Awal yang bagus! \uD83C\uDF89'},
    {min:50, text:'Form sudah setengah selesai.'},
    {min:75, text:'Hampir selesai.'},
    {min:100,text:'Semua data telah lengkap. Silakan kirim pendaftaran.'}
  ];

  function updateProgress(){
    var validCount = 0;
    requiredFields.forEach(function(id){
      var el = document.getElementById(id);
      if(!el) return;
      if(el.type === 'checkbox'){ if(el.checked) validCount++; }
      else if(el.value && el.value.trim() !== ''){ if(el.checkValidity && el.checkValidity()) validCount++; }
    });
    var districtOk = (!districtInput.disabled && districtInput.value && districtInput.value.trim() !== '') ||
      (districtManualWrap && districtManualWrap.style.display !== 'none' && districtManualInput && districtManualInput.value.trim() !== '');
    if(districtOk) validCount++;
    var percent = Math.round((validCount / TOTAL_WITH_DISTRICT) * 100);
    progressFill.style.width = percent + '%';
    progressCount.textContent = validCount + ' dari ' + TOTAL_WITH_DISTRICT + ' data telah lengkap';
    var msg = progressMessages[0].text;
    for(var i = progressMessages.length-1; i >= 0; i--){ if(percent >= progressMessages[i].min){ msg = progressMessages[i].text; break; } }
    progressMessage.textContent = msg;
  }

  // ============================================================
  // BIRTH DATE — auto-slash + strict validation
  // ============================================================
  birthDateInput.addEventListener('input', function(){
    manualBirthDateChanged = true;
    var val = this.value.replace(/[^0-9]/g,'');
    var f = '';
    if(val.length > 0){ f = val.substring(0,2); if(val.length > 2) f += '/' + val.substring(2,4); if(val.length > 4) f += '/' + val.substring(4,8); }
    this.value = f;
    calculateAge();
    if(f.length === 10) validateBirthDate();
    else { this.classList.remove('is-valid','is-invalid'); var fb=this.closest('.col-md-6'); if(fb){var inv=fb.querySelector('.invalid-feedback');if(inv)inv.style.display='none';} }
    updateProgress();
  });
  birthDateInput.addEventListener('blur', function(){ if(this.value.trim().length > 0) validateBirthDate(); updateProgress(); });

  function validateBirthDate(){
    var el = birthDateInput;
    var container = el.closest('.col-md-6');
    var feedback  = container ? container.querySelector('.invalid-feedback') : null;
    var val = el.value.trim();
    function setInvalid(msg){ el.classList.add('is-invalid'); el.classList.remove('is-valid'); if(feedback){feedback.textContent=msg;feedback.style.display='flex';} }
    function setValid()     { el.classList.remove('is-invalid'); el.classList.add('is-valid'); if(feedback) feedback.style.display='none'; }
    if(!val||val.length<10){ setInvalid('Tanggal lahir wajib diisi dengan format DD/MM/YYYY.'); return false; }
    var p = val.split('/');
    if(p.length!==3||p[0].length!==2||p[1].length!==2||p[2].length!==4){ setInvalid('Format tidak valid. Gunakan DD/MM/YYYY (contoh: 15/08/1990).'); return false; }
    var day=parseInt(p[0],10), month=parseInt(p[1],10), year=parseInt(p[2],10), curYear=new Date().getFullYear();
    if(isNaN(day)||isNaN(month)||isNaN(year)){ setInvalid('Tanggal lahir mengandung karakter tidak valid.'); return false; }
    if(month<1||month>12){ setInvalid('Bulan tidak valid (01–12).'); return false; }
    if(day<1||day>31){ setInvalid('Tanggal tidak valid (01–31).'); return false; }
    if(year<1900||year>curYear){ setInvalid('Tahun lahir tidak valid (1900–'+curYear+').'); return false; }
    var d = new Date(year,month-1,day);
    if(d.getFullYear()!==year||d.getMonth()!==month-1||d.getDate()!==day){ setInvalid('Tanggal tidak ada dalam kalender.'); return false; }
    var today=new Date(); today.setHours(0,0,0,0);
    if(d>today){ setInvalid('Tanggal lahir tidak boleh tanggal yang akan datang.'); return false; }
    var age=today.getFullYear()-year, mDiff=today.getMonth()-(month-1);
    if(mDiff<0||(mDiff===0&&today.getDate()<day)) age--;
    if(age<17){ setInvalid('Usia minimal untuk mendaftar adalah 17 tahun.'); return false; }
    setValid(); return true;
  }

  function calculateAge(){
    var val = birthDateInput.value.trim();
    if(!val||val.length<10){ ageInput.value=''; validateField(ageInput); return; }
    var p=val.split('/'); if(p.length!==3) return;
    var day=parseInt(p[0],10), month=parseInt(p[1],10), year=parseInt(p[2],10);
    if(!day||!month||!year||month<1||month>12||day<1||day>31) return;
    var bd=new Date(year,month-1,day), today=new Date();
    var age=today.getFullYear()-bd.getFullYear(), m=today.getMonth()-bd.getMonth();
    if(m<0||(m===0&&today.getDate()<bd.getDate())) age--;
    ageInput.value = (age>=0&&age<=120) ? age : '';
    validateField(ageInput);
  }

  // ============================================================
  // NIK PARSER + AUTO-FILL
  // ============================================================
  function parseNIK(nik){
    if(!nik||nik.length!==16||!/^[0-9]{16}$/.test(nik)) return null;
    var rawDay=nik.substring(6,8), rawMonth=nik.substring(8,10), rawYear=nik.substring(10,12);
    var day=parseInt(rawDay,10), gender=(day>40)?'Female':'Male';
    if(day>40) day-=40;
    var month=parseInt(rawMonth,10), year=parseInt(rawYear,10);
    var fullYear=(year<=24)?2000+year:1900+year;
    if(month<1||month>12||day<1||day>31) return null;
    return { birthDate:{day:day,month:month,year:fullYear,formatted:('0'+day).slice(-2)+'/'+('0'+month).slice(-2)+'/'+fullYear}, gender:gender, provinceCode:nik.substring(0,2), cityCode:nik.substring(0,4) };
  }

  nikInput.addEventListener('input', function(){
    var nik = this.value.replace(/[^0-9]/g,'').substring(0,16);
    this.value = nik;
    clearTimeout(nikDebounceTimer);
    if(nik.length===16) processNIK(nik);
    else nikDebounceTimer = setTimeout(function(){ if(nikInput.value.length===16) processNIK(nikInput.value); }, 400);
    validateField(this); updateProgress();
  });

  nikInput.addEventListener('blur', function(){
    var nik = this.value.trim();
    if(nik.length!==16) return;
    if(isAlreadySubmitted()){ showAlreadySubmittedPage(); return; }
    clearTimeout(nikCheckTimer);
    nikCheckTimer = setTimeout(function(){
      google.script.run
        .withSuccessHandler(function(candidates){
          var isDup = candidates && candidates.some(function(c){ return String(c.nik||'').replace(/'/g,'').trim()===nik; });
          if(isDup){
            nikDuplicateWarning.classList.add('show');
            nikDuplicateWarning.innerHTML = '<div class="alert alert-warning" style="margin-top:10px;"><i class="bi bi-exclamation-triangle-fill"></i> <strong>NIK ini sudah pernah digunakan untuk mendaftar.</strong><br>Hubungi HR apabila Anda merasa ini adalah kesalahan.</div>';
            nikInput.classList.add('is-invalid'); nikInput.classList.remove('is-valid');
          }
        })
        .withFailureHandler(function(){})
        .getRecruitmentList();
    }, 600);
  });

  function processNIK(nik){
    var r = parseNIK(nik);
    if(!r){ showNIKFeedback(false); return; }
    if(!manualBirthDateChanged){ birthDateInput.value=r.birthDate.formatted; calculateAge(); validateBirthDate(); validateField(ageInput); }
    genderSelect.value = r.gender; validateField(genderSelect);
    var provinceName = REGIONS.provinces[r.provinceCode];
    var cityName     = REGIONS.cities[r.cityCode];
    if(provinceName){ provinceSelect.value=r.provinceCode; validateField(provinceSelect); populateCities(r.provinceCode);
      if(cityName){ citySelect.value=r.cityCode; validateField(citySelect); loadDistricts(r.cityCode); } }
    showNIKFeedback(true, r); updateProgress();
  }

  function showNIKFeedback(success, r){
    nikFeedback.classList.add('show');
    if(success){
      var det = ['Tanggal Lahir: '+r.birthDate.formatted, 'Jenis Kelamin: '+(r.gender==='Male'?'Laki-laki':'Perempuan')];
      if(REGIONS.provinces[r.provinceCode]) det.push('Provinsi: '+REGIONS.provinces[r.provinceCode]);
      if(REGIONS.cities[r.cityCode]) det.push('Kabupaten/Kota: '+REGIONS.cities[r.cityCode]);
      nikFeedback.innerHTML = '<div class="alert alert-success"><i class="bi bi-check-circle-fill"></i> <strong>Data berhasil dikenali</strong><ul>'+det.map(function(d){return '<li>'+d+'</li>';}).join('')+'</ul></div>';
    } else {
      nikFeedback.innerHTML = '<div class="alert alert-warning"><i class="bi bi-exclamation-triangle-fill"></i> <strong>NIK tidak valid.</strong> Pastikan nomor KTP terdiri dari 16 digit yang benar.</div>';
    }
  }

  // ============================================================
  // REGION DROPDOWNS
  // ============================================================
  function populateProvinces(){
    var html = '<option value="">-- Pilih Provinsi --</option>';
    Object.keys(REGIONS.provinces).sort().forEach(function(code){ html += '<option value="'+code+'">'+REGIONS.provinces[code]+'</option>'; });
    provinceSelect.innerHTML = html;
  }

  function populateCities(provinceCode){
    citySelect.innerHTML = '<option value="">-- Pilih Kota/Kabupaten --</option>';
    resetDistrict();
    if(!provinceCode) return;
    Object.keys(REGIONS.cities).filter(function(c){ return c.substring(0,2)===provinceCode; }).sort()
      .forEach(function(code){ citySelect.innerHTML += '<option value="'+code+'">'+REGIONS.cities[code]+'</option>'; });
  }

  function resetDistrict(){
    districtInput.innerHTML = '<option value="">-- Pilih Kota dahulu --</option>';
    districtInput.disabled = true; districtInput.value = '';
    districtInput.classList.remove('is-valid','is-invalid');
    districtLoading.style.display = 'none';
    districtManualWrap.style.display = 'none';
    districtManualInput.value = ''; districtManualInput.required = false;
    districtInput.required = true;
  }

  function loadDistricts(cityCode){
    if(!cityCode){ resetDistrict(); return; }
    if(REGIONS.districts[cityCode]){
      populateDistrictOptions(REGIONS.districts[cityCode].map(function(n){ return {id:n,nama:n}; }));
      return;
    }
    districtInput.innerHTML = '<option value="">Memuat kecamatan...</option>';
    districtInput.disabled = true; districtLoading.style.display = 'block';
    districtManualWrap.style.display = 'none'; districtManualInput.required = false; districtInput.required = true;
    google.script.run
      .withSuccessHandler(function(list){ districtLoading.style.display='none'; if(list&&list.length>0) populateDistrictOptions(list); else showDistrictManual(); })
      .withFailureHandler(function(){ districtLoading.style.display='none'; showDistrictManual(); })
      .getKecamatan(cityCode);
  }

  function populateDistrictOptions(list){
    var html = '<option value="">-- Pilih Kecamatan --</option>';
    list.forEach(function(item){ html += '<option value="'+item.nama+'">'+item.nama+'</option>'; });
    districtInput.innerHTML = html; districtInput.disabled = false; districtInput.required = true;
    districtManualWrap.style.display = 'none'; districtManualInput.required = false;
  }

  function showDistrictManual(){
    districtInput.innerHTML = '<option value="">-</option>'; districtInput.disabled = true; districtInput.required = false;
    districtManualWrap.style.display = 'block'; districtManualInput.required = true; districtManualInput.focus();
  }

  provinceSelect.addEventListener('change', function(){ populateCities(this.value); validateField(this); updateProgress(); });
  citySelect.addEventListener('change',     function(){ validateField(this); loadDistricts(this.value); updateProgress(); });
  districtInput.addEventListener('change',  function(){ validateField(this); updateProgress(); });
  districtManualInput.addEventListener('input', function(){
    this.classList.toggle('is-valid',   this.value.trim()!=='');
    this.classList.toggle('is-invalid', this.value.trim()==='');
    if(this.value.trim()!=='') this.classList.remove('is-invalid');
    updateProgress();
  });
  districtManualInput.addEventListener('blur', function(){
    if(this.value.trim()!=='') this.classList.add('is-valid');
    else if(this.required) this.classList.add('is-invalid');
  });

  // ============================================================
  // PHONE & SALARY FORMATTING
  // ============================================================
  phoneInput.addEventListener('input', function(){
    this.value = this.value.replace(/[^0-9]/g,'').substring(0,13);
    validateField(this); updateProgress();
  });
  salaryInput.addEventListener('input', function(){
    var raw = this.value.replace(/[^0-9]/g,'');
    this.value = raw.length > 0 ? parseInt(raw,10).toLocaleString('id-ID') : '';
    validateField(this); updateProgress();
  });

  // ============================================================
  // EMAIL TYPO DETECTION
  // ============================================================
  var commonTypos = {
    'gmial.com':'gmail.com','gmai.com':'gmail.com','gmail.con':'gmail.com',
    'hotnail.com':'hotmail.com','hotmai.com':'hotmail.com','hotmail.con':'hotmail.com',
    'yahooo.com':'yahoo.com','yaho.com':'yahoo.com',
    'outlok.com':'outlook.com','outlook.con':'outlook.com'
  };
  emailInput.addEventListener('blur', function(){
    var email = this.value.trim();
    if(!email){ emailValidation.style.display='none'; return; }
    var valid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
    if(!valid){ emailValidation.className='email-validation invalid'; emailValidation.innerHTML='<i class="bi bi-x-circle-fill"></i> Format email tidak valid'; emailValidation.style.display='flex'; return; }
    var domain = email.split('@')[1];
    if(commonTypos[domain]){ emailValidation.className='email-validation suggestion'; emailValidation.innerHTML='<i class="bi bi-lightbulb-fill"></i> Apakah yang Anda maksud: <strong>'+email.split('@')[0]+'@'+commonTypos[domain]+'</strong>?'; emailValidation.style.display='flex'; }
    else { emailValidation.className='email-validation valid'; emailValidation.innerHTML='<i class="bi bi-check-circle-fill"></i> Format email valid'; emailValidation.style.display='flex'; }
  });
  emailInput.addEventListener('input', function(){ if(emailValidation.style.display==='flex') emailValidation.style.display='none'; validateField(this); updateProgress(); });

  // ============================================================
  // WORK EXPERIENCE — show/hide last company
  // ============================================================
  workExperienceSelect.addEventListener('change', function(){
    var lc = document.getElementById('last_company');
    if(this.value===''||this.value==='No Experience'){ lastCompanyGroup.style.display='none'; lc.value=''; lc.disabled=true; }
    else { lastCompanyGroup.style.display='block'; lc.disabled=false; }
    validateField(this); updateProgress();
  });

  // ============================================================
  // AGREEMENT CHECKBOX
  // ============================================================
  agreementCheckbox.addEventListener('change', function(){
    submitBtn.disabled = !this.checked;
    if(this.checked){ agreementError.style.display='none'; this.classList.add('is-valid'); this.classList.remove('is-invalid'); }
    else { this.classList.remove('is-valid'); }
    updateProgress();
  });

  // ============================================================
  // FORM SUBMISSION
  // ============================================================
  form.addEventListener('submit', function(e){
    e.preventDefault();
    if(isSubmitting) return;
    if(isAlreadySubmitted()){ showAlreadySubmittedPage(); return; }
    if(!agreementCheckbox.checked){ agreementError.style.display='flex'; agreementCheckbox.classList.add('is-invalid'); return; }
    agreementError.style.display = 'none';
    if(!form.checkValidity()||!validateBirthDate()){ form.classList.add('was-validated'); if(!validateBirthDate()) birthDateInput.scrollIntoView({behavior:'smooth',block:'center'}); return; }

    isSubmitting = true; submitBtn.disabled = true;
    submitSpinner.classList.remove('d-none'); submitText.textContent = 'Memeriksa...';
    loadingOverlay.classList.add('show');

    var enteredNIK = document.getElementById('nik').value.trim();
    var phoneVal   = phoneInput.value.replace(/[^0-9]/g,'');
    var salaryVal  = salaryInput.value.replace(/[^0-9]/g,'');
    var cityCode   = document.getElementById('city').value;
    var cityName   = REGIONS.cities[cityCode] || cityCode;
    var districtValue = districtInput.disabled ? districtManualInput.value.trim() : districtInput.value.trim();

    var formData = {
      full_name: document.getElementById('full_name').value.trim(),
      nik: enteredNIK, birth_date: document.getElementById('birth_date').value,
      age: document.getElementById('age').value, gender: document.getElementById('gender').value,
      marital_status: document.getElementById('marital_status').value,
      email: document.getElementById('email').value.trim(), phone: '62' + phoneVal,
      address: document.getElementById('address').value.trim(),
      city: cityName + (districtValue ? ', Kec. ' + districtValue : ''),
      position_applied: document.getElementById('position_applied').value,
      education: document.getElementById('education').value,
      work_experience: document.getElementById('work_experience').value,
      last_company: document.getElementById('last_company').value.trim() || '-',
      current_employment_status: document.getElementById('current_employment_status').value,
      available_to_join: document.getElementById('available_to_join').value,
      expected_salary: salaryVal,
      recruitment_source: document.getElementById('recruitment_source').value
    };

    function doSubmit(){
      submitText.textContent = 'Mengirim...';
      google.script.run
        .withSuccessHandler(function(response){
          loadingOverlay.classList.remove('show'); submitSpinner.classList.add('d-none');
          submitText.textContent = 'Kirim Pendaftaran'; isSubmitting = false;
          if(response==='Sukses'){ markSubmitted(enteredNIK); document.getElementById('registrationForm').style.display='none'; document.getElementById('successPage').classList.add('show'); }
          else { alert('Error: '+response); submitBtn.disabled = false; }
        })
        .withFailureHandler(function(err){
          loadingOverlay.classList.remove('show'); submitSpinner.classList.add('d-none');
          submitText.textContent = 'Kirim Pendaftaran'; isSubmitting = false;
          alert('Gagal mengirim pendaftaran: '+err.message); submitBtn.disabled = false;
        })
        .simpanDataKandidat(formData);
    }

    // Duplicate NIK check first
    google.script.run
      .withSuccessHandler(function(candidates){
        var isDup = candidates && candidates.some(function(c){ return String(c.nik||'').replace(/'/g,'').trim()===enteredNIK; });
        if(isDup){
          loadingOverlay.classList.remove('show'); submitSpinner.classList.add('d-none');
          submitText.textContent = 'Kirim Pendaftaran'; isSubmitting = false; submitBtn.disabled = false;
          nikDuplicateWarning.classList.add('show');
          nikDuplicateWarning.innerHTML = '<div class="alert alert-warning" style="margin-top:10px;"><i class="bi bi-exclamation-triangle-fill"></i> <strong>NIK yang Anda masukkan sudah pernah digunakan untuk mengirim lamaran.</strong><br>Silakan gunakan NIK yang berbeda atau hubungi HR apabila terjadi kesalahan.</div>';
          nikInput.scrollIntoView({behavior:'smooth',block:'center'}); nikInput.focus();
        } else { doSubmit(); }
      })
      .withFailureHandler(function(){ doSubmit(); })
      .getRecruitmentList();
  });

  // ============================================================
  // REAL-TIME VALIDATION on all required fields
  // ============================================================
  var inputs = form.querySelectorAll('input[required],select[required],textarea[required]');
  inputs.forEach(function(input){
    if(input.id==='birth_date') return;
    input.addEventListener('blur',   function(){ validateField(this); updateProgress(); });
    input.addEventListener('input',  function(){ validateField(this); updateProgress(); });
    input.addEventListener('change', function(){ validateField(this); updateProgress(); });
  });
  var lc = document.getElementById('last_company');
  ['input','blur'].forEach(function(ev){ lc.addEventListener(ev, function(){
    this.classList.toggle('is-valid', this.value.trim()!=='');
    if(!this.value.trim()) this.classList.remove('is-valid','is-invalid');
  }); });

  // ============================================================
  // INIT
  // ============================================================
  populateProvinces();
  updateProgress();
</script>
