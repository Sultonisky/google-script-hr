<script>
  // ============================================================
  // js/helpers.html — UTILITY FUNCTIONS
  // Depends on: nothing
  // ============================================================

  // Polyfill google.script.run untuk dev preview lokal
  if (typeof google === 'undefined' || typeof google.script === 'undefined') {
    window.google = window.google || {};
    google.script = {
      run: new Proxy({}, {
        get: function(_, fnName) {
          return function() {
            return {
              withSuccessHandler: function(fn) { return this; },
              withFailureHandler: function(fn) {
                console.warn('[Dev] google.script.run.' + fnName + '() — tidak tersedia di luar Apps Script.');
                return this;
              }
            };
          };
        }
      })
    };
  }

  function statusBadgeClass(status) {
    var s = (status || '').toLowerCase();
    if (s === 'accepted') return 'accepted';
    if (s === 'hold')     return 'hold';
    if (s === 'blacklist') return 'blacklist';
    return 'pending';
  }

  // Badge class untuk status karyawan/outsource
  function entityStatusBadgeClass(status) {
    var s = (status || '').toLowerCase().replace(/_/g, ' ');
    if (s === 'permanent')      return 'accepted';   // hijau — karyawan tetap
    if (s === 'contract')       return 'accepted';   // hijau — kontrak aktif
    if (s === 'probation')      return 'hold';        // biru/amber — masa percobaan
    if (s === 'on leave')       return 'pending';     // kuning — cuti panjang
    if (s === 'resigned')       return 'blacklist';   // merah
    if (s === 'terminated')     return 'blacklist';   // merah
    if (s === 'retired')        return 'blacklist';   // merah/abu
    if (s === 'deceased')       return 'blacklist';   // merah/abu — meninggal dunia
    if (s === 'inactive')       return 'blacklist';   // merah/abu
    // legacy fallback
    if (s === 'active')         return 'accepted';
    return 'pending';
  }

  function initials(name) {
    if (!name) return '?';
    var parts = name.trim().split(/\s+/);
    return ((parts[0] || '')[0] + (parts[1] ? parts[1][0] : '')).toUpperCase();
  }

  function escapeHtml(str) {
    if (str === null || str === undefined) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  }

  function formatRupiah(num) {
    return 'Rp ' + new Intl.NumberFormat('id-ID').format(Number(num) || 0);
  }

  function parseDdMmYyyy(dateStr) {
    if (!dateStr) return null;
    var d = dateStr.split(' ')[0].split('/');
    if (d.length !== 3) return null;
    return new Date(Number(d[2]), Number(d[1]) - 1, Number(d[0]));
  }

  // Konversi tampilan dd/MM/yyyy[ HH:mm] menjadi nilai yyyy-MM-dd untuk input type="date"
  function toDateInputValue(dateStr) {
    if (!dateStr) return '';
    var p = String(dateStr).split(' ')[0].split('/');
    if (p.length === 3 && p[2].length === 4) {
      return p[2] + '-' + p[1] + '-' + p[0];
    }
    var d = new Date(dateStr);
    if (!isNaN(d.getTime())) {
      var y = d.getFullYear();
      var m = String(d.getMonth() + 1).padStart(2, '0');
      var day = String(d.getDate()).padStart(2, '0');
      return y + '-' + m + '-' + day;
    }
    return '';
  }

  function formatDisplayDate(dateStr) {
    if (!dateStr || dateStr === '-') return '-';
    var d = new Date(dateStr);
    if (!isNaN(d.getTime())) {
      var day = String(d.getDate()).padStart(2, '0');
      var m = String(d.getMonth() + 1).padStart(2, '0');
      var y = d.getFullYear();
      return day + '/' + m + '/' + y;
    }
    var parts = String(dateStr).split(' ')[0].split('/');
    if (parts.length === 3 && parts[2].length === 4) {
      return parts[0] + '/' + parts[1] + '/' + parts[2];
    }
    return dateStr;
  }

  function showToast(message, type) {
    type = type || 'success';
    var iconMap  = { success: 'bi-check-circle-fill', warning: 'bi-exclamation-triangle-fill', error: 'bi-x-circle-fill' };
    var colorMap = { success: '#166534', warning: '#8a6100', error: '#991b1b' };
    var bgMap    = { success: '#ecfdf3', warning: '#fff8e6', error: '#fef2f2' };
    var el = document.createElement('div');
    el.className = 'toast toast-custom align-items-center border-0';
    el.style.background = bgMap[type];
    el.style.color = colorMap[type];
    el.setAttribute('role', 'alert');
    el.innerHTML = '<div class="d-flex"><div class="toast-body"><i class="bi ' + iconMap[type] + ' me-2"></i>' +
      escapeHtml(message) + '</div>' +
      '<button type="button" class="btn-close btn-close-sm me-2 m-auto" data-bs-dismiss="toast"></button></div>';
    document.getElementById('toastContainer').appendChild(el);
    var t = new bootstrap.Toast(el, { delay: 4000 });
    t.show();
    el.addEventListener('hidden.bs.toast', function() { el.remove(); });
  }

  function animateCounter(el, toValue) {
    var fromValue = Number(el.getAttribute('data-current') || 0);
    var startTime = null;
    function step(ts) {
      if (!startTime) startTime = ts;
      var progress = Math.min(1, (ts - startTime) / 600);
      var eased    = 1 - Math.pow(1 - progress, 3);
      el.innerText = Math.round(fromValue + (toValue - fromValue) * eased);
      if (progress < 1) requestAnimationFrame(step);
      else el.setAttribute('data-current', toValue);
    }
    requestAnimationFrame(step);
  }

  // Set nilai <select> dengan pencocokan cerdas (exact value, case-insensitive, text match, atau pemetaan sinonim)
  function setSelectSmart(el, value) {
    if (!el) return;
    if (value === undefined || value === null) { el.value = ''; return; }
    var raw = String(value).trim();
    if (!raw) { el.value = ''; return; }

    // 1. Coba set langsung
    el.value = raw;
    if (el.value === raw && el.selectedIndex > -1) return;

    var lower = raw.toLowerCase();

    // 2. Mapping sinonim khusus (Status Pernikahan, Gender, dll)
    var synonyms = {
      'single': 'belum menikah',
      'lajang': 'belum menikah',
      'belum menikah': 'belum menikah',
      'belum nikah': 'belum menikah',
      'married': 'menikah',
      'kawin': 'menikah',
      'menikah': 'menikah',
      'nikah': 'menikah',
      'divorced': 'cerai',
      'cerai': 'cerai',
      'cerai hidup': 'cerai',
      'cerai mati': 'cerai',
      'janda': 'cerai',
      'duda': 'cerai',
      'widowed': 'cerai',
      'laki-laki': 'male',
      'pria': 'male',
      'laki': 'male',
      'male': 'male',
      'perempuan': 'female',
      'wanita': 'female',
      'female': 'female'
    };

    var targetSynonym = synonyms[lower] || lower;

    // 3. Cari di options (value atau text)
    for (var i = 0; i < el.options.length; i++) {
      var optVal = el.options[i].value.toLowerCase();
      var optTxt = el.options[i].text.toLowerCase();

      if (optVal === lower || optTxt === lower) {
        el.selectedIndex = i;
        return;
      }
      if (optVal === targetSynonym || optTxt.indexOf(targetSynonym) !== -1 || (synonyms[optVal] && synonyms[optVal] === targetSynonym)) {
        el.selectedIndex = i;
        return;
      }
    }

    // 4. Fallback: jika value tidak ada di options namun ada isi, tambahkan option baru agar tidak hilang
    var opt = document.createElement('option');
    opt.value = raw;
    opt.text = raw;
    el.appendChild(opt);
    el.value = raw;
  }
</script>
