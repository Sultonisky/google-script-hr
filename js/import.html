<script>
  // ============================================================
  // js/import.html — CSV IMPORT LOGIC (Master Data / Employee)
  // Depends on: helpers.html (showToast)
  // ============================================================

  var empImportFile = null;
  var empImportRows = [];

  function openEmpImportModal() {
    var modalEl = document.getElementById('empImportModal');
    if (!modalEl) return;
    empImportFile = null;
    empImportRows = [];
    resetEmpImportSteps();
    var m = bootstrap.Modal.getOrCreateInstance(modalEl);
    m.show();
  }

  function resetEmpImportSteps() {
    document.getElementById('empImportStep1').style.display = '';
    document.getElementById('empImportStep2').style.display = 'none';
    document.getElementById('empImportStep3').style.display = 'none';
    document.getElementById('empImportFileInfo').style.display = 'none';
    document.getElementById('empImportDropZone').style.display = '';
    document.getElementById('btnEmpImportStart').classList.add('disabled');
    document.getElementById('btnEmpImportStart').disabled = true;
    document.getElementById('btnEmpImportStartText').style.display = '';
    document.getElementById('btnEmpImportLoading').style.display = 'none';
    document.getElementById('btnEmpImportBack').style.display = 'none';
    document.getElementById('empImportErrorList').innerHTML = '';
    document.getElementById('empImportResultErrors').style.display = 'none';
    document.getElementById('empImportPreviewBody').innerHTML = '';
    document.getElementById('empImportSummaryBadge').textContent = '-';
  }

  function initEmpImportModal() {
    var dropZone = document.getElementById('empImportDropZone');
    var fileInput = document.getElementById('empImportFileInput');
    var clearBtn = document.getElementById('btnEmpImportClearFile');
    var startBtn = document.getElementById('btnEmpImportStart');
    var backBtn = document.getElementById('btnEmpImportBack');

    if (dropZone && fileInput) {
      dropZone.addEventListener('click', function() { fileInput.click(); });
      dropZone.addEventListener('dragover', function(e) {
        e.preventDefault();
        dropZone.style.background = '#e8f0fe';
      });
      dropZone.addEventListener('dragleave', function() {
        dropZone.style.background = '';
      });
      dropZone.addEventListener('drop', function(e) {
        e.preventDefault();
        dropZone.style.background = '';
        if (e.dataTransfer.files.length > 0) handleEmpImportFile(e.dataTransfer.files[0]);
      });
      fileInput.addEventListener('change', function() {
        if (fileInput.files.length > 0) handleEmpImportFile(fileInput.files[0]);
      });
    }

    if (clearBtn) clearBtn.addEventListener('click', function() {
      empImportFile = null;
      empImportRows = [];
      resetEmpImportSteps();
      if (fileInput) fileInput.value = '';
    });

    if (startBtn) startBtn.addEventListener('click', function() {
      if (empImportRows.length === 0) return;
      runEmpImport();
    });

    if (backBtn) backBtn.addEventListener('click', function() {
      resetEmpImportSteps();
      if (empImportRows.length > 0) showEmpImportPreview(empImportRows);
    });
  }

  function handleEmpImportFile(file) {
    if (!file.name.toLowerCase().endsWith('.csv')) {
      showToast('Hanya file CSV yang didukung.', 'error');
      return;
    }
    if (file.size > 5 * 1024 * 1024) {
      showToast('Ukuran file maksimal 5MB.', 'error');
      return;
    }
    empImportFile = file;

    document.getElementById('empImportFileName').textContent = file.name;
    document.getElementById('empImportFileSize').textContent = (file.size / 1024).toFixed(1) + ' KB';
    document.getElementById('empImportFileInfo').style.display = '';
    document.getElementById('empImportDropZone').style.display = 'none';

    var reader = new FileReader();
    reader.onload = function(e) {
      var text = e.target.result;
      empImportRows = parseEmpCSV(text);

      if (empImportRows.length === 0) {
        showToast('File CSV kosong atau format tidak sesuai.', 'error');
        return;
      }
      if (empImportRows.length > 500) {
        showToast('Maksimal 500 baris per import. File memiliki ' + empImportRows.length + ' baris.', 'error');
        empImportRows = [];
        return;
      }

      showEmpImportPreview(empImportRows);
    };
    reader.readAsText(file);
  }

  function parseEmpCSV(text) {
    var lines = text.split(/\r?\n/).filter(function(l) { return l.trim() !== ''; });
    if (lines.length < 2) return [];

    // Normalize header: trim, strip quotes, lowercase, remove spaces/underscores
    function normHeader(h) {
      return h.trim().replace(/^"|"$/g, '').toLowerCase().replace(/[\s_]/g, '');
    }

    var headers = lines[0].split(',').map(normHeader);

    var fieldMap = {
      'nama': 'fullName', 'fullname': 'fullName', 'fullnamelengkap': 'fullName', 'namalengkap': 'fullName',
      'nik': 'nik', 'nomorinduk': 'nik',
      'email': 'email', 'emel': 'email',
      'telepon': 'phone', 'phone': 'phone', 'nohp': 'phone', 'hp': 'phone', 'nomortelepon': 'phone',
      'posisi': 'position', 'position': 'position', 'jabatan': 'position',
      'departemen': 'department', 'department': 'department', 'dept': 'department',
      'divisi': 'division', 'division': 'division',
      'cabang': 'branch', 'branch': 'branch',
      'tipekaryawan': 'employeeType', 'employeetype': 'employeeType', 'tipe': 'employeeType',
      'tanggalmasuk': 'joinDate', 'joindate': 'joinDate', 'tglmasuk': 'joinDate',
      'status': 'status',
      'statuskerja': 'employmentStatus', 'employmentstatus': 'employmentStatus',
      'gender': 'gender', 'jeniskelamin': 'gender',
      'tanggallahir': 'birthDate', 'birthdate': 'birthDate', 'tgllahir': 'birthDate',
      'usia': 'age', 'age': 'age', 'umur': 'age',
      'statuspernikahan': 'maritalStatus', 'maritalstatus': 'maritalStatus',
      'alamat': 'address', 'address': 'address',
      'kota': 'city', 'city': 'city',
      'pendidikan': 'education', 'education': 'education',
      'pengalamankerja': 'workExperience', 'workexperience': 'workExperience', 'pengalaman': 'workExperience',
      'gaji': 'salary', 'salary': 'salary', 'upah': 'salary',
      'tipegaji': 'salaryType', 'salarytype': 'salaryType',
      'kontrakmulai': 'contractStart', 'contractstart': 'contractStart',
      'kontrakberakhir': 'contractEnd', 'contractend': 'contractEnd',
      'durasikontrak': 'contractDuration', 'contractduration': 'contractDuration',
      'nokontrak': 'contractNumber', 'contractnumber': 'contractNumber',
      'vendor': 'outsourceVendor', 'outsourcevendor': 'outsourceVendor',
      'kecamatan': 'district', 'district': 'district',
      'sumber': 'recruitmentSource', 'recruitmentsource': 'recruitmentSource',
      'catatan': 'notes', 'notes': 'notes'
    };

    var rows = [];
    for (var i = 1; i < lines.length; i++) {
      var vals = lines[i].split(',').map(function(v) { return v.trim().replace(/^"|"$/g, ''); });
      var row = {};
      for (var j = 0; j < headers.length; j++) {
        var key = fieldMap[headers[j]] || headers[j];
        row[key] = vals[j] || '';
      }
      rows.push(row);
    }
    return rows;
  }

  function showEmpImportPreview(rows) {
    document.getElementById('empImportStep1').style.display = 'none';
    document.getElementById('empImportStep2').style.display = '';

    var badge = document.getElementById('empImportSummaryBadge');
    badge.textContent = rows.length + ' baris siap diimport';
    badge.className = 'badge bg-primary';
    badge.style.fontSize = '12px';

    var tbody = document.getElementById('empImportPreviewBody');
    tbody.innerHTML = rows.map(function(r, i) {
      var nameOk = r.fullName && r.fullName.trim() !== '';
      var statusClass = nameOk ? 'text-success' : 'text-danger';
      var statusIcon = nameOk ? 'bi-check-circle-fill' : 'bi-x-circle-fill';
      var statusText = nameOk ? 'OK' : 'Nama kosong';
      return '<tr>' +
        '<td>' + (i + 1) + '</td>' +
        '<td>' + escapeHtml(r.fullName || '-') + '</td>' +
        '<td>' + escapeHtml(r.nik || '-') + '</td>' +
        '<td><i class="bi ' + statusIcon + ' ' + statusClass + '"></i> <span class="' + statusClass + '">' + statusText + '</span></td>' +
        '</tr>';
    }).join('');

    document.getElementById('btnEmpImportStart').classList.remove('disabled');
    document.getElementById('btnEmpImportStart').disabled = false;
    document.getElementById('btnEmpImportBack').style.display = '';
  }

  function runEmpImport() {
    if (empImportRows.length === 0) return;

    document.getElementById('btnEmpImportStartText').style.display = 'none';
    document.getElementById('btnEmpImportLoading').style.display = '';
    document.getElementById('btnEmpImportStart').classList.add('disabled');
    document.getElementById('btnEmpImportStart').disabled = true;
    document.getElementById('btnEmpImportBack').style.display = 'none';

    google.script.run
      .withSuccessHandler(function(result) {
        document.getElementById('empImportStep2').style.display = 'none';
        document.getElementById('empImportStep3').style.display = '';

        var icon = document.getElementById('empImportResultIcon');
        var title = document.getElementById('empImportResultTitle');
        var msg = document.getElementById('empImportResultMessage');
        var errDiv = document.getElementById('empImportResultErrors');
        var errList = document.getElementById('empImportErrorList');

        if (result.success) {
          icon.className = 'bi bi-check-circle-fill fs-1';
          icon.style.color = 'var(--color-success)';
          title.textContent = 'Import Berhasil!';
          title.className = 'mt-3 mb-1 text-success';
        } else {
          icon.className = 'bi bi-exclamation-triangle-fill fs-1';
          icon.style.color = '#e67700';
          title.textContent = 'Import Selesai dengan Error';
          title.className = 'mt-3 mb-1';
        }

        msg.textContent = result.message || (result.imported + ' karyawan berhasil diimport.');

        if (result.errors && result.errors.length > 0) {
          errDiv.style.display = '';
          errList.innerHTML = result.errors.map(function(e) {
            return '<li>' + escapeHtml(e) + '</li>';
          }).join('');
        }

        document.getElementById('btnEmpImportStartText').style.display = '';
        document.getElementById('btnEmpImportLoading').style.display = 'none';
        document.getElementById('btnEmpImportStart').style.display = 'none';
        document.getElementById('btnEmpImportBack').style.display = 'none';

        if (typeof empLoadAll === 'function') empLoadAll();

        showToast(result.message || 'Import selesai.', result.success ? 'success' : 'error');
      })
      .withFailureHandler(function(err) {
        document.getElementById('empImportStep2').style.display = 'none';
        document.getElementById('empImportStep3').style.display = '';
        document.getElementById('empImportResultIcon').className = 'bi bi-exclamation-circle-fill fs-1';
        document.getElementById('empImportResultIcon').style.color = '#991b1b';
        document.getElementById('empImportResultTitle').textContent = 'Import Gagal';
        document.getElementById('empImportResultTitle').className = 'mt-3 mb-1 text-danger';
        document.getElementById('empImportResultMessage').textContent = err.message || 'Terjadi kesalahan saat import.';
        document.getElementById('btnEmpImportStartText').style.display = '';
        document.getElementById('btnEmpImportLoading').style.display = 'none';
        document.getElementById('btnEmpImportStart').style.display = 'none';
        document.getElementById('btnEmpImportBack').style.display = '';
        showToast('Import gagal: ' + (err.message || err), 'error');
      })
      .importEmployees(empImportRows);
  }
</script>
