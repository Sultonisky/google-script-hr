<!-- partials/Statistics.html — STAT CARDS (Dashboard page) -->
<div class="row g-3 mb-4">
  <div class="col-6 col-md-4 col-xl-2">
    <button class="stat-card" type="button" data-page="pageRecruitment">
      <div class="stat-icon bg-blue"><i class="bi bi-people-fill"></i></div>
      <div>
        <div class="stat-label">Total Kandidat</div>
        <div class="stat-value" data-current="0" id="statTotal">0</div>
      </div>
    </button>
  </div>
  <div class="col-6 col-md-4 col-xl-2">
    <button class="stat-card" type="button" data-page="pageRecruitment">
      <div class="stat-icon bg-gold"><i class="bi bi-hourglass-split"></i></div>
      <div>
        <div class="stat-label">Pending</div>
        <div class="stat-value" data-current="0" id="statPending">0</div>
      </div>
    </button>
  </div>
  <div class="col-6 col-md-4 col-xl-2">
    <button class="stat-card" type="button" data-page="pageAccepted">
      <div class="stat-icon bg-green">
        <i class="bi bi-check-circle-fill"></i>
      </div>
      <div>
        <div class="stat-label">Accepted</div>
        <div class="stat-value" data-current="0" id="statAccepted">0</div>
      </div>
    </button>
  </div>
  <div class="col-6 col-md-4 col-xl-2">
    <button class="stat-card" type="button" data-page="pageHold">
      <div class="stat-icon bg-navy">
        <i class="bi bi-pause-circle-fill"></i>
      </div>
      <div>
        <div class="stat-label">Hold</div>
        <div class="stat-value" data-current="0" id="statHold">0</div>
      </div>
    </button>
  </div>
  <div class="col-6 col-md-4 col-xl-2">
    <button class="stat-card" type="button" data-page="pageBlacklist">
      <div class="stat-icon bg-red">
        <i class="bi bi-slash-circle-fill"></i>
      </div>
      <div>
        <div class="stat-label">Blacklist</div>
        <div class="stat-value" data-current="0" id="statBlacklist">0</div>
      </div>
    </button>
  </div>
  <div class="col-6 col-md-4 col-xl-2">
    <button class="stat-card" type="button" data-page="pageProbation">
      <div class="stat-icon bg-navy">
        <i class="bi bi-hourglass-split"></i>
      </div>
      <div>
        <div class="stat-label">Probation</div>
        <div class="stat-value" data-current="0" id="statProbation">0</div>
      </div>
    </button>
  </div>
</div>
