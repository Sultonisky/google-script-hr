<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Akses Ditolak — Mahakarya HRIS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <style>
    body { background: #f0f2f5; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    .access-denied-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .access-denied-card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      padding: 60px 40px;
      text-align: center;
      max-width: 480px;
      width: 100%;
    }
    .access-denied-icon {
      width: 80px;
      height: 80px;
      background: #FEE2E2;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
    }
    .access-denied-icon i { font-size: 36px; color: #991B1B; }
    .access-denied-card h2 { font-weight: 700; color: #1a1a2e; margin-bottom: 12px; }
    .access-denied-card p { color: #6b7280; font-size: 15px; line-height: 1.6; }
    .btn-back { margin-top: 24px; }
    .btn-back a {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 10px 24px; border-radius: 8px; text-decoration: none;
      font-weight: 600; font-size: 14px;
      background: #005BAC; color: #fff; border: none; cursor: pointer;
      transition: background 0.2s;
    }
    .btn-back a:hover { background: #00437e; }
    .user-info { background: #f8f9fa; border-radius: 8px; padding: 12px 16px; margin-top: 20px; }
    .user-info small { color: #6b7280; }
    .user-info strong { color: #374151; }
  </style>
</head>
<body>
  <div class="access-denied-container">
    <div class="access-denied-card">
      <div class="access-denied-icon">
        <i class="bi bi-shield-lock"></i>
      </div>
      <h2>Akses Ditolak</h2>
      <p>Anda tidak memiliki izin untuk mengakses halaman ini. Hubungi administrator untuk mendapatkan akses.</p>
      <div id="userInfoContainer"></div>
      <div class="btn-back">
        <a href="javascript:history.back()"><i class="bi bi-arrow-left"></i> Kembali</a>
      </div>
    </div>
  </div>
  <script>
    google.script.run
      .withSuccessHandler(function(user) {
        var el = document.getElementById('userInfoContainer');
        if (user && user.email) {
          el.innerHTML = '<div class="user-info"><small>Login sebagai:</small><br><strong>' + user.email + '</strong></div>';
        }
      })
      .withFailureHandler(function() {})
      .getCurrentUser();
  </script>
</body>
</html>
