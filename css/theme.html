<style>
  /* ============================================================
     css/theme.html — CSS VARIABLES & DARK MODE
  ============================================================ */
  :root {
    --color-primary: #005bac;
    --color-primary-dark: #00437e;
    --color-navy: #0b2540;
    --color-navy-soft: #122f52;
    --color-accent: #fdb913;
    --color-bg: #f5f7fa;
    --color-surface: #ffffff;
    --color-text: #1f2937;
    --color-text-soft: #6b7280;
    --color-border: #e5e7eb;
    --sidebar-w: 260px;
    --drawer-w: 520px;
  }

  [data-theme="dark"] {
    --color-bg: #0f1720;
    --color-surface: #17212c;
    --color-text: #e7ecf2;
    --color-text-soft: #93a2b4;
    --color-border: #26313d;
  }

  * { box-sizing: border-box; }

  body {
    background: var(--color-bg);
    font-family: "Inter", sans-serif;
    color: var(--color-text);
    -webkit-font-smoothing: antialiased;
    transition: background-color 0.2s ease, color 0.2s ease;
  }

  /* stat icon colors */
  .stat-icon.bg-blue   { background: rgba(0,91,172,0.1);   color: var(--color-primary); }
  .stat-icon.bg-gold   { background: rgba(253,185,19,0.16); color: #8a6100; }
  .stat-icon.bg-green  { background: rgba(22,163,74,0.1);   color: #166534; }
  .stat-icon.bg-navy   { background: rgba(11,37,64,0.08);   color: var(--color-navy); }
  .stat-icon.bg-red    { background: rgba(220,38,38,0.1);   color: #b91c1c; }
  .stat-icon.bg-purple { background: rgba(124,58,237,0.1);  color: #6d28d9; }
  .stat-icon.bg-cyan   { background: rgba(8,145,178,0.1);   color: #0e7490; }
</style>
