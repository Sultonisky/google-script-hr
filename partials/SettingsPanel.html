<!-- partials/SettingsPanel.html — SETTINGS PAGE SECTION -->
<section class="page-section" id="pageSettings">
  <div class="panel settings-card">
    <div class="panel-header"><h6>Pengaturan Dashboard</h6></div>
    <div class="p-3 p-md-4">
      <div class="settings-row">
        <div>
          <div class="settings-label">Tema</div>
          <div class="settings-desc">Pilih tampilan terang atau gelap.</div>
        </div>
        <select id="settingTheme">
          <option value="light">Terang</option>
          <option value="dark">Gelap</option>
        </select>
      </div>
      <div class="settings-row">
        <div>
          <div class="settings-label">Item per Halaman</div>
          <div class="settings-desc">Jumlah baris tabel per halaman.</div>
        </div>
        <select id="settingPageSize">
          <option value="10">10</option>
          <option value="25">25</option>
          <option value="50">50</option>
          <option value="100">100</option>
        </select>
      </div>
      <div class="settings-row">
        <div>
          <div class="settings-label">Status Default</div>
          <div class="settings-desc">Filter status saat dashboard dibuka.</div>
        </div>
        <select id="settingDefaultStatus">
          <option value="">Semua Status</option>
          <option>Pending</option>
          <option>Accepted</option>
          <option>Hold</option>
          <option>Blacklist</option>
        </select>
      </div>
      <div class="settings-row">
        <div>
          <div class="settings-label">Auto Refresh</div>
          <div class="settings-desc">Muat ulang data secara otomatis di latar belakang.</div>
        </div>
        <div class="form-check form-switch">
          <input class="form-check-input" type="checkbox" role="switch"
            id="settingAutoRefresh" style="width:44px;height:24px" />
        </div>
      </div>
      <div class="settings-row">
        <div>
          <div class="settings-label">Interval Refresh (detik)</div>
          <div class="settings-desc">Seberapa sering dashboard menyegarkan data.</div>
        </div>
        <input type="number" id="settingRefreshInterval" min="15" step="5" style="width:110px" />
      </div>
      <div class="settings-row">
        <div></div>
        <button class="btn-reset-filter" id="btnSaveSettings" type="button">
          <i class="bi bi-check2-circle"></i> Simpan Pengaturan
        </button>
      </div>
    </div>
  </div>
</section>
