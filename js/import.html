<script>
  // ============================================================
  // js/import.html — CSV IMPORT LOGIC
  // Depends on: helpers.html (showToast)
  // ============================================================

  var importFile = null;
  var importRows = [];

  function openImportModal() {
    importFile = null;
    importRows = [];
    resetImportSteps();
    var m = new bootstrap.Modal(document.getElementById('importModal'));
    m.show();
  }

  function resetImportSteps() {
    document.getElementById('importStep1').style.display = '';
    document.getElementById('importStep2').style.display = 'none';
    document.getElementById('importStep3').style.display = 'none';
    document.getElementById('importFileInfo').style.display = 'none';
    document.getElementById('importDropZone').style.display = '';
    document.getElementById('btnImportStart').classList.add('disabled');
    document.getElementById('btnImportStart').disabled = true;
    document.getElementById('btnImportStartText').style.display = '';
    document.getElementById('btnImportLoading').style.display = 'none';
    document.getElementById('btnImportBack').style.display = 'none';
    document.getElementById('importErrorList').innerHTML = '';
    document.getElementById('importResultErrors').style.display = 'none';
    document.getElementById('importPreviewBody').innerHTML = '';
    document.getElementById('importSummaryBadge').textContent = '-';
  }

  function initImportModal() {
    var dropZone = document.getElementById('importDropZone');
    var fileInput = document.getElementById('importFileInput');
    var clearBtn = document.getElementById('btnImportClearFile');
    var startBtn = document.getElementById('btnImportStart');
    var backBtn = document.getElementById('btnImportBack');

    if (dropZone && fileInput) {
      dropZone.addEventListener('click', function() { fileInput.click(); });
      dropZone.addEventListener('dragover', function(e) {
        e.preventDefault();
        dropZone.style.background = '#e8f0fe';
      });
      dropZone.addEventListener('dragleave', function() {
        dropZone.style.background = '';
      });
      dropZone.addEventListener('drop', function(e) {
        e.preventDefault();
        dropZone.style.background = '';
        if (e.dataTransfer.files.length > 0) handleImportFile(e.dataTransfer.files[0]);
      });
      fileInput.addEventListener('change', function() {
        if (fileInput.files.length > 0) handleImportFile(fileInput.files[0]);
      });
    }

    if (clearBtn) clearBtn.addEventListener('click', function() {
      importFile = null;
      importRows = [];
      resetImportSteps();
      if (fileInput) fileInput.value = '';
    });

    if (startBtn) startBtn.addEventListener('click', function() {
      if (importRows.length === 0) return;
      runImport();
    });

    if (backBtn) backBtn.addEventListener('click', function() {
      resetImportSteps();
      if (importRows.length > 0) showImportPreview(importRows);
    });
  }

  function handleImportFile(file) {
    if (!file.name.toLowerCase().endsWith('.csv')) {
      showToast('Hanya file CSV yang didukung.', 'error');
      return;
    }
    if (file.size > 5 * 1024 * 1024) {
      showToast('Ukuran file maksimal 5MB.', 'error');
      return;
    }
    importFile = file;

    document.getElementById('importFileName').textContent = file.name;
    document.getElementById('importFileSize').textContent = (file.size / 1024).toFixed(1) + ' KB';
    document.getElementById('importFileInfo').style.display = '';
    document.getElementById('importDropZone').style.display = 'none';

    // Parse CSV
    var reader = new FileReader();
    reader.onload = function(e) {
      var text = e.target.result;
      importRows = parseCSV(text);

      if (importRows.length === 0) {
        showToast('File CSV kosong atau format tidak sesuai.', 'error');
        return;
      }
      if (importRows.length > 500) {
        showToast('Maksimal 500 baris per import. File memiliki ' + importRows.length + ' baris.', 'error');
        importRows = [];
        return;
      }

      showImportPreview(importRows);
    };
    reader.readAsText(file);
  }

  function parseCSV(text) {
    var lines = text.split(/\r?\n/).filter(function(l) { return l.trim() !== ''; });
    if (lines.length < 2) return [];

    var headers = lines[0].split(',').map(function(h) { return h.trim().replace(/^"|"$/g, ''); });

    // Map CSV headers to our field names
    var fieldMap = {
      'nama': 'fullName', 'fullname': 'fullName', 'full_name': 'fullName',
      'email': 'email',
      'telepon': 'phone', 'phone': 'phone', 'no_hp': 'phone', 'hp': 'phone', 'nomor_telepon': 'phone',
      'gender': 'gender', 'jenis_kelamin': 'gender',
      'tanggal_lahir': 'dateOfBirth', 'dateofbirth': 'dateOfBirth', 'date_of_birth': 'dateOfBirth', 'dob': 'dateOfBirth',
      'usia': 'age', 'age': 'age',
      'tempat_lahir': 'pob', 'pob': 'pob', 'place_of_birth': 'pob',
      'alamat': 'address', 'address': 'address',
      'kota': 'city', 'city': 'city', 'kota_asal': 'city',
      'provinsi': 'province', 'province': 'province',
      'kecamatan': 'district', 'district': 'district',
      'kelurahan': 'village', 'village': 'village',
      'kode_pos': 'postalCode', 'postalCode': 'postalCode', 'postal_code': 'postalCode',
      'nik': 'nik',
      'pendidikan': 'education', 'education': 'education',
      'jurusan': 'major', 'major': 'major', 'specialization': 'major',
      'institusi': 'institution', 'institution': 'institution', 'universitas': 'institution',
      'ipk': 'gpa', 'gpa': 'gpa',
      'pengalaman_kerja': 'workExperience', 'workExperience': 'workExperience', 'work_experience': 'workExperience',
      'posisi': 'positionApplied', 'positionApplied': 'positionApplied', 'position_applied': 'positionApplied',
      'gaji_harapan': 'expectedSalary', 'expectedSalary': 'expectedSalary', 'expected_salary': 'expectedSalary',
      'langsung_bekerja': 'availableImmediately', 'availableImmediately': 'availableImmediately', 'available_immediately': 'availableImmediately',
      'status_kerja': 'currentEmploymentStatus', 'currentEmploymentStatus': 'currentEmploymentStatus', 'current_employment_status': 'currentEmploymentStatus',
      'sumber': 'recruitmentSource', 'recruitmentSource': 'recruitmentSource', 'recruitment_source': 'recruitmentSource',
      'catatan': 'notes', 'notes': 'notes'
    };

    var rows = [];
    for (var i = 1; i < lines.length; i++) {
      var vals = lines[i].split(',').map(function(v) { return v.trim().replace(/^"|"$/g, ''); });
      var row = {};
      for (var j = 0; j < headers.length; j++) {
        var key = fieldMap[headers[j].toLowerCase()] || headers[j];
        row[key] = vals[j] || '';
      }
      rows.push(row);
    }
    return rows;
  }

  function showImportPreview(rows) {
    // Client-side basic validation
    document.getElementById('importStep1').style.display = 'none';
    document.getElementById('importStep2').style.display = '';

    var badge = document.getElementById('importSummaryBadge');
    badge.textContent = rows.length + ' baris siap diimport';
    badge.className = 'badge bg-primary';
    badge.style.fontSize = '12px';

    var tbody = document.getElementById('importPreviewBody');
    tbody.innerHTML = rows.map(function(r, i) {
      var nameOk = r.fullName && r.fullName.trim() !== '';
      var phoneOk = r.phone && r.phone.trim() !== '';
      var statusClass = (nameOk && phoneOk) ? 'text-success' : 'text-danger';
      var statusIcon = (nameOk && phoneOk) ? 'bi-check-circle-fill' : 'bi-x-circle-fill';
      var statusText = (nameOk && phoneOk) ? 'OK' : (!nameOk ? 'Nama kosong' : 'Telepon kosong');
      return '<tr>' +
        '<td>' + (i + 1) + '</td>' +
        '<td>' + escapeHtml(r.fullName || '-') + '</td>' +
        '<td>' + escapeHtml(r.phone || '-') + '</td>' +
        '<td><i class="bi ' + statusIcon + ' ' + statusClass + '"></i> <span class="' + statusClass + '">' + statusText + '</span></td>' +
        '</tr>';
    }).join('');

    document.getElementById('btnImportStart').classList.remove('disabled');
    document.getElementById('btnImportStart').disabled = false;
    document.getElementById('btnImportBack').style.display = '';
  }

  function runImport() {
    if (importRows.length === 0) return;

    // Show loading state
    document.getElementById('btnImportStartText').style.display = 'none';
    document.getElementById('btnImportLoading').style.display = '';
    document.getElementById('btnImportStart').classList.add('disabled');
    document.getElementById('btnImportStart').disabled = true;
    document.getElementById('btnImportBack').style.display = 'none';

    google.script.run
      .withSuccessHandler(function(result) {
        // Show result
        document.getElementById('importStep2').style.display = 'none';
        document.getElementById('importStep3').style.display = '';

        var icon = document.getElementById('importResultIcon');
        var title = document.getElementById('importResultTitle');
        var msg = document.getElementById('importResultMessage');
        var errDiv = document.getElementById('importResultErrors');
        var errList = document.getElementById('importErrorList');

        if (result.success) {
          icon.className = 'bi bi-check-circle-fill fs-1';
          icon.style.color = 'var(--color-success)';
          title.textContent = 'Import Berhasil!';
          title.className = 'mt-3 mb-1 text-success';
        } else {
          icon.className = 'bi bi-exclamation-triangle-fill fs-1';
          icon.style.color = '#e67700';
          title.textContent = 'Import Selesai dengan Error';
          title.className = 'mt-3 mb-1';
        }

        msg.textContent = result.message || (result.imported + ' kandidat berhasil diimport.');

        if (result.errors && result.errors.length > 0) {
          errDiv.style.display = '';
          errList.innerHTML = result.errors.map(function(e) {
            return '<li>' + escapeHtml(e) + '</li>';
          }).join('');
        }

        // Reset button states
        document.getElementById('btnImportStartText').style.display = '';
        document.getElementById('btnImportLoading').style.display = 'none';
        document.getElementById('btnImportStart').style.display = 'none';
        document.getElementById('btnImportBack').style.display = 'none';

        // Refresh candidate table if on dashboard
        if (typeof loadCandidates === 'function') loadCandidates();

        showToast(result.message || 'Import selesai.', result.success ? 'success' : 'error');
      })
      .withFailureHandler(function(err) {
        document.getElementById('importStep2').style.display = 'none';
        document.getElementById('importStep3').style.display = '';
        document.getElementById('importResultIcon').className = 'bi bi-exclamation-circle-fill fs-1';
        document.getElementById('importResultIcon').style.color = '#991b1b';
        document.getElementById('importResultTitle').textContent = 'Import Gagal';
        document.getElementById('importResultTitle').className = 'mt-3 mb-1 text-danger';
        document.getElementById('importResultMessage').textContent = err.message || 'Terjadi kesalahan saat import.';
        document.getElementById('btnImportStartText').style.display = '';
        document.getElementById('btnImportLoading').style.display = 'none';
        document.getElementById('btnImportStart').style.display = 'none';
        document.getElementById('btnImportBack').style.display = '';
        showToast('Import gagal: ' + (err.message || err), 'error');
      })
      .importCandidates(importRows);
  }
</script>
