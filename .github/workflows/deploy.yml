name: Deploy MITO HRIS

on:
  workflow_run:
    workflows:
      - "CI - MITO HRIS"
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mito-hris-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -Eeuo pipefail
            trap 'echo "Deployment failed at line ${LINENO}: ${BASH_COMMAND}" >&2' ERR

            echo "== Server identity =="
            hostname
            whoami
            pwd
            id

            echo "== OS =="
            cat /etc/os-release | head -n 5

            echo "== /opt =="
            ls -la /opt || true

            echo "== /opt/mito-hris =="
            ls -la /opt/mito-hris || true

            echo "== /opt/mito-hris/app =="
            ls -la /opt/mito-hris/app || true

            REPO_DIR="/opt/mito-hris/app"
            COMPOSE_DIR="/opt/mito-hris"
            DEPLOY_SHA="${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}"

            echo "== Deployment target =="
            echo "Commit: $DEPLOY_SHA"

            echo "== Updating source =="
            cd "$REPO_DIR"
            git fetch --prune origin main
            git reset --hard "$DEPLOY_SHA"

            echo "== Verifying deployed commit =="
            test "$(git rev-parse HEAD)" = "$DEPLOY_SHA" || {
              echo "Server checkout does not match CI commit." >&2
              echo "Expected: $DEPLOY_SHA" >&2
              echo "Actual:   $(git rev-parse HEAD)" >&2
              exit 1
            }

            echo "Deploying commit: $(git rev-parse --short HEAD)"

            if [ -f "$REPO_DIR/mito-hris-laravel/package.json" ]; then
              APP_DIR="$REPO_DIR/mito-hris-laravel"
            elif [ -f "$REPO_DIR/package.json" ]; then
              APP_DIR="$REPO_DIR"
            else
              echo "Cannot find Laravel package.json under $REPO_DIR" >&2
              exit 1
            fi

            echo "App directory: $APP_DIR"

            echo "== Pinning hris-app PHP to 8.4.27 =="
            cd "$COMPOSE_DIR"
            if ! docker compose config --format json > /tmp/hris-compose.json; then
              echo "Unable to read the hris-app compose config." >&2
              exit 1
            fi
            python3 - <<'PY'
            import json, os, re, sys

            root = os.environ["COMPOSE_DIR"]
            with open("/tmp/hris-compose.json", encoding="utf-8") as handle:
                config = json.load(handle)

            service = config.get("services", {}).get("hris-app")
            build = service.get("build") if isinstance(service, dict) else None
            if not build:
                sys.exit("hris-app has no build section; refusing to deploy the current image")

            if isinstance(build, str):
                context, dockerfile = build, "Dockerfile"
            else:
                context = build.get("context") or root
                dockerfile = build.get("dockerfile") or "Dockerfile"

            if not os.path.isabs(context):
                context = os.path.abspath(os.path.join(root, context))
            if not os.path.isabs(dockerfile):
                dockerfile = os.path.join(context, dockerfile)
            if not os.path.isfile(dockerfile):
                sys.exit(f"Dockerfile not found: {dockerfile}")

            image_re = re.compile(r"php:(\d+\.\d+(?:\.\d+)?)([^\s'\"]*)")
            arg_re = re.compile(
                r"(?m)^(\s*ARG\s+[A-Z0-9_]*PHP[A-Z0-9_]*=)['\"]?(\d+\.\d+(?:\.\d+)?)['\"]?"
            )
            compose_arg_re = re.compile(
                r"(PHP_VERSION\s*[:=]\s*['\"]?)(\d+\.\d+(?:\.\d+)?)"
            )

            def pin_token(match):
                suffix = re.sub(r"@sha256:[0-9a-fA-F]+", "", match.group(2) or "")
                return f"php:8.4.27{suffix}"

            def pin_file(path):
                with open(path, encoding="utf-8") as handle:
                    original = handle.read()
                updated, images = image_re.subn(pin_token, original)
                updated, args = arg_re.subn(r"\g<1>8.4.27", updated)
                updated, compose_args = compose_arg_re.subn(r"\g<1>8.4.27", updated)
                if updated != original:
                    with open(path, "w", encoding="utf-8", newline="\n") as handle:
                        handle.write(updated)
                    print(f"Pinned PHP 8.4.27 in {path}")
                else:
                    print(f"PHP image already 8.4.27 in {path}")
                return images + args + compose_args

            pinned = pin_file(dockerfile)
            for name in ("docker-compose.yml", "docker-compose.yaml", "compose.yml", "compose.yaml"):
                path = os.path.join(root, name)
                if os.path.isfile(path) and os.path.abspath(path) != os.path.abspath(dockerfile):
                    pinned += pin_file(path)

            if pinned == 0:
                sys.exit(f"No PHP image tag found in {dockerfile}")
            PY

            echo "== Building HRIS Docker image =="
            docker compose build --pull hris-app

            echo "== Updating containers =="
            docker compose up -d hris-app hris-nginx

            echo "== Waiting for HRIS container =="
            for i in {1..30}; do
              if docker inspect -f '{{.State.Running}}' hris-app 2>/dev/null | grep -q true; then
                echo "hris-app is running."
                break
              fi
              if [ "$i" -eq 30 ]; then
                echo "hris-app failed to start." >&2
                docker logs --tail 100 hris-app >&2 || true
                exit 1
              fi
              sleep 2
            done

            echo "== Verifying PHP 8.4.27 =="
            PHP_RUNTIME="$(docker exec hris-app php -r 'echo PHP_VERSION;')"
            echo "hris-app PHP CLI ${PHP_RUNTIME}"
            test "${PHP_RUNTIME}" = "8.4.27"
            if docker exec hris-app sh -c 'command -v php-fpm >/dev/null'; then
              FPM_RUNTIME="$(docker exec hris-app php-fpm -v | awk 'NR==1 { print $2 }')"
              echo "hris-app PHP FPM ${FPM_RUNTIME}"
              test "${FPM_RUNTIME}" = "8.4.27"
            fi

            echo "== Publishing Vite assets for nginx =="
            docker exec hris-app php artisan mito:verify-frontend

            BUILD_PATH="$(docker exec hris-app php artisan mito:verify-frontend --build-path | tail -n 1 | tr -d '\r')"
            test -n "$BUILD_PATH"

            mkdir -p "$APP_DIR/public/build"

            docker exec hris-app tar \
              -C "$BUILD_PATH" \
              -cf - . \
              | tar \
                  --no-same-owner \
                  --no-same-permissions \
                  --no-overwrite-dir \
                  -xf - \
                  -C "$APP_DIR/public/build"

            test -f "$APP_DIR/public/build/manifest.json"
            ls "$APP_DIR/public/build/assets"/app-*.js >/dev/null
            ls "$APP_DIR/public/build/assets"/public-*.css >/dev/null

            echo "Vite assets published successfully."

            echo "== Applying database migrations =="
            docker exec hris-app php artisan migrate --force

            echo "== SoT health & diagnostics =="
            docker exec hris-app php artisan optimize:clear
            docker exec hris-app php artisan mito:health-check
            docker exec hris-app php artisan mito:diagnose
            # Warm-cache dari SoT aktif (DB jika HRIS_DATA_DRIVER=pgsql, Sheets jika sheets)
            docker exec hris-app php artisan mito:sync

            echo "== Sheets archive helpers =="
            # Soft-disabled (SUCCESS no-op) when HRIS_DATA_DRIVER=pgsql.
            # Still runs for real when SoT is still sheets. Never pass --force here
            # so deploy cannot mutate archive Sheets while Postgres is SoT.
            docker exec hris-app php artisan mito:setup-sheets --fix --no-interaction
            docker exec hris-app php artisan mito:validate-schema

            echo "== ETL / mirror (manual only; not auto-run on deploy) =="
            echo "Import once:  php artisan mito:etl-sheets-to-db --dry-run"
            echo "Mirror archive: php artisan mito:etl-db-to-sheets --dry-run"

            echo "== Laravel optimization =="
            docker exec hris-app php artisan config:cache
            docker exec hris-app php artisan route:cache
            docker exec hris-app php artisan view:cache

            echo "== Post-deploy application check =="
            docker exec hris-app php artisan about >/dev/null

            echo "== Container status =="
            docker compose ps

            echo "== Deployment completed successfully =="
