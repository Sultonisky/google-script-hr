name: Deploy MITO HRIS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e

            cd /home/ubuntu/hris/mito-hris-laravel

            echo "== Updating source =="
            git fetch origin main
            git reset --hard origin/main

            echo "== Installing PHP dependencies =="
            composer install --optimize-autoloader --no-interaction

            echo "== Checking Node dependencies =="
            if [ ! -d "node_modules" ]; then
              echo "node_modules not found. Installing..."
              npm install
            else
              echo "node_modules already exists. Skipping npm install."
            fi

            echo "== Building frontend assets =="
            npm run build

            echo "== Running Laravel tests =="
            if [ -x "vendor/bin/phpunit" ]; then
              ./vendor/bin/phpunit
            else
              echo "PHPUnit not installed in production dependencies."
              echo "Skipping Laravel tests."
            fi

            echo "== Running MITO diagnostics =="
            php artisan mito:diagnose

            echo "== Checking Google Sheets =="
            php artisan mito:health-check
            php artisan mito:setup-sheets --fix
            php artisan mito:validate-schema
            php artisan mito:sync

            echo "== Laravel optimization =="
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            echo "== Reloading PHP-FPM =="
            sudo systemctl reload php8.3-fpm

            echo "== Deployment completed successfully =="
