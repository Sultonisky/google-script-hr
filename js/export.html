<script>
  // ============================================================
  // js/export.html — CSV / EXCEL / PDF EXPORT
  // Depends on: helpers.html, filters.html
  // Requires: XLSX CDN loaded before this script
  // ============================================================

  function getExportRows() {
    return filteredCandidates.map(function(r) {
      return {
        'Recruitment ID': r.recruitmentId,
        'Nama Lengkap':   r.fullName,
        'NIK':            r.nik,
        'Tanggal Lahir':  r.birthDate,
        'Usia':           r.age,
        'Gender':         r.gender,
        'Status Pernikahan': r.maritalStatus,
        'Email':          r.email,
        'No. HP':         r.phone,
        'Kota':           r.city,
        'Posisi Dilamar': r.positionApplied,
        'Pendidikan':     r.education,
        'Pengalaman':     r.workExperience,
        'Perusahaan Terakhir': r.lastCompany,
        'Status Kerja':   r.currentEmploymentStatus,
        'Kesediaan Join': r.availableToJoin,
        'Ekspektasi Gaji': r.expectedSalary,
        'Sumber':         r.recruitmentSource,
        'Status':         r.status,
        'Tanggal Daftar': r.createdDate,
        'Employee ID':    r.employeeId || ''
      };
    });
  }

  function exportCsv(rows, filename) {
    var headers = Object.keys(rows[0]);
    var csv = headers.join(',') + '\n' + rows.map(function(row) {
      return headers.map(function(h) {
        return '"' + String(row[h] !== null && row[h] !== undefined ? row[h] : '').replace(/"/g, '""') + '"';
      }).join(',');
    }).join('\n');
    var blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
    var link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = filename;
    link.click();
  }

  function exportXlsx(rows, sheetName, filename) {
    var ws = XLSX.utils.json_to_sheet(rows);
    var wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, sheetName);
    XLSX.writeFile(wb, filename);
  }

  function exportPdf(rows, title) {
    var headers = Object.keys(rows[0]);
    var win = window.open('', '_blank');
    var html = '<html><head><title>' + title + '</title><style>' +
      'body{font-family:Arial,sans-serif;padding:20px;} h3{margin-bottom:14px;}' +
      'table{width:100%;border-collapse:collapse;font-size:11px;} th,td{border:1px solid #ccc;padding:6px 8px;text-align:left;}' +
      'th{background:#005BAC;color:#fff;}' +
      '</style></head><body>' +
      '<h3>' + title + ' &mdash; ' + new Date().toLocaleDateString('id-ID') + '</h3>' +
      '<table><thead><tr>' + headers.map(function(h){ return '<th>' + h + '</th>'; }).join('') + '</tr></thead><tbody>' +
      rows.map(function(row){ return '<tr>' + headers.map(function(h){ return '<td>' + escapeHtml(row[h]) + '</td>'; }).join('') + '</tr>'; }).join('') +
      '</tbody></table></body></html>';
    win.document.write(html);
    win.document.close();
    win.focus();
    setTimeout(function(){ win.print(); }, 400);
  }

  function initExportButtons() {
    var btnCsv  = document.getElementById('btnExportCsv');
    var btnXlsx = document.getElementById('btnExportXlsx');
    var btnPdf  = document.getElementById('btnExportPdf');
    var today   = new Date().toISOString().slice(0, 10);

    if (btnCsv) btnCsv.addEventListener('click', function() {
      var rows = getExportRows();
      if (!rows.length) { showToast('Tidak ada data untuk diexport.', 'warning'); return; }
      exportCsv(rows, 'data-kandidat-' + today + '.csv');
      showToast('Data berhasil diexport ke CSV (' + rows.length + ' data).', 'success');
    });

    if (btnXlsx) btnXlsx.addEventListener('click', function() {
      var rows = getExportRows();
      if (!rows.length) { showToast('Tidak ada data untuk diexport.', 'warning'); return; }
      exportXlsx(rows, 'Kandidat', 'data-kandidat-' + today + '.xlsx');
      showToast('Data berhasil diexport ke Excel (' + rows.length + ' data).', 'success');
    });

    if (btnPdf) btnPdf.addEventListener('click', function() {
      var rows = getExportRows();
      if (!rows.length) { showToast('Tidak ada data untuk diexport.', 'warning'); return; }
      exportPdf(rows, 'Data Kandidat');
    });
  }
</script>
