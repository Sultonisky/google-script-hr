<!-- partials/MasterDataContent.html — MASTER DATA PAGE CONTENT (SPA partial) -->
<!-- Digunakan di dalam <section id="pageMasterData"> di Dashboard.html -->

<!-- Summary Cards -->
<div class="md-card" id="mdSummaryCard">
  <div class="md-card-body">
    <div class="md-summary" id="mdSummaryGrid"></div>
  </div>
</div>

<!-- Main Table Card -->
<div class="md-card">
  <div class="md-card-header">
    <h6><i class="bi bi-list-ul"></i> <span id="mdCurrentCategoryLabel">Semua Data</span></h6>
    <button class="btn-md-add" id="btnMdAdd" type="button">
      <i class="bi bi-plus-lg"></i> Tambah Item
    </button>
  </div>

  <!-- Category Nav -->
  <div class="md-cat-nav" id="mdCatNav"></div>

  <!-- Toolbar -->
  <div class="md-toolbar">
    <div class="md-search">
      <i class="bi bi-search"></i>
      <input type="text" id="mdSearch" placeholder="Cari item..." autocomplete="off" />
    </div>
    <div class="text-muted small" id="mdCountInfo">0 item</div>
  </div>

  <!-- Table -->
  <div class="md-card-body">
    <div style="overflow-x:auto;">
      <table class="md-table" id="mdTable">
        <thead>
          <tr>
            <th style="width:50px;">#</th>
            <th>Nama</th>
            <th>Deskripsi</th>
            <th>Kategori</th>
            <th style="width:80px;">Aksi</th>
          </tr>
        </thead>
        <tbody id="mdTableBody"></tbody>
      </table>
    </div>
    <div class="md-empty" id="mdEmpty" style="display:none;">
      <i class="bi bi-inbox"></i>
      <div>Belum ada data ditemukan.</div>
    </div>
  </div>
</div>

<!-- Add/Edit Modal -->
<div class="modal fade" id="mdItemModal" tabindex="-1" aria-labelledby="mdItemModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content" style="border-radius:12px;box-shadow:0 8px 40px rgba(0,0,0,0.12);">
      <div class="modal-header" style="border-bottom:1px solid var(--border-color,#f0f0f0);padding:16px 20px;">
        <h6 class="modal-title fw-bold" id="mdItemModalLabel">Tambah Item</h6>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Tutup"></button>
      </div>
      <div class="modal-body" style="padding:20px;">
        <input type="hidden" id="mdItemId" />
        <div class="mb-3">
          <label class="form-label fw-semibold" style="font-size:13px;">
            Kategori <span class="text-danger">*</span>
          </label>
          <select class="form-select" id="mdItemCategory" style="font-size:13px;">
            <option value="">— Pilih Kategori —</option>
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold" style="font-size:13px;">
            Nama <span class="text-danger">*</span>
          </label>
          <input type="text" class="form-control" id="mdItemName" placeholder="Nama item" style="font-size:13px;" />
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold" style="font-size:13px;">Deskripsi</label>
          <input type="text" class="form-control" id="mdItemDesc" placeholder="Deskripsi singkat (opsional)" style="font-size:13px;" />
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold" style="font-size:13px;">Urutan</label>
          <input type="number" class="form-control" id="mdItemOrder" min="1" value="1" style="font-size:13px;width:100px;" />
        </div>
      </div>
      <div class="modal-footer" style="border-top:1px solid var(--border-color,#f0f0f0);padding:12px 20px;">
        <button type="button" class="btn btn-light btn-sm fw-semibold" data-bs-dismiss="modal">Batal</button>
        <button type="button" class="btn btn-primary btn-sm fw-semibold" id="btnMdSaveItem"
          style="background:#005BAC;border:none;">
          <i class="bi bi-check2-circle me-1"></i> Simpan
        </button>
      </div>
    </div>
  </div>
</div>

<!-- Toast Notification -->
<div class="position-fixed bottom-0 end-0 p-3" style="z-index:9999;pointer-events:none;">
  <div id="mdToast" class="toast align-items-center border-0 shadow" role="alert" aria-live="assertive" aria-atomic="true" style="pointer-events:auto;">
    <div class="d-flex">
      <div class="toast-body" id="mdToastBody"></div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Tutup"></button>
    </div>
  </div>
</div>
