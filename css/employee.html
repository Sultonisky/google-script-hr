<!-- css/employee.html — EMPLOYEE & USER MANAGEMENT PAGE STYLES -->
<style>
  /* ============ EMPLOYEE PAGE ============ */
  .emp-ct {
    max-width: 1200px;
    margin: 0 auto;
    padding: 24px;
  }
  .emp-hdr {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
    flex-wrap: wrap;
    gap: 12px;
  }
  .emp-hdr h4 {
    font-weight: 700;
    color: var(--color-text);
    margin: 0;
  }
  .emp-card {
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: 12px;
    box-shadow: 0 1px 8px rgba(0, 0, 0, 0.06);
    margin-bottom: 20px;
    overflow: hidden;
  }
  .emp-card-body {
    padding: 16px 20px;
  }
  .emp-card-hdr {
    padding: 16px 20px;
    border-bottom: 1px solid var(--color-border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .emp-card-hdr h6 {
    margin: 0;
    font-weight: 700;
    color: var(--color-text);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .emp-tb {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 20px;
    gap: 10px;
    flex-wrap: wrap;
  }
  .emp-srch {
    position: relative;
  }
  .emp-srch input {
    padding: 8px 12px 8px 34px;
    border: 1px solid var(--color-border);
    border-radius: 8px;
    font-size: 13px;
    width: 240px;
    background: var(--color-bg);
    color: var(--color-text);
  }
  .emp-srch input::placeholder {
    color: var(--color-text-soft);
  }
  .emp-srch input:focus {
    outline: none;
    border-color: var(--color-primary);
    box-shadow: 0 0 0 3px rgba(235, 28, 36, 0.1);
  }
  .emp-srch i {
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--color-text-soft);
  }
  .emp-flt {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .emp-flt select {
    padding: 7px 12px;
    border: 1px solid var(--color-border);
    border-radius: 8px;
    font-size: 12px;
    background: var(--color-bg);
    color: var(--color-text);
  }
  .emp-flt select:focus {
    outline: none;
    border-color: var(--color-primary);
  }
  .emp-tbl {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  .emp-tbl th {
    background: var(--color-bg);
    font-weight: 600;
    color: var(--color-text-soft);
    text-transform: uppercase;
    font-size: 11px;
    letter-spacing: 0.5px;
    padding: 10px 16px;
    text-align: left;
    border-bottom: 1px solid var(--color-border);
  }
  .emp-tbl td {
    padding: 10px 16px;
    border-bottom: 1px solid var(--color-border);
    color: var(--color-text);
    vertical-align: middle;
  }
  .emp-tbl tr:last-child td { border-bottom: none; }
  .emp-tbl tr:hover td {
    background: var(--color-bg);
    cursor: pointer;
  }
  .emp-nm {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .emp-av {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: rgba(235, 28, 36, 0.1);
    color: var(--color-primary);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 13px;
    flex-shrink: 0;
  }
  .emp-av img {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    object-fit: cover;
  }
  .emp-inf .nm {
    font-weight: 600;
    color: var(--color-text);
  }
  .emp-inf .nk {
    font-size: 11px;
    color: var(--color-text-soft);
  }
  .emp-st {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 600;
  }
  .emp-st.on  { background: rgba(22, 163, 74, 0.12); color: #166534; }
  .emp-st.off { background: rgba(220, 38, 38, 0.12); color: #991b1b; }
  :root[data-theme="dark"] .emp-st.on  { background: rgba(22, 163, 74, 0.18); color: #4ade80; }
  :root[data-theme="dark"] .emp-st.off { background: rgba(220, 38, 38, 0.18); color: #f87171; }

  .emp-empty {
    text-align: center;
    padding: 40px 20px;
    color: var(--color-text-soft);
  }
  .emp-empty i {
    font-size: 48px;
    color: var(--color-border);
    display: block;
    margin-bottom: 12px;
  }
  .emp-stats {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 12px;
    padding: 20px;
  }
  .emp-sc {
    padding: 16px;
    border-radius: 10px;
    border: 1px solid var(--color-border);
    background: var(--color-bg);
  }
  .emp-sc .sn {
    font-size: 28px;
    font-weight: 800;
    color: var(--color-text);
  }
  .emp-sc .sl {
    font-size: 12px;
    color: var(--color-text-soft);
    margin-top: 2px;
  }
  .emp-sc.pri .sn { color: var(--color-primary); }
  .emp-sc.suc .sn { color: #166534; }
  .emp-sc.dan .sn { color: #991b1b; }
  :root[data-theme="dark"] .emp-sc.suc .sn { color: #4ade80; }
  :root[data-theme="dark"] .emp-sc.dan .sn { color: #f87171; }

  .btn-em {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 16px;
    border-radius: 8px;
    font-weight: 600;
    font-size: 13px;
    border: none;
    cursor: pointer;
    background: var(--color-primary);
    color: #fff;
  }
  .btn-em:hover { background: var(--color-primary-dark); }

  .btn-eo {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 16px;
    border-radius: 8px;
    font-weight: 600;
    font-size: 13px;
    border: 1px solid var(--color-border);
    cursor: pointer;
    background: var(--color-surface);
    color: var(--color-text);
  }
  .btn-eo:hover { background: var(--color-bg); }

  .dt-row {
    display: flex;
    padding: 8px 0;
    border-bottom: 1px solid var(--color-border);
  }
  .dt-label {
    width: 160px;
    font-weight: 600;
    color: var(--color-text-soft);
    font-size: 13px;
    flex-shrink: 0;
  }
  .dt-val {
    font-size: 13px;
    color: var(--color-text);
  }

  /* ============ USER MANAGEMENT PAGE ============ */
  .um-container {
    max-width: 1100px;
    margin: 0 auto;
    padding: 24px;
  }
  .um-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
    flex-wrap: wrap;
    gap: 12px;
  }
  .um-header h4 {
    font-weight: 700;
    color: var(--color-text);
    margin: 0;
  }
  .um-card {
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: 12px;
    box-shadow: 0 1px 8px rgba(0, 0, 0, 0.06);
  }
  .um-toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 20px;
    border-bottom: 1px solid var(--color-border);
    flex-wrap: wrap;
    gap: 12px;
  }
  .um-table { width: 100%; }
  .um-table th {
    font-weight: 600;
    color: var(--color-text-soft);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    border-top: none;
    background: var(--color-bg);
  }
  .um-table td {
    vertical-align: middle;
    border-color: var(--color-border);
    color: var(--color-text);
  }
  .role-badge {
    font-size: 11px;
    padding: 4px 8px;
    border-radius: 6px;
    font-weight: 600;
  }
  .info-card {
    background: rgba(59, 130, 246, 0.08);
    border: 1px solid rgba(59, 130, 246, 0.25);
    border-radius: 10px;
    padding: 16px 20px;
    margin-bottom: 20px;
  }
  .info-card i {
    color: var(--color-primary);
    font-size: 18px;
  }
  .info-card p {
    margin: 4px 0 0 0;
    color: #1e40af;
    font-size: 13px;
  }
  :root[data-theme="dark"] .info-card {
    background: rgba(235, 28, 36, 0.08);
    border-color: rgba(235, 28, 36, 0.2);
  }
  :root[data-theme="dark"] .info-card p { color: #93c5fd; }

  @media (max-width: 768px) {
    .emp-tb { flex-direction: column; align-items: stretch; }
    .emp-srch input { width: 100%; }
    .emp-flt { flex-direction: column; }
  }
</style>
