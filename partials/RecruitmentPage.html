<!-- partials/RecruitmentPage.html — RECRUITMENT IN-PAGE SECTION (inside Dashboard) -->
<section class="page-section" id="pageRecruitment">

  <!-- Stat cards -->
  <div class="row g-3 mb-4">
    <div class="col-6 col-md-3">
      <div class="stat-card">
        <div class="stat-icon bg-blue"><i class="bi bi-people-fill"></i></div>
        <div><div class="stat-label">Total</div><div class="stat-value" id="recStatTotal">0</div></div>
      </div>
    </div>
    <div class="col-6 col-md-3">
      <div class="stat-card">
        <div class="stat-icon bg-gold"><i class="bi bi-hourglass-split"></i></div>
        <div><div class="stat-label">Pending</div><div class="stat-value" id="recStatPending">0</div></div>
      </div>
    </div>
    <div class="col-6 col-md-3">
      <div class="stat-card">
        <div class="stat-icon bg-green"><i class="bi bi-check-circle-fill"></i></div>
        <div><div class="stat-label">Accepted</div><div class="stat-value" id="recStatAccepted">0</div></div>
      </div>
    </div>
    <div class="col-6 col-md-3">
      <div class="stat-card">
        <div class="stat-icon bg-red"><i class="bi bi-slash-circle-fill"></i></div>
        <div><div class="stat-label">Blacklist</div><div class="stat-value" id="recStatBlacklist">0</div></div>
      </div>
    </div>
  </div>

  <!-- Table panel -->
  <div class="panel" id="recTablePanel">
    <div class="panel-header">
      <div>
        <h6>Data Recruitment</h6>
        <div class="panel-subtitle" id="recPanelSubtitle">Memuat data...</div>
      </div>
      <div class="export-btns">
        <button class="btn-export csv"  id="recBtnExportCsv"  type="button"><i class="bi bi-filetype-csv"></i> CSV</button>
        <button class="btn-export xlsx" id="recBtnExportXlsx" type="button"><i class="bi bi-file-earmark-excel"></i> Excel</button>
        <button class="btn-export pdf"  id="recBtnExportPdf"  type="button"><i class="bi bi-file-earmark-pdf"></i> PDF</button>
      </div>
    </div>

    <!-- Filter bar basic -->
    <div class="filter-bar">
      <div class="table-search">
        <i class="bi bi-search"></i>
        <input type="text" id="recSearchInput" placeholder="Cari ID, nama, NIK, HP, email, posisi, kota..." />
      </div>
      <select class="filter-select" id="recStatusFilter">
        <option value="">Semua Status</option>
        <option>Pending</option><option>Accepted</option><option>Hold</option><option>Blacklist</option>
      </select>
      <select class="filter-select" id="recPositionFilter"><option value="">Semua Posisi</option></select>
      <select class="filter-select" id="recGenderFilter">
        <option value="">Semua Gender</option>
        <option value="Male">Laki-laki</option>
        <option value="Female">Perempuan</option>
      </select>
      <select class="filter-select" id="recSortSelect">
        <option value="newest">Terbaru</option>
        <option value="oldest">Terlama</option>
        <option value="name_asc">Nama A-Z</option>
        <option value="name_desc">Nama Z-A</option>
        <option value="age_desc">Usia Tertinggi</option>
        <option value="age_asc">Usia Terendah</option>
        <option value="salary_desc">Gaji Tertinggi</option>
        <option value="salary_asc">Gaji Terendah</option>
      </select>
      <button class="btn-toggle-more" id="recBtnToggleMore" type="button"><i class="bi bi-sliders"></i> Filter Lanjutan</button>
      <button class="btn-reset-filter" type="button" id="recBtnResetFilter"><i class="bi bi-arrow-counterclockwise"></i> Reset</button>
      <button class="btn-refresh" id="recBtnRefresh" type="button" title="Muat ulang data"><i class="bi bi-arrow-clockwise"></i></button>
    </div>

    <!-- Filter bar advanced -->
    <div class="filter-bar filter-bar-collapse" id="recFilterBarMore">
      <select class="filter-select" id="recEducationFilter"><option value="">Semua Pendidikan</option></select>
      <select class="filter-select" id="recExperienceFilter"><option value="">Semua Pengalaman</option></select>
      <select class="filter-select" id="recCityFilter"><option value="">Semua Kota</option></select>
      <select class="filter-select" id="recSourceFilter"><option value="">Semua Sumber</option></select>
      <select class="filter-select" id="recEmploymentStatusFilter"><option value="">Semua Status Kerja</option></select>
      <div class="filter-range-group">
        <input type="number" class="filter-number" id="recSalaryMinFilter" placeholder="Gaji min" />
        <span>&ndash;</span>
        <input type="number" class="filter-number" id="recSalaryMaxFilter" placeholder="Gaji max" />
      </div>
      <div class="filter-range-group">
        <input type="number" class="filter-number" id="recAgeMinFilter" placeholder="Usia min" />
        <span>&ndash;</span>
        <input type="number" class="filter-number" id="recAgeMaxFilter" placeholder="Usia max" />
      </div>
      <input type="date" class="filter-date" id="recDateFromFilter" title="Dari tanggal" />
      <input type="date" class="filter-date" id="recDateToFilter"   title="Sampai tanggal" />
      <button class="btn-reset-filter" type="button" id="recBtnApplyMoreFilter"><i class="bi bi-check2"></i> Terapkan</button>
    </div>

    <!-- Table -->
    <div class="table-responsive">
      <table class="table hr-table">
        <thead>
          <tr>
            <th>Avatar</th>
            <th data-rec-sort="id">Recruitment ID</th>
            <th data-rec-sort="name">Kandidat</th>
            <th data-rec-sort="age">Usia</th>
            <th>Gender</th>
            <th>Posisi</th>
            <th>Pendidikan</th>
            <th>Pengalaman</th>
            <th data-rec-sort="salary">Exp. Gaji</th>
            <th>Sumber</th>
            <th>Status</th>
            <th data-rec-sort="date">Tanggal Daftar</th>
            <th>Aksi</th>
          </tr>
        </thead>
        <tbody id="recTableBody"></tbody>
      </table>
      <div class="table-loading" id="recTableLoading">
        <div class="spinner-border" role="status"></div>
        <p>Mengambil data dari spreadsheet...</p>
      </div>
      <div class="table-empty d-none" id="recTableEmpty">
        <i class="bi bi-inbox"></i>
        <p>Belum ada data kandidat.</p>
      </div>
    </div>

    <div class="panel-footer">
      <span id="recFooterCount">Menampilkan 0 data</span>
      <nav class="pagination-ui" id="recPaginationUi" aria-label="Pagination"></nav>
    </div>
  </div>
</section>
