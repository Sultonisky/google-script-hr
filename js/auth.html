<!-- js/auth.html — LOGIN STATE MANAGEMENT + ROUTE PROTECTION + TOAST -->
<script>
  (function () {
    "use strict";

    // ============================================================
    // SESSION STATE
    // ============================================================
    var AUTH_SESSION_STORAGE_KEY = "mahakarya_hris_session";
    var _currentUser = null;
    var _sessionLoaded = false;
    var _sessionCallbacks = [];

    function bootstrapSessionTokenFromUrl_() {
      try {
        var url = new URL(window.location.href);
        var token = String(url.searchParams.get("sessionToken") || "").trim();
        if (!token) return;

        setStoredSessionToken_(token);
        url.searchParams.delete("sessionToken");
        window.history.replaceState({}, document.title, url.toString());
      } catch (e) {}
    }

    function getStoredSessionToken_() {
      try {
        return (
          localStorage.getItem(AUTH_SESSION_STORAGE_KEY) ||
          sessionStorage.getItem(AUTH_SESSION_STORAGE_KEY) ||
          ""
        );
      } catch (e) {
        return "";
      }
    }

    function setStoredSessionToken_(token) {
      try {
        localStorage.setItem(AUTH_SESSION_STORAGE_KEY, token);
        sessionStorage.setItem(AUTH_SESSION_STORAGE_KEY, token);
      } catch (e) {}
    }

    function clearStoredSessionToken_() {
      try {
        localStorage.removeItem(AUTH_SESSION_STORAGE_KEY);
      } catch (e) {}
      try {
        sessionStorage.removeItem(AUTH_SESSION_STORAGE_KEY);
      } catch (e) {}
    }

    bootstrapSessionTokenFromUrl_();

    window.getAuthSessionToken = function () {
      return getStoredSessionToken_();
    };

    window.setAuthSessionToken = function (token) {
      setStoredSessionToken_(String(token || "").trim());
    };

    window.clearAuthSessionToken = function () {
      var sessionToken = getStoredSessionToken_();
      clearStoredSessionToken_();
      _currentUser = null;
      _sessionLoaded = false;
      if (sessionToken) {
        try {
          google.script.run.clearUserSession(sessionToken);
        } catch (e) {}
      }
    };

    /**
     * Returns a promise that resolves with the current user session.
     * Caches the result for the page lifetime.
     */
    window.getUserSession = function () {
      return new Promise(function (resolve) {
        if (_sessionLoaded) {
          resolve(_currentUser);
          return;
        }
        // Already loading — queue the callback
        if (_sessionCallbacks.length > 0) {
          _sessionCallbacks.push(resolve);
          return;
        }
        _sessionCallbacks.push(resolve);
        var sessionToken = getStoredSessionToken_();
        google.script.run
          .withSuccessHandler(function (user) {
            if (!user || !user.isLoggedIn) {
              clearStoredSessionToken_();
              _currentUser = null;
            } else {
              _currentUser = user;
            }
            _sessionLoaded = true;
            var cbs = _sessionCallbacks.slice();
            _sessionCallbacks = [];
            cbs.forEach(function (cb) {
              cb(_currentUser);
            });
          })
          .withFailureHandler(function () {
            _currentUser = null;
            _sessionLoaded = true;
            var cbs = _sessionCallbacks.slice();
            _sessionCallbacks = [];
            cbs.forEach(function (cb) {
              cb(null);
            });
          })
          .getCurrentUser(sessionToken);
      });
    };

    /**
     * Checks if user is logged in. If not, redirects to login page.
     * @param {string} requiredPermission - Optional permission to check
     * @returns {Promise<Object>} user session
     */
    window.requireAuth = function (requiredPermission) {
      return getUserSession().then(function (user) {
        if (!user || !user.isLoggedIn) {
          var nextUrl = encodeURIComponent(
            (window.location.search || "?page=dashboard") +
              (window.location.hash || ""),
          );
          window.location.href = "?page=login&next=" + nextUrl;
          return null;
        }
        if (
          requiredPermission &&
          user.permissions &&
          user.permissions.indexOf(requiredPermission) === -1
        ) {
          window.location.href = "?page=access-denied";
          return null;
        }
        return user;
      });
    };

    /**
     * Gets the initials from a full name.
     */
    window.getUserInitials = function (fullName) {
      if (!fullName || fullName === "") return "HR";
      var parts = fullName.trim().split(/\s+/);
      if (parts.length >= 2) {
        return (
          parts[0].charAt(0) + parts[parts.length - 1].charAt(0)
        ).toUpperCase();
      }
      return fullName.substring(0, 2).toUpperCase();
    };

    /**
     * Sets avatar content: Google photo if available, otherwise initials.
     */
    function setAvatarContent(el, initials, photoUrl) {
      if (!el) return;
      if (photoUrl) {
        el.textContent = "";
        el.style.backgroundImage = "url(" + photoUrl + ")";
        el.style.backgroundSize = "cover";
        el.style.backgroundPosition = "center";
      } else {
        el.textContent = initials;
      }
    }

    /**
     * Returns a CSS class for the role badge color.
     */
    window.getRoleBadgeClass = function (role) {
      switch (role) {
        case "Super Admin":
          return "role-badge-superadmin";
        case "HR Admin":
          return "role-badge-hradmin";
        case "Recruiter":
          return "role-badge-recruiter";
        case "Manager":
          return "role-badge-manager";
        case "Viewer":
          return "role-badge-viewer";
        default:
          return "";
      }
    };

    /**
     * Populates all user profile UI elements across sidebar, topbar, and dropdown.
     */
    window.populateUserUI = function (user) {
      if (!user || !user.isLoggedIn) return;

      var initials = getUserInitials(user.fullName);
      var displayName = user.fullName || user.email;
      var roleLabel = user.role || "-";

      var photoUrl = user.photoUrl || "";

      // Topbar
      var el;
      el = document.getElementById("topbarUserName");
      if (el) el.textContent = displayName;
      el = document.getElementById("topbarUserRole");
      if (el) {
        el.textContent = roleLabel;
        el.className =
          "topbar-user-role sidebar-role-badge " + getRoleBadgeClass(user.role);
      }
      setAvatarContent(
        document.getElementById("topbarAvatar"),
        initials,
        photoUrl,
      );

      // Dropdown
      el = document.getElementById("dropdownUserName");
      if (el) el.textContent = displayName;
      el = document.getElementById("dropdownUserEmail");
      if (el) el.textContent = user.email;
      el = document.getElementById("dropdownUserRole");
      if (el) {
        el.textContent = roleLabel;
        el.className = "sidebar-role-badge " + getRoleBadgeClass(user.role);
      }
      setAvatarContent(
        document.getElementById("dropdownAvatar"),
        initials,
        photoUrl,
      );

      // Show/hide permission-based nav items
      applyPermissionsToNav(user.permissions || []);
      applyPermissionsToDropdown(user.permissions || []);
    };

    /**
     * Shows/hides nav items based on user permissions.
     */
    function applyPermissionsToNav(permissions) {
      var navItems = document.querySelectorAll("#sidebarNav [data-permission]");
      navItems.forEach(function (item) {
        var requiredPerm = item.getAttribute("data-permission");
        if (requiredPerm && permissions.indexOf(requiredPerm) === -1) {
          item.style.display = "none";
        } else {
          item.style.display = "";
        }
      });
    }

    /**
     * Shows/hides dropdown menu items based on user permissions.
     */
    function applyPermissionsToDropdown(permissions) {
      var el;
      el = document.getElementById("btnDropdownUserManagement");
      if (el)
        el.style.display =
          permissions.indexOf("manage_users") !== -1 ? "" : "none";
      el = document.getElementById("btnDropdownSettings");
      if (el)
        el.style.display =
          permissions.indexOf("manage_settings") !== -1 ? "" : "none";
    }

    // ============================================================
    // TOAST NOTIFICATION SYSTEM
    // ============================================================
    var toastContainer = null;

    function ensureToastContainer() {
      if (toastContainer) return toastContainer;
      toastContainer = document.createElement("div");
      toastContainer.id = "appToastContainer";
      toastContainer.style.cssText =
        "position:fixed;top:20px;right:20px;z-index:99999;display:flex;flex-direction:column;gap:10px;pointer-events:none;";
      document.body.appendChild(toastContainer);
      return toastContainer;
    }

    /**
     * Shows a toast notification.
     * @param {string} message
     * @param {string} type - 'success' | 'error' | 'warning' | 'info'
     * @param {number} duration - ms, default 4000
     */
    window.showToast = function (message, type, duration) {
      type = type || "info";
      duration = duration || 4000;
      var container = ensureToastContainer();

      var colors = {
        success: {
          bg: "#F0FDF4",
          border: "#BBF7D0",
          text: "#166534",
          icon: "bi-check-circle-fill",
        },
        error: {
          bg: "#FEF2F2",
          border: "#FECACA",
          text: "#991B1B",
          icon: "bi-exclamation-triangle-fill",
        },
        warning: {
          bg: "#FFFBEB",
          border: "#FDE68A",
          text: "#92400E",
          icon: "bi-exclamation-circle-fill",
        },
        info: {
          bg: "#EFF6FF",
          border: "#BFDBFE",
          text: "#1E40AF",
          icon: "bi-info-circle-fill",
        },
      };
      var c = colors[type] || colors.info;

      var toast = document.createElement("div");
      toast.style.cssText =
        "pointer-events:auto;display:flex;align-items:center;gap:10px;padding:14px 18px;border-radius:10px;box-shadow:0 4px 16px rgba(0,0,0,0.12);font-size:14px;font-weight:500;font-family:Inter,Segoe UI,sans-serif;max-width:400px;opacity:0;transform:translateX(20px);transition:all 0.3s ease;" +
        "background:" +
        c.bg +
        ";border:1px solid " +
        c.border +
        ";color:" +
        c.text +
        ";";
      toast.innerHTML =
        '<i class="bi ' +
        c.icon +
        '" style="font-size:18px;flex-shrink:0;"></i><span>' +
        message +
        "</span>";

      container.appendChild(toast);
      // Animate in
      requestAnimationFrame(function () {
        toast.style.opacity = "1";
        toast.style.transform = "translateX(0)";
      });

      // Auto-dismiss
      setTimeout(function () {
        toast.style.opacity = "0";
        toast.style.transform = "translateX(20px)";
        setTimeout(function () {
          if (toast.parentNode) toast.parentNode.removeChild(toast);
        }, 300);
      }, duration);
    };

    // ============================================================
    // LOADING OVERLAY
    // ============================================================
    var loadingOverlay = null;

    /**
     * Shows a full-screen loading overlay.
     * @param {string} message
     */
    window.showLoadingOverlay = function (message) {
      if (!loadingOverlay) {
        loadingOverlay = document.createElement("div");
        loadingOverlay.id = "appLoadingOverlay";
        loadingOverlay.style.cssText =
          "position:fixed;inset:0;z-index:99998;background:rgba(255,255,255,0.85);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;transition:opacity 0.3s;";
        loadingOverlay.innerHTML =
          '<div style="width:40px;height:40px;border:3px solid #e5e7eb;border-top-color:#005BAC;border-radius:50%;animation:spin 0.8s linear infinite;"></div><p style="font-size:14px;color:#6b7280;font-family:Inter,Segoe UI,sans-serif;" id="loadingOverlayText">Memuat data...</p>';
        document.body.appendChild(loadingOverlay);
      }
      if (message) {
        var txt = document.getElementById("loadingOverlayText");
        if (txt) txt.textContent = message;
      }
      loadingOverlay.style.display = "flex";
    };

    /**
     * Hides the loading overlay.
     */
    window.hideLoadingOverlay = function () {
      if (loadingOverlay) loadingOverlay.style.display = "none";
    };

    // ============================================================
    // USER DROPDOWN MENU
    // ============================================================
    function initUserDropdown() {
      var userBtn = document.getElementById("topbarUserBtn");
      var dropdown = document.getElementById("userDropdownMenu");
      if (!userBtn || !dropdown) return;

      userBtn.addEventListener("click", function (e) {
        e.stopPropagation();
        dropdown.classList.toggle("show");
      });

      document.addEventListener("click", function (e) {
        if (!dropdown.contains(e.target) && e.target !== userBtn) {
          dropdown.classList.remove("show");
        }
      });

      // Logout
      var logoutBtn = document.getElementById("btnDropdownLogout");
      if (logoutBtn) {
        logoutBtn.addEventListener("click", function () {
          logoutBtn.disabled = true;
          logoutBtn.innerHTML =
            '<i class="bi bi-hourglass-split"></i> Keluar...';

          var sessionToken = getStoredSessionToken_();
          var loggedOutEmail = (_currentUser && _currentUser.email) || "";
          clearStoredSessionToken_();
          _currentUser = null;
          _sessionLoaded = false;

          function doRedirect() {
            try {
              window.top.location.replace("?page=landing");
            } catch (e) {
              window.location.replace("?page=landing");
            }
          }

          if (sessionToken) {
            google.script.run
              .withSuccessHandler(doRedirect)
              .withFailureHandler(doRedirect)
              .performLogout(sessionToken, loggedOutEmail);
          } else {
            doRedirect();
          }
        });
      }

      // Navigation buttons
      var userMgmtBtn = document.getElementById("btnDropdownUserManagement");
      if (userMgmtBtn) {
        userMgmtBtn.addEventListener("click", function () {
          window.location.href = "?page=user-management";
        });
      }
      var settingsBtn = document.getElementById("btnDropdownSettings");
      if (settingsBtn) {
        settingsBtn.addEventListener("click", function () {
          // Navigate to settings page in dashboard
          window.location.href = "?page=dashboard#settings";
        });
      }
    }

    // ============================================================
    // PAGE TRANSITION EFFECTS
    // ============================================================
    window.animatePageIn = function () {
      var mainContent = document.querySelector(".main-content");
      if (mainContent) {
        mainContent.style.opacity = "0";
        mainContent.style.transform = "translateY(8px)";
        requestAnimationFrame(function () {
          mainContent.style.transition =
            "opacity 0.3s ease, transform 0.3s ease";
          mainContent.style.opacity = "1";
          mainContent.style.transform = "translateY(0)";
        });
      }
    };

    // ============================================================
    // INIT ON DOM READY
    // ============================================================
    document.addEventListener("DOMContentLoaded", function () {
      initUserDropdown();
      animatePageIn();
    });
  })();
</script>
<style>
  @keyframes spin {
    to {
      transform: rotate(360deg);
    }
  }
  .sidebar-role-badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 600;
    line-height: 1.4;
    white-space: nowrap;
  }
  .role-badge-superadmin {
    background: #fef3c7;
    color: #92400e;
  }
  .role-badge-hradmin {
    background: #dbeafe;
    color: #1e40af;
  }
  .role-badge-recruiter {
    background: #d1fae5;
    color: #065f46;
  }
  .role-badge-manager {
    background: #e0e7ff;
    color: #3730a3;
  }
  .role-badge-viewer {
    background: #f3f4f6;
    color: #374151;
  }
</style>
