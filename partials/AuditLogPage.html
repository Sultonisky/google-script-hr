<!-- partials/AuditLogPage.html — AUDIT LOG PAGE SECTION -->
<section class="page-section" id="pageAuditLog">
  <!-- Header -->
  <div class="d-flex justify-content-between align-items-center mb-3">
    <div>
      <h5 class="fw-bold mb-0">
        <i class="bi bi-clock-history me-2"></i>Audit Log
      </h5>
      <small class="text-muted">Riwayat aktivitas semua modul sistem</small>
    </div>
    <div class="d-flex gap-2">
      <button
        class="btn btn-outline-primary btn-sm"
        id="btnAuditRefresh"
        type="button"
      >
        <i class="bi bi-arrow-clockwise"></i> Refresh
      </button>
    </div>
  </div>

  <!-- Stats -->
  <div class="row g-3 mb-4">
    <div class="col-6 col-md-3">
      <div class="stat-card">
        <div class="stat-icon bg-blue"><i class="bi bi-list-ul"></i></div>
        <div>
          <div class="stat-label">Total Log</div>
          <div class="stat-value" id="auditStatTotal">0</div>
        </div>
      </div>
    </div>
    <div class="col-6 col-md-3">
      <div class="stat-card">
        <div class="stat-icon bg-green">
          <i class="bi bi-check-circle-fill"></i>
        </div>
        <div>
          <div class="stat-label">Created</div>
          <div class="stat-value" id="auditStatCreated">0</div>
        </div>
      </div>
    </div>
    <div class="col-6 col-md-3">
      <div class="stat-card">
        <div class="stat-icon bg-gold"><i class="bi bi-arrow-repeat"></i></div>
        <div>
          <div class="stat-label">Update Status</div>
          <div class="stat-value" id="auditStatUpdate">0</div>
        </div>
      </div>
    </div>
    <div class="col-6 col-md-3">
      <div class="stat-card">
        <div class="stat-icon bg-navy">
          <i class="bi bi-pause-circle-fill"></i>
        </div>
        <div>
          <div class="stat-label">Hold/Blacklist</div>
          <div class="stat-value" id="auditStatHoldBl">0</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Filter bar -->
  <div class="panel mb-4">
    <div class="panel-header">
      <div class="d-flex flex-wrap gap-2 align-items-center">
        <div class="table-search">
          <i class="bi bi-search"></i>
          <input
            type="text"
            id="auditSearchInput"
            class="form-control"
            placeholder="Cari ID, user, action..."
          />
        </div>
        <select
          class="form-select"
          id="auditActionFilter"
          style="width: 160px; font-size: 13px"
        >
          <option value="">Semua Action</option>
          <option value="Created">Created</option>
          <option value="Update Status">Update Status</option>
          <option value="Hold">Hold</option>
          <option value="Blacklist">Blacklist</option>
          <option value="Accepted">Accepted</option>
          <option value="Deleted">Deleted</option>
        </select>
        <button
          class="btn btn-outline-secondary btn-sm"
          id="btnAuditReset"
          type="button"
        >
          <i class="bi bi-arrow-counterclockwise"></i> Reset
        </button>
      </div>
    </div>
  </div>

  <!-- Table -->
  <div class="panel">
    <div class="table-responsive">
      <table class="table hr-table">
        <thead>
          <tr>
            <th>Timestamp</th>
            <th>User</th>
            <th>Recruitment ID</th>
            <th>Action</th>
            <th>Field</th>
            <th>Old Value</th>
            <th>New Value</th>
          </tr>
        </thead>
        <tbody id="auditTableBody">
          <tr>
            <td colspan="7" class="text-center text-muted py-4">
              Memuat data...
            </td>
          </tr>
        </tbody>
      </table>
    </div>
    <div class="panel-footer">
      <span id="auditFooterCount">Menampilkan 0 data</span>
      <nav
        class="pagination-ui"
        id="auditPaginationUi"
        aria-label="Pagination"
      ></nav>
    </div>
  </div>
</section>
